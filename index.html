          <div style={{display:'flex',gap:14,alignItems:'flex-start'}}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontWeight:600,fontSize:'var(--text-sm)',marginBottom:3,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{lastRead.title}</div>
              <div style={{fontSize:'0.75rem',color:'var(--muted)',marginBottom:6}}>By: {(lastRead.authors||[]).join(', ')}</div>
              <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
                {(lastRead.categories||[]).map(c=><span key={c} className="sc-cat" style={{fontSize:'0.65rem'}}>{c}</span>)}
                <span style={{fontSize:'0.7rem',color:'var(--muted)',marginLeft:2}}>{lastRead.year}</span>
              </div>
            </div>
            <button className="btn btn-gold btn-sm" style={{flexShrink:0}}>Open →</button>
          </div>

      {/* ── Bookmarks ── */}

                onClick={async()=>{
                  const snap=await db.collection('studies').doc(fav.studyId).get();
                  if(snap.exists){const d={id:snap.id,...snap.data()};setSelectedStudy(d);trackRecentlyViewed(d);}
                  else toast.err('Study no longer available.');
                }}>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:500,fontSize:'var(--text-sm)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{fav.title}</div>
                  <div style={{fontSize:'0.72rem',color:'var(--muted)'}}>{(fav.authors||[]).join(', ')} · {fav.year}</div>
                </div>
                <button className="btn btn-ol btn-sm" style={{flexShrink:0}}
                  onClick={async e=>{e.stopPropagation();await API.removeFavorite(currentUser.id,fav.studyId);setFavorites(f=>f.filter(x=>x.studyId!==fav.studyId));toast.ok('Bookmark removed.');}}>
                  ✕
                </button>
              </div>
            ))}
          </div>
        )}
      </div>

      {/* ── Continue Reading (empty state when no reading history) ── */}
      {!lastRead&&(
        <div className="card" style={{marginBottom:16}}>
          <div className="card-hd"><span className="card-title">📖 Continue Reading</span></div>
          <EmptyState
            icon="📖"
            title="Nothing to continue yet"
            message="Open a study from the repository and we'll pick up where you left off."
            compact
          />
        </div>
      )}

      {selectedStudy&&<StudyDetailModal study={selectedStudy} onClose={()=>setSelectedStudy(null)} currentUser={currentUser} onDelete={async id=>{await API.deleteStudy(id);setSelectedStudy(null);load();}} allStudies={myStudies} onOpenStudy={async s=>{const snap=await db.collection('studies').doc(s.studyId||s.id).get();if(snap.exists){const d={id:snap.id,...snap.data()};setSelectedStudy(d);trackRecentlyViewed(d);}}}/>}
      <div className="card">
        <div className="card-hd"><span className="card-title">My Uploaded Studies</span><button className="btn btn-gold btn-sm" onClick={()=>setShowUpload(true)}><Ico.up/> Upload New</button></div>
        {myStudies.length===0?(
          <EmptyState
            icon="📄"
            title="No studies yet"
            message="Once you upload your first research study, it'll show up here with its views, downloads, and citation stats."
            action={<button className="btn btn-gold mt12" onClick={()=>setShowUpload(true)}><Ico.up/> Upload Your First Study</button>}
          />
        ):(
          <div className="tw"><table>
            <thead><tr><th>Title</th><th>Categories</th><th>Year</th><th>Views</th><th>Downloads</th><th>Citations</th><th>Uploaded</th><th>Activity</th></tr></thead>
            <tbody>{myStudies.map(s=><tr key={s.id} style={{cursor:'default'}}>
              <td style={{maxWidth:230}}><div style={{fontWeight:500,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{s.title}</div></td>
              <td><div style={{display:'flex',gap:3,flexWrap:'wrap'}}>{(s.categories||[]).map(c=><span key={c} className="badge" style={{background:'var(--gold-bg)',color:'var(--gold)',fontSize:'0.66rem'}}>{c}</span>)}</div></td>
              <td>{s.year}</td>
              <td>
                <span style={{display:'flex',alignItems:'center',gap:4}}>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" width="12" height="12"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                  {s.viewCount||0}

              <td>

                  {s.downloadCount||0}

              </td>
              <td>
                <span style={{display:'flex',alignItems:'center',gap:4,color:'var(--purple)'}}>

              <td style={{whiteSpace:'nowrap'}}>{fmtDate(s.createdAt)}</td>
              <td>
                <button
                  className="btn btn-ol btn-sm"
                  style={{display:'flex',alignItems:'center',gap:5,fontSize:'0.72rem',padding:'5px 10px',minHeight:32}}
                  onClick={()=>setHistoryStudy(s)}
                  data-tip="View who viewed, downloaded, and cited this study">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" width="12" height="12"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                  Activity

            </tr>)}</tbody>
          </table></div>

      </div>
      {showUpload&&<UploadModal onClose={()=>setShowUpload(false)} currentUser={currentUser} cats={cats} onUpload={()=>{load();setShowUpload(false);}}/>}
      {historyStudy&&<StudyHistoryModal study={historyStudy} onClose={()=>setHistoryStudy(null)}/>}
      </>
      )}
    </div>
  );
}

function AdminDash({ currentUser }) {
  const [stats,setStats]=useState(null);
  const [pending,setPending]=useState([]);
  const [recent,setRecent]=useState([]);
  const [selectedStudy,setSelectedStudy]=useState(null);

  const load=async()=>{
    const [s,p,r]=await Promise.all([API.getStats(),API.getUsers({role:'student',status:'pending'}),API.getStudies({status:'',perPage:50})]);
    setStats(s);setPending(p);setRecent(r.data);
  };
  useEffect(()=>{load();},[]);

  const upd=async(id,status)=>{await API.updateUserStatus(id,status);toast.ok(`Account ${status}.`);load();};

  if(!stats)return (
    <div>
      <div style={{marginBottom:22}}>
        <div className="skel skel-page-title" style={{marginBottom:8}}/>

      </div>
      <StatsSkeleton count={4}/>
      <StudiesGridSkeleton count={3}/>
    </div>

  return (
    <div>
      <div style={{marginBottom:22}}>
        <h2 style={{fontFamily:'var(--font-display)',fontSize:'var(--text-2xl)',marginBottom:3}}>
          Welcome back, Teacher {currentUser?.name?.split(' ')[0] || 'Teacher'} 👋
        </h2>
        <p className="muted">Here's your system overview for today.</p>
      </div>
      <div className="stats">
        <div className="stat gold"><div className="stat-icon"><Ico.users/></div><div className="stat-body"><div className="stat-lbl">Total Students</div><div className="stat-val">{stats.totalStudents}</div><div className="stat-sub">{stats.approvedStudents} approved</div></div></div>
        <div className="stat red"><div className="stat-icon"><Ico.bell/></div><div className="stat-body"><div className="stat-lbl">Pending</div><div className="stat-val">{stats.pendingStudents}</div><div className="stat-sub">Awaiting review</div></div></div>
        <div className="stat teal"><div className="stat-icon"><Ico.doc/></div><div className="stat-body"><div className="stat-lbl">Studies</div><div className="stat-val">{stats.totalStudies}</div><div className="stat-sub">In repository</div></div></div>
        <div className="stat blue"><div className="stat-icon"><Ico.eye/></div><div className="stat-body"><div className="stat-lbl">Total Views</div><div className="stat-val">{stats.totalViews}</div><div className="stat-sub">All time</div></div></div>
        <div className="stat pur"><div className="stat-icon"><Ico.dl/></div><div className="stat-body"><div className="stat-lbl">Downloads</div><div className="stat-val">{stats.totalDownloads}</div><div className="stat-sub">All time</div></div></div>
        <div className="stat slate"><div className="stat-icon"><Ico.cite/></div><div className="stat-body"><div className="stat-lbl">Citations</div><div className="stat-val">{stats.totalCitations||0}</div><div className="stat-sub">APA copies</div></div></div>
      </div>
      <WeeklyHighlightsCard onOpenStudy={async s=>{
        const snap=await db.collection('studies').doc(s.id).get();
        if(snap.exists){const d={id:snap.id,...snap.data()};setSelectedStudy(d);trackRecentlyViewed(d);}
        else toast.err('Study no longer available.');
      }}/>
      <RecentlyViewedCard onOpenStudy={d=>setSelectedStudy(d)}/>
      {/* Grade level breakdown */}
      {(()=>{
        if(!stats.gradeBreakdown||Object.keys(stats.gradeBreakdown).length===0) return null;
        const total=Object.values(stats.gradeBreakdown).reduce((a,b)=>a+b,0)||1;
        return(
          <div className="card" style={{marginBottom:18}}>
            <div className="card-hd" style={{marginBottom:12}}><span className="card-title">🎓 Students by Grade Level</span><span style={{fontSize:'0.75rem',color:'var(--muted)'}}>{total} total</span></div>
            <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
              {['8','9','10','11','12'].map(g=>{
                const n=stats.gradeBreakdown[g]||0;
                const pct=Math.round((n/total)*100);
                return(
                  <div key={g} style={{flex:'1 1 80px',display:'flex',flexDirection:'column',gap:6,padding:'12px 14px',
                    background:GRADE_BG[g]||'var(--surface)',borderRadius:'var(--radius)',
                    border:`1.5px solid ${GRADE_COLORS[g]||'var(--border)'}`,textAlign:'center'}}>
                    <div style={{fontSize:'0.68rem',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.8px',color:GRADE_COLORS[g]||'var(--muted)'}}>Grade {g}</div>
                    <div style={{fontFamily:'var(--font-display)',fontSize:'1.6rem',fontWeight:700,color:GRADE_COLORS[g]||'var(--ink)',lineHeight:1}}>{n}</div>
                    <div style={{fontSize:'0.68rem',color:GRADE_COLORS[g]||'var(--muted)',opacity:0.8}}>{pct}%</div>
                    <div style={{height:4,background:'rgba(255,255,255,0.4)',borderRadius:99,overflow:'hidden'}}>
                      <div style={{height:'100%',width:`${pct}%`,background:GRADE_COLORS[g]||'var(--muted)',borderRadius:99,transition:'width .6s ease'}}/>
                    </div>
                  </div>
                );
              })}
            </div>
            {stats.gradeBreakdown['']&&<div style={{marginTop:8,fontSize:'0.72rem',color:'var(--muted)',textAlign:'right'}}>+{stats.gradeBreakdown['']} student{stats.gradeBreakdown['']!==1?'s':''} with no grade assigned</div>}
          </div>
        );
      })()}
      {pending.length>0&&<div className="card" style={{marginBottom:18,borderLeft:'4px solid var(--gold)'}}>
        <div className="card-hd"><span className="card-title">⏳ Pending Approvals</span><span className="badge badge-pend">{pending.length} waiting</span></div>
        <div className="tw"><table>
          <thead><tr><th>Name</th><th>Email</th><th>School</th><th>Grade / Section</th><th>Registered</th><th>Actions</th></tr></thead>
          <tbody>{pending.map(u=><tr key={u.id}>
            <td><div style={{fontWeight:500}}>{u.name}</div></td>
            <td style={{fontSize:'0.8rem'}}>{u.email}</td>
            <td>{u.institution||'—'}</td>
            <td>{u.gradeLevel?`Grade ${u.gradeLevel}`:''}{u.section?` — ${u.section}`:''}</td>
            <td style={{whiteSpace:'nowrap'}}>{fmtDate(u.createdAt)}</td>
            <td><div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
              <button className="btn btn-grn btn-sm" onClick={()=>upd(u.id,'approved')}><Ico.chk/> Approve</button>
              <button className="btn btn-red btn-sm" onClick={()=>upd(u.id,'rejected')}><Ico.X/> Reject</button>
            </div></td>
          </tr>)}</tbody>
        </table></div>
      </div>}
      {/* Analytics */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(280px,1fr))',gap:14,marginBottom:14}}>
        {/* Category breakdown */}
        <div className="card">
          <div className="card-hd"><span className="card-title">📊 Studies by Category</span></div>
          {(()=>{
            const cats={};
            recent.forEach(s=>(s.categories||[]).forEach(c=>cats[c]=(cats[c]||0)+1));
            const allStats=Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,6);
            const max=allStats[0]?.[1]||1;
            return allStats.length===0?<p className="muted" style={{fontSize:'0.82rem'}}>No data yet.</p>:(
              <div style={{display:'flex',flexDirection:'column',gap:7,marginTop:4}}>
                {allStats.map(([cat,count])=>(
                  <div key={cat}>
                    <div style={{display:'flex',justifyContent:'space-between',fontSize:'0.75rem',marginBottom:3}}>
                      <span style={{fontWeight:500,color:'var(--ink)'}}>{cat}</span>
                      <span style={{color:'var(--muted)'}}>{count}</span>
                    </div>
                    <div style={{height:6,background:'var(--border)',borderRadius:99,overflow:'hidden'}}>
                      <div style={{height:'100%',width:`${(count/max)*100}%`,background:'var(--gold)',borderRadius:99,transition:'width .5s'}}/>
                    </div>
                  </div>
                ))}
              </div>
            );
          })()}
        </div>
        {/* Top studies */}
        <div className="card">
          <div className="card-hd"><span className="card-title">🔥 Most Viewed Studies</span></div>
          {(()=>{
            const top=[...recent].sort((a,b)=>(b.viewCount||0)-(a.viewCount||0)).slice(0,5);
            return top.length===0?<p className="muted" style={{fontSize:'0.82rem'}}>No data yet.</p>:(
              <div style={{display:'flex',flexDirection:'column',gap:8,marginTop:4}}>
                {top.map((s,i)=>(
                  <div key={s.id} style={{display:'flex',gap:10,alignItems:'center'}}>
                    <div style={{width:22,height:22,borderRadius:'50%',background:i===0?'var(--gold)':i===1?'var(--teal)':'var(--border)',color:i<2?'#fff':'var(--muted)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'0.68rem',fontWeight:700,flexShrink:0}}>{i+1}</div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:'0.78rem',fontWeight:500,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{s.title}</div>
                      <div style={{fontSize:'0.68rem',color:'var(--muted)'}}>{s.viewCount||0} views · {s.downloadCount||0} downloads</div>
                    </div>
                  </div>
                ))}
              </div>
            );
          })()}
        </div>
      </div>

      {/* Grade distribution */}
      <div className="card" style={{marginBottom:14}}>
        <div className="card-hd"><span className="card-title">📝 Teacher Graded Studies</span></div>
        {(()=>{
          const graded=recent.filter(s=>s.teacherGrade);
          if(!graded.length) return <p className="muted" style={{fontSize:'0.82rem'}}>No studies graded yet.</p>;
          const gradeCounts={};
          graded.forEach(s=>gradeCounts[s.teacherGrade]=(gradeCounts[s.teacherGrade]||0)+1);
          return(
            <div>
              <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:10}}>
                {Object.entries(gradeCounts).sort().map(([g,n])=>(
                  <span key={g} style={{background:'var(--teal-light)',color:'var(--teal)',fontWeight:700,fontSize:'0.78rem',padding:'3px 12px',borderRadius:99,border:'1px solid var(--teal)'}}>{g}: {n}</span>
                ))}
              </div>
              <div className="tw"><table>
                <thead><tr><th>Title</th><th>Grade</th><th>Score</th><th>Graded By</th><th>Date</th></tr></thead>
                <tbody>{graded.map(s=><tr key={s.id}>

// ── Shared: SVG mini scatter plot ─────────────────────────────
function ScatterPlot({ pairs, labelX, labelY }) {
  if(!pairs||pairs.length<2) return null;
  const W=320,H=200,PAD=32;
  const xs=pairs.map(p=>p[0]),ys=pairs.map(p=>p[1]);
  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  const toX=v=>PAD+(maxX===minX?W/2:(v-minX)/(maxX-minX))*(W-PAD*2);
  const toY=v=>H-PAD-(maxY===minY?H/2:(v-minY)/(maxY-minY))*(H-PAD*2);
  // Regression line
  const n=pairs.length,mx=statMean(xs),my=statMean(ys);
  let num=0,den=0;
  pairs.forEach(([x,y])=>{num+=(x-mx)*(y-my);den+=(x-mx)**2;});
  const slope=den?num/den:0,intercept=my-slope*mx;
  const lx1=minX,ly1=slope*lx1+intercept,lx2=maxX,ly2=slope*lx2+intercept;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:H,overflow:'visible'}}>
      <line x1={PAD} y1={PAD} x2={PAD} y2={H-PAD} stroke="var(--border)" strokeWidth="1"/>
      <line x1={PAD} y1={H-PAD} x2={W-PAD} y2={H-PAD} stroke="var(--border)" strokeWidth="1"/>
      <line x1={toX(lx1)} y1={toY(ly1)} x2={toX(lx2)} y2={toY(ly2)} stroke="var(--gold)" strokeWidth="1.5" strokeDasharray="4 2" opacity="0.7"/>
      {pairs.map(([x,y],i)=>(
        <circle key={i} cx={toX(x)} cy={toY(y)} r={4} fill="var(--teal)" opacity="0.75" stroke="var(--white)" strokeWidth="1"/>
      ))}
      <text x={W/2} y={H-2} textAnchor="middle" fontSize="9" fill="var(--muted)">{labelX}</text>
      <text x={6} y={H/2} textAnchor="middle" fontSize="9" fill="var(--muted)" transform={`rotate(-90,6,${H/2})`}>{labelY}</text>
    </svg>
  );
}

// ── Shared: SVG bar chart ─────────────────────────────
function SVGBarChart({ data, color='var(--gold)', labelKey='label', valueKey='value', height=160 }) {
  if(!data||!data.length) return null;
  const W=360,H=height,PAD_L=8,PAD_B=28,PAD_T=16,PAD_R=8;
  const max=Math.max(...data.map(d=>d[valueKey]),1);
  const bw=(W-PAD_L-PAD_R)/data.length;
  const gap=Math.max(2,bw*0.18);
  const bwInner=bw-gap;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:H,overflow:'visible'}}>
      {data.map((d,i)=>{
        const bh=Math.max(2,((d[valueKey]||0)/max)*(H-PAD_T-PAD_B));
        const x=PAD_L+i*bw+gap/2;
        const y=H-PAD_B-bh;
        const label=String(d[labelKey]||'').slice(0,10);
        return (
          <g key={i}>
            <rect x={x} y={y} width={bwInner} height={bh} rx="3" fill={color} opacity="0.85"/>
            <text x={x+bwInner/2} y={H-PAD_B+12} textAnchor="middle" fontSize="8" fill="var(--muted)">{label}</text>
            <text x={x+bwInner/2} y={y-3} textAnchor="middle" fontSize="8" fontWeight="700" fill="var(--ink)">{d[valueKey]||0}</text>
          </g>
        );
      })}
      <line x1={PAD_L} y1={H-PAD_B} x2={W-PAD_R} y2={H-PAD_B} stroke="var(--border)" strokeWidth="1"/>
    </svg>
  );
}

// ── Shared: SVG Histogram ─────────────────────────────
function SVGHistogram({ values, color='var(--blue)', bins=8, height=140 }) {
  if(!values||values.length<2) return null;
  const mn=Math.min(...values), mx=Math.max(...values);
  if(mn===mx) return null;
  const bw=(mx-mn)/bins;
  const counts=Array(bins).fill(0);
  values.forEach(v=>{const i=Math.min(bins-1,Math.floor((v-mn)/bw));counts[i]++;});
  const maxC=Math.max(...counts,1);
  const W=340,H=height,PL=10,PB=28,PT=14,PR=8;
  const bwPx=(W-PL-PR)/bins;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:H}}>
      {counts.map((c,i)=>{
        const bh=Math.max(0,(c/maxC)*(H-PT-PB));
        const x=PL+i*bwPx, y=H-PB-bh;
        const label=(mn+i*bw).toFixed(1);
        return <g key={i}>
          <rect x={x+1} y={y} width={bwPx-2} height={bh} rx="2" fill={color} opacity="0.8"/>
          <text x={x+bwPx/2} y={H-PB+12} textAnchor="middle" fontSize="7" fill="var(--muted)">{label}</text>
          {c>0&&<text x={x+bwPx/2} y={y-3} textAnchor="middle" fontSize="8" fontWeight="700" fill="var(--ink)">{c}</text>}
        </g>;
      })}
      <line x1={PL} y1={H-PB} x2={W-PR} y2={H-PB} stroke="var(--border)" strokeWidth="1"/>
    </svg>
  );
}


function APACopyBtn({ result, title }) {
  const [copied,setCopied]=useState(false);
  const genAPA=()=>{
    const r=result;
    if(!r) return '';
    let s=`${title}\n\n`;
    if(r.type==='Descriptive'){
      r.groups.forEach(g=>{s+=`${g.label}: M = ${g.mean}, SD = ${g.sd}, n = ${g.n}${g.ci?`, 95% CI [${g.ci.lower}, ${g.ci.upper}]`:''}\n`;});
    } else if(r.type==='T-Test'){
      s+=`Welch's t-test: t(${r.df}) = ${r.t}, p = ${r.p}, d = ${r.d||'—'} (${r.dLabel||''} effect)${r.ci95?`, 95% CI for difference [${r.ci95.lower}, ${r.ci95.upper}]`:''} (${r.sig?'significant':'not significant'} at α = .05)\n`;
      (r.desc||[]).forEach(d=>{s+=`${d.label}: M = ${d.mean}, SD = ${d.sd}, n = ${d.n}${d.ci?`, 95% CI [${d.ci.lower}, ${d.ci.upper}]`:''}\n`;});
    } else if(r.type==='ANOVA'){
      s+=`One-way ANOVA: F(${r.dfB}, ${r.dfW}) = ${r.F}, p = ${r.p}, η² = ${r.eta2||'—'} (${r.eta2Label||''} effect) (${r.sig?'significant':'not significant'} at α = .05)\n`;
      (r.desc||[]).forEach(d=>{s+=`${d.label}: M = ${d.mean}, SD = ${d.sd}, n = ${d.n}\n`;});
      if(r.tukey&&r.tukey.length){s+=`\nTukey HSD Post-Hoc:\n`;r.tukey.forEach(p=>{s+=`${p.g1} vs ${p.g2}: Δ = ${p.meanDiff}, q = ${p.q}, ${p.sig?'significant':'ns'}\n`;});}
    } else if(r.type==='Pearson'){
      s+=`Pearson correlation: r(${r.n-2}) = ${r.r}, p = ${r.p}, R² = ${r.r2||'—'} — ${Math.abs(r.r)>=0.7?'strong':Math.abs(r.r)>=0.4?'moderate':Math.abs(r.r)>=0.2?'weak':'negligible'} ${r.r>=0?'positive':'negative'} correlation (${r.sig?'significant':'not significant'} at α = .05)\n`;
    } else if(r.type==='Spearman'){
      s+=`Spearman rank correlation: rs(${r.n-2}) = ${r.r}, p = ${r.p}, R² = ${r.r2||'—'} — ${Math.abs(r.r)>=0.7?'strong':Math.abs(r.r)>=0.4?'moderate':Math.abs(r.r)>=0.2?'weak':'negligible'} ${r.r>=0?'positive':'negative'} correlation (${r.sig?'significant':'not significant'} at α = .05)\n`;
    } else if(r.type==='Chi-Square'){
      s+=`Chi-square goodness of fit: χ²(${r.df}) = ${r.chi2}, p = ${r.p} (${r.sig?'significant':'not significant'} at α = .05)\n`;
    }
    return s.trim();
  };
  const copy=()=>{
    navigator.clipboard.writeText(genAPA()).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2000);});
  };
  return (
    <button onClick={copy} className="btn btn-ol btn-sm" style={{display:'flex',alignItems:'center',gap:5,color:copied?'var(--teal)':'var(--muted)',borderColor:copied?'var(--teal)':'var(--border)'}}>
      {copied?'✓ Copied!':'📋 Copy APA'}
    </button>
  );
}

// ── Modal: Teacher creates / edits an analysis ─────────────────
function StatCreateModal({ currentUser, existing, allowSave=true, onClose, onSaved }) {
  const [title, setTitle]     = useState(existing?.title||'');
  const [desc,  setDesc]      = useState(existing?.description||'');
  const [testType, setTestType] = useState(existing?.testType||'Descriptive');
  const [groups, setGroups]   = useState(existing?.groups || [{ label:'Group 1', values:'' }]);
  const [saving, setSaving]   = useState(false);
  const [result, setResult]   = useState(existing?.result||null);
  const [error,  setError]    = useState('');

  const TEST_TYPES = ['Descriptive','T-Test','ANOVA','Pearson','Spearman','Chi-Square'];

  const parseVals = str => str.split(/[\s,;]+/).map(Number).filter(n=>!isNaN(n)&&n!==undefined&&str.trim()!=='');

  const addGroup = () => setGroups(g=>[...g,{label:`Group ${g.length+1}`,values:''}]);
  const removeGroup = i => setGroups(g=>g.filter((_,j)=>j!==i));
  const setGroupLabel = (i,v) => setGroups(g=>g.map((x,j)=>j===i?{...x,label:v}:x));
  const setGroupVals  = (i,v) => setGroups(g=>g.map((x,j)=>j===i?{...x,values:v}:x));

  const needsGroups = {'T-Test':2,'ANOVA':'2+','Pearson':2,'Spearman':2,'Chi-Square':1};
  const groupHints  = {'Descriptive':'Enter your data values separated by commas or spaces.','T-Test':'Enter two groups to compare their means.','ANOVA':'Enter 2 or more groups to compare across categories.','Pearson':'Enter two sets of paired values (same length) — tests linear relationship.','Spearman':'Enter two sets of paired values (same length) — tests monotonic/ranked relationship, robust to outliers.','Chi-Square':'Enter observed counts for each category.'};

  const runAnalysis = () => {
    setError('');
    const parsed = groups.map(g=>({label:g.label,values:parseVals(g.values)}));
    const allHaveData = parsed.every(g=>g.values.length>0);
    if(!title.trim()){ setError('Please enter a title.'); return; }
    if(!allHaveData){ setError('Please enter data values for all groups.'); return; }

    let res = {};
    try {
      if(testType==='Descriptive') {
        res = { type:'Descriptive', groups: parsed.map(g=>({
          label:g.label, n:g.values.length, mean:+statMean(g.values).toFixed(4),
          sd:+statSD(g.values).toFixed(4), median:+statMedian(g.values).toFixed(4),
          min:statMin(g.values), max:statMax(g.values),
          variance:+statVariance(g.values).toFixed(4),
          ci: ciMean(g.values),
          values: g.values,
        }))};
      } else if(testType==='T-Test') {
        if(parsed.length<2||parsed[0].values.length<2||parsed[1].values.length<2){ setError('T-Test requires 2 groups with at least 2 values each.'); return; }
        const d = cohensD(parsed[0].values, parsed[1].values);
        const ci = ciMeanDiff(parsed[0].values, parsed[1].values);
        res = { type:'T-Test', labels:[parsed[0].label,parsed[1].label], ...tTest2(parsed[0].values,parsed[1].values),
          d, dLabel:cohensDLabel(d), ci95: ci,
          desc: parsed.map(g=>({label:g.label,n:g.values.length,mean:+statMean(g.values).toFixed(4),sd:+statSD(g.values).toFixed(4),ci:ciMean(g.values)}))};
      } else if(testType==='ANOVA') {
        if(parsed.length<2){ setError('ANOVA requires at least 2 groups.'); return; }
        const gvals = parsed.map(g=>g.values).filter(v=>v.length>0);
        const labels = parsed.map(g=>g.label);
        const anovaRes = anovaOneway(gvals);
        const allVals = gvals.flat();
        const SST = allVals.reduce((s,x)=>s+(x-statMean(allVals))**2,0);
        const eta2 = etaSquared(anovaRes.SSB||0, SST);
        const tukey = anovaRes.sig ? tukeyHSD(gvals, labels) : null;
        res = { type:'ANOVA', labels, ...anovaRes, eta2, eta2Label:etaLabel(eta2), tukey,
          desc: parsed.map(g=>({label:g.label,n:g.values.length,mean:+statMean(g.values).toFixed(4),sd:+statSD(g.values).toFixed(4),ci:ciMean(g.values)}))};
      } else if(testType==='Pearson') {
        if(parsed.length<2){ setError('Pearson requires 2 variables.'); return; }
        if(parsed[0].values.length!==parsed[1].values.length){ setError('Both variables must have the same number of values.'); return; }
        const pr = pearson(parsed[0].values,parsed[1].values);
        res = { type:'Pearson', labelX:parsed[0].label, labelY:parsed[1].label, ...pr,
          r2:+(pr.r**2).toFixed(4),
          descX:{n:parsed[0].values.length,mean:+statMean(parsed[0].values).toFixed(4),sd:+statSD(parsed[0].values).toFixed(4)},
          descY:{n:parsed[1].values.length,mean:+statMean(parsed[1].values).toFixed(4),sd:+statSD(parsed[1].values).toFixed(4)},
          pairs: parsed[0].values.map((v,i)=>([v,parsed[1].values[i]])),
        };
      } else if(testType==='Spearman') {
        if(parsed.length<2){ setError('Spearman requires 2 variables.'); return; }
        if(parsed[0].values.length!==parsed[1].values.length){ setError('Both variables must have the same number of values.'); return; }
        const sr = spearman(parsed[0].values,parsed[1].values);
        res = { type:'Spearman', labelX:parsed[0].label, labelY:parsed[1].label, ...sr,
          r2:+(sr.r**2).toFixed(4),
          descX:{n:parsed[0].values.length,mean:+statMean(parsed[0].values).toFixed(4),sd:+statSD(parsed[0].values).toFixed(4)},
          descY:{n:parsed[1].values.length,mean:+statMean(parsed[1].values).toFixed(4),sd:+statSD(parsed[1].values).toFixed(4)},
          pairs: parsed[0].values.map((v,i)=>([v,parsed[1].values[i]])),
        };
      } else if(testType==='Chi-Square') {
        const obs = parsed[0].values;
        if(obs.length<2){ setError('Chi-Square needs at least 2 categories.'); return; }
        res = { type:'Chi-Square', labels: obs.map((_,i)=>`Cat ${i+1}`),
          observed:obs, expected:+(obs.reduce((a,b)=>a+b,0)/obs.length).toFixed(2),
          ...chiSquare(obs) };
      }
      setResult(res);
    } catch(e) { setError('Error running analysis: '+e.message); }
  };

  const handleSave = async () => {
    if(!result){ setError('Run the analysis first before saving.'); return; }
    setSaving(true);
    try {
      await API.saveStatAnalysis({
        ...(existing||{}),
        title: title.trim(), description: desc.trim(),
        testType, groups, result,
        createdBy: currentUser.id, createdByName: currentUser.name,
        createdAt: existing?.createdAt || new Date().toISOString(),
      });
      toast.ok(existing?'Analysis updated!':'Analysis published!');
      onSaved();
    } catch(e) { toast.err('Failed to save: '+e.message); }
    setSaving(false);
  };

  const SIG = s => (
    <span style={{padding:'3px 10px',borderRadius:99,fontSize:'0.75rem',fontWeight:700,
      background:s?'var(--green-light)':'var(--red-light)',color:s?'var(--green)':'var(--red)'}}>
      {s?'✓ Significant (p < 0.05)':'✗ Not Significant (p ≥ 0.05)'}
    </span>
  );

  const numGroups = testType==='Descriptive'?1:testType==='Chi-Square'?1:testType==='Pearson'||testType==='Spearman'?2:groups.length;
  const canAddGroup = testType==='ANOVA' || testType==='Descriptive';

  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.55)',zIndex:2000,display:'flex',alignItems:'flex-start',justifyContent:'center',padding:'24px 16px',overflowY:'auto'}}>
      <div style={{background:'var(--white)',borderRadius:'var(--radius-xl)',width:'100%',maxWidth:680,boxShadow:'var(--shadow-xl)',padding:'28px'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
          <h3 style={{fontFamily:'var(--font-display)',fontSize:'var(--text-xl)',margin:0}}>{!allowSave ? '🧮 My Statistical Analysis' : existing?'Edit':'New'} {allowSave ? 'Statistical Analysis' : ''}</h3>
          <button onClick={onClose} style={{background:'none',border:'none',fontSize:'1.4rem',cursor:'pointer',color:'var(--muted)',lineHeight:1}}>×</button>
        </div>

        {!allowSave && (
          <div style={{marginBottom:16,padding:'10px 14px',background:'var(--teal-light)',borderRadius:8,border:'1px solid var(--teal)',fontSize:'0.8rem',color:'var(--teal)',display:'flex',alignItems:'center',gap:8}}>
            <span>🧪</span>
            <span><b>Personal sandbox</b> — your results are not saved or shared. Run as many analyses as you like!</span>
          </div>
        )}

        {/* Title & Description */}
        <div style={{marginBottom:14}}>
          <label style={{fontSize:'0.78rem',fontWeight:600,color:'var(--ink)',display:'block',marginBottom:5}}>Analysis Title *</label>
          <input value={title} onChange={e=>setTitle(e.target.value)} placeholder="e.g. Comparison of Test Scores by Section"
            style={{width:'100%',padding:'9px 12px',borderRadius:8,border:'1.5px solid var(--border)',background:'var(--surface)',color:'var(--ink)',fontSize:'0.88rem',boxSizing:'border-box'}}/>
        </div>
        <div style={{marginBottom:14}}>
          <label style={{fontSize:'0.78rem',fontWeight:600,color:'var(--ink)',display:'block',marginBottom:5}}>Description / Context <span style={{color:'var(--muted)',fontWeight:400}}>(optional)</span></label>
          <textarea value={desc} onChange={e=>setDesc(e.target.value)} rows={2} placeholder="What does this analysis measure? What is the hypothesis?"
            style={{width:'100%',padding:'9px 12px',borderRadius:8,border:'1.5px solid var(--border)',background:'var(--surface)',color:'var(--ink)',fontSize:'0.82rem',resize:'vertical',boxSizing:'border-box'}}/>
        </div>

        {/* Test Type */}
        <div style={{marginBottom:18}}>
          <label style={{fontSize:'0.78rem',fontWeight:600,color:'var(--ink)',display:'block',marginBottom:8}}>Statistical Test</label>
          <div data-tour="stat-test-types" style={{display:'flex',gap:6,flexWrap:'wrap'}}>
            {TEST_TYPES.map(t=>(
              <button key={t} onClick={()=>{setTestType(t);setGroups(t==='Pearson'||t==='Spearman'?[{label:'Variable X',values:''},{label:'Variable Y',values:''}]:t==='T-Test'?[{label:'Group A',values:''},{label:'Group B',values:''}]:[{label:'Group 1',values:''}]);setResult(null);}}
                style={{padding:'6px 14px',borderRadius:8,border:`1.5px solid ${testType===t?'var(--gold)':'var(--border)'}`,background:testType===t?'var(--gold-bg)':'var(--surface)',color:testType===t?'var(--gold)':'var(--muted)',fontWeight:testType===t?700:400,fontSize:'0.8rem',cursor:'pointer'}}>
                {t}
              </button>
            ))}
          </div>
          <p style={{fontSize:'0.72rem',color:'var(--muted)',marginTop:8}}>{groupHints[testType]}</p>
        </div>

        {/* Data Input Groups */}
        <div data-tour="stat-data-input" style={{marginBottom:16}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
            <label style={{fontSize:'0.78rem',fontWeight:600,color:'var(--ink)'}}>Data Input</label>
            {canAddGroup && <button onClick={addGroup} className="btn btn-ol btn-sm">+ Add Group</button>}
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:10}}>
            {(testType==='T-Test'?groups.slice(0,2):testType==='Pearson'||testType==='Spearman'?groups.slice(0,2):testType==='Chi-Square'?groups.slice(0,1):groups).map((g,i)=>(
              <div key={i} style={{padding:'12px 14px',background:'var(--surface)',borderRadius:10,border:'1px solid var(--border)'}}>
                <div style={{display:'flex',gap:8,marginBottom:8,alignItems:'center'}}>
                  <input value={g.label} onChange={e=>setGroupLabel(i,e.target.value)}
                    style={{flex:1,padding:'6px 10px',borderRadius:7,border:'1.5px solid var(--border)',background:'var(--white)',color:'var(--ink)',fontSize:'0.82rem',fontWeight:600}}
                    placeholder={testType==='Pearson'?`Variable ${i===0?'X':'Y'}`:`Group ${i+1} name`}/>
                  {canAddGroup && groups.length>1 && <button onClick={()=>removeGroup(i)} style={{background:'none',border:'none',color:'var(--red)',cursor:'pointer',fontSize:'1.1rem',lineHeight:1}}>×</button>}
                </div>
                <textarea value={g.values} onChange={e=>setGroupVals(i,e.target.value)} rows={2}
                  placeholder={testType==='Chi-Square'?"Observed counts e.g: 12, 18, 25, 9":"Values e.g: 85, 90, 78, 92, 88"}
                  style={{width:'100%',padding:'8px 10px',borderRadius:7,border:'1.5px solid var(--border)',background:'var(--white)',color:'var(--ink)',fontSize:'0.82rem',fontFamily:'var(--font-mono)',resize:'vertical',boxSizing:'border-box'}}/>
                <div style={{fontSize:'0.65rem',color:'var(--muted)',marginTop:4}}>
                  {parseVals(g.values).length} value{parseVals(g.values).length!==1?'s':''} entered · Separate with commas, spaces, or new lines
                </div>
              </div>
            ))}
          </div>
        </div>

        {error && <div style={{padding:'9px 14px',background:'var(--red-light)',color:'var(--red)',borderRadius:8,fontSize:'0.82rem',marginBottom:14}}>{error}</div>}

        {/* Run + Results Preview */}
        <button onClick={runAnalysis} className="btn btn-gold" style={{width:'100%',marginBottom:16,fontWeight:700}}>▶ Run Analysis</button>

        {result && (
          <div style={{padding:'16px',background:'var(--surface)',borderRadius:10,border:'1px solid var(--border)',marginBottom:16}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
              <div style={{fontWeight:700,fontSize:'0.88rem',color:'var(--ink)'}}>📊 Results Preview</div>
              <APACopyBtn result={result} title={title}/>
            </div>

            {result.type==='Descriptive' && result.groups.map((g,gi)=>(
              <div key={g.label} style={{marginBottom:10}}>
                <div style={{fontWeight:600,fontSize:'0.78rem',color:'var(--muted)',marginBottom:6,textTransform:'uppercase'}}>{g.label}</div>
                <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(110px,1fr))',gap:8}}>
                  {[['N',g.n],['Mean',g.mean],['SD',g.sd],['Median',g.median],['Min',g.min],['Max',g.max],['Variance',g.variance]].map(([l,v])=>(
                    <div key={l} style={{padding:'8px 10px',background:'var(--white)',borderRadius:7,border:'1px solid var(--border)'}}>
                      <div style={{fontSize:'0.62rem',color:'var(--muted)',textTransform:'uppercase',fontWeight:600}}>{l}</div>
                      <div style={{fontFamily:'var(--font-mono)',fontWeight:700,color:'var(--blue)'}}>{v}</div>
                    </div>
                  ))}
                </div>
                {g.ci&&<div style={{marginTop:6,fontSize:'0.7rem',color:'var(--muted)'}}>95% CI: [{g.ci.lower}, {g.ci.upper}]</div>}
              </div>
            ))}
            {result.type==='Descriptive'&&result.groups.length>1&&(
              <div style={{marginTop:10,padding:'10px',background:'var(--white)',borderRadius:8,border:'1px solid var(--border)'}}>
                <div style={{fontSize:'0.7rem',color:'var(--muted)',marginBottom:4,fontWeight:600}}>Group Means Comparison</div>
                <SVGBarChart data={result.groups.map(g=>({label:g.label,value:parseFloat(g.mean)||0}))} color="var(--blue)" height={110}/>
              </div>
            )}

            {(result.type==='T-Test'||result.type==='ANOVA') && <>
              <div style={{display:'flex',gap:10,marginBottom:10,flexWrap:'wrap'}}>
                {(result.type==='T-Test'?[['t',result.t],['p-value',result.p],['df',result.df],["d",result.d!==undefined?result.d:'—'],['Effect',result.dLabel||'—']]:[['F',result.F],['p-value',result.p],['df Between',result.dfB],['df Within',result.dfW],['η²',result.eta2!==undefined?result.eta2:'—'],['Effect',result.eta2Label||'—']]).map(([l,v])=>(
                  <div key={l} style={{padding:'10px 14px',background:'var(--white)',borderRadius:8,border:'1px solid var(--border)',flex:1,minWidth:80}}>
                    <div style={{fontSize:'0.62rem',color:'var(--muted)',textTransform:'uppercase',fontWeight:600}}>{l}</div>
                    <div style={{fontFamily:'var(--font-mono)',fontWeight:700,fontSize:'1.0rem',color:result.type==='T-Test'?'var(--teal)':'var(--purple)'}}>{v}</div>
                  </div>
                ))}
              </div>
              {result.ci95&&<div style={{fontSize:'0.72rem',color:'var(--muted)',marginBottom:8,padding:'5px 10px',background:'var(--white)',borderRadius:6,border:'1px solid var(--border)'}}>95% CI for mean diff: [{result.ci95.lower}, {result.ci95.upper}]</div>}
              <div style={{marginBottom:10}}>{SIG(result.sig)}</div>
              {/* Group mean visual bars */}
              {result.desc && (
                <div style={{marginTop:10}}>
                  <div style={{fontSize:'0.72rem',fontWeight:600,color:'var(--muted)',marginBottom:6,textTransform:'uppercase'}}>Group Means</div>
                  <SVGBarChart data={(result.desc||[]).map(d=>({label:d.label,value:parseFloat(d.mean)||0}))} color={result.type==='T-Test'?'var(--teal)':'var(--purple)'} height={120}/>
                </div>
              )}
              {result.desc && (
                <div style={{display:'flex',gap:8,marginTop:8}}>
                  {result.desc.map(d=>(
                    <div key={d.label} style={{flex:1,padding:'8px 10px',background:'var(--white)',borderRadius:7,border:'1px solid var(--border)'}}>
                      <div style={{fontSize:'0.72rem',fontWeight:600,color:'var(--muted)',marginBottom:3}}>{d.label}</div>
                      <div style={{fontSize:'0.78rem'}}><b>M</b> = {d.mean} &nbsp; <b>SD</b> = {d.sd} &nbsp; <b>n</b> = {d.n}</div>
                    </div>
                  ))}
                </div>
              )}
            </>}

            {(result.type==='Pearson'||result.type==='Spearman') && <>
              <div style={{display:'flex',gap:10,marginBottom:10,flexWrap:'wrap'}}>
                {[[result.type==='Spearman'?'rs':'r',result.r],['p-value',result.p],['n',result.n],['R²',result.r2!==undefined?result.r2:'—']].map(([l,v])=>(
                  <div key={l} style={{padding:'10px 14px',background:'var(--white)',borderRadius:8,border:'1px solid var(--border)',flex:1,minWidth:80}}>
                    <div style={{fontSize:'0.62rem',color:'var(--muted)',textTransform:'uppercase',fontWeight:600}}>{l}</div>
                    <div style={{fontFamily:'var(--font-mono)',fontWeight:700,fontSize:'1.1rem',color:'var(--gold)'}}>{v}</div>
                  </div>
                ))}
              </div>
              <div style={{marginBottom:8}}>{SIG(result.sig)}</div>
              <div style={{height:8,background:'var(--border)',borderRadius:99,overflow:'hidden',marginTop:8}}>
                <div style={{height:'100%',width:`${Math.abs(result.r)*100}%`,background:'var(--gold)',borderRadius:99}}/>
              </div>
              <div style={{fontSize:'0.72rem',color:'var(--muted)',marginTop:4}}>{result.labelX} ↔ {result.labelY} · |r| = {Math.abs(result.r).toFixed(3)} — {Math.abs(result.r)>=0.7?'Strong':Math.abs(result.r)>=0.4?'Moderate':Math.abs(result.r)>=0.2?'Weak':'Negligible'} {result.r>=0?'positive':'negative'}{result.r2!==undefined?` · R² = ${result.r2} (${(result.r2*100).toFixed(1)}% variance explained)`:''}</div>
              {result.pairs && result.pairs.length >= 2 && (
                <div style={{marginTop:12,padding:'10px',background:'var(--white)',borderRadius:8,border:'1px solid var(--border)'}}>
                  <div style={{fontSize:'0.7rem',color:'var(--muted)',marginBottom:4,fontWeight:600}}>Scatter Plot</div>
                  <ScatterPlot pairs={result.pairs} labelX={result.labelX} labelY={result.labelY}/>
                </div>
              )}
            </>}

            {result.type==='Chi-Square' && <>
              <div style={{display:'flex',gap:10,marginBottom:10,flexWrap:'wrap'}}>
                {[['χ²',result.chi2],['p-value',result.p],['df',result.df],['Expected',result.expected]].map(([l,v])=>(
                  <div key={l} style={{padding:'10px 14px',background:'var(--white)',borderRadius:8,border:'1px solid var(--border)',flex:1,minWidth:80}}>
                    <div style={{fontSize:'0.62rem',color:'var(--muted)',textTransform:'uppercase',fontWeight:600}}>{l}</div>
                    <div style={{fontFamily:'var(--font-mono)',fontWeight:700,fontSize:'1.1rem',color:'var(--red)'}}>{v}</div>
                  </div>
                ))}
              </div>
              <div style={{marginBottom:10}}>{SIG(result.chi2!==undefined?result.sig:false)}</div>
              {result.observed && (
                <div style={{marginTop:8,padding:'10px',background:'var(--white)',borderRadius:8,border:'1px solid var(--border)'}}>
                  <div style={{fontSize:'0.7rem',color:'var(--muted)',marginBottom:4,fontWeight:600}}>Observed vs Expected</div>
                  <SVGBarChart data={result.observed.map((v,i)=>({label:`Cat ${i+1}`,value:v}))} color="var(--red)" height={120}/>
                  <div style={{display:'flex',alignItems:'center',gap:6,marginTop:6,fontSize:'0.68rem',color:'var(--muted)'}}>
                    <div style={{width:20,height:2,background:'var(--gold)',borderRadius:2}}/>Expected per category: {result.expected}
                  </div>
                </div>
              )}
            </>}
          </div>
        )}

        <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
          <button onClick={onClose} className="btn btn-ol">Cancel</button>
          <button onClick={runAnalysis} className="btn btn-ol" style={{borderColor:'var(--teal)',color:'var(--teal)'}}>▶ Run Analysis</button>
          {allowSave && <button onClick={handleSave} className="btn btn-gold" disabled={saving||!result}>{saving?'Saving…':existing?'Update Analysis':'Publish Analysis'}</button>}
        </div>
      </div>
    </div>
  );
}

// ── Modal: View a published analysis (students + teachers) ─────
function StatViewModal({ analysis: a, onClose }) {
  const SIG = s => (
    <span style={{padding:'3px 10px',borderRadius:99,fontSize:'0.75rem',fontWeight:700,
      background:s?'var(--green-light)':'var(--red-light)',color:s?'var(--green)':'var(--red)'}}>
      {s?'✓ Significant (p < 0.05)':'✗ Not Significant (p ≥ 0.05)'}
    </span>
  );
  const r = a.result || {};
  const TEST_COLORS = { 'Descriptive':'var(--blue)','T-Test':'var(--teal)','ANOVA':'var(--purple)','Pearson':'var(--gold)','Spearman':'var(--gold)','Chi-Square':'var(--red)' };

  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.55)',zIndex:2000,display:'flex',alignItems:'flex-start',justifyContent:'center',padding:'24px 16px',overflowY:'auto'}}>
      <div style={{background:'var(--white)',borderRadius:'var(--radius-xl)',width:'100%',maxWidth:680,boxShadow:'var(--shadow-xl)',padding:'28px'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:6}}>
          <div style={{flex:1,paddingRight:16}}>
            <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap',marginBottom:4}}>
              <h3 style={{fontFamily:'var(--font-display)',fontSize:'var(--text-xl)',margin:0}}>{a.title}</h3>
              <span style={{padding:'2px 10px',borderRadius:99,fontSize:'0.72rem',fontWeight:700,background:(TEST_COLORS[a.testType]||'var(--muted)')+'22',color:TEST_COLORS[a.testType]||'var(--muted)',border:`1px solid ${TEST_COLORS[a.testType]||'var(--border)'}`}}>{a.testType}</span>
            </div>
            {a.description && <p style={{fontSize:'0.82rem',color:'var(--muted)',margin:'0 0 4px'}}>{a.description}</p>}
            <div style={{fontSize:'0.68rem',color:'var(--muted)'}}>Published by {a.createdByName||'Teacher'} · {fmtDate(a.updatedAt)}</div>
          </div>
          <div style={{display:'flex',gap:8,alignItems:'center',flexShrink:0}}>
            <APACopyBtn result={r} title={a.title}/>
            <button onClick={onClose} style={{background:'none',border:'none',fontSize:'1.4rem',cursor:'pointer',color:'var(--muted)',lineHeight:1}}>×</button>
          </div>
        </div>

        <hr style={{border:'none',borderTop:'1px solid var(--border)',margin:'16px 0'}}/>

        {r.type==='Descriptive' && (
          <div>
            <div style={{fontWeight:600,fontSize:'0.88rem',marginBottom:12}}>📐 Descriptive Statistics</div>
            {r.groups.length>1&&(
              <div style={{marginBottom:14,padding:'10px',background:'var(--surface)',borderRadius:8,border:'1px solid var(--border)'}}>
                <div style={{fontSize:'0.7rem',color:'var(--muted)',marginBottom:6,fontWeight:600}}>Group Means Comparison</div>
                <SVGBarChart data={r.groups.map(g=>({label:g.label,value:parseFloat(g.mean)||0}))} color="var(--blue)" height={130}/>
              </div>
            )}
            {r.groups.map(g=>(
              <div key={g.label} style={{marginBottom:16,paddingBottom:16,borderBottom:'1px solid var(--border)'}}>
                <div style={{fontWeight:600,fontSize:'0.78rem',color:'var(--muted)',marginBottom:8,textTransform:'uppercase',letterSpacing:'0.04em'}}>{g.label}</div>
                <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(100px,1fr))',gap:8,marginBottom:10}}>
                  {[['N',g.n],['Mean',g.mean],['Std Dev',g.sd],['Median',g.median],['Variance',g.variance],['Min',g.min],['Max',g.max]].map(([l,v])=>(
                    <div key={l} style={{padding:'10px 12px',background:'var(--surface)',borderRadius:8,border:'1px solid var(--border)'}}>
                      <div style={{fontSize:'0.62rem',color:'var(--muted)',textTransform:'uppercase',fontWeight:600,marginBottom:2}}>{l}</div>
                      <div style={{fontFamily:'var(--font-mono)',fontWeight:700,color:'var(--blue)',fontSize:'0.95rem'}}>{v}</div>
                    </div>
                  ))}
                </div>
                {g.ci&&<div style={{fontSize:'0.72rem',color:'var(--muted)',marginBottom:10,padding:'6px 10px',background:'var(--blue-light)',borderRadius:6,border:'1px solid var(--blue)'}}>
                  <b style={{color:'var(--blue)'}}>95% CI for mean:</b> [{g.ci.lower}, {g.ci.upper}]
                </div>}
                {g.values&&g.values.length>=4&&(
                  <div style={{padding:'8px 12px',background:'var(--surface)',borderRadius:8,border:'1px solid var(--border)',marginBottom:6}}>
                    <div style={{fontSize:'0.68rem',color:'var(--muted)',marginBottom:6,fontWeight:600}}>Frequency Distribution (Histogram)</div>
                    <SVGHistogram values={g.values} color="var(--blue)" bins={Math.min(8,Math.ceil(Math.sqrt(g.values.length)))} height={120}/>
                  </div>
                )}
                {g.n>0&&<div style={{marginTop:4,padding:'8px 12px',background:'var(--surface)',borderRadius:8,border:'1px solid var(--border)'}}>
                  <div style={{fontSize:'0.68rem',color:'var(--muted)',marginBottom:5,fontWeight:600}}>Distribution Range</div>
                  <div style={{position:'relative',height:24,background:'var(--border)',borderRadius:4,overflow:'hidden'}}>
                    {(()=>{const range=g.max-g.min||1;const qLeft=((g.median-g.sd/2-g.min)/range)*100;const qW=(g.sd/range)*100;return<>
                      <div style={{position:'absolute',left:`${Math.max(0,qLeft)}%`,width:`${Math.min(100,qW)}%`,height:'100%',background:'var(--blue)',opacity:0.35}}/>
                      <div style={{position:'absolute',left:`${((g.mean-g.min)/range)*100}%`,width:2,height:'100%',background:'var(--blue)'}}/>
                      <div style={{position:'absolute',left:`${((g.median-g.min)/range)*100}%`,width:2,height:'100%',background:'var(--gold)'}}/>
                    </>})()}
                  </div>
                  <div style={{display:'flex',justifyContent:'space-between',fontSize:'0.62rem',color:'var(--muted)',marginTop:3}}>
                    <span>Min: {g.min}</span>
                    <span style={{color:'var(--blue)'}}>Mean: {g.mean}</span>
                    <span style={{color:'var(--gold)'}}>Median: {g.median}</span>
                    <span>Max: {g.max}</span>
                  </div>
                </div>}
              </div>
            ))}
          </div>
        )}

        {r.type==='T-Test' && (
          <div>
            <div style={{fontWeight:600,fontSize:'0.88rem',marginBottom:12}}>📊 Independent Samples T-Test (Welch's)</div>
            <div style={{display:'flex',gap:10,marginBottom:12,flexWrap:'wrap'}}>

// ── Statistical Analysis Helpers ─────────────────────────────────
const statMean = arr => arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : 0;
const statVariance = arr => { if(arr.length<2) return 0; const m=statMean(arr); return arr.reduce((s,x)=>s+(x-m)**2,0)/(arr.length-1); };
const statSD = arr => Math.sqrt(statVariance(arr));
const statMedian = arr => { if(!arr.length) return 0; const s=[...arr].sort((a,b)=>a-b); const m=Math.floor(s.length/2); return s.length%2?s[m]:(s[m-1]+s[m])/2; };
const statMin = arr => arr.length?Math.min(...arr):0;
const statMax = arr => arr.length?Math.max(...arr):0;

// One-sample t-test (vs mu=0)
const tTest1 = (arr, mu=0) => {
  if(arr.length<2) return {t:0,df:0,p:1,sig:false};
  const n=arr.length, m=statMean(arr), sd=statSD(arr), se=sd/Math.sqrt(n);
  if(se===0) return {t:0,df:n-1,p:1,sig:false};
  const t=Math.abs((m-mu)/se), df=n-1;
  const p=2*(1-tDistCDF(t,df));
  return {t:+t.toFixed(4),df,p:+p.toFixed(4),sig:p<0.05};
};
// Two-sample independent t-test (Welch)
const tTest2 = (a, b) => {
  if(a.length<2||b.length<2) return {t:0,df:0,p:1,sig:false};
  const m1=statMean(a),m2=statMean(b),v1=statVariance(a),v2=statVariance(b),n1=a.length,n2=b.length;
  const se=Math.sqrt(v1/n1+v2/n2);
  if(se===0) return {t:0,df:n1+n2-2,p:1,sig:false};
  const t=Math.abs((m1-m2)/se);
  const df=(v1/n1+v2/n2)**2/((v1/n1)**2/(n1-1)+(v2/n2)**2/(n2-1));
  const p=2*(1-tDistCDF(t,df));
  return {t:+t.toFixed(4),df:+df.toFixed(1),p:+p.toFixed(4),sig:p<0.05,mean1:+m1.toFixed(3),mean2:+m2.toFixed(3)};
};
// One-way ANOVA
const anovaOneway = groups => {
  const k=groups.length, allVals=groups.flat(), N=allVals.length;
  if(N<k+1||k<2) return {F:0,dfB:0,dfW:0,p:1,sig:false};
  const grandMean=statMean(allVals);
  const SSB=groups.reduce((s,g)=>s+g.length*(statMean(g)-grandMean)**2,0);
  const SSW=groups.reduce((s,g)=>s+g.reduce((ss,x)=>ss+(x-statMean(g))**2,0),0);
  const dfB=k-1, dfW=N-k;
  if(SSW===0||dfW===0) return {F:0,dfB,dfW,p:1,sig:false};
  const F=(SSB/dfB)/(SSW/dfW);
  const p=1-fDistCDF(F,dfB,dfW);
  return {F:+F.toFixed(4),dfB,dfW,p:+p.toFixed(4),sig:p<0.05,SSB:+SSB.toFixed(2),SSW:+SSW.toFixed(2)};
};
// Pearson correlation
const pearson = (x,y) => {
  const n=Math.min(x.length,y.length); if(n<2) return {r:0,p:1,sig:false};
  const mx=statMean(x.slice(0,n)),my=statMean(y.slice(0,n));
  let num=0,dx=0,dy=0;
  for(let i=0;i<n;i++){num+=(x[i]-mx)*(y[i]-my);dx+=(x[i]-mx)**2;dy+=(y[i]-my)**2;}
  const r=dx&&dy?num/Math.sqrt(dx*dy):0;
  const t=Math.abs(r)*Math.sqrt((n-2)/(1-r**2));
  const p=n>2?2*(1-tDistCDF(t,n-2)):1;
  return {r:+r.toFixed(4),p:+p.toFixed(4),sig:p<0.05,n};
};
// Spearman rank correlation
const spearman = (x, y) => {
  const n = Math.min(x.length, y.length); if(n < 3) return {r:0,p:1,sig:false,n};
  const rank = arr => { const sorted=[...arr].map((v,i)=>({v,i})).sort((a,b)=>a.v-b.v); const r=new Array(arr.length); sorted.forEach((s,ri)=>{r[s.i]=ri+1;}); return r; };
  const rx=rank(x.slice(0,n)), ry=rank(y.slice(0,n));
  const d2=rx.reduce((s,_,i)=>s+(rx[i]-ry[i])**2,0);
  const rs=1-(6*d2)/(n*(n*n-1));
  const t=Math.abs(rs)*Math.sqrt((n-2)/(1-rs**2));
  const p=n>2?2*(1-tDistCDF(t,n-2)):1;
  return {r:+rs.toFixed(4),p:+p.toFixed(4),sig:p<0.05,n};
};
// Chi-square goodness of fit (observed vs equal expected)
const chiSquare = observed => {
  const n=observed.length; if(n<2) return {chi2:0,df:0,p:1,sig:false};
  const total=observed.reduce((a,b)=>a+b,0), expected=total/n;
  if(expected===0) return {chi2:0,df:n-1,p:1,sig:false};
  const chi2=observed.reduce((s,o)=>s+(o-expected)**2/expected,0);
  const df=n-1, p=1-chi2CDF(chi2,df);
  return {chi2:+chi2.toFixed(4),df,p:+p.toFixed(4),sig:p<0.05};
};
// ── Effect Size Helpers ──────────────────────────────────────────
// Cohen's d (pooled SD)
const cohensD = (a, b) => {
  const n1=a.length,n2=b.length;
  if(n1<2||n2<2) return 0;
  const pooledSD=Math.sqrt(((n1-1)*statVariance(a)+(n2-1)*statVariance(b))/(n1+n2-2));
  if(pooledSD===0) return 0;
  return +((statMean(a)-statMean(b))/pooledSD).toFixed(4);
};
const cohensDLabel = d => { const ad=Math.abs(d); return ad>=0.8?'Large':ad>=0.5?'Medium':ad>=0.2?'Small':'Negligible'; };

// Eta-squared for ANOVA
const etaSquared = (SSB, SST) => SST===0?0:+(SSB/SST).toFixed(4);
const etaLabel = e => e>=0.14?'Large':e>=0.06?'Medium':e>=0.01?'Small':'Negligible';

// 95% CI for mean difference (t-test)
const ciMeanDiff = (a, b) => {
  const m1=statMean(a),m2=statMean(b),v1=statVariance(a),v2=statVariance(b),n1=a.length,n2=b.length;
  const se=Math.sqrt(v1/n1+v2/n2);
  const df=(v1/n1+v2/n2)**2/((v1/n1)**2/(n1-1)+(v2/n2)**2/(n2-1));
  // t critical at df (approximation for 0.975 quantile)
  const tCrit = tCritical(df, 0.025);
  const diff=m1-m2, margin=tCrit*se;
  return {lower:+(diff-margin).toFixed(4), upper:+(diff+margin).toFixed(4)};
};
// CI for single mean
const ciMean = (arr) => {
  const n=arr.length; if(n<2) return {lower:0,upper:0};
  const m=statMean(arr), se=statSD(arr)/Math.sqrt(n);
  const tCrit=tCritical(n-1,0.025);
  return {lower:+(m-tCrit*se).toFixed(4), upper:+(m+tCrit*se).toFixed(4)};
};
// Approximate t-critical using bisection on tDistCDF
function tCritical(df, alpha) {
  let lo=0,hi=20;
  for(let i=0;i<60;i++){const mid=(lo+hi)/2;(1-tDistCDF(mid,df))>alpha?lo=mid:hi=mid;}
  return (lo+hi)/2;
}

// Tukey HSD post-hoc
const tukeyHSD = (groups, labels) => {
  const k=groups.length, allVals=groups.flat(), N=allVals.length;
  const grandMean=statMean(allVals);
  const SSW=groups.reduce((s,g)=>s+g.reduce((ss,x)=>ss+(x-statMean(g))**2,0),0);
  const dfW=N-k;
  const MSW=dfW>0?SSW/dfW:1;
  // Harmonic mean of n
  const hn=k/(groups.reduce((s,g)=>s+1/g.length,0));
  const SE=Math.sqrt(MSW/hn);
  const pairs=[];
  for(let i=0;i<k;i++) for(let j=i+1;j<k;j++){
    const q=Math.abs(statMean(groups[i])-statMean(groups[j]))/SE;
    // Approx p from studentized range (conservative: compare to chi2/k)
    const pApprox = Math.max(0, Math.min(1, 1-Math.pow(1-Math.exp(-q*q/2),k)));
    pairs.push({g1:labels[i],g2:labels[j],meanDiff:+(statMean(groups[i])-statMean(groups[j])).toFixed(4),q:+q.toFixed(3),sig:pApprox<0.05});
  }
  return pairs;
};

// Distribution approximations
function tDistCDF(t,df){
  // Beta regularized approximation
  const x=df/(df+t*t);
  return 1-0.5*betaInc(df/2,0.5,x);
}
function fDistCDF(f,d1,d2){
  const x=d1*f/(d1*f+d2);
  return betaInc(d1/2,d2/2,x);
}
function chi2CDF(x,k){
  if(x<=0) return 0;
  return lowerGammaReg(k/2,x/2);
}
function lowerGammaReg(a,x){
  // Series expansion
  if(x<0) return 0;
  let sum=0,term=1/a,n=0;
  while(n<200){sum+=term;n++;term*=x/(a+n);if(term<1e-10) break;}
  return Math.min(1,sum*Math.exp(-x+a*Math.log(x)-logGamma(a)));
}
function logGamma(z){
  const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];
  let x=z,y=z,tmp=x+5.5;
  tmp-=(x+0.5)*Math.log(tmp);
  let ser=1.000000000190015;
  for(let j=0;j<6;j++) ser+=c[j]/++y;
  return -tmp+Math.log(2.5066282746310005*ser/x);
}
function betaInc(a,b,x){
  // Continued fraction approximation (Lentz)
  if(x===0) return 0; if(x===1) return 1;
  const lbeta=logGamma(a)+logGamma(b)-logGamma(a+b);
  const front=Math.exp(Math.log(x)*a+Math.log(1-x)*b-lbeta)/a;
  return front*betaCF(a,b,x);
}
function betaCF(a,b,x){
  const maxIter=200,eps=3e-7;
  let c=1,d=1-(a+b)*x/(a+1); if(Math.abs(d)<1e-30) d=1e-30; d=1/d;
  let h=d;
  for(let m=1;m<=maxIter;m++){
    let aa=m*(b-m)*x/((a+2*m-1)*(a+2*m));
    d=1+aa*d; if(Math.abs(d)<1e-30) d=1e-30; c=1+aa/c; if(Math.abs(c)<1e-30) c=1e-30; d=1/d; h*=d*c;
    aa=-(a+m)*(a+b+m)*x/((a+2*m)*(a+2*m+1));
    d=1+aa*d; if(Math.abs(d)<1e-30) d=1e-30; c=1+aa/c; if(Math.abs(c)<1e-30) c=1e-30; d=1/d;
    const del=d*c; h*=del;
    if(Math.abs(del-1)<eps) break;
  }
  return h;
}

        // Descriptive stats for uploads/student
        const descUploads = {
          n: uploadsPerStudent.length,
          mean: +statMean(uploadsPerStudent).toFixed(3),
          sd: +statSD(uploadsPerStudent).toFixed(3),
          median: +statMedian(uploadsPerStudent).toFixed(3),
          min: statMin(uploadsPerStudent),
          max: statMax(uploadsPerStudent),
        };
        const descViews = {
          n: viewsPerStudy.length,
          mean: +statMean(viewsPerStudy).toFixed(3),
          sd: +statSD(viewsPerStudy).toFixed(3),
          median: +statMedian(viewsPerStudy).toFixed(3),
          min: statMin(viewsPerStudy),
          max: statMax(viewsPerStudy),
        };

        // One-way ANOVA: uploads by grade
        const anovaResult = anovaOneway(gradeGroups);

        // Welch t-test: views vs downloads per study
        const tResult = tTest2(viewsPerStudy, downloadsPerStudy);

        // Pearson: views ↔ downloads
        const corrVD = pearson(viewsPerStudy, downloadsPerStudy);
        const corrVC = pearson(viewsPerStudy, citesPerStudy);
        const corrDC = pearson(downloadsPerStudy, citesPerStudy);

        // Chi-square: observed uploads per grade vs uniform distribution
        const chiObs = gradeLabels.map(g=>approved.filter(u=>u.gradeLevel===g).reduce((s,u)=>s+allStudies.filter(st=>st.uploadedBy===u.id).length,0));
        const chiResult = chiSquare(chiObs);

        // Descriptive per grade
        const gradeDesc = gradeLabels.map((g,i)=>({
          grade: g,
          n: gradeGroups[i]?.length||0,
          mean: +(statMean(gradeGroups[i]||[])).toFixed(2),
          sd: +(statSD(gradeGroups[i]||[])).toFixed(2),
          total: (chiObs[i]||0),
        }));

        const SIG = s => (
          <span style={{padding:'2px 8px',borderRadius:99,fontSize:'0.68rem',fontWeight:700,
            background:s?'var(--green-light)':'var(--red-light)',
            color:s?'var(--green)':'var(--red)'}}>
            {s?'Significant (p<0.05)':'Not Significant'}
          </span>
        );
        const StatRow = ({label,value,sub}) => (
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'7px 0',borderBottom:'1px solid var(--border)'}}>
            <span style={{fontSize:'0.82rem',color:'var(--ink)'}}>{label}</span>
            <span style={{fontWeight:700,fontSize:'0.88rem',color:'var(--gold)',fontFamily:'var(--font-mono)'}}>{value}{sub&&<span style={{fontSize:'0.65rem',color:'var(--muted)',marginLeft:4}}>{sub}</span>}</span>
          </div>
        );

        return (
          <div style={{display:'flex',flexDirection:'column',gap:16}}>
            <div style={{padding:'12px 16px',background:'var(--blue-light)',borderRadius:10,border:'1px solid var(--blue)',fontSize:'0.82rem',color:'var(--blue)'}}>
              ℹ️ All tests use real data from Firestore. α = 0.05. Welch t-test used for unequal variances.
            </div>

            {/* Descriptive Statistics */}
            <div className="card">
              <div className="card-hd" style={{marginBottom:14}}><span className="card-title">📐 Descriptive Statistics</span></div>
              <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(260px,1fr))',gap:14}}>
                <div>
                  <div style={{fontWeight:600,fontSize:'0.78rem',color:'var(--muted)',marginBottom:8,textTransform:'uppercase',letterSpacing:'0.05em'}}>Uploads per Student</div>
                  <StatRow label="N (students)" value={descUploads.n}/>
                  <StatRow label="Mean" value={descUploads.mean}/>
                  <StatRow label="Std Deviation" value={descUploads.sd}/>
                  <StatRow label="Median" value={descUploads.median}/>
                  <StatRow label="Min" value={descUploads.min}/>
                  <StatRow label="Max" value={descUploads.max}/>
                </div>
                <div>
                  <div style={{fontWeight:600,fontSize:'0.78rem',color:'var(--muted)',marginBottom:8,textTransform:'uppercase',letterSpacing:'0.05em'}}>Views per Study</div>
                  <StatRow label="N (studies)" value={descViews.n}/>
                  <StatRow label="Mean" value={descViews.mean}/>
                  <StatRow label="Std Deviation" value={descViews.sd}/>
                  <StatRow label="Median" value={descViews.median}/>
                  <StatRow label="Min" value={descViews.min}/>
                  <StatRow label="Max" value={descViews.max}/>
                </div>
              </div>
            </div>

            {/* Per-Grade Breakdown */}
            <div className="card">
              <div className="card-hd" style={{marginBottom:14}}><span className="card-title">🎓 Uploads by Grade Level</span></div>
              <div style={{overflowX:'auto'}}>
                <table style={{width:'100%',borderCollapse:'collapse',fontSize:'0.82rem'}}>
                  <thead>
                    <tr style={{borderBottom:'2px solid var(--border)'}}>
                      {['Grade','N Students','Mean Uploads','SD','Total Uploads'].map(h=>(
                        <th key={h} style={{textAlign:'left',padding:'6px 10px',fontWeight:600,color:'var(--muted)',fontSize:'0.72rem',textTransform:'uppercase',letterSpacing:'0.04em'}}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {gradeDesc.map(g=>(
                      <tr key={g.grade} style={{borderBottom:'1px solid var(--border)'}}>
                        <td style={{padding:'8px 10px',fontWeight:700,color:GRADE_COLORS[g.grade]||'var(--ink)'}}>{g.grade}</td>
                        <td style={{padding:'8px 10px',color:'var(--ink)'}}>{g.n}</td>
                        <td style={{padding:'8px 10px',fontFamily:'var(--font-mono)',color:'var(--ink)'}}>{g.mean}</td>
                        <td style={{padding:'8px 10px',fontFamily:'var(--font-mono)',color:'var(--muted)'}}>{g.sd}</td>
                        <td style={{padding:'8px 10px',fontWeight:700,color:'var(--gold)',fontFamily:'var(--font-mono)'}}>{g.total}</td>
                      </tr>
                    ))}
                    {gradeDesc.length===0&&<tr><td colSpan={5}><p className="muted" style={{padding:'10px',fontSize:'0.82rem'}}>No grade data available.</p></td></tr>}
                  </tbody>
                </table>
              </div>
            </div>

            {/* One-Way ANOVA */}
            <div className="card" style={{borderLeft:`3px solid var(--purple)`}}>
              <div className="card-hd" style={{marginBottom:6}}>
                <span className="card-title">⚗️ One-Way ANOVA — Uploads by Grade</span>
                {SIG(anovaResult.sig)}
              </div>
              <p style={{fontSize:'0.78rem',color:'var(--muted)',marginBottom:12}}>Tests whether mean uploads differ significantly across grade levels.</p>
              <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(150px,1fr))',gap:10,marginBottom:10}}>
                {[['F-statistic',anovaResult.F],['p-value',anovaResult.p],['df (between)',anovaResult.dfB],['df (within)',anovaResult.dfW],['SS Between',anovaResult.SSB],['SS Within',anovaResult.SSW]].map(([l,v])=>(
                  <div key={l} style={{padding:'10px 12px',background:'var(--surface)',borderRadius:8,border:'1px solid var(--border)'}}>
                    <div style={{fontSize:'0.65rem',color:'var(--muted)',fontWeight:600,marginBottom:4,textTransform:'uppercase'}}>{l}</div>
                    <div style={{fontFamily:'var(--font-mono)',fontWeight:700,fontSize:'1rem',color:'var(--purple)'}}>{v}</div>
                  </div>
                ))}
              </div>
              {gradeGroups.length<2&&<p style={{fontSize:'0.78rem',color:'var(--red)'}}>⚠️ Need at least 2 grade groups with data to run ANOVA.</p>}
            </div>

            {/* Independent Samples T-Test */}
            <div className="card" style={{borderLeft:`3px solid var(--teal)`}}>
              <div className="card-hd" style={{marginBottom:6}}>
                <span className="card-title">📊 Welch's T-Test — Views vs Downloads</span>
                {SIG(tResult.sig)}
              </div>
              <p style={{fontSize:'0.78rem',color:'var(--muted)',marginBottom:12}}>Tests whether average views and downloads per study differ significantly.</p>
              <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(150px,1fr))',gap:10}}>
                {[['t-statistic',tResult.t],['p-value',tResult.p],['df (Welch)',tResult.df],['Mean Views',tResult.mean1],['Mean Downloads',tResult.mean2]].map(([l,v])=>(
                  <div key={l} style={{padding:'10px 12px',background:'var(--surface)',borderRadius:8,border:'1px solid var(--border)'}}>
                    <div style={{fontSize:'0.65rem',color:'var(--muted)',fontWeight:600,marginBottom:4,textTransform:'uppercase'}}>{l}</div>
                    <div style={{fontFamily:'var(--font-mono)',fontWeight:700,fontSize:'1rem',color:'var(--teal)'}}>{v}</div>
                  </div>
                ))}
              </div>
            </div>

            {/* Chi-Square */}
            <div className="card" style={{borderLeft:`3px solid var(--gold)`}}>
              <div className="card-hd" style={{marginBottom:6}}>
                <span className="card-title">χ² Chi-Square — Upload Distribution by Grade</span>
                {SIG(chiResult.sig)}
              </div>
              <p style={{fontSize:'0.78rem',color:'var(--muted)',marginBottom:12}}>Tests whether total uploads are distributed equally across grade levels (goodness of fit).</p>
              <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(150px,1fr))',gap:10}}>
                {[['χ² statistic',chiResult.chi2],['p-value',chiResult.p],['df',chiResult.df]].map(([l,v])=>(
                  <div key={l} style={{padding:'10px 12px',background:'var(--surface)',borderRadius:8,border:'1px solid var(--border)'}}>
                    <div style={{fontSize:'0.65rem',color:'var(--muted)',fontWeight:600,marginBottom:4,textTransform:'uppercase'}}>{l}</div>
                    <div style={{fontFamily:'var(--font-mono)',fontWeight:700,fontSize:'1rem',color:'var(--gold)'}}>{v}</div>
                  </div>
                ))}
              </div>
            </div>

            {/* Pearson Correlations */}
            {(() => {
              const corrSpVD = spearman(viewsPerStudy, downloadsPerStudy);
              const corrSpVC = spearman(viewsPerStudy, citesPerStudy);
              const corrSpDC = spearman(downloadsPerStudy, citesPerStudy);
              const corrRows = [
                {label:'Views ↔ Downloads', pearsonR:corrVD.r, pearsonP:corrVD.p, pearsonSig:corrVD.sig, spearmanR:corrSpVD.r, spearmanP:corrSpVD.p, spearmanSig:corrSpVD.sig, color:'var(--blue)'},
                {label:'Views ↔ Citations',  pearsonR:corrVC.r, pearsonP:corrVC.p, pearsonSig:corrVC.sig, spearmanR:corrSpVC.r, spearmanP:corrSpVC.p, spearmanSig:corrSpVC.sig, color:'var(--purple)'},
                {label:'Downloads ↔ Citations', pearsonR:corrDC.r, pearsonP:corrDC.p, pearsonSig:corrDC.sig, spearmanR:corrSpDC.r, spearmanP:corrSpDC.p, spearmanSig:corrSpDC.sig, color:'var(--teal)'},
              ];
              return (
                <div className="card" style={{borderLeft:`3px solid var(--blue)`}}>
                  <div className="card-hd" style={{marginBottom:10}}><span className="card-title">🔗 Correlation Matrix — Engagement Metrics</span></div>
                  <p style={{fontSize:'0.78rem',color:'var(--muted)',marginBottom:12}}>Pearson (linear) and Spearman (rank) correlations between study views, downloads, and citations.</p>
                  <div style={{overflowX:'auto'}}>
                    <table style={{width:'100%',borderCollapse:'collapse',fontSize:'0.78rem'}}>
                      <thead>
                        <tr style={{borderBottom:'2px solid var(--border)'}}>
                          {['Pair','Pearson r','p','Strength','Spearman rs','p','Strength'].map(h=>(
                            <th key={h} style={{padding:'6px 10px',textAlign:'left',fontWeight:600,color:'var(--muted)',fontSize:'0.68rem',textTransform:'uppercase',whiteSpace:'nowrap'}}>{h}</th>
                          ))}
                        </tr>
                      </thead>
                      <tbody>
                        {corrRows.map(row=>{
                          const prStr=Math.abs(row.pearsonR)>=0.7?'Strong':Math.abs(row.pearsonR)>=0.4?'Moderate':Math.abs(row.pearsonR)>=0.2?'Weak':'Negligible';
                          const srStr=Math.abs(row.spearmanR)>=0.7?'Strong':Math.abs(row.spearmanR)>=0.4?'Moderate':Math.abs(row.spearmanR)>=0.2?'Weak':'Negligible';
                          return (
                            <tr key={row.label} style={{borderBottom:'1px solid var(--border)'}}>
                              <td style={{padding:'9px 10px',fontWeight:500,color:'var(--ink)',whiteSpace:'nowrap'}}>{row.label}</td>
                              <td style={{padding:'9px 10px',fontFamily:'var(--font-mono)',fontWeight:700,color:row.color}}>{row.pearsonR}</td>
                              <td style={{padding:'9px 10px',fontFamily:'var(--font-mono)',fontSize:'0.72rem',color:row.pearsonSig?'var(--green)':'var(--muted)'}}>{row.pearsonP}{row.pearsonSig?'*':''}</td>
                              <td style={{padding:'9px 10px',fontSize:'0.72rem',color:'var(--muted)'}}>{prStr}</td>
                              <td style={{padding:'9px 10px',fontFamily:'var(--font-mono)',fontWeight:700,color:row.color}}>{row.spearmanR}</td>
                              <td style={{padding:'9px 10px',fontFamily:'var(--font-mono)',fontSize:'0.72rem',color:row.spearmanSig?'var(--green)':'var(--muted)'}}>{row.spearmanP}{row.spearmanSig?'*':''}</td>
                              <td style={{padding:'9px 10px',fontSize:'0.72rem',color:'var(--muted)'}}>{srStr}</td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                  <div style={{marginTop:10,fontSize:'0.68rem',color:'var(--muted)'}}>* p &lt; 0.05 (significant)</div>
                  {/* Visual correlation bars */}
                  <div style={{marginTop:14,display:'flex',flexDirection:'column',gap:8}}>
                    {corrRows.map(row=>(
                      <div key={row.label}>
                        <div style={{fontSize:'0.72rem',fontWeight:500,color:'var(--ink)',marginBottom:3}}>{row.label}</div>
                        <div style={{display:'flex',gap:6,alignItems:'center'}}>
                          <span style={{fontSize:'0.62rem',color:'var(--muted)',width:52,flexShrink:0}}>Pearson</span>
                          <div style={{flex:1,height:7,background:'var(--border)',borderRadius:99,overflow:'hidden'}}>
                            <div style={{height:'100%',width:`${Math.abs(row.pearsonR)*100}%`,background:row.color,borderRadius:99,opacity:0.8}}/>
                          </div>
                          <span style={{fontSize:'0.68rem',fontFamily:'var(--font-mono)',fontWeight:700,color:row.color,width:36}}>{row.pearsonR}</span>
                        </div>
                        <div style={{display:'flex',gap:6,alignItems:'center',marginTop:2}}>
                          <span style={{fontSize:'0.62rem',color:'var(--muted)',width:52,flexShrink:0}}>Spearman</span>
                          <div style={{flex:1,height:7,background:'var(--border)',borderRadius:99,overflow:'hidden'}}>
                            <div style={{height:'100%',width:`${Math.abs(row.spearmanR)*100}%`,background:row.color,borderRadius:99,opacity:0.45}}/>
                          </div>
                          <span style={{fontSize:'0.68rem',fontFamily:'var(--font-mono)',fontWeight:700,color:row.color,width:36}}>{row.spearmanR}</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              );
            })()}

            <div style={{padding:'10px 14px',background:'var(--surface)',borderRadius:8,border:'1px solid var(--border)',fontSize:'0.72rem',color:'var(--muted)'}}>
              📌 <strong style={{color:'var(--ink)'}}>Interpretation guide:</strong> p &lt; 0.05 = statistically significant. |r| ≥ 0.7 = strong, 0.4–0.7 = moderate, 0.2–0.4 = weak correlation. ANOVA F-statistic compares between-group to within-group variance.
            </div>
          </div>
        );
      })()}
    </div>
  );
}

// Grade-level colour palette
const GRADE_COLORS = {'8':'var(--purple)','9':'var(--blue)','10':'var(--teal)','11':'var(--green)','12':'var(--gold)'};
const GRADE_BG     = {'8':'var(--purple-light)','9':'var(--blue-light)','10':'var(--teal-light)','11':'var(--green-light)','12':'var(--gold-bg)'};

function GradeBadge({ level }) {
  if(!level) return <span style={{fontSize:'0.68rem',color:'var(--muted)'}}>—</span>;
  return (
    <span style={{display:'inline-flex',alignItems:'center',padding:'2px 10px',borderRadius:99,
      fontSize:'0.68rem',fontWeight:700,letterSpacing:'0.3px',
      background:GRADE_BG[level]||'var(--surface)',color:GRADE_COLORS[level]||'var(--muted)',
      border:`1.5px solid ${GRADE_COLORS[level]||'var(--border)'}`}}>
      Grade {level}
