//  BATCH GRADING PAGE (Teacher only)
// ══════════════════════════════════════════════════════════════════
function BatchGradingPage({ currentUser }) {
  const [studies, setStudies] = useState([]);
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState({});
  const [saved, setSaved] = useState({});
  const [drafts, setDrafts] = useState({});   // { studyId: { grade, criteria, comments } }
  const [expandedId, setExpandedId] = useState(null);
  const [filter, setFilter] = useState('ungraded'); // 'ungraded' | 'graded' | 'all'
  const [search, setSearch] = useState('');
  const [bulkDone, setBulkDone] = useState(0);

  const load = async () => {
    setLoading(true);
    try {
      const res = await API.getStudies({ status: 'active', perPage: 200 });
      setStudies(res.data || []);
    } catch(e) { toast.err('Failed to load studies.'); }
    setLoading(false);
  };
  useEffect(() => { load(); }, []);

  const filtered = useMemo(() => {
    let list = studies;
    if (filter === 'ungraded') list = list.filter(s => !s.teacherGrade);
    if (filter === 'graded')   list = list.filter(s =>  s.teacherGrade);
    if (search.trim()) {
      const q = search.trim().toLowerCase();
      list = list.filter(s =>
        (s.title||'').toLowerCase().includes(q) ||
        (s.uploadedByName||'').toLowerCase().includes(q) ||
        (s.uploaderSection||'').toLowerCase().includes(q)
      );
    }
    return list;
  }, [studies, filter, search]);

  const setDraft = (id, field, value) => {
    setDrafts(d => ({ ...d, [id]: { ...(d[id]||{}), [field]: value } }));
  };
  const setCrit = (id, k, v) => {
    setDrafts(d => ({
      ...d,
      [id]: { ...(d[id]||{}), criteria: { ...((d[id]||{}).criteria||{}), [k]: v } }
    }));
  };

  const submitOne = async (study) => {
    const draft = drafts[study.id] || {};
    const grade = draft.grade;
    const criteria = draft.criteria || {};
    const comments = draft.comments || '';
    if (!grade) { toast.err('Please select a grade for "' + study.title.slice(0,40) + '"'); return; }
    const totalScore = Object.values(criteria).reduce((a,b)=>a+(b||0), 0);
    setSaving(s => ({ ...s, [study.id]: true }));
    try {
      await API.submitTeacherFeedback(study.id, {
        teacherId: currentUser.id,
        teacherName: currentUser.name,
        grade, criteria, comments,
        recommendations: draft.recommendations || '',
        requestsRevision: false,
      });
      setSaved(s => ({ ...s, [study.id]: true }));
      setBulkDone(n => n + 1);
      setStudies(prev => prev.map(s => s.id === study.id ? { ...s, teacherGrade: grade, teacherScore: totalScore } : s));
      setExpandedId(null);
      toast.ok('✅ Graded: ' + study.title.slice(0, 40) + (study.title.length > 40 ? '…' : ''));
    } catch(e) { toast.err(e.message); }
    setSaving(s => ({ ...s, [study.id]: false }));
  };

  const gradeColor = g => ({ 'A+':'var(--teal)','A':'var(--teal)','A-':'var(--teal)','B+':'var(--blue)','B':'var(--blue)','B-':'var(--blue)' }[g] || 'var(--gold)');

  if (loading) return <div><StatsSkeleton count={3}/><StudiesGridSkeleton count={4}/></div>;

  const ungradedCount = studies.filter(s => !s.teacherGrade).length;

  return (
    <div>
      {/* Header */}
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', flexWrap:'wrap', gap:10, marginBottom:20 }}>
        <div>
          <h2 style={{ fontFamily:'var(--font-display)', fontSize:'var(--text-2xl)', marginBottom:3 }}>⚡ Batch Grading</h2>
          <p className="muted">Grade multiple studies without opening each one individually.</p>
        </div>
        {bulkDone > 0 && (
          <div style={{ display:'flex', alignItems:'center', gap:8, padding:'8px 14px', background:'var(--green-light)', border:'1.5px solid var(--green)', borderRadius:'var(--radius)', fontSize:'0.82rem', color:'var(--green)', fontWeight:600 }}>
            ✅ {bulkDone} graded this session
          </div>
        )}
      </div>

      {/* Stats row */}
      <div className="stats" style={{ marginBottom:16 }}>
        <div className="stat gold"><div className="stat-icon">📄</div><div className="stat-body"><div className="stat-lbl">Total Studies</div><div className="stat-val">{studies.length}</div></div></div>
        <div className="stat red"><div className="stat-icon">⏳</div><div className="stat-body"><div className="stat-lbl">Needs Grading</div><div className="stat-val">{ungradedCount}</div></div></div>
        <div className="stat teal"><div className="stat-icon">✅</div><div className="stat-body"><div className="stat-lbl">Graded</div><div className="stat-val">{studies.length - ungradedCount}</div></div></div>
      </div>

      {/* Filters */}
      <div style={{ display:'flex', gap:8, flexWrap:'wrap', marginBottom:14, alignItems:'center' }}>
        {[['ungraded','⏳ Needs Grading'],['graded','✅ Graded'],['all','📋 All']].map(([v,l]) => (
          <button key={v} onClick={()=>setFilter(v)}
            style={{ padding:'6px 14px', borderRadius:99, fontSize:'0.78rem', fontWeight:600, cursor:'pointer', border:`1.5px solid ${filter===v?'var(--gold)':'var(--border)'}`, background:filter===v?'var(--gold-bg)':'var(--surface)', color:filter===v?'var(--gold)':'var(--muted)', transition:'all .15s' }}>
            {l}
          </button>
        ))}
        <input
          value={search} onChange={e=>setSearch(e.target.value)}
          placeholder="Search by title, student, or section…"
          style={{ flex:1, minWidth:180, padding:'7px 12px', borderRadius:'var(--radius)', border:'1.5px solid var(--border)', background:'var(--surface)', color:'var(--ink)', fontSize:'0.85rem' }}
        />
      </div>

      {/* Study list */}
      {filtered.length === 0 ? (
        <EmptyState icon="🎉" title={filter==='ungraded'?"All caught up!":`No studies found`} message={filter==='ungraded'?"Every study has been graded.":"Try a different filter or search."} compact/>
      ) : (
        <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
          {filtered.map(study => {
            const draft = drafts[study.id] || {};
            const isOpen = expandedId === study.id;
            const totalCrit = Object.values(draft.criteria||{}).reduce((a,b)=>a+(b||0),0);
            const alreadyGraded = !!study.teacherGrade && !saved[study.id];
            return (
              <div key={study.id} className="card" style={{ padding:0, overflow:'hidden', border: saved[study.id] ? '1.5px solid var(--green)' : alreadyGraded ? '1.5px solid var(--border)' : '1.5px solid var(--gold)', transition:'border-color .2s' }}>
                {/* Row header — always visible */}
                <div
                  style={{ display:'flex', alignItems:'center', gap:12, padding:'12px 16px', cursor:'pointer', background: isOpen ? 'var(--gold-bg)' : 'transparent', transition:'background .15s' }}
                  onClick={() => setExpandedId(isOpen ? null : study.id)}>
                  {/* Status dot */}
                  <div style={{ width:10, height:10, borderRadius:'50%', flexShrink:0, background: saved[study.id] ? 'var(--green)' : study.teacherGrade ? 'var(--teal)' : 'var(--gold)' }}/>
                  <div style={{ flex:1, minWidth:0 }}>
                    <div style={{ fontWeight:600, fontSize:'0.9rem', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{study.title}</div>
                    <div style={{ fontSize:'0.72rem', color:'var(--muted)', marginTop:2, display:'flex', gap:10, flexWrap:'wrap' }}>
                      <span>👤 {study.uploadedByName || 'Unknown'}</span>
                      {study.uploaderSection && <span>🏫 {study.uploaderSection}</span>}
                      {study.uploaderGrade && <span>📚 Grade {study.uploaderGrade}</span>}
                      <span>📅 {study.year}</span>
                    </div>
                  </div>
                  {/* Current grade badge */}
                  {(study.teacherGrade || draft.grade) && (
                    <span style={{ padding:'3px 10px', borderRadius:99, fontSize:'0.75rem', fontWeight:700, background:'var(--teal-light)', color: gradeColor(study.teacherGrade || draft.grade), border:`1.5px solid ${gradeColor(study.teacherGrade || draft.grade)}`, flexShrink:0 }}>
                      {draft.grade || study.teacherGrade}
                    </span>
                  )}
                  {saved[study.id] && <span style={{ fontSize:'0.75rem', color:'var(--green)', fontWeight:700, flexShrink:0 }}>✅ Saved</span>}
                  <span style={{ color:'var(--muted)', fontSize:'0.85rem', flexShrink:0 }}>{isOpen ? '▲' : '▼'}</span>
                </div>

                {/* Expanded grading form */}
                {isOpen && (
                  <div style={{ padding:'16px', borderTop:'1px solid var(--border)', background:'var(--surface)' }}>
                    {alreadyGraded && (
                      <div style={{ padding:'8px 12px', background:'var(--teal-light)', border:'1px solid var(--teal)', borderRadius:'var(--radius)', marginBottom:12, fontSize:'0.8rem', color:'var(--teal)' }}>
                        ℹ️ Already graded: <strong>{study.teacherGrade}</strong> ({study.teacherScore}/100). Submitting will overwrite.
                      </div>
                    )}
                    {/* Grade selector */}
                    <div style={{ marginBottom:12 }}>
                      <div style={{ fontSize:'0.72rem', fontWeight:600, textTransform:'uppercase', letterSpacing:'0.6px', color:'var(--muted)', marginBottom:7 }}>Grade</div>
                      <div style={{ display:'flex', gap:5, flexWrap:'wrap' }}>
                        {Object.keys(GRADE_LABELS).map(g => (
                          <button key={g} onClick={() => setDraft(study.id,'grade',g)}
                            style={{ padding:'5px 12px', borderRadius:6, fontSize:'0.8rem', fontWeight:700, cursor:'pointer', border:`1.5px solid ${draft.grade===g ? gradeColor(g) : 'var(--border)'}`, background: draft.grade===g ? gradeColor(g) : 'var(--surface)', color: draft.grade===g ? '#fff' : 'var(--muted)', transition:'all .12s' }}>
                            {g}
                          </button>
                        ))}
                      </div>
                    </div>

                    {/* Criteria scores */}
                    <div style={{ marginBottom:12 }}>
                      <div style={{ fontSize:'0.72rem', fontWeight:600, textTransform:'uppercase', letterSpacing:'0.6px', color:'var(--muted)', marginBottom:7 }}>
                        Scoring Criteria <span style={{ color: totalCrit>=90?'var(--green)':totalCrit>=75?'var(--teal)':totalCrit>=60?'var(--gold)':'var(--red)', fontWeight:700 }}>({totalCrit}/100)</span>
                      </div>
                      <div className="tf-criteria">
                        {Object.entries(CRITERIA_LABELS).map(([k,{label,max}]) => (
                          <ScoreInput key={k} label={label} max={max} value={(draft.criteria||{})[k]||0} onChange={v=>setCrit(study.id,k,v)}/>
                        ))}
                      </div>
                    </div>

                    {/* Comments */}
                    <div style={{ marginBottom:14 }}>
                      <div style={{ fontSize:'0.72rem', fontWeight:600, textTransform:'uppercase', letterSpacing:'0.6px', color:'var(--muted)', marginBottom:5 }}>Comments (optional)</div>
                      <textarea
                        value={draft.comments||''}
                        onChange={e=>setDraft(study.id,'comments',e.target.value)}
                        placeholder="Feedback for the student…"
                        rows={2}
                        style={{ width:'100%', padding:'9px 12px', borderRadius:'var(--radius)', border:'1.5px solid var(--border)', background:'var(--white)', color:'var(--ink)', fontSize:'0.875rem', resize:'vertical', fontFamily:'var(--font-body)', boxSizing:'border-box' }}
                      />
                    </div>

                    <div style={{ display:'flex', gap:8 }}>
                      <button
                        className="btn btn-gold btn-sm"
                        onClick={() => submitOne(study)}
                        disabled={saving[study.id] || !draft.grade}
                        style={{ display:'flex', alignItems:'center', gap:6 }}>
                        {saving[study.id] ? <><span className="spin spin-dark" style={{width:13,height:13}}/> Saving…</> : '✅ Submit Grade'}
                      </button>
                      <button className="btn btn-ol btn-sm" onClick={()=>setExpandedId(null)}>Cancel</button>
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function RecognizedStudiesPage({ currentUser, isAdmin }) {
  const [entries, setEntries] = useState([]);
  const [cats, setCats] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showForm, setShowForm] = useState(false);
  const [editId, setEditId] = useState(null);
  const [form, setForm] = useState({ title:'', authors:'', award:'', year:String(new Date().getFullYear()), description:'', institution:'', category:'' });
  const [search, setSearch] = useState('');
  const [filterCat, setFilterCat] = useState('');
  const [deleteConfirm, setDeleteConfirm] = useState(null);
  const [saving, setSaving] = useState(false);
  const [addAwardFor, setAddAwardFor] = useState(null);
  const [awardForm, setAwardForm] = useState({ award:'', year:String(new Date().getFullYear()) });

  const load = useCallback(async () => {
    setLoading(true);
    const [data, catsArr] = await Promise.all([API.getRecognizedStudies(), API.getCategories()]);
    setEntries(data);
    setCats(catsArr);
    setLoading(false);
  }, []);

  useEffect(() => { load(); }, [load]);

  const sf = (k,v) => setForm(f => ({...f, [k]:v}));

  const openNew = () => {
    setEditId(null);
    setForm({ title:'', authors:'', award:'', year:String(new Date().getFullYear()), description:'', institution:'', category:'' });
    setShowForm(true);
  };

  const openEdit = entry => {
    setEditId(entry.id);
    setForm({ title:entry.title, authors:entry.authors, award:entry.award, year:entry.year, description:entry.description||'', institution:entry.institution||'', category:entry.category||'' });
    setShowForm(true);
  };

  const openAddAward = group => {
    setAddAwardFor({ title: group.title, authors: group.authors, category: group.category||'', institution: group.institution||'', description: group.description||'' });
    setAwardForm({ award:'', year:String(new Date().getFullYear()) });
  };

  const submitNewAward = async () => {
    if (!awardForm.award.trim()) { toast.err('Award name is required.'); return; }
    setSaving(true);
    try {
      await API.addRecognizedStudy({ ...addAwardFor, award: awardForm.award.trim(), year: awardForm.year, addedBy: currentUser.name });
      toast.ok('Award added!');
      setAddAwardFor(null);
      await load();
    } catch(e) { toast.err(e.message); }
    setSaving(false);
  };

  const submit = async () => {
    if (!form.title.trim()) { toast.err('Title is required.'); return; }
    if (!form.authors.trim()) { toast.err('Author(s) are required.'); return; }
    if (!form.award.trim()) { toast.err('Award / Recognition is required.'); return; }
    setSaving(true);
    try {
      if (editId) {
        await API.updateRecognizedStudy(editId, form);
        toast.ok('Entry updated!');
      } else {
        await API.addRecognizedStudy({ ...form, addedBy: currentUser.name });
        toast.ok('Recognized study added!');
      }
      setShowForm(false);
      await load();
    } catch(e) { toast.err(e.message); }
    setSaving(false);
  };

  const remove = async id => {
    try {
      await API.deleteRecognizedStudy(id);
      setDeleteConfirm(null);
      toast.ok('Entry removed.');
      await load();
    } catch(e) { toast.err(e.message); }
  };

  const filtered = entries.filter(e => {
    const matchSearch = !search || [e.title, e.authors, e.award, e.institution].join(' ').toLowerCase().includes(search.toLowerCase());
    const matchCat = !filterCat || e.category === filterCat;
    return matchSearch && matchCat;
  });

  // Group filtered entries by title (case-insensitive), sorted by award count desc
  const groupedFiltered = useMemo(() => {
    const map = {};
    filtered.forEach(e => {
      const key = e.title.trim().toLowerCase();
      if (!map[key]) map[key] = { title: e.title, authors: e.authors, category: e.category, institution: e.institution, description: e.description, year: e.year, addedBy: e.addedBy, createdAt: e.createdAt, awards: [], ids: [] };
      // merge fields: prefer non-empty values
      if (e.category && !map[key].category) map[key].category = e.category;
      if (e.institution && !map[key].institution) map[key].institution = e.institution;
      if (e.description && !map[key].description) map[key].description = e.description;
      map[key].awards.push({ award: e.award, year: e.year, id: e.id, addedBy: e.addedBy, createdAt: e.createdAt });
      map[key].ids.push(e.id);
    });
    return Object.values(map).sort((a, b) => b.awards.length - a.awards.length);
  }, [filtered]);

  const RANK_STYLES = [
    { border:'var(--gold)',  trophy:'🥇', rankBg:'var(--gold-bg)',   rankColor:'var(--gold)',   rankLabel:'#1' },
    { border:'var(--slate)', trophy:'🥈', rankBg:'var(--surface)',   rankColor:'var(--slate)',  rankLabel:'#2' },
    { border:'#b87333',      trophy:'🥉', rankBg:'#fdf3ec',          rankColor:'#b87333',       rankLabel:'#3' },
  ];

  return (
    <div>
      {/* Header */}
      <div className="page-hd">
        <div className="page-hd-left">
          <h2>Recognized Studies</h2>
          <p className="muted">{groupedFiltered.length} {groupedFiltered.length===1?'study':'studies'}{filterCat && <span style={{color:'var(--gold)',marginLeft:5}}>· {filterCat}</span>} · sorted by awards won</p>
        </div>
        {isAdmin && (
          <button className="btn btn-gold" onClick={openNew}>
            <Ico.plus/> Add Recognition
          </button>
        )}
      </div>

      {/* Admin notice */}
      {!isAdmin && (
        <div style={{display:'flex',alignItems:'center',gap:9,padding:'10px 14px',background:'var(--blue-light)',border:'1.5px solid var(--blue)',borderRadius:'var(--radius)',marginBottom:18,fontSize:'var(--text-sm)',color:'var(--blue)'}}>
          <Ico.award/>
          <span>This page showcases research studies that have received awards or formal recognition. New entries are added by a teacher.</span>
        </div>
      )}

      {/* Search + Category filter */}
      {entries.length > 0 && (
        <div className="fb" style={{marginBottom:18,flexWrap:'wrap',gap:9}}>
          <div className="sb" style={{flex:1,minWidth:200}}>
            <Ico.search/>
            <input placeholder="Search by title, author, award…" value={search} onChange={e=>setSearch(e.target.value)} aria-label="Search recognized studies"/>
            {search&&<button onClick={()=>setSearch('')} style={{background:'none',border:'none',cursor:'pointer',color:'var(--muted)',padding:'0 2px',fontSize:'1rem'}}>✕</button>}
          </div>
          {cats.length > 0 && (
            <select value={filterCat} onChange={e=>setFilterCat(e.target.value)} style={{width:'auto',padding:'10px 13px'}} aria-label="Filter by category">
              <option value="">All Categories</option>
              {cats.map(c=><option key={c}>{c}</option>)}
            </select>
          )}
          {(search || filterCat) && (
            <button className="btn btn-ol btn-sm" onClick={()=>{setSearch('');setFilterCat('');}} style={{whiteSpace:'nowrap'}}>✕ Clear</button>
          )}
        </div>
      )}

      {loading ? (
        <div style={{textAlign:'center',padding:'50px',color:'var(--muted)'}}>
          <span className="spin spin-gold" style={{width:28,height:28,border:'3px solid rgba(201,162,39,0.25)',borderTopColor:'var(--gold)',display:'inline-block',marginBottom:12}}/>
          <p>Loading…</p>
        </div>
      ) : entries.length === 0 ? (
        <EmptyState
          icon="🏆"
          title="No recognized studies yet"
          message={isAdmin ? 'Highlight award-winning or outstanding research by clicking "Add Recognition" above.' : 'Outstanding research will be showcased here once recognized by your teachers.'}
        />
      ) : groupedFiltered.length === 0 ? (
        <EmptyState
          icon="🔍"
          title="No results found"
          message="Try a different search term or clear the search to see all recognized studies."
        />
      ) : (
        <div style={{display:'flex',flexDirection:'column',gap:14}}>
          {groupedFiltered.map((group, idx) => {
            const rs = RANK_STYLES[idx] || { border:'var(--border)', trophy:'🏆', rankBg:'var(--surface)', rankColor:'var(--muted)', rankLabel:`#${idx+1}` };
            const awardCount = group.awards.length;
            return (
              <div key={group.title} className="card" style={{position:'relative',borderLeft:`4px solid ${rs.border}`,transition:'box-shadow var(--transition)'}}>
                {/* Rank + admin buttons */}
                <div style={{position:'absolute',top:14,right:14,display:'flex',gap:6,alignItems:'center'}}>
                  {/* Award count badge */}
                  <span style={{display:'inline-flex',alignItems:'center',gap:4,padding:'3px 10px',borderRadius:99,background:rs.rankBg,color:rs.rankColor,border:`1.5px solid ${rs.border}`,fontSize:'var(--text-xs)',fontWeight:700,whiteSpace:'nowrap'}}>
                    {rs.trophy} {awardCount} award{awardCount!==1?'s':''}
                  </span>
                  {isAdmin && (
                    <>
                      <button className="btn btn-teal btn-sm" onClick={()=>openAddAward(group)} data-tip="Add another award to this study" aria-label={`Add award to ${group.title}`} style={{display:'flex',alignItems:'center',gap:4}}><Ico.plus/> Award</button>
                      <button className="btn btn-ol btn-sm" onClick={()=>openEdit({...group.awards[0], title:group.title, authors:group.authors, category:group.category||'', institution:group.institution||'', description:group.description||'', year:group.awards[0].year, id:group.awards[0].id})} data-tip="Edit latest entry" aria-label={`Edit ${group.title}`}><Ico.edit/></button>
                      <button className="btn btn-red btn-sm" onClick={()=>setDeleteConfirm(group.awards[0].id)} data-tip-pos="left" data-tip="Delete latest entry" aria-label={`Delete ${group.title}`}><Ico.trash/></button>
                    </>
                  )}
                </div>

                <div style={{display:'flex',alignItems:'flex-start',gap:14,flexWrap:'wrap',paddingRight:isAdmin?160:80}}>
                  {/* Rank icon */}
                  <div style={{width:46,height:46,borderRadius:10,background:rs.rankBg,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'1.5rem',flexShrink:0,border:`1.5px solid ${rs.border}`}}>
                    {rs.trophy}
                  </div>
                  <div style={{flex:1,minWidth:200}}>
                    {/* Rank label */}
                    <div style={{fontSize:'var(--text-xs)',fontWeight:700,color:rs.rankColor,marginBottom:3,letterSpacing:'0.04em'}}>{rs.rankLabel} · RANK</div>
                    <h3 style={{fontFamily:'var(--font-display)',fontSize:'var(--text-lg)',fontWeight:700,color:'var(--ink)',marginBottom:4,lineHeight:1.3}}>{group.title}</h3>
                    <p style={{fontSize:'var(--text-sm)',color:'var(--slate)',marginBottom:8}}>By: <strong>{group.authors}</strong></p>

                    {/* Category badge */}
                    {group.category && (
                      <div style={{marginBottom:8}}>
                        <span style={{display:'inline-flex',alignItems:'center',gap:4,padding:'3px 10px',borderRadius:99,background:'var(--purple-light)',color:'var(--purple)',border:'1.5px solid var(--purple)',fontSize:'var(--text-xs)',fontWeight:600}}>
                          🏷️ {group.category}
                        </span>
                      </div>
                    )}

                    {/* All awards list */}
                    <div style={{display:'flex',flexDirection:'column',gap:5,marginBottom:group.description||group.institution?10:0}}>
                      {group.awards.map((aw,i)=>(
                        <div key={aw.id} style={{display:'flex',alignItems:'center',gap:7,flexWrap:'wrap'}}>
                          <span style={{display:'inline-flex',alignItems:'center',gap:5,padding:'4px 11px',borderRadius:99,background:'var(--gold-bg)',color:'var(--gold)',border:'1.5px solid var(--gold)',fontSize:'var(--text-xs)',fontWeight:700}}>
                            🥇 {aw.award}
                          </span>
                          <span style={{fontSize:'var(--text-xs)',color:'var(--muted)'}}>{aw.year}</span>
                          {isAdmin && (
                            <button className="btn btn-red btn-sm" style={{padding:'2px 8px',fontSize:'0.65rem',minHeight:24}} onClick={()=>setDeleteConfirm(aw.id)} aria-label={`Remove award: ${aw.award}`}><Ico.trash/></button>
                          )}
                        </div>
                      ))}
                    </div>

                    {(group.description || group.institution) && (
                      <div style={{display:'flex',flexDirection:'column',gap:4}}>
                        {group.institution && (
                          <p style={{fontSize:'var(--text-xs)',color:'var(--muted)',display:'flex',alignItems:'center',gap:4}}>
                            🏫 {group.institution}
                          </p>
                        )}
                        {group.description && (
                          <p style={{fontSize:'var(--text-sm)',color:'var(--slate)',lineHeight:1.55}}>{group.description}</p>
                        )}
                      </div>
                    )}

                    <div style={{display:'flex',gap:14,marginTop:10,fontSize:'var(--text-xs)',color:'var(--muted)',flexWrap:'wrap'}}>
                      <span>Added by {group.addedBy}</span>
                      <span>{fmtDate(group.createdAt)}</span>
                    </div>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* Add / Edit Modal — Admin only */}
      {showForm && isAdmin && (
        <Modal title={editId ? 'Edit Recognition' : 'Add Recognized Study'} onClose={()=>setShowForm(false)} wide>
          <div style={{display:'flex',alignItems:'center',gap:9,padding:'10px 14px',background:'var(--blue-light)',border:'1px solid var(--blue)',borderRadius:'var(--radius)',marginBottom:18,fontSize:'var(--text-sm)',color:'var(--blue)'}}>
            ℹ️ Only teachers can add or edit entries. This listing is visible to all users.
          </div>
          <div className="fg"><label>Study Title *</label><input placeholder="Full title of the recognized research study" value={form.title} onChange={e=>sf('title',e.target.value)} autoFocus/></div>
          <div className="fg"><label>Author(s) * <span style={{fontWeight:300,color:'var(--muted)'}}>(comma-separated)</span></label><input placeholder="e.g. Juan dela Cruz, Maria Santos" value={form.authors} onChange={e=>sf('authors',e.target.value)}/></div>
          <div className="fg"><label>Award / Recognition *</label><input placeholder="e.g. Best Research Paper – Regional Science Fair 2024" value={form.award} onChange={e=>sf('award',e.target.value)}/></div>
          <div className="fr">
            <div className="fg"><label>Year</label><input type="number" min="1900" max="2099" value={form.year} onChange={e=>sf('year',e.target.value)}/></div>
            <div className="fg">
              <label>Category</label>
              <select value={form.category} onChange={e=>sf('category',e.target.value)}>
                <option value="">— None —</option>
                {cats.map(c=><option key={c} value={c}>{c}</option>)}
              </select>
            </div>
          </div>
          <div className="fg"><label>Institution / Organization</label><input placeholder="e.g. SABNAHIS" value={form.institution} onChange={e=>sf('institution',e.target.value)}/></div>
          <div className="fg"><label>Description <span style={{fontWeight:300,color:'var(--muted)'}}>(optional)</span></label><textarea placeholder="Brief description of the recognition or study significance…" value={form.description} onChange={e=>sf('description',e.target.value)} style={{minHeight:80}}/></div>
          <div style={{display:'flex',gap:9,justifyContent:'flex-end',flexWrap:'wrap',marginTop:4}}>
            <button className="btn btn-ol" onClick={()=>setShowForm(false)}>Cancel</button>
            <button className="btn btn-gold" onClick={submit} disabled={saving}>{saving?<><span className="spin spin-dark"/>Saving…</>:editId?<><Ico.chk/> Save Changes</>:<><Ico.plus/> Add Recognition</>}</button>
          </div>
        </Modal>
      )}

      {/* Add Award Modal */}
      {addAwardFor && isAdmin && (
        <Modal title="Add Award" onClose={()=>setAddAwardFor(null)}>
          <div style={{padding:'10px 14px',background:'var(--teal-light)',border:'1px solid var(--teal)',borderRadius:'var(--radius)',marginBottom:16,fontSize:'var(--text-sm)',color:'var(--teal)'}}>
            🏆 Adding a new award to: <strong>{addAwardFor.title}</strong>
          </div>
          <div className="fg">
            <label>Award / Recognition *</label>
            <input placeholder="e.g. 2nd Place – Division Science Fair 2025" value={awardForm.award} onChange={e=>setAwardForm(f=>({...f,award:e.target.value}))} autoFocus/>
          </div>
          <div className="fg" style={{maxWidth:160}}>
            <label>Year</label>
            <input type="number" min="1900" max="2099" value={awardForm.year} onChange={e=>setAwardForm(f=>({...f,year:e.target.value}))}/>
          </div>
          <div style={{display:'flex',gap:9,justifyContent:'flex-end',marginTop:4}}>
            <button className="btn btn-ol" onClick={()=>setAddAwardFor(null)}>Cancel</button>
            <button className="btn btn-teal" onClick={submitNewAward} disabled={saving}>{saving?<><span className="spin spin-dark"/>Saving…</>:<><Ico.plus/> Add Award</>}</button>
          </div>
        </Modal>
      )}

      {/* Delete Confirm Modal */}
      {deleteConfirm && (
        <Modal title="Remove Recognition" onClose={()=>setDeleteConfirm(null)}>
          <p style={{marginBottom:20,color:'var(--slate)'}}>Are you sure you want to remove this recognized study entry? This cannot be undone.</p>
          <div style={{display:'flex',gap:9,justifyContent:'flex-end'}}>
            <button className="btn btn-ol" onClick={()=>setDeleteConfirm(null)}>Cancel</button>
            <button className="btn btn-red" onClick={()=>remove(deleteConfirm)}><Ico.trash/> Remove</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════
//  ANNOUNCEMENTS PAGE
// ══════════════════════════════════════════════════════════════════
function AnnouncementsPage({ currentUser }) {
  const isTeacher = currentUser.role === 'admin';
  const [announcements, setAnnouncements] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showForm, setShowForm] = useState(false);
  const [title, setTitle] = useState('');
  const [body, setBody] = useState('');
  const [priority, setPriority] = useState('normal');
  const [durationHours, setDurationHours] = useState('24');
  const [submitting, setSubmitting] = useState(false);
  const [scheduledAt, setScheduledAt] = useState('');
  const [targetGrades, setTargetGrades] = useState([]);
  const [targetSections, setTargetSections] = useState('');
  const [now, setNow] = useState(new Date());

  // Live clock — ticks every minute to update countdowns
  useEffect(() => {
    const t = setInterval(() => setNow(new Date()), 60000);
    return () => clearInterval(t);
  }, []);

  const load = async () => {
    setLoading(true);
    const data = await API.getAnnouncements(20, currentUser);
    data.sort((a,b) => {
      if (a.pinned && !b.pinned) return -1;
      if (!a.pinned && b.pinned) return 1;
      return new Date(b.createdAt) - new Date(a.createdAt);
    });
    setAnnouncements(data);
    setLoading(false);
  };
  useEffect(() => { load(); }, []);

  const submit = async () => {
    setSubmitting(true);
    try {
      await API.createAnnouncement({ title, body, priority, authorId:currentUser.id, authorName:currentUser.name, durationHours, scheduledAt: scheduledAt || null, targetGrades, targetSections: targetSections.split(',').map(s=>s.trim()).filter(Boolean) });
      toast.ok(scheduledAt ? 'Announcement scheduled!' : 'Announcement posted!');
      setTitle(''); setBody(''); setPriority('normal'); setDurationHours('24'); setScheduledAt(''); setTargetGrades([]); setTargetSections(''); setShowForm(false);
      load();
    } catch(e) { toast.err(e.message); }
    setSubmitting(false);
  };

  const del = async id => {
    if (!confirm('Delete this announcement?')) return;
    // Optimistic removal
    const prev = announcements;
    setAnnouncements(a => a.filter(x => x.id !== id));
    try {
      await API.deleteAnnouncement(id);
      toast.ok('Deleted.');
    } catch(e) {
      setAnnouncements(prev);
      toast.err('Failed to delete announcement.');
    }
  };

  const togglePin = async (id, pinned) => {
    // Optimistic pin toggle
    setAnnouncements(a => a.map(x => x.id === id ? {...x, pinned: !pinned} : x));
    try {
      await API.pinAnnouncement(id, !pinned);
    } catch(e) {
      setAnnouncements(a => a.map(x => x.id === id ? {...x, pinned} : x)); // revert
      toast.err('Failed to update pin.');
    }
  };

  // Format countdown string
  const getCountdown = expiresAt => {
    if (!expiresAt) return null;
    const diff = new Date(expiresAt) - now;
    if (diff <= 0) return { text: 'Expired', urgent: true };
    const totalMins = Math.floor(diff / 60000);
    const hrs = Math.floor(totalMins / 60);
    const mins = totalMins % 60;
    const days = Math.floor(hrs / 24);
    const remHrs = hrs % 24;
    let text = '';
    if (days > 0)      text = `${days}d ${remHrs}h left`;
    else if (hrs > 0)  text = `${hrs}h ${mins}m left`;
    else               text = `${mins}m left`;
    const urgent = diff < 3 * 60 * 60 * 1000; // < 3 hours
    const warn   = diff < 6 * 60 * 60 * 1000; // < 6 hours
    return { text, urgent, warn };
  };

  const DURATION_OPTS = [
    { value:'1',   label:'1 hour' },
    { value:'3',   label:'3 hours' },
    { value:'6',   label:'6 hours' },
    { value:'12',  label:'12 hours' },
    { value:'24',  label:'24 hours (default)' },
    { value:'48',  label:'2 days' },
    { value:'72',  label:'3 days' },
    { value:'168', label:'1 week' },
  ];

  const priorityStyle = p => ({
    urgent:   { accent:'#ef4444', bg:'linear-gradient(135deg,#fef2f2 0%,#fff5f5 100%)', bgDark:'linear-gradient(135deg,rgba(239,68,68,0.12) 0%,rgba(239,68,68,0.06) 100%)', border:'rgba(239,68,68,0.3)', icon:'🚨', label:'Urgent', tagBg:'#ef4444', tagColor:'#fff' },
    important:{ accent:'#f59e0b', bg:'linear-gradient(135deg,#fffbeb 0%,#fefce8 100%)', bgDark:'linear-gradient(135deg,rgba(245,158,11,0.12) 0%,rgba(245,158,11,0.06) 100%)', border:'rgba(245,158,11,0.35)', icon:'⚠️', label:'Important', tagBg:'#f59e0b', tagColor:'#fff' },
    normal:   { accent:'#3b82f6', bg:'linear-gradient(135deg,#eff6ff 0%,#f0f9ff 100%)', bgDark:'linear-gradient(135deg,rgba(59,130,246,0.1) 0%,rgba(59,130,246,0.05) 100%)', border:'rgba(59,130,246,0.25)', icon:'📢', label:'Notice', tagBg:'#3b82f6', tagColor:'#fff' },
  }[p||'normal']);

  return (
    <div>
      <div className="page-hd">
        <div className="page-hd-left">
          <h2>Announcements</h2>
          <p className="muted">{announcements.length} announcement{announcements.length!==1?'s':''} · auto-expire after set duration</p>
        </div>
        {isTeacher&&(
          <button className="btn btn-gold" onClick={()=>setShowForm(s=>!s)}>
            {showForm?'✕ Cancel':'📢 Post Announcement'}
          </button>
        )}
      </div>

      {/* Post form — teachers only */}
      {isTeacher&&showForm&&(
        <div className="card" style={{marginBottom:20,border:'1.5px solid var(--gold)'}}>
          <div style={{fontWeight:600,fontSize:'var(--text-sm)',marginBottom:14,color:'var(--gold)'}}>📢 New Announcement</div>
          <div className="fg">
            <label>Title *</label>
            <input placeholder="Announcement title…" value={title} onChange={e=>setTitle(e.target.value)} autoFocus/>
          </div>
          <div className="fg">
            <label style={{display:'flex',justifyContent:'space-between'}}>
              <span>Message *</span>
              <span style={{fontWeight:300,color:body.length>800?'var(--red)':'var(--muted)',fontSize:'0.75rem'}}>{body.length} chars</span>
            </label>
            <textarea placeholder="Write your announcement here…" value={body} onChange={e=>setBody(e.target.value)} style={{minHeight:100}}/>
          </div>
          <div className="fr">
            <div className="fg">
              <label>Priority</label>
              <div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:4}}>
                {['normal','important','urgent'].map(p=>{
                  const s=priorityStyle(p);
                  return(
                    <button key={p} onClick={()=>setPriority(p)}
                      style={{padding:'7px 16px',borderRadius:99,border:`1.5px solid ${priority===p?s.accent:'var(--border)'}`,
                        background:priority===p?s.tagBg:'none',color:priority===p?s.tagColor:'var(--muted)',

    </div>
  );

//  ADMIN STUDY NOTIFICATION BELL
// ══════════════════════════════════════════════════════════════════
function AdminNotifBell({ currentUser, count, onCountChange }) {
  const [open, setOpen] = useState(false);
  const [notifs, setNotifs] = useState([]);
  const [loading, setLoading] = useState(false);
  const wrapRef = useRef(null);

  // Close on outside click
  useEffect(()=>{
    if (!open) return;
    const handler = e => { if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, [open]);

  const load = useCallback(async () => {
    setLoading(true);
    const data = await API.getStudyNotifications(currentUser.id, 20);
    setNotifs(data);
    setLoading(false);
  }, [currentUser.id]);

  const openPanel = () => {
    setOpen(o => !o);
    if (!open) load();
  };

  const markAll = async () => {
    await API.markAllStudyNotificationsRead(currentUser.id);
    setNotifs(n => n.map(x => ({...x, read: true})));
    onCountChange(0);
  };

  const markOne = async (notif) => {
    if (!notif.read) {
      await API.markStudyNotificationRead(currentUser.id, notif.id);
      setNotifs(n => n.map(x => x.id===notif.id ? {...x, read:true} : x));
      onCountChange(Math.max(0, count - 1));
    }
  };

  const dismiss = async (e, notif) => {
    e.stopPropagation();
    await API.deleteStudyNotification(currentUser.id, notif.id);
    const wasUnread = !notif.read;
    setNotifs(n => n.filter(x => x.id !== notif.id));
    if (wasUnread) onCountChange(Math.max(0, count - 1));
  };

  const fmtRelTime = iso => {
    const diff = Date.now() - new Date(iso).getTime();
    const mins = Math.floor(diff / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return `${mins}m ago`;
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return `${hrs}h ago`;
    return `${Math.floor(hrs/24)}d ago`;
  };

  const unread = notifs.filter(n => !n.read).length;

  return (
    <div className="notif-bell-wrap" ref={wrapRef} data-tour="study-notif-bell">
      <button
        className={`notif-bell-btn${count > 0 ? ' has-unread' : ''}`}
        onClick={openPanel}
        aria-label={`Study submissions${count > 0 ? `, ${count} unread` : ''}`}
        title="New study submissions">
        📬
        {count > 0 && (
          <span className="notif-dot" aria-hidden="true">{count > 9 ? '9+' : count}</span>
        )}
      </button>

      {open && (
        <div className="notif-dropdown" role="dialog" aria-label="Study submission notifications">
          <div className="notif-dropdown-hd">
            <span>📬 Study Submissions</span>
            {unread > 0 && (
              <button className="notif-mark-all" onClick={markAll}>Mark all read</button>
            )}
          </div>

          <div className="notif-list">
            {loading ? (
              <div className="notif-empty"><span className="spin"/></div>
            ) : notifs.length === 0 ? (
              <div className="notif-empty">No submission notifications yet.</div>
            ) : notifs.map(n => (
              <div
                key={n.id}
                className={`notif-item${!n.read ? ' unread' : ''}`}
                onClick={() => markOne(n)}
                role="button"
                tabIndex={0}
                onKeyDown={e => e.key === 'Enter' && markOne(n)}>
                <div className="notif-icon">📄</div>
                <div className="notif-body">
                  <div className="notif-title">"{n.studyTitle}"</div>
                  <div className="notif-sub">by {n.submittedBy}</div>
                  {n.categories?.length > 0 && (
                    <div className="notif-sub" style={{marginTop:2}}>
                      {n.categories.slice(0,2).map(c=>(
                        <span key={c} style={{display:'inline-block',background:'var(--teal-light)',color:'var(--teal)',borderRadius:99,padding:'1px 7px',fontSize:'0.65rem',fontWeight:600,marginRight:4}}>{c}</span>
                      ))}
                    </div>
                  )}
                  <div className="notif-time">{fmtRelTime(n.createdAt)}</div>
                </div>
                {!n.read && <div className="notif-unread-dot" aria-hidden="true"/>}
                <button className="notif-dismiss" onClick={e=>dismiss(e,n)} aria-label="Dismiss notification" title="Dismiss">✕</button>
              </div>
            ))}
          </div>

          {notifs.length > 0 && (
            <div className="notif-footer">
              {notifs.length} notification{notifs.length !== 1 ? 's' : ''} · Dismissed items are removed permanently
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════
//  GENERAL USER NOTIFICATION BELL (feedback, announcements, etc.)
// ══════════════════════════════════════════════════════════════════
const NOTIF_ICONS = { feedback:'📝', announcement:'📢', coauthor_tag:'🤝', revision_requested:'✏️', resubmitted:'🔄', default:'🔔' };
function UserNotifBell({ currentUser, count, onCountChange, onOpenStudy }) {
  const [open, setOpen] = useState(false);
  const [notifs, setNotifs] = useState([]);
  const [loading, setLoading] = useState(false);
  const wrapRef = useRef(null);

  useEffect(()=>{
    if (!open) return;
    const handler = e => { if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, [open]);

  const load = useCallback(async () => {
    setLoading(true);
    const data = await API.getNotifications(currentUser.id, 20);
    setNotifs(data);
    setLoading(false);
  }, [currentUser.id]);

  const openPanel = () => {
    setOpen(o => !o);
    if (!open) load();
  };

  const markAll = async () => {
    await API.markAllNotificationsRead(currentUser.id);
    setNotifs(n => n.map(x => ({...x, read: true})));
    onCountChange(0);
  };

  const markOne = async (notif) => {
    if (!notif.read) {
      await API.markNotificationRead(currentUser.id, notif.id);
      setNotifs(n => n.map(x => x.id===notif.id ? {...x, read:true} : x));
      onCountChange(c => Math.max(0, c - 1));
    }
    if (notif.link) {
      try {
        const snap = await db.collection('studies').doc(notif.link).get();
        if (snap.exists) onOpenStudy?.({ id: snap.id, ...snap.data() });
      } catch {}
      setOpen(false);
    }
  };

  const dismiss = async (e, notif) => {
    e.stopPropagation();
    await API.deleteNotification(currentUser.id, notif.id);
    const wasUnread = !notif.read;
    setNotifs(n => n.filter(x => x.id !== notif.id));
    if (wasUnread) onCountChange(c => Math.max(0, c - 1));
  };

  const fmtRelTime = iso => {
    const diff = Date.now() - new Date(iso).getTime();
    const mins = Math.floor(diff / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return `${mins}m ago`;
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return `${hrs}h ago`;
    return `${Math.floor(hrs/24)}d ago`;
  };

  return (
    <div className="notif-bell-wrap" ref={wrapRef} data-tour="user-notif-bell">
      <button
        className={`notif-bell-btn${count > 0 ? ' has-unread' : ''}`}
        onClick={openPanel}
        aria-label={`Notifications${count > 0 ? `, ${count} unread` : ''}`}
        title="Notifications">
        <Ico.bell/>
        {count > 0 && (
          <span className="notif-dot" aria-hidden="true">{count > 9 ? '9+' : count}</span>
        )}
      </button>

      {open && (
        <div className="notif-dropdown" role="dialog" aria-label="Notifications">
          <div className="notif-dropdown-hd">
            <span>🔔 Notifications</span>
            {notifs.some(n=>!n.read) && (
              <button className="notif-mark-all" onClick={markAll}>Mark all read</button>
            )}
          </div>

          <div className="notif-list">
            {loading ? (
              <div className="notif-empty"><span className="spin"/></div>
            ) : notifs.length === 0 ? (
              <div className="notif-empty">You're all caught up — no notifications yet.</div>
            ) : notifs.map(n => (
              <div
                key={n.id}
                className={`notif-item${!n.read ? ' unread' : ''}`}
                onClick={() => markOne(n)}
                role="button"
                tabIndex={0}
                onKeyDown={e => e.key === 'Enter' && markOne(n)}>
                <div className="notif-icon">{NOTIF_ICONS[n.type]||NOTIF_ICONS.default}</div>
                <div className="notif-body">
                  <div className="notif-title">{n.title}</div>
                  {n.body && <div className="notif-sub">{n.body}</div>}
                  <div className="notif-time">{fmtRelTime(n.createdAt)}</div>
                </div>
                {!n.read && <div className="notif-unread-dot" aria-hidden="true"/>}
                <button className="notif-dismiss" onClick={e=>dismiss(e,n)} aria-label="Dismiss notification" title="Dismiss">✕</button>
              </div>
            ))}
          </div>

          {notifs.length > 0 && (
            <div className="notif-footer">
              {notifs.length} notification{notifs.length !== 1 ? 's' : ''} · Dismissed items are removed permanently
            </div>
          )}
        </div>
      )}
    </div>
  );
}

const ANNOUNCE_DISMISS_KEY = 'sabnahis_dismissed_announcements';

function AnnouncementPopup({ currentUser }) {
  const [queue, setQueue] = useState([]);
  const [idx, setIdx] = useState(0);
  const [dontShow, setDontShow] = useState(false);

  useEffect(() => {
    let active = true;
    (async () => {
      try {
        const data = await API.getAnnouncements(20, currentUser);
        let dismissed = [];
        try { dismissed = JSON.parse(localStorage.getItem(ANNOUNCE_DISMISS_KEY) || '[]'); } catch {}
        const relevant = data
          .filter(a => a.priority === 'urgent' || a.priority === 'important')
          .filter(a => !dismissed.includes(a.id))
          .sort((a,b) => (a.priority==='urgent'?0:1) - (b.priority==='urgent'?0:1) || new Date(b.createdAt)-new Date(a.createdAt));
        if (active && relevant.length) setQueue(relevant);
      } catch {}
    })();
    return () => { active = false; };
  }, [currentUser?.id]);

  if (!queue.length || idx >= queue.length) return null;

  const a = queue[idx];
  const isUrgent = a.priority === 'urgent';
  const icon = isUrgent ? '🚨' : '⚠️';
  const label = isUrgent ? 'Urgent Announcement' : 'Important Announcement';
  const accent = isUrgent ? '#ef4444' : '#f59e0b';
  const bg = isUrgent
    ? 'linear-gradient(135deg,#fef2f2 0%,#fff5f5 100%)'
    : 'linear-gradient(135deg,#fffbeb 0%,#fefce8 100%)';

  const close = () => {
    if (dontShow) {
      try {
        const dismissed = JSON.parse(localStorage.getItem(ANNOUNCE_DISMISS_KEY) || '[]');
        if (!dismissed.includes(a.id)) dismissed.push(a.id);
        localStorage.setItem(ANNOUNCE_DISMISS_KEY, JSON.stringify(dismissed));
      } catch {}
    }
    setDontShow(false);
    setIdx(i => i + 1);
  };

  return (
    <div className="ann-popup-overlay" role="dialog" aria-modal="true" aria-label={label}>
      <div className="ann-popup-card" style={{borderColor: accent}}>
        <div className="ann-popup-hd" style={{background: bg, borderColor: accent}}>
          <span className="ann-popup-icon">{icon}</span>
          <span className="ann-popup-label" style={{color: accent}}>{label}</span>
          {queue.length > 1 && (
            <span className="ann-popup-count">{idx+1} / {queue.length}</span>
          )}
        </div>
        <div className="ann-popup-body">
          <h3 className="ann-popup-title">{a.title}</h3>
          <p className="ann-popup-text">{a.body}</p>
          <p className="ann-popup-meta">— {a.authorName}</p>
        </div>
        <div className="ann-popup-ft">
          <label className="ann-popup-checkbox">
            <input type="checkbox" checked={dontShow} onChange={e=>setDontShow(e.target.checked)} />
            Don't show this again
          </label>
          <button className="btn btn-gold" onClick={close}>
            {idx + 1 < queue.length ? 'Next' : 'Got it'}
          </button>
        </div>
      </div>
    </div>
  );
}

// ── Topbar popover wrapper ───────────────────────────────
// Opens on hover (desktop) and toggles on click (works for touch too).
// Closes on outside click or mouse-leave (with a short delay so moving
// from the trigger to the dropdown doesn't close it).
function TopbarPopover({ trigger, children, label }) {
  const [open, setOpen] = useState(false);
  const wrapRef = useRef(null);
  const closeTimer = useRef(null);

  useEffect(()=>{
    if (!open) return;
    const handler = e => { if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, [open]);

  const cancelClose = () => { if(closeTimer.current){ clearTimeout(closeTimer.current); closeTimer.current=null; } };
  const scheduleClose = () => { cancelClose(); closeTimer.current = setTimeout(()=>setOpen(false), 180); };

  return (
    <div
      className="tb-pill-wrap"
      ref={wrapRef}
      onMouseEnter={()=>{cancelClose();setOpen(true);}}
      onMouseLeave={scheduleClose}>
      <button
        className="tb-pill"
        onClick={()=>setOpen(o=>!o)}
        aria-expanded={open}
        aria-label={label}>
        {trigger}
      </button>
      {open && (
        <div className="tb-pill-dropdown" role="dialog" aria-label={label}>
          {children}
        </div>
      )}
    </div>
  );
}

  return (

          {longest>streak && <div style={{fontSize:'0.7rem',color:'var(--muted)'}}>Best: {longest} day{longest!==1?'s':''}</div>}

      <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
        {STREAK_TIERS.slice().reverse().map(t=>{

              borderRadius:'var(--radius)',minWidth:62,textAlign:'center',

          );
        })}

    </TopbarPopover>
  );

function StatTour({ isTeacher, onFinish }) {
  const steps = useMemo(() => buildStatTourSteps(isTeacher), [isTeacher]);
  const [stepIndex, setStepIndex] = useState(0);
  const [rect, setRect] = useState(null);
  const [ready, setReady] = useState(false);
  const step = steps[stepIndex];

  const goTo = useCallback(idx => {
    if (idx < 0) return;
    if (idx >= steps.length) { onFinish?.(); return; }
    setReady(false);
    setStepIndex(idx);
  }, [steps.length, onFinish]);

  useEffect(() => {
    let cancelled = false;
    const run = () => {
      if (cancelled) return;
      if (step.center || !step.target) { setRect(null); setReady(true); return; }
      const el = document.querySelector(step.target);
      if (!el || el.offsetParent === null) { setRect(null); setReady(true); return; }
      el.scrollIntoView?.({ block: 'nearest', inline: 'nearest' });
      const r = el.getBoundingClientRect();
      setRect({ top: r.top, left: r.left, width: r.width, height: r.height });
      setReady(true);
    };
    const raf = requestAnimationFrame(() => requestAnimationFrame(run));
    return () => { cancelled = true; cancelAnimationFrame(raf); };
  }, [stepIndex]);

  useEffect(() => {
    const onKey = e => {
      if (e.key === 'Escape') onFinish?.();
      else if (e.key === 'ArrowRight') goTo(stepIndex + 1);
      else if (e.key === 'ArrowLeft') goTo(stepIndex - 1);
    };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [stepIndex, goTo, onFinish]);

  const PAD = 8;
  let cardStyle = {};
  if (!step.center && rect) {
    const cardW = Math.min(360, window.innerWidth - 28);
    const cardH = 320;
    const vp = window.innerHeight;
    let top, left;
    switch (step.placement) {
      case 'left':
        left = rect.left - cardW - 16;
        top = Math.min(Math.max(rect.top, 16), vp - cardH - 16);
        if (left < 16) { left = rect.left + rect.width + 16; }
        break;
      case 'top':
        top = rect.top - cardH - 12;
        left = Math.min(Math.max(rect.left, 16), window.innerWidth - cardW - 16);
        if (top < 16) top = rect.top + rect.height + 12;
        break;
      default:
        top = rect.top + rect.height + 12;
        left = Math.min(Math.max(rect.left, 16), window.innerWidth - cardW - 16);
        if (top + cardH > vp - 16) top = Math.max(8, rect.top - cardH - 12);
    }
    top  = Math.max(8, Math.min(top,  vp - cardH - 8));
    left = Math.max(8, Math.min(left, window.innerWidth - cardW - 8));
    cardStyle = { top, left, width: cardW, maxHeight: vp - 32, overflowY: 'auto' };
  }

  return (
    <>
      <div className={`tour-overlay${step.center ? ' tour-center-bg' : ''}`} aria-hidden="true"/>
      {rect && !step.center && (
        <div className="tour-spotlight pulse" style={{ top: rect.top - PAD, left: rect.left - PAD, width: rect.width + PAD * 2, height: rect.height + PAD * 2 }} aria-hidden="true"/>
      )}
      {ready && (
        <div className={`tour-card${step.center ? ' tour-card-center' : ''}`} style={{...cardStyle, whiteSpace:'pre-line'}} role="dialog" aria-modal="true" aria-label={`Stats tutorial, step ${stepIndex + 1} of ${steps.length}`}>
          <div className="tour-progress-bar-track" aria-hidden="true">
            <div className="tour-progress-bar-fill" style={{ width: `${((stepIndex + 1) / steps.length) * 100}%` }}/>
          </div>
          <div className="tour-eyebrow">{step.eyebrow || 'Statistical Analysis Tutorial'}</div>
          <h3>{step.title}</h3>
          <p style={{whiteSpace:'pre-line'}}>{step.body}</p>
          <div className="tour-card-footer">
            <div className="tour-footer-row">
              <span className="tour-step-counter">{stepIndex + 1} / {steps.length}</span>
              <div className="tour-actions">
                {stepIndex > 0 && <button className="tour-btn tour-btn-ghost" onClick={() => goTo(stepIndex - 1)}>Back</button>}
                <button className="tour-btn tour-btn-primary" onClick={() => goTo(stepIndex + 1)}>{stepIndex === steps.length - 1 ? 'Done' : 'Next'}</button>
              </div>
            </div>
          </div>
          {stepIndex < steps.length - 1 && <button className="tour-skip" onClick={() => onFinish?.()}>Skip tutorial</button>}
        </div>
      )}
    </>
  );
}
