            onClick={async()=>{
              setOfflineLoading(true);
              try {
                if(savedOffline){
                  await OfflineDB.remove(study.id);
                  setSavedOffline(false);
                  toast.ok('Removed from offline library.');
                } else {
                  await OfflineDB.save(study);
                  setSavedOffline(true);
                  toast.ok('📥 Saved for offline reading!');
                }
              } catch(e){ toast.err('Could not save offline: '+e.message); }
              setOfflineLoading(false);
            }}>
            {offlineLoading?<span className="spin" style={{width:13,height:13}}/>:<>{savedOffline?'📥 Saved Offline':'📥 Save Offline'}</>}
          </button>
        </div>
        {canDel&&<button className="btn btn-red btn-sm" data-tip="Permanently remove this study" onClick={()=>{onDelete(study.id);onClose();}}><Ico.trash/> Delete Study</button>}
      </div>
      {/* ── Similar Studies ── */}
      {(()=>{
        const cats = study.categories || [];
        const kws  = (study.keywords || []).map(k=>k.toLowerCase());
        const similar = allStudies
          .filter(s => s.id !== study.id)
          .map(s => {
            const sCats = s.categories || [];
            const sKws  = (s.keywords || []).map(k=>k.toLowerCase());
            const catScore = sCats.filter(c=>cats.includes(c)).length * 3;
            const kwScore  = sKws.filter(k=>kws.includes(k)).length * 2;
            return { ...s, _score: catScore + kwScore };
          })
          .filter(s => s._score > 0)
          .sort((a,b) => b._score - a._score)
          .slice(0, 4);

        if (!similar.length) return null;
        return (
          <div style={{borderTop:'1px solid var(--border)',paddingTop:16,marginTop:16}}>
            <div style={{fontSize:'0.72rem',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.8px',color:'var(--muted)',marginBottom:12}}>
              📚 Similar Studies
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:9}}>
              {similar.map(s=>(
                <div key={s.id}
                  onClick={()=>onOpenStudy&&onOpenStudy(s)}
                  style={{display:'flex',gap:12,padding:'11px 14px',background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'var(--radius)',cursor:'pointer',transition:'border-color .15s,box-shadow .15s'}}
                  onMouseEnter={e=>{e.currentTarget.style.borderColor='var(--gold)';e.currentTarget.style.boxShadow='0 2px 8px rgba(201,162,39,0.1)';}}
                  onMouseLeave={e=>{e.currentTarget.style.borderColor='var(--border)';e.currentTarget.style.boxShadow='none';}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:'flex',gap:4,flexWrap:'wrap',marginBottom:5}}>
                      {(s.categories||[]).filter(c=>cats.includes(c)).map(c=>(
                        <span key={c} style={{background:'var(--gold-bg)',color:'var(--gold)',fontSize:'0.62rem',fontWeight:600,padding:'1px 7px',borderRadius:99,border:'1px solid var(--gold)'}}>{c}</span>
                      ))}
                      {(s.categories||[]).filter(c=>!cats.includes(c)).map(c=>(
                        <span key={c} style={{background:'var(--surface)',color:'var(--muted)',fontSize:'0.62rem',padding:'1px 7px',borderRadius:99,border:'1px solid var(--border)'}}>{c}</span>
                      ))}
                    </div>
                    <div style={{fontWeight:600,fontSize:'0.85rem',lineHeight:1.35,marginBottom:3,color:'var(--ink)'}} title={s.title}>
                      {s.title.length>90?s.title.slice(0,90)+'…':s.title}
                    </div>
                    <div style={{fontSize:'0.72rem',color:'var(--muted)',display:'flex',gap:10,flexWrap:'wrap'}}>
                      <span>{(s.authors||[]).slice(0,2).join(', ')}{s.authors?.length>2?' et al.':''}</span>
                      <span>{s.year}</span>
                      <span><Ico.eye/>{s.viewCount||0}</span>
                      {s.teacherGrade&&<span style={{color:'var(--teal)',fontWeight:600}}>✓ {s.teacherGrade}</span>}
                    </div>
                  </div>
                  <div style={{display:'flex',alignItems:'center',color:'var(--muted)',fontSize:'0.8rem',flexShrink:0}}>›</div>
                </div>
              ))}
            </div>
          </div>
        );
      })()}
    </Modal>
  );
}

const PASSING_GRADES = new Set(['A+','A','A-','B+','B','B-','C+','C']);

function generateCertificate(study, feedback, currentUser) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
  const W = 297, H = 210;

  // ── Resolve grade level & section from study first, then currentUser fallback ──
  const gradeLevel = (study.uploaderGrade && study.uploaderGrade !== 'N/A' && study.uploaderGrade !== '')
    ? study.uploaderGrade
    : (currentUser && currentUser.gradeLevel && currentUser.gradeLevel !== '' ? currentUser.gradeLevel : null);
  const section = (study.uploaderSection && study.uploaderSection !== 'N/A' && study.uploaderSection !== '')
    ? study.uploaderSection
    : (currentUser && currentUser.section && currentUser.section !== '' ? currentUser.section : null);

  // ── Build full author list: main author + co-authors all together ──
  const mainAuthor = study.uploadedByName || (study.authors && study.authors[0]) || 'Unknown';
  const coAuthorNames = (study.coAuthors && study.coAuthors.length > 0)
    ? study.coAuthors.map(ca => ca.name || ca).filter(Boolean)
    : (study.authors || []).slice(1);
  const allAuthors = [mainAuthor, ...coAuthorNames];

  // ── Helper: load image as base64 for embedding ──
  function embedImage(url, callback) {
    const img = new Image();
    img.crossOrigin = 'Anonymous';
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = img.width; canvas.height = img.height;
      canvas.getContext('2d').drawImage(img, 0, 0);
      callback(canvas.toDataURL('image/png'), img.width, img.height);
    };
    img.onerror = () => callback(null, 0, 0);
    img.src = url;
  }

  async function buildPDF(logo1Data, logo1W, logo1H, logo2Data, logo2W, logo2H) {
    // Background
    doc.setFillColor(253, 248, 236);
    doc.rect(0, 0, W, H, 'F');

    // Outer border — double rule
    doc.setDrawColor(201, 162, 39);
    doc.setLineWidth(3);
    doc.rect(8, 8, W - 16, H - 16);
    doc.setLineWidth(0.8);
    doc.rect(11, 11, W - 22, H - 22);

    // Corner ornaments
    doc.setFillColor(201, 162, 39);
    [[12,12],[W-12,12],[12,H-12],[W-12,H-12]].forEach(([cx,cy]) => doc.circle(cx, cy, 2.5, 'F'));

    // Header band
    doc.setFillColor(13, 15, 20);
    doc.rect(11, 11, W - 22, 22, 'F');

    // Logos in header
    const logoSize = 14;
    const logoY = 14;
    if (logo1Data) {
      const aspect1 = logo1W / logo1H;
      doc.addImage(logo1Data, 'PNG', 17, logoY, logoSize * aspect1, logoSize);
    }
    if (logo2Data) {
      const aspect2 = logo2W / logo2H;
      doc.addImage(logo2Data, 'PNG', W - 17 - logoSize * aspect2, logoY, logoSize * aspect2, logoSize);
    }

    doc.setTextColor(255, 255, 255);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(9);
    doc.text('SABNAHIS STE RESEARCH PORTAL', W / 2, 20, { align: 'center' });
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(7.5);
    doc.setTextColor(201, 162, 39);
    doc.text('Certificate of Academic Recognition', W / 2, 27, { align: 'center' });

    // Main title
    doc.setTextColor(13, 15, 20);
    doc.setFont('times', 'bold');
    doc.setFontSize(22);
    doc.text('Certificate of Recognition', W / 2, 47, { align: 'center' });

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9.5);
    doc.setTextColor(74, 81, 116);
    doc.text('This is to certify that the following research study has been reviewed and recognized', W / 2, 56, { align: 'center' });
    doc.text('for its outstanding academic contribution.', W / 2, 62, { align: 'center' });

    // Gold divider
    doc.setDrawColor(201, 162, 39);
    doc.setLineWidth(0.5);
    doc.line(40, 66, W - 40, 66);

    // Study title
    const titleText = study.title || 'Untitled Study';
    doc.setFont('times', 'bolditalic');
    doc.setFontSize(13);
    doc.setTextColor(13, 15, 20);
    const titleLines = doc.splitTextToSize('"' + titleText + '"', W - 70);
    doc.text(titleLines, W / 2, 74, { align: 'center' });
    const afterTitle = 74 + (titleLines.length - 1) * 6.5;

    // Authors section — ALL authors together
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(8);
    doc.setTextColor(74, 81, 116);
    const authLabel = allAuthors.length > 1 ? 'AUTHORS' : 'AUTHOR';
    doc.text(authLabel, W / 2, afterTitle + 10, { align: 'center' });

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(11);
    doc.setTextColor(13, 15, 20);
    // All authors on one line, separated by middle dot; wrap if needed
    const authLine = allAuthors.join('  ·  ');
    const authLines = doc.splitTextToSize(authLine, W - 70);
    doc.text(authLines, W / 2, afterTitle + 17, { align: 'center' });
    const afterAuth = afterTitle + 17 + (authLines.length - 1) * 6;

    // Meta row
    const metaY = afterAuth + 16;
    const cols = [
      { label: 'YEAR',          value: String(study.year || new Date().getFullYear()) },
      { label: 'GRADE LEVEL',   value: gradeLevel || 'N/A' },
      { label: 'SECTION',       value: section || 'N/A' },
      { label: 'GRADE RECEIVED',value: (feedback.grade || '') + ' — ' + ((GRADE_LABELS[feedback.grade]||{}).desc||'') },
    ];
    const colW = (W - 80) / cols.length;
    cols.forEach((col, i) => {
      const cx = 40 + colW * i + colW / 2;
      doc.setFillColor(245, 246, 250);
      doc.roundedRect(40 + colW * i + 2, metaY - 8, colW - 4, 18, 3, 3, 'F');
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(7);
      doc.setTextColor(124, 133, 168);
      doc.text(col.label, cx, metaY - 1, { align: 'center' });
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(10);
      doc.setTextColor(26, 127, 110);
      doc.text(col.value, cx, metaY + 7, { align: 'center' });
    });

    // Signature lines
    const sigY = metaY + 26;
    doc.setDrawColor(201, 162, 39);
    doc.setLineWidth(0.5);
    doc.line(40, sigY + 14, 100, sigY + 14);
    doc.line(W - 100, sigY + 14, W - 40, sigY + 14);

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(8);
    doc.setTextColor(74, 81, 116);
    doc.text('Reviewed by', 70, sigY + 19, { align: 'center' });
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9);
    doc.setTextColor(13, 15, 20);
    doc.text(feedback.teacherName || 'Teacher', 70, sigY + 25, { align: 'center' });

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(8);
    doc.setTextColor(74, 81, 116);
    doc.text('Date Awarded', W - 70, sigY + 19, { align: 'center' });
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9);
    doc.setTextColor(13, 15, 20);
    const awardDate = feedback.gradedAt
      ? new Date(feedback.gradedAt).toLocaleDateString('en-PH', { year:'numeric', month:'long', day:'numeric' })
      : new Date().toLocaleDateString('en-PH', { year:'numeric', month:'long', day:'numeric' });
    doc.text(awardDate, W - 70, sigY + 25, { align: 'center' });

    // Footer band
    doc.setFillColor(13, 15, 20);
    doc.rect(11, H - 27, W - 22, 16, 'F');
    doc.setTextColor(201, 162, 39);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(7.5);
    doc.text('Score: ' + (feedback.totalScore || 0) + '/100', W / 2, H - 21, { align: 'center' });
    doc.setFont('helvetica', 'italic');
    doc.setFontSize(7);
    doc.setTextColor(180, 180, 180);
    doc.text('This certificate is an official recognition issued by SABNAHIS STE Research Portal. Unauthorized reproduction is prohibited.', W / 2, H - 15, { align: 'center' });

    // QR code — generate via canvas then embed
    try {
      const qrDiv = document.createElement('div');
      document.body.appendChild(qrDiv);
      new QRCode(qrDiv, {
        text: window.location.href || 'https://sabnahis.portal',
        width: 80, height: 80,
        colorDark: '#0d0f14', colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });
      await new Promise(r => setTimeout(r, 120));
      const qrCanvas = qrDiv.querySelector('canvas');
      if (qrCanvas) {
        const qrData = qrCanvas.toDataURL('image/png');
        // Bottom-right corner of certificate above footer
        doc.addImage(qrData, 'PNG', W - 48, H - 54, 24, 24);
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(5.5);
        doc.setTextColor(124, 133, 168);
        doc.text('Scan to verify', W - 36, H - 28, { align:'center' });
      }
      document.body.removeChild(qrDiv);
    } catch(e) { /* QR generation failed silently */ }

    const safeTitle = (study.title || 'certificate').replace(/[^a-z0-9]/gi, '_').slice(0, 40);
    doc.save('Certificate_' + safeTitle + '.pdf');
  }

  // Load both logos then build
  embedImage(SCHOOL_LOGO_URL || '', (d1, w1, h1) => {
    embedImage(SCHOOL_LOGO_URL2 || '', (d2, w2, h2) => {
      buildPDF(d1, w1 || 1, h1 || 1, d2, w2 || 1, h2 || 1);
    });
  });
}

function ResubmitModal({ study, currentUser, onClose, onDone }) {
  const [form, setForm] = useState({
    title: study.title || '',
    abstract: study.abstract || '',
    keywords: (study.keywords||[]).join(', '),
  });
  const [gdriveUrl, setGdriveUrl] = useState('');
  const [gdriveInfo, setGdriveInfo] = useState(null);
  const [submitting, setSubmitting] = useState(false);
  const sf = (k,v) => setForm(f=>({...f,[k]:v}));

  const handleGdrive = val => {
    setGdriveUrl(val);
    setGdriveInfo(parseGDriveLink(val.trim()));
  };

  const submit = async () => {
    if (!form.title.trim()) { toast.err('Title is required.'); return; }
    if (!form.abstract.trim()) { toast.err('Abstract is required.'); return; }
    setSubmitting(true);
    try {
      const keywords = form.keywords.split(',').map(k=>k.trim()).filter(Boolean);
      const gdrive = gdriveInfo ? { driveUrl:gdriveInfo.viewUrl, downloadUrl:gdriveInfo.downloadUrl, driveId:gdriveInfo.id } : null;
      await API.resubmitStudy(study.id, {
        title: form.title,
        abstract: form.abstract,
        keywords,
        gdrive,
        resubmittedBy: currentUser.id,
        resubmittedByName: currentUser.name,
      });
      toast.ok('Revision submitted!');
      onDone?.();
      onClose();
    } catch(e) { toast.err(e.message); }
    setSubmitting(false);
  };

  const currentGdrive = study.gdrive ? (study.gdrive.driveUrl || study.gdrive.viewUrl || null) : null;

  return (
    <Modal title="Revise & Resubmit" onClose={onClose} wide>
      <div style={{padding:'10px 14px',background:'var(--gold-bg)',border:'1px solid var(--gold)',borderRadius:'var(--radius)',marginBottom:16,fontSize:'var(--text-sm)',color:'var(--gold)',fontWeight:600}}>
        ✏️ Revising Version {study.version||1} — your current version will be archived before saving.
      </div>

      <div className="fg">
        <label>Study Title *</label>
        <input value={form.title} onChange={e=>sf('title',e.target.value)} placeholder="Full title of your research study" autoFocus/>
      </div>

      <div className="fg">
        <label style={{display:'flex',justifyContent:'space-between'}}>
          <span>Abstract *</span>
          <span style={{fontWeight:300,color:'var(--muted)',fontSize:'0.75rem'}}>{form.abstract.length} chars</span>
        </label>
        <textarea value={form.abstract} onChange={e=>sf('abstract',e.target.value)} placeholder="Updated abstract…" style={{minHeight:120}}/>
      </div>

      <div className="fg">
        <label>Keywords <span style={{fontWeight:300,color:'var(--muted)'}}>(comma-separated)</span></label>
        <input value={form.keywords} onChange={e=>sf('keywords',e.target.value)} placeholder="e.g. biology, ecology, climate"/>
      </div>

      <div className="fg">
        <label>Google Drive Link <span style={{fontWeight:300,color:'var(--muted)'}}>(leave blank to keep existing)</span></label>
        {currentGdrive && !gdriveUrl && (
          <div style={{fontSize:'var(--text-xs)',color:'var(--muted)',marginBottom:6,padding:'6px 10px',background:'var(--surface)',borderRadius:6,border:'1px solid var(--border)',wordBreak:'break-all'}}>
            📎 Current: {currentGdrive}
          </div>
        )}
        <input value={gdriveUrl} onChange={e=>handleGdrive(e.target.value)} placeholder="Paste new Google Drive link (optional)"/>
        {gdriveInfo && <div style={{marginTop:4,fontSize:'0.72rem',color:'var(--teal)',fontWeight:600}}>✅ Valid Drive link detected</div>}
      </div>

      <div style={{display:'flex',gap:9,justifyContent:'flex-end',flexWrap:'wrap',marginTop:4}}>
        <button className="btn btn-ol" onClick={onClose}>Cancel</button>
        <button className="btn btn-gold" onClick={submit} disabled={submitting}>
          {submitting ? <><span className="spin spin-dark"/> Submitting…</> : '🔄 Submit Revision'}
        </button>
      </div>
    </Modal>
  );
}

function TeacherFeedbackSection({ study, currentUser }) {
  const isTeacher = currentUser.role === 'admin';
  const isOwner   = currentUser.id === study.uploadedBy;
  const [feedback, setFeedback] = useState(null);
  const [loading, setLoading]   = useState(true);
  const [showForm, setShowForm] = useState(false);
  const [submitting, setSubmitting] = useState(false);
  const [grade, setGrade]       = useState('');
  const [criteria, setCriteria] = useState({ methodology:0, relevance:0, presentation:0, originality:0 });
  const [comments, setComments]     = useState('');
  const [recommendations, setRecommendations] = useState('');
  const [plagTeacher,setPlagTeacher]=useState(null);
  const [plagTeacherLoading,setPlagTeacherLoading]=useState(false);
  const [requestsRevision,setRequestsRevision]=useState(false);
  const [showResubmitModal,setShowResubmitModal]=useState(false);
  const [revisions,setRevisions]=useState([]);
  const [revisionsLoading,setRevisionsLoading]=useState(false);
  const [showRevHistory,setShowRevHistory]=useState(false);

  const totalScore = Object.values(criteria).reduce((a,b)=>a+(b||0),0);
  const gradeLetterClass = grade ? `tf-grade-${grade.charAt(0)}` : '';

  const load = async () => {
    setLoading(true);
    const fb = await API.getTeacherFeedback(study.id);
    setFeedback(fb);
    if(fb){ setGrade(fb.grade); setCriteria(fb.criteria||{}); setComments(fb.comments||''); setRecommendations(fb.recommendations||''); setRequestsRevision(fb.requestsRevision||false); }
    setLoading(false);
  };
  const loadRevisions = async () => {
    setRevisionsLoading(true);
    const revs = await API.getRevisions(study.id);
    setRevisions(revs);
    setRevisionsLoading(false);
  };
  useEffect(()=>{ load(); },[]);

  const submit = async () => {
    setSubmitting(true);
    try {
      await API.submitTeacherFeedback(study.id, { teacherId:currentUser.id, teacherName:currentUser.name, grade, criteria, comments, recommendations, requestsRevision });
      toast.ok('Feedback submitted!');
      setShowForm(false);
      load();
    } catch(e) { toast.err(e.message); }
    setSubmitting(false);
  };

  const del = async () => {
    if(!confirm('Remove this feedback?')) return;
    await API.deleteTeacherFeedback(study.id, currentUser.id);
    setFeedback(null); setGrade(''); setCriteria({methodology:0,relevance:0,presentation:0,originality:0}); setComments(''); setRecommendations('');
    toast.ok('Feedback removed.');
  };

  const setCrit = (k,v) => setCriteria(c=>({...c,[k]:v}));

  if(loading) return null;

  // Students & owner: show feedback if exists
  if (!isTeacher) {
    if (!feedback) return (
      <div style={{padding:'12px 0',borderTop:'1px solid var(--border)',marginTop:16}}>
        <div style={{fontSize:'0.72rem',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.8px',color:'var(--muted)',marginBottom:6}}>Teacher Feedback</div>
        <p style={{fontSize:'var(--text-sm)',color:'var(--muted)',fontStyle:'italic'}}>No teacher feedback yet.</p>
      </div>
    );
    const gl = GRADE_LABELS[feedback.grade]||{};
    return (
      <div className="tf-card" style={{marginTop:16}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:8,marginBottom:12}}>
          <div style={{fontSize:'0.72rem',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.8px',color:'var(--teal)'}}>📝 Teacher Feedback</div>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <span className={`tf-grade-badge tf-grade-${feedback.grade.charAt(0)}`}>{feedback.grade} — {gl.desc}</span>
            <span style={{fontSize:'0.7rem',color:'var(--muted)'}}>{fmtDate(feedback.gradedAt)}</span>
          </div>
        </div>
        <div className="tf-criteria">
          {Object.entries(CRITERIA_LABELS).map(([k,{label,max}])=>(
            <ScoreInput key={k} label={label} max={max} value={feedback.criteria?.[k]} readOnly/>
          ))}
        </div>
        <div style={{background:'var(--bg)',borderRadius:6,padding:'2px 0',marginBottom:8}}>
          <div style={{fontSize:'0.68rem',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.5px',color:'var(--muted)',marginBottom:4}}>Overall Score</div>
          <div style={{fontSize:'1.4rem',fontWeight:700,color:'var(--teal)'}}>{feedback.totalScore}<span style={{fontSize:'0.8rem',color:'var(--muted)',fontWeight:400}}>/100</span></div>
        </div>
        <div style={{marginBottom:feedback.recommendations?10:0}}>
          <div style={{fontSize:'0.68rem',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.5px',color:'var(--muted)',marginBottom:5}}>Comments</div>
          <p style={{fontSize:'var(--text-sm)',color:'var(--ink)',lineHeight:1.6,whiteSpace:'pre-wrap'}}>{feedback.comments}</p>
        </div>
        {feedback.recommendations&&(
          <div style={{borderTop:'1px solid var(--border)',paddingTop:10,marginTop:4}}>
            <div style={{fontSize:'0.68rem',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.5px',color:'var(--muted)',marginBottom:5}}>Recommendations</div>
            <p style={{fontSize:'var(--text-sm)',color:'var(--ink)',lineHeight:1.6,whiteSpace:'pre-wrap'}}>{feedback.recommendations}</p>
          </div>
        )}
        <div style={{marginTop:10,fontSize:'0.72rem',color:'var(--muted)',display:'flex',alignItems:'center',gap:5}}>
          <div style={{width:20,height:20,borderRadius:'50%',background:'var(--teal)',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'0.6rem',fontWeight:700,flexShrink:0}}>{feedback.teacherName?.charAt(0).toUpperCase()}</div>
          {feedback.teacherName} · Teacher
        </div>

        {/* Certificate of Recognition */}
        {PASSING_GRADES.has(feedback.grade) && (
          <div style={{marginTop:14,padding:'14px 16px',background:'linear-gradient(135deg,#fdf8ec,#fff9f0)',border:'1.5px solid var(--gold)',borderRadius:'var(--radius)',display:'flex',alignItems:'center',gap:12,flexWrap:'wrap'}}>
            <span style={{fontSize:'1.6rem',flexShrink:0}}>🏆</span>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontWeight:700,fontSize:'var(--text-sm)',color:'var(--gold)'}}>Congratulations! You passed.</div>
              <div style={{fontSize:'var(--text-xs)',color:'var(--muted)',marginTop:2}}>Your study received a passing grade. Download your Certificate of Recognition as a PDF.</div>
            </div>
            <button
              className="btn btn-gold btn-sm"
              style={{flexShrink:0,display:'flex',alignItems:'center',gap:6}}
              onClick={()=>generateCertificate(study, feedback, currentUser)}>
              🏅 Download Certificate
            </button>
          </div>
        )}

        {/* Revision request banner */}
        {feedback.requestsRevision && (
          <div style={{marginTop:14,padding:'12px 14px',background:'var(--gold-bg)',border:'1.5px solid var(--gold)',borderRadius:'var(--radius)'}}>
            {study.revisionStatus === 'resubmitted' ? (
              <div style={{display:'flex',alignItems:'center',gap:8}}>
                <span style={{fontSize:'1rem'}}>🔄</span>
                <div>
                  <div style={{fontWeight:700,fontSize:'var(--text-sm)',color:'var(--teal)'}}>Revision submitted</div>
                  <div style={{fontSize:'var(--text-xs)',color:'var(--muted)',marginTop:2}}>Your revised version is awaiting review. Version {study.version||1}.</div>
                </div>
              </div>
            ) : (
              <div>
                <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
                  <span style={{fontSize:'1rem'}}>✏️</span>
                  <div style={{fontWeight:700,fontSize:'var(--text-sm)',color:'var(--gold)'}}>Revision requested by your teacher</div>
                </div>
                <p style={{fontSize:'var(--text-xs)',color:'var(--slate)',marginBottom:10,lineHeight:1.5}}>
                  Your teacher has reviewed your study and is requesting changes. Please revise and resubmit below. Your original version will be preserved in history.
                </p>
                {isOwner && (
                  <button className="btn btn-gold btn-sm" onClick={()=>setShowResubmitModal(true)} style={{display:'flex',alignItems:'center',gap:5}}>
                    ✏️ Revise &amp; Resubmit
                  </button>
                )}
              </div>
            )}
          </div>
        )}

        {/* Revision history toggle */}
        {isOwner && study.version > 1 && (
          <div style={{marginTop:10}}>
            <button className="btn btn-ol btn-sm" style={{fontSize:'0.72rem'}} onClick={()=>{ if(!showRevHistory){loadRevisions();} setShowRevHistory(v=>!v); }}>
              📋 {showRevHistory?'Hide':'View'} Revision History ({(study.version||1)-1} previous version{study.version>2?'s':''})
            </button>
            {showRevHistory&&(
              <div style={{marginTop:10,display:'flex',flexDirection:'column',gap:8}}>
                {revisionsLoading ? <div style={{fontSize:'0.78rem',color:'var(--muted)'}}>Loading…</div> : revisions.length===0 ? <div style={{fontSize:'0.78rem',color:'var(--muted)',fontStyle:'italic'}}>No previous versions found.</div> : revisions.map((rev,i)=>(
                  <div key={rev.id} style={{padding:'10px 12px',background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'var(--radius)',borderLeft:'3px solid var(--gold)'}}>
                    <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:4}}>
                      <span style={{fontSize:'0.68rem',fontWeight:700,color:'var(--gold)',textTransform:'uppercase',letterSpacing:'0.5px'}}>Version {rev.version}</span>
                      <span style={{fontSize:'0.65rem',color:'var(--muted)'}}>{fmtDate(rev.archivedAt)}</span>
                    </div>
                    <div style={{fontWeight:500,fontSize:'var(--text-sm)',marginBottom:3}}>{rev.title}</div>
                    <div style={{fontSize:'var(--text-xs)',color:'var(--slate)',lineHeight:1.5,display:'-webkit-box',WebkitLineClamp:3,WebkitBoxOrient:'vertical',overflow:'hidden'}}>{rev.abstract}</div>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}
      </div>
    );
  }

  // Plagiarism check for existing study (teacher only)
  const runPlagCheck=async()=>{
    setPlagTeacherLoading(true);
    const allSnap=await API.getStudies({status:'active',perPage:200});
    const results=checkPlagiarism(study.abstract,allSnap.data||[],study.id);
    setPlagTeacher(results);
    setPlagTeacherLoading(false);
  };

  // Teacher view
  return (
    <div style={{marginTop:16,borderTop:'1px solid var(--border)',paddingTop:14}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10,flexWrap:'wrap',gap:8}}>
        <div style={{fontSize:'0.72rem',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.8px',color:'var(--teal)'}}>📝 Teacher Feedback</div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          {!showForm&&(
          <button className="btn btn-teal btn-sm" onClick={()=>setShowForm(true)}>
            {feedback?'✏️ Edit Feedback':'+ Give Feedback'}
          </button>
          )}
          <button className="btn btn-ol btn-sm" onClick={runPlagCheck} disabled={plagTeacherLoading}>
            {plagTeacherLoading?<><span className="spin" style={{width:12,height:12}}/> Checking…</>:'🔍 Check Plagiarism'}
          </button>
        </div>
        {plagTeacher!==null&&(
          <div style={{marginTop:10,borderRadius:'var(--radius)',overflow:'hidden',border:`1.5px solid ${plagTeacher.length&&plagTeacher[0].score>=0.5?'var(--red)':plagTeacher.length&&plagTeacher[0].score>=0.3?'#f59e0b':'var(--green)'}`,marginBottom:10}}>
            <div style={{padding:'8px 12px',background:plagTeacher.length&&plagTeacher[0].score>=0.5?'var(--red-light)':plagTeacher.length&&plagTeacher[0].score>=0.3?'#fef9c3':'var(--green-light)',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
              <span style={{fontWeight:700,fontSize:'0.78rem',color:plagTeacher.length&&plagTeacher[0].score>=0.5?'var(--red)':plagTeacher.length&&plagTeacher[0].score>=0.3?'#92400e':'var(--green)'}}>
                {plagTeacher.length===0?'✅ No significant similarity found':`${plagTeacher.length} similar ${plagTeacher.length===1?'study':'studies'} found`}
              </span>
              <button onClick={()=>setPlagTeacher(null)} style={{background:'none',border:'none',cursor:'pointer',color:'var(--muted)',fontSize:'0.8rem'}}>✕</button>
            </div>
            {plagTeacher.length>0&&(
              <div style={{background:'var(--surface)',padding:'10px 12px',display:'flex',flexDirection:'column',gap:7}}>
                {plagTeacher.map((r,i)=>{
                  const l=plagiarismLevel(r.score);
                  return(
                    <div key={i} style={{display:'flex',alignItems:'flex-start',gap:8}}>
                      <div style={{minWidth:42,height:20,borderRadius:99,background:l.bg,border:`1px solid ${l.color}`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'0.65rem',fontWeight:700,color:l.color,flexShrink:0}}>
                        {Math.round(r.score*100)}%
                      </div>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:'0.78rem',fontWeight:600,color:'var(--ink)'}}>{r.study.title.length>60?r.study.title.slice(0,60)+'…':r.study.title}</div>
                        <div style={{fontSize:'0.68rem',color:'var(--muted)'}}>{(r.study.authors||[]).slice(0,2).join(', ')} · {r.study.year}</div>
                        {r.shared.length>0&&<div style={{marginTop:3,display:'flex',gap:3,flexWrap:'wrap'}}>{r.shared.map(w=><span key={w} style={{background:'var(--gold-bg)',color:'var(--gold)',fontSize:'0.62rem',padding:'1px 6px',borderRadius:99,border:'1px solid var(--gold)'}}>{w}</span>)}</div>}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        )}
      </div>

      {/* Existing feedback display for teacher */}
      {feedback&&!showForm&&(
        <div className="tf-card" style={{marginBottom:10}}>
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10,flexWrap:'wrap'}}>
            <span className={`tf-grade-badge tf-grade-${feedback.grade.charAt(0)}`}>{feedback.grade} — {(GRADE_LABELS[feedback.grade]||{}).desc}</span>
            <span style={{fontSize:'0.7rem',color:'var(--muted)',marginLeft:'auto'}}>{fmtDate(feedback.gradedAt)}</span>
            <button className="btn btn-red btn-sm" onClick={del}>Delete</button>
          </div>
          <div className="tf-criteria">
            {Object.entries(CRITERIA_LABELS).map(([k,{label,max}])=>(
              <ScoreInput key={k} label={label} max={max} value={feedback.criteria?.[k]} readOnly/>
            ))}
          </div>
          <div style={{fontSize:'0.82rem',color:'var(--muted)',marginTop:6}}>Total: <strong style={{color:'var(--teal)'}}>{feedback.totalScore}/100</strong></div>
        </div>
      )}

      {/* Feedback form */}
      {showForm&&(
        <div className="tf-card">
          <div style={{fontWeight:600,fontSize:'var(--text-sm)',marginBottom:14,color:'var(--teal)'}}>
            {feedback?'Edit Feedback':'Grade this Study'}
          </div>

          {/* Grade selector */}
          <div className="fg" style={{marginBottom:12}}>
            <label>Grade *</label>
            <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
              {Object.keys(GRADE_LABELS).map(g=>(
                <button key={g} onClick={()=>setGrade(g)}
                  style={{padding:'5px 12px',borderRadius:6,border:`1.5px solid ${grade===g?GRADE_LABELS[g].color:'var(--border)'}`,
                    background:grade===g?GRADE_LABELS[g].color:'none',
                    color:grade===g?'#fff':GRADE_LABELS[g].color,
                    cursor:'pointer',fontSize:'0.78rem',fontWeight:600,transition:'all .15s'}}>
                  {g}
                </button>
              ))}
            </div>
            {grade&&<div style={{marginTop:6,fontSize:'0.78rem',color:'var(--muted)'}}>
              <span className={`tf-grade-badge tf-grade-${grade.charAt(0)}`}>{grade} — {GRADE_LABELS[grade].desc}</span>
            </div>}
          </div>

          {/* Criteria scores */}
          <div className="fg" style={{marginBottom:12}}>
            <label>Scoring Criteria (each out of their max, total: <strong style={{color:totalScore>=90?'var(--green)':totalScore>=75?'var(--teal)':totalScore>=60?'var(--gold)':'var(--red)'}}>{totalScore}/100</strong>)</label>
            <div className="tf-criteria">
              {Object.entries(CRITERIA_LABELS).map(([k,{label,max}])=>(
                <ScoreInput key={k} label={label} max={max} value={criteria[k]||0} onChange={v=>setCrit(k,v)}/>
              ))}
            </div>
          </div>

          {/* Comments */}
          <div className="fg">
            <label style={{display:'flex',justifyContent:'space-between'}}>
              <span>Overall Feedback *</span>
              <span style={{fontWeight:300,color:'var(--muted)',fontSize:'0.75rem'}}>{comments.length} chars</span>
            </label>
            <textarea placeholder="Write detailed feedback about the study's strengths and weaknesses…" value={comments} onChange={e=>setComments(e.target.value)} style={{minHeight:90}}/>
          </div>

          {/* Recommendations */}
          <div className="fg">
            <label>Recommendations <span style={{fontWeight:300,color:'var(--muted)'}}>(optional)</span></label>
            <textarea placeholder="What should the student improve or explore further?" value={recommendations} onChange={e=>setRecommendations(e.target.value)} style={{minHeight:60}}/>
          </div>

          {/* Requests revision checkbox */}
          <div style={{padding:'10px 14px',background:requestsRevision?'var(--gold-bg)':'var(--surface)',border:`1.5px solid ${requestsRevision?'var(--gold)':'var(--border)'}`,borderRadius:'var(--radius)',marginBottom:4,cursor:'pointer',transition:'all .15s'}}
            onClick={()=>setRequestsRevision(v=>!v)}>
            <label style={{display:'flex',alignItems:'flex-start',gap:10,cursor:'pointer'}}>
              <input type="checkbox" checked={requestsRevision} onChange={e=>setRequestsRevision(e.target.checked)}
                style={{marginTop:2,width:16,height:16,accentColor:'var(--gold)',flexShrink:0}} onClick={e=>e.stopPropagation()}/>
              <div>
                <div style={{fontWeight:600,fontSize:'var(--text-sm)',color:requestsRevision?'var(--gold)':'var(--ink)'}}>✏️ Request revision from student</div>
                <div style={{fontSize:'var(--text-xs)',color:'var(--muted)',marginTop:2,lineHeight:1.4}}>
                  Student will be notified to revise and resubmit. Their original version will be archived in history.
                </div>
              </div>
            </label>
          </div>

          <div style={{display:'flex',gap:9,justifyContent:'flex-end',flexWrap:'wrap'}}>
            <button className="btn btn-ol" onClick={()=>setShowForm(false)}>Cancel</button>
            <button className="btn btn-teal" onClick={submit} disabled={submitting||!grade||!comments.trim()}>
              {submitting?<><span className="spin spin-dark"/>Saving…</>:requestsRevision?'Submit & Request Revision':'Submit Feedback'}
            </button>
          </div>
        </div>
      )}

      {/* Resubmit Modal */}
      {showResubmitModal&&<ResubmitModal study={study} currentUser={currentUser} onClose={()=>setShowResubmitModal(false)} onDone={load}/>}

      {/* Resubmitted badge for teacher */}
      {study.revisionStatus==='resubmitted'&&(
        <div style={{marginTop:10,padding:'10px 14px',background:'var(--teal-light)',border:'1.5px solid var(--teal)',borderRadius:'var(--radius)',display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
          <span style={{fontSize:'1rem'}}>🔄</span>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontWeight:700,fontSize:'var(--text-sm)',color:'var(--teal)'}}>Student submitted a revision</div>
            <div style={{fontSize:'var(--text-xs)',color:'var(--muted)',marginTop:2}}>The study has been updated. Review the new version and re-grade if needed.</div>
          </div>
          <button className="btn btn-ol btn-sm" onClick={()=>{ if(!showRevHistory){loadRevisions();} setShowRevHistory(v=>!v); }}>
            📋 {showRevHistory?'Hide':'View'} History
          </button>
        </div>
      )}

      {/* Revision history (teacher) */}
      {showRevHistory&&(
        <div style={{marginTop:10,display:'flex',flexDirection:'column',gap:8}}>
          {revisionsLoading ? <div style={{fontSize:'0.78rem',color:'var(--muted)'}}>Loading…</div> : revisions.length===0 ? <div style={{fontSize:'0.78rem',color:'var(--muted)',fontStyle:'italic'}}>No previous versions archived yet.</div> : revisions.map(rev=>(
            <div key={rev.id} style={{padding:'10px 12px',background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'var(--radius)',borderLeft:'3px solid var(--gold)'}}>
              <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:4}}>
                <span style={{fontSize:'0.68rem',fontWeight:700,color:'var(--gold)',textTransform:'uppercase',letterSpacing:'0.5px'}}>Version {rev.version}</span>
                <span style={{fontSize:'0.65rem',color:'var(--muted)'}}>{fmtDate(rev.archivedAt)}</span>
              </div>
              <div style={{fontWeight:500,fontSize:'var(--text-sm)',marginBottom:3}}>{rev.title}</div>
              <div style={{fontSize:'var(--text-xs)',color:'var(--slate)',lineHeight:1.5,display:'-webkit-box',WebkitLineClamp:4,WebkitBoxOrient:'vertical',overflow:'hidden'}}>{rev.abstract}</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════
//  REVIEWS SECTION
// ══════════════════════════════════════════════════════════════════
function StarRating({ value, onChange, readOnly=false }) {
  const [hover, setHover] = useState(0);
  return (
    <div className="review-stars" role="group" aria-label="Rating">
      {[1,2,3,4,5].map(n=>(
        <span key={n} className="review-star"
          style={{color: (hover||value)>=n ? '#f59e0b' : 'var(--border)', fontSize: readOnly?'0.85rem':'1.2rem'}}
          onClick={()=>!readOnly&&onChange&&onChange(n)}
          onMouseEnter={()=>!readOnly&&setHover(n)}
          onMouseLeave={()=>!readOnly&&setHover(0)}
          role={readOnly?undefined:'button'}
          aria-label={readOnly?undefined:`Rate ${n} star${n!==1?'s':''}`}>
          ★
        </span>
      ))}
      {readOnly&&value>0&&<span style={{fontSize:'0.72rem',color:'var(--muted)',marginLeft:4}}>{value.toFixed(1)}</span>}
    </div>
  );
}

function ReviewsSection({ study, currentUser }) {
  const [reviews, setReviews] = useState([]);
  const [myReview, setMyReview] = useState(null);
  const [loading, setLoading] = useState(true);
  const [showAll, setShowAll] = useState(false);
  const [totalCount, setTotalCount] = useState(0);
  const [showForm, setShowForm] = useState(false);
  const [rating, setRating] = useState(0);
  const [comment, setComment] = useState('');
  const [submitting, setSubmitting] = useState(false);
  const isOwner = currentUser.id === study.uploadedBy;

  const load = async () => {
    setLoading(true);
    const [revs, mine, count] = await Promise.all([
      API.getReviews(study.id, showAll ? 50 : 5),
      API.getUserReview(study.id, currentUser.id),
      API.getReviewsCount(study.id)
    ]);
    setReviews(revs); setMyReview(mine); setTotalCount(count);
    if(mine){ setRating(mine.rating); setComment(mine.comment); }
    setLoading(false);
  };
  useEffect(()=>{ load(); },[showAll]);

  const submit = async () => {
    setSubmitting(true);
    // Optimistic update — show review immediately before Firestore confirms
    const prevReview = myReview;
    const prevReviews = reviews;
    const wasReview = !!myReview;
    const optimisticReview = {
      id: currentUser.id, userId: currentUser.id,
      userName: currentUser.name, userInstitution: currentUser.institution||'',
      rating, comment: comment.trim(), createdAt: new Date().toISOString(), _optimistic: true
    };
    setMyReview(optimisticReview);
    setShowForm(false);
    if(!wasReview) setReviews(r=>[optimisticReview, ...r.filter(x=>x.userId!==currentUser.id)]);
    try {
      await API.submitReview(study.id, currentUser.id, currentUser.name, currentUser.institution||'', rating, comment);
      toast.ok(wasReview ? 'Review updated!' : 'Review submitted!');
      load(); // sync to strip _optimistic flag
    } catch(e) {
      // Revert on failure
      setMyReview(prevReview); setReviews(prevReviews); setShowForm(true);
      toast.err(e.message);
    }
    setSubmitting(false);
  };

  const del = async () => {
    if(!confirm('Delete your review?')) return;
    // Optimistic removal
    const prevReview = myReview;
    const prevReviews = reviews;
    setMyReview(null); setRating(0); setComment('');
    setReviews(r=>r.filter(x=>x.userId!==currentUser.id));
    try {
      await API.deleteReview(study.id, currentUser.id);
      toast.ok('Review deleted.');
      load();
    } catch(e) {
      setMyReview(prevReview); setReviews(prevReviews);
      toast.err('Failed to delete review.');
    }
  };

  const avgRating = study.avgRating || 0;
  const reviewCount = study.reviewCount || totalCount || 0;

  return (
    <div style={{marginTop:20}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:8,marginBottom:12}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <div style={{fontSize:'0.72rem',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.8px',color:'var(--muted)'}}>Reviews</div>
          {avgRating>0&&(
            <div style={{display:'flex',alignItems:'center',gap:5}}>
              <StarRating value={avgRating} readOnly/>
              <span style={{fontSize:'0.75rem',color:'var(--muted)'}}>({reviewCount} review{reviewCount!==1?'s':''})</span>
            </div>
          )}
          {reviewCount===0&&<span style={{fontSize:'0.75rem',color:'var(--muted)'}}>No reviews yet</span>}
        </div>
        {!isOwner&&!showForm&&(
          <button className="btn btn-ol btn-sm" onClick={()=>setShowForm(true)}>
            {myReview?'✏️ Edit Review':'⭐ Write Review'}
          </button>
        )}
      </div>

      {/* Write / Edit form */}
      {showForm&&(
        <div style={{background:'var(--surface)',border:'1.5px solid var(--gold)',borderRadius:'var(--radius)',padding:'14px',marginBottom:14}}>
          <div style={{fontWeight:600,fontSize:'var(--text-sm)',marginBottom:10}}>{myReview?'Edit your review':'Write a review'}</div>
          <div style={{marginBottom:10}}>
            <div style={{fontSize:'0.75rem',color:'var(--muted)',marginBottom:5}}>Rating *</div>
            <StarRating value={rating} onChange={setRating}/>
          </div>
          <div style={{marginBottom:10}}>
            <div style={{fontSize:'0.75rem',color:'var(--muted)',marginBottom:5}}>Comment * <span style={{color:comment.length>500?'var(--red)':'var(--muted)'}}>{comment.length}/500</span></div>
            <textarea
              placeholder="Share your thoughts about this study…"
              value={comment}
              onChange={e=>setComment(e.target.value.slice(0,500))}
              style={{minHeight:80,width:'100%',resize:'vertical'}}/>
          </div>
          <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
            <button className="btn btn-ol btn-sm" onClick={()=>{setShowForm(false);if(myReview){setRating(myReview.rating);setComment(myReview.comment);}}}>Cancel</button>
            {myReview&&<button className="btn btn-red btn-sm" onClick={del}>Delete</button>}
            <button className="btn btn-gold btn-sm" onClick={submit} disabled={submitting||!rating}>
              {submitting?<span className="spin spin-dark" style={{width:13,height:13}}/>:(myReview?'Update':'Submit')}
            </button>
          </div>
        </div>
      )}

      {/* Reviews list */}
      {loading?(
        <div style={{textAlign:'center',padding:'16px',color:'var(--muted)'}}><span className="spin"/></div>
      ):(
        <>
          {myReview&&!showForm&&(
            <div className="review-item review-own" style={{marginBottom:8,opacity:myReview._optimistic?0.7:1,transition:'opacity 0.3s'}}>
              <div className="review-header">
                <div className="review-avatar">{currentUser.name.charAt(0).toUpperCase()}</div>
                <span className="review-name">{myReview.userName} <span style={{fontSize:'0.68rem',fontWeight:400,color:'var(--gold)'}}>· Your review</span></span>
                <StarRating value={myReview.rating} readOnly/>
                <span className="review-date">{fmtDate(myReview.createdAt)}</span>
                <button className="btn btn-ol btn-sm" style={{marginLeft:'auto'}} onClick={()=>setShowForm(true)}>✏️ Edit</button>
              </div>
              <p className="review-comment">{myReview.comment}</p>
            </div>
          )}
          <div className="review-list">
            {reviews.filter(r=>r.userId!==currentUser.id).map(r=>(
              <div key={r.id} className="review-item">
                <div className="review-header">
                  <div className="review-avatar" style={{background:'var(--purple)'}}>{r.userName?.charAt(0).toUpperCase()||'?'}</div>
                  <div style={{flex:1,minWidth:0}}>
                    <div className="review-name">{r.userName}</div>
                    {r.userInstitution&&<div style={{fontSize:'0.68rem',color:'var(--muted)'}}>{r.userInstitution}</div>}
                  </div>
                  <StarRating value={r.rating} readOnly/>
                  <span className="review-date">{fmtDate(r.createdAt)}</span>
                </div>
                <p className="review-comment">{r.comment}</p>
              </div>
            ))}
          </div>
          {!showAll&&totalCount>5&&(
            <button className="btn btn-ol btn-sm" style={{marginTop:10,width:'100%'}} onClick={()=>setShowAll(true)}>
              Load more reviews ({totalCount-5} remaining)
            </button>
          )}
          {reviews.filter(r=>r.userId!==currentUser.id).length===0&&!myReview&&(
            <div style={{textAlign:'center',padding:'18px',color:'var(--muted)',fontSize:'var(--text-sm)'}}>
              No reviews yet.{!isOwner?' Be the first to review this study!':''}
            </div>
          )}
        </>
      )}
    </div>
  );
}

//  AUTHOR TAG INPUT — co-author tagging with user search
// ══════════════════════════════════════════════════════════════════
function AuthorTagInput({ tags, onChange, currentUser }) {
  const [query, setQuery]         = useState('');
  const [results, setResults]     = useState([]);
  const [loading, setLoading]     = useState(false);
  const [showDrop, setShowDrop]   = useState(false);
  const [activeIdx, setActiveIdx] = useState(-1);
  const inputRef  = useRef(null);
  const wrapRef   = useRef(null);
  const searchRef = useRef(null);

  // Fetch matching approved students whenever query changes
  useEffect(()=>{
    if (!query.trim()) { setResults([]); setShowDrop(false); return; }
    setLoading(true);
    clearTimeout(searchRef.current);
    searchRef.current = setTimeout(async()=>{
      try {
        const all = await API.getUsers({ role:'student', status:'approved' });
        const q   = query.toLowerCase();
        const filtered = all
          .filter(u => u.id !== currentUser.id)                        // exclude self (already first tag)
          .filter(u => !tags.some(t => t.userId === u.id))             // exclude already-added
          .filter(u => u.name.toLowerCase().includes(q) || (u.email||'').toLowerCase().includes(q));
        setResults(filtered.slice(0, 8));
        setShowDrop(true);
      } catch { setResults([]); }
      setLoading(false);
    }, 280);
  }, [query]);

  // Close dropdown on outside click
  useEffect(()=>{
    const handler = e => { if (wrapRef.current && !wrapRef.current.contains(e.target)) setShowDrop(false); };
    document.addEventListener('mousedown', handler);
    return ()=>document.removeEventListener('mousedown', handler);
  }, []);

  const addRegistered = user => {
    onChange([...tags, { name: user.name, userId: user.id, institution: user.institution||'', registered: true }]);
    setQuery(''); setResults([]); setShowDrop(false); setActiveIdx(-1);
    inputRef.current?.focus();
  };

  const addFreeText = () => {
    const name = query.trim();
    if (!name) return;
    if (tags.some(t => t.name.toLowerCase() === name.toLowerCase())) { setQuery(''); return; }
    onChange([...tags, { name, userId: null, registered: false }]);
    setQuery(''); setResults([]); setShowDrop(false); setActiveIdx(-1);
    inputRef.current?.focus();
  };

  const removeTag = idx => {
    if (idx === 0) return; // can't remove uploader (self)
    onChange(tags.filter((_,i)=>i!==idx));
    inputRef.current?.focus();
  };

  const onKeyDown = e => {
    if (e.key === 'Enter' || e.key === ',') {
      e.preventDefault();
      if (activeIdx >= 0 && results[activeIdx]) addRegistered(results[activeIdx]);
      else addFreeText();
    } else if (e.key === 'ArrowDown') {
      e.preventDefault(); setActiveIdx(i=>Math.min(i+1, results.length-1));
    } else if (e.key === 'ArrowUp') {
      e.preventDefault(); setActiveIdx(i=>Math.max(i-1, -1));
    } else if (e.key === 'Escape') {
      setShowDrop(false); setActiveIdx(-1);
    } else if (e.key === 'Backspace' && !query && tags.length > 1) {
      removeTag(tags.length - 1);
    }
  };

  return (
    <div ref={wrapRef} style={{position:'relative'}}>
      <div className="author-field" onClick={()=>inputRef.current?.focus()}>
        {tags.map((tag, i)=>(
          <span key={i} className={`author-tag${i===0?' self':tag.registered?' registered':''}`}>
            <span className="author-tag-avatar">
              <span>{tag.name.charAt(0).toUpperCase()}</span>
            </span>
            <span style={{overflow:'hidden',textOverflow:'ellipsis',maxWidth:160}}>{tag.name}</span>
            {i===0
              ? <span style={{fontSize:'0.6rem',opacity:0.6,fontWeight:400,marginLeft:1}}>(you)</span>
              : <button className="author-tag-remove" onClick={e=>{e.stopPropagation();removeTag(i);}} aria-label={`Remove ${tag.name}`}>✕</button>
            }
          </span>
        ))}
        <input
          ref={inputRef}
          className="author-tag-input"
          placeholder={tags.length<2?"Add co-author name or search…":"+ Add another…"}
          value={query}
          onChange={e=>{setQuery(e.target.value);setActiveIdx(-1);}}
          onKeyDown={onKeyDown}
          onFocus={()=>query&&setShowDrop(true)}
          autoComplete="off"
          spellCheck={false}
        />
        {loading&&<span className="spin" style={{width:12,height:12,flexShrink:0}}/>}
      </div>

      {/* Dropdown */}
      {showDrop&&(results.length>0||query.trim())&&(
        <div className="author-dropdown">
          {results.map((u,i)=>(
            <div key={u.id}
              className={`author-dropdown-item${i===activeIdx?' active':''}`}
              onMouseDown={e=>{e.preventDefault();addRegistered(u);}}>
              <div className="author-dropdown-avatar">{u.name.charAt(0).toUpperCase()}</div>
              <div className="author-dropdown-info">
                <div className="author-dropdown-name">{u.name}</div>
                {(u.institution||u.department)&&<div className="author-dropdown-sub">{[u.institution,u.department].filter(Boolean).join(' · ')}</div>}
              </div>
              <span className="author-dropdown-badge">Registered</span>
            </div>
          ))}
          {query.trim()&&(
            <div className="author-dropdown-item" style={{borderTop:results.length?'1px solid var(--border)':'none'}}
              onMouseDown={e=>{e.preventDefault();addFreeText();}}>
              <div className="author-dropdown-avatar" style={{background:'var(--slate)'}}>+</div>
              <div className="author-dropdown-info">
                <div className="author-dropdown-name">Add "<strong>{query.trim()}</strong>"</div>
                <div className="author-dropdown-sub">as guest / external author</div>
              </div>
            </div>
          )}
        </div>
      )}

      <p style={{fontSize:'var(--text-xs)',color:'var(--muted)',marginTop:5}}>
        Search registered students, or type a name and press <kbd style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:3,padding:'0 4px',fontFamily:'var(--font-mono)',fontSize:'0.65rem'}}>Enter</kbd> to add external authors.
      </p>
    </div>
  );
}

// ── Draft helpers ────────────────────────────────────────────────
const DRAFT_KEY = uid => `sabnahis_upload_draft_${uid}`;
const loadDraft = uid => { try { const d=localStorage.getItem(DRAFT_KEY(uid)); return d?JSON.parse(d):null; } catch{ return null; } };
const saveDraft = (uid,data) => { try { localStorage.setItem(DRAFT_KEY(uid),JSON.stringify({...data,_savedAt:Date.now()})); } catch{} };
const clearDraft = uid => { try { localStorage.removeItem(DRAFT_KEY(uid)); } catch{} };

function UploadModal({ onClose, currentUser, onUpload, cats=[] }) {
  const draftKey = currentUser?.id;
  const existingDraft = loadDraft(draftKey);

  const selfTag = { name: currentUser.name, userId: currentUser.id, registered: true, self: true };

  const [form,setForm]=useState(existingDraft?.form||{title:'',abstract:'',keywords:'',year:String(new Date().getFullYear())});
  const [authorTags,setAuthorTags]=useState(existingDraft?.authorTags||[selfTag]);
  const [selCats,setSelCats]=useState(existingDraft?.selCats||[]);
  const [gdriveUrl,setGdriveUrl]=useState(existingDraft?.gdriveUrl||'');
  const [gdriveInfo,setGdriveInfo]=useState(existingDraft?.gdriveInfo||null);
  const [loading,setLoading]=useState(false);
  const [titleDupe,setTitleDupe]=useState(null);
  const [titleChecking,setTitleChecking]=useState(false);
  const [plagResults,setPlagResults]=useState([]);
  const [plagChecking,setPlagChecking]=useState(false);
  const [allStudiesCache,setAllStudiesCache]=useState([]);
  const [draftStatus,setDraftStatus]=useState(existingDraft?'saved':null);
  const [hasDraftRestored,setHasDraftRestored]=useState(!!existingDraft);
  const titleCheckTimeout=useRef(null);
  const plagCheckTimeout=useRef(null);
  const draftTimeout=useRef(null);

  // Load all studies once for plagiarism checking
  useEffect(()=>{
    API.getStudies({status:'active',perPage:200}).then(r=>setAllStudiesCache(r.data||[])).catch(()=>{});
  },[]);

  // Auto-save draft whenever form content changes
  const triggerDraftSave = (newForm, newTags, newCats, newGdriveUrl, newGdriveInfo) => {
    setDraftStatus('saving');
    clearTimeout(draftTimeout.current);
    draftTimeout.current = setTimeout(()=>{
      const hasContent = (newForm.title||'').trim() || (newForm.abstract||'').trim();
      if(hasContent){
        saveDraft(draftKey, { form:newForm, authorTags:newTags, selCats:newCats, gdriveUrl:newGdriveUrl, gdriveInfo:newGdriveInfo });
        setDraftStatus('saved');
      } else {
        clearDraft(draftKey);
        setDraftStatus(null);
      }
    }, 800);
  };

  const sf=(k,v)=>{
    const newForm = {...form,[k]:v};
    setForm(newForm);
    triggerDraftSave(newForm, authorTags, selCats, gdriveUrl, gdriveInfo);
    if(k==='title'){
      setTitleDupe(null);
      clearTimeout(titleCheckTimeout.current);
      if(v.trim().length>4){
        setTitleChecking(true);
        titleCheckTimeout.current=setTimeout(async()=>{
          try{
            const norm=v.trim().toLowerCase().replace(/\s+/g,' ');
            const snap=await db.collection('studies').where('titleNorm','==',norm).limit(1).get();
            setTitleDupe(snap.empty?false:snap.docs[0].data().title);
          }catch{setTitleDupe(false);}
          setTitleChecking(false);
        },600);
      }else{setTitleChecking(false);}
    }
    if(k==='abstract'){
      setPlagResults([]);
      clearTimeout(plagCheckTimeout.current);
      if(v.trim().length>80){
        setPlagChecking(true);
        plagCheckTimeout.current=setTimeout(()=>{
          const results=checkPlagiarism(v,allStudiesCache);
          setPlagResults(results);
          setPlagChecking(false);
        },800);
      }else{setPlagChecking(false);}
    }
  };

  const handleAuthorTagsChange = (newTags) => {
    setAuthorTags(newTags);
    triggerDraftSave(form, newTags, selCats, gdriveUrl, gdriveInfo);
  };

  const handleCatsChange = (newCats) => {
    setSelCats(newCats);
    triggerDraftSave(form, authorTags, newCats, gdriveUrl, gdriveInfo);
  };

  const handleGdriveInput=val=>{
    setGdriveUrl(val);
    const parsed=parseGDriveLink(val.trim());
    setGdriveInfo(parsed);
    triggerDraftSave(form, authorTags, selCats, val, parsed);
  };

  const discardDraft = () => {
    clearDraft(draftKey);
    setForm({title:'',abstract:'',keywords:'',year:String(new Date().getFullYear())});
    setAuthorTags([selfTag]);
    setSelCats([]);
    setGdriveUrl('');
    setGdriveInfo(null);
    setDraftStatus(null);
    setHasDraftRestored(false);
    setPlagResults([]);
    setTitleDupe(null);
    toast.info('Draft discarded.');
  };

  const confirmClose=()=>{
    const hasContent=form.title.trim()||form.abstract.trim();
    if(hasContent){
      toast.info('✏️ Draft saved. You can resume anytime.');
      onClose();
      return;
    }
    onClose();
  };

  const submit=async()=>{
    if(!form.title.trim()){toast.err('Title is required.');return;}
    if(!authorTags.length){toast.err('At least one author is required.');return;}
    if(!form.abstract.trim()){toast.err('Abstract is required.');return;}
    if(!selCats.length){toast.err('Select at least one category.');return;}
    const topPlag=plagResults[0];
    if(topPlag&&topPlag.score>=0.5){
      toast.err('Abstract has high similarity ('+Math.round(topPlag.score*100)+'%) with an existing study. Please rewrite it.');
      return;
    }
    setLoading(true);
    try{
      const authors=authorTags.map(t=>t.name);
      const coAuthors=authorTags.slice(1).map(t=>({name:t.name,userId:t.userId||null,registered:!!t.registered}));
      const keywords=form.keywords.split(',').map(k=>k.trim()).filter(Boolean);
      const gdrive=gdriveInfo?{driveUrl:gdriveInfo.viewUrl,downloadUrl:gdriveInfo.downloadUrl,driveId:gdriveInfo.id}:null;
      await API.createStudy({title:form.title,authors,coAuthors,abstract:form.abstract,keywords,categories:selCats,year:form.year,gdrive,uploadedBy:currentUser.id,uploadedByName:currentUser.name,uploaderGrade:currentUser.gradeLevel||'',uploaderSection:currentUser.section||''});
      clearDraft(draftKey);
      toast.ok('Study uploaded successfully!');onUpload();onClose();
    }catch(e){toast.err(e.message);}
    setLoading(false);
  };

  const draftAge = existingDraft?._savedAt ? (() => {
    const mins = Math.round((Date.now() - existingDraft._savedAt) / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return `${mins} min ago`;
    const hrs = Math.floor(mins/60);
    return hrs === 1 ? '1 hour ago' : `${hrs} hours ago`;
  })() : '';

  return (
    <Modal title="Upload Research Study" onClose={confirmClose} wide>

      {/* Draft restored banner */}
      {hasDraftRestored&&(
        <div className="draft-banner">
          <span className="draft-banner-icon">📝</span>
          <div className="draft-banner-text">
            <strong>Draft restored</strong>
            <span>Last saved {draftAge} · Your progress has been recovered.</span>
          </div>
          <button className="btn btn-ol btn-sm" style={{flexShrink:0,fontSize:'0.72rem'}} onClick={discardDraft}>
            ✕ Discard
          </button>
        </div>
      )}

      <div className="fg">
        <label style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8}}>
          <span>Title *</span>
          {draftStatus==='saving'&&<span className="draft-status saving"><span className="spin" style={{width:9,height:9,borderWidth:1.5}}/>Saving…</span>}
          {draftStatus==='saved'&&!hasDraftRestored&&<span className="draft-status saved">✓ Draft saved</span>}
        </label>
        <input placeholder="Full title of your research study" value={form.title} onChange={e=>sf('title',e.target.value)} autoCapitalize="words" spellCheck style={titleDupe?{borderColor:'var(--red)'}:{}}/>
        {titleChecking&&<span style={{fontSize:'0.73rem',color:'var(--muted)',marginTop:4,display:'block'}}>⏳ Checking for duplicates…</span>}
        {titleDupe&&<div className="al al-err" style={{marginTop:6,padding:'8px 12px',fontSize:'0.78rem'}}>
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2" style={{flexShrink:0}}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span>A study with this title already exists: <strong>"{titleDupe}"</strong></span>
        </div>}
        {titleDupe===false&&form.title.trim().length>4&&<span style={{fontSize:'0.73rem',color:'var(--green)',marginTop:4,display:'block'}}>✓ Title is available</span>}
      </div>
      <div className="fg">
        <label style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8}}>
          <span>Authors *</span>
          <span style={{fontSize:'var(--text-xs)',color:'var(--muted)',fontWeight:400}}>
            {authorTags.length} author{authorTags.length!==1?'s':''}
          </span>
        </label>
        <AuthorTagInput tags={authorTags} onChange={handleAuthorTagsChange} currentUser={currentUser}/>
      </div>
      <div className="fg">
        <label style={{display:'flex',justifyContent:'space-between'}}>
          <span>Abstract / Description *</span>
          <span style={{fontWeight:300,color:form.abstract.length>800?'var(--red)':(form.abstract.length>500?'var(--gold)':'var(--muted)'),fontSize:'0.75rem'}}>
            {form.abstract.split(/\s+/).filter(Boolean).length}w · {form.abstract.length} chars
          </span>
        </label>
        <textarea placeholder="Concise summary of your research…" value={form.abstract} onChange={e=>sf('abstract',e.target.value)} style={{minHeight:110}}/>

        {/* Plagiarism results */}
        {plagChecking&&(
          <div style={{display:'flex',alignItems:'center',gap:7,marginTop:8,fontSize:'0.75rem',color:'var(--muted)'}}>
            <span className="spin" style={{width:12,height:12,flexShrink:0}}/> Checking similarity…
          </div>
        )}
        {!plagChecking&&plagResults.length===0&&form.abstract.trim().length>80&&(
          <div style={{marginTop:8,display:'flex',alignItems:'center',gap:6,fontSize:'0.75rem',color:'var(--green)'}}>
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="20 6 9 17 4 12"/></svg>
            No significant similarity detected
          </div>
        )}
        {!plagChecking&&plagResults.length>0&&(()=>{
          const top=plagResults[0];
          const lvl=plagiarismLevel(top.score);
          return(
            <div style={{marginTop:10,borderRadius:'var(--radius)',overflow:'hidden',border:`1.5px solid ${lvl.color}`}}>
              {/* Header */}
              <div style={{background:lvl.bg,padding:'8px 12px',display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
                <span style={{fontWeight:700,fontSize:'0.78rem',color:lvl.color}}>
                  {top.score>=0.5?'🚨':top.score>=0.3?'⚠️':'ℹ️'} Similarity Check — {lvl.label}
                </span>
                <span style={{marginLeft:'auto',fontSize:'0.7rem',color:lvl.color,fontWeight:600}}>
                  Highest: {Math.round(top.score*100)}%
                </span>
              </div>
              {/* Matches */}
              <div style={{background:'var(--surface)',padding:'10px 12px',display:'flex',flexDirection:'column',gap:8}}>
                {plagResults.map((r,i)=>{
                  const l=plagiarismLevel(r.score);
                  return(
                    <div key={i} style={{borderBottom:i<plagResults.length-1?'1px solid var(--border)':'none',paddingBottom:i<plagResults.length-1?8:0}}>
                      <div style={{display:'flex',alignItems:'flex-start',gap:8,marginBottom:3}}>
                        <div style={{minWidth:42,height:20,borderRadius:99,background:l.bg,border:`1px solid ${l.color}`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'0.65rem',fontWeight:700,color:l.color,flexShrink:0}}>
                          {Math.round(r.score*100)}%
                        </div>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontSize:'0.78rem',fontWeight:600,color:'var(--ink)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}} title={r.study.title}>
                            {r.study.title.length>70?r.study.title.slice(0,70)+'…':r.study.title}
                          </div>
                          <div style={{fontSize:'0.68rem',color:'var(--muted)'}}>
                            {(r.study.authors||[]).slice(0,2).join(', ')} · {r.study.year}
                          </div>
                        </div>
                      </div>
                      {r.shared.length>0&&(
                        <div style={{display:'flex',gap:3,flexWrap:'wrap',marginTop:3,paddingLeft:50}}>
                          <span style={{fontSize:'0.62rem',color:'var(--muted)',marginRight:2}}>Shared terms:</span>
                          {r.shared.map(w=>(
                            <span key={w} style={{background:'var(--gold-bg)',color:'var(--gold)',fontSize:'0.62rem',padding:'1px 6px',borderRadius:99,border:'1px solid var(--gold)'}}>{w}</span>
                          ))}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
              {top.score>=0.5&&(
                <div style={{background:'var(--red-light)',padding:'8px 12px',fontSize:'0.75rem',color:'var(--red)',fontWeight:500}}>
                  🚨 Submission blocked — abstract is too similar to an existing study. Rewrite it significantly before submitting.
                </div>
              )}
              {top.score>=0.3&&top.score<0.5&&(
                <div style={{background:'#fef9c3',padding:'8px 12px',fontSize:'0.75rem',color:'#92400e'}}>
                  ⚠️ Moderate similarity detected. Review your abstract and consider rephrasing.
                </div>
              )}
            </div>
          );
        })()}
      </div>
      <div className="fg"><label>Category * <span style={{fontWeight:300,color:'var(--muted)'}}>(select 1–2)</span></label><CatPicker selected={selCats} onChange={handleCatsChange} max={2} cats={cats}/></div>
      <div className="fr">
        <div className="fg"><label>Year</label><input type="number" min="1900" max="2099" value={form.year} onChange={e=>sf('year',e.target.value)}/></div>
        <div className="fg">
          <label>Keywords <span style={{fontWeight:300,color:'var(--muted)'}}>(comma-separated)</span></label>
          <input placeholder="e.g. robotics, AI, biology" value={form.keywords} onChange={e=>sf('keywords',e.target.value)}/>
          {form.keywords.trim()&&<div style={{display:'flex',gap:4,flexWrap:'wrap',marginTop:5}}>
            {form.keywords.split(',').map(k=>k.trim()).filter(Boolean).map(k=><span key={k} style={{background:'var(--gold-bg)',color:'var(--gold)',border:'1px solid var(--gold)',borderRadius:20,padding:'1px 8px',fontSize:'0.72rem'}}>{k}</span>)}
          </div>}
        </div>
      </div>
      <div className="fg">
        <label style={{display:'flex',alignItems:'center',gap:7}}>
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          Google Drive Link
          <span style={{fontWeight:300,color:'var(--muted)',fontSize:'0.78rem'}}>(optional)</span>
        </label>
        <div className="al al-info" style={{marginBottom:10,padding:'9px 13px',fontSize:'0.78rem'}}>
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2" style={{flexShrink:0,marginTop:1}}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span>Upload your PDF to <strong>Google Drive</strong>, set sharing to <strong>"Anyone with the link"</strong>, then paste the link here.</span>
        </div>
        {gdriveInfo?(
          <div className="gdrive-preview">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2" style={{flexShrink:0}}><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontWeight:600,fontSize:'0.82rem',marginBottom:2}}>Google Drive file linked</div>
              <a href={gdriveInfo.viewUrl} target="_blank" rel="noopener noreferrer" style={{fontSize:'0.73rem'}}>{gdriveInfo.viewUrl}</a>
            </div>
            <button className="gdrive-remove" onClick={()=>{setGdriveUrl('');setGdriveInfo(null);triggerDraftSave(form,selCats,'',null);}} data-tip="Remove Google Drive link">✕</button>
          </div>
        ):(
          <div className="gdrive-input-wrap">
            <span className="gdrive-icon">
              <svg viewBox="0 0 87.3 78" width="18" height="18" xmlns="http://www.w3.org/2000/svg"><path d="M6.6 66.85l3.85 6.65c.8 1.4 1.95 2.5 3.3 3.3l13.75-23.8H0c0 1.55.4 3.1 1.2 4.5z" fill="#0066da"/><path d="M43.65 25L29.9 1.2C28.55 2 27.4 3.1 26.6 4.5L1.2 48.6c-.8 1.4-1.2 2.95-1.2 4.5h27.5z" fill="#00ac47"/><path d="M73.55 76.8c1.35-.8 2.5-1.9 3.3-3.3l1.6-2.75 7.65-13.25c.8-1.4 1.2-2.95 1.2-4.5H59.8l5.85 11.5z" fill="#ea4335"/><path d="M43.65 25L57.4 1.2C56.05.4 54.5 0 52.9 0H34.4c-1.6 0-3.1.45-4.5 1.2z" fill="#00832d"/><path d="M59.8 53.1H27.5L13.75 76.9c1.35.8 2.9 1.2 4.5 1.2h50.8c1.6 0 3.1-.45 4.5-1.2z" fill="#2684fc"/><path d="M73.4 26.6l-12.6-21.9C59.9 3.2 58.75 2.1 57.4 1.3L43.65 25l16.15 28.1h27.45c0-1.55-.4-3.1-1.2-4.5z" fill="#ffba00"/></svg>
            </span>
            <input
              placeholder="Paste Google Drive link here…"
              value={gdriveUrl}
              onChange={e=>handleGdriveInput(e.target.value)}
              style={{color:'var(--ink)'}}
            />
            {gdriveUrl&&!gdriveInfo&&<span style={{color:'var(--red)',fontSize:'0.75rem',flexShrink:0}}>Invalid link</span>}
          </div>
        )}
      </div>

      {/* Draft status footer */}
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4,minHeight:20}}>
        {draftStatus==='saving'&&<span className="draft-status saving"><span className="spin" style={{width:9,height:9,borderWidth:1.5}}/>Auto-saving draft…</span>}
        {draftStatus==='saved'&&<span className="draft-status saved">✓ Draft saved — close anytime and resume later</span>}
      </div>

      <div style={{display:'flex',gap:9,justifyContent:'flex-end',flexWrap:'wrap'}}>
        <button className="btn btn-ol" onClick={confirmClose}>
          {(form.title.trim()||authorTags.length>1||form.abstract.trim()) ? '💾 Save & Close' : 'Cancel'}
        </button>
        <button className="btn btn-gold" onClick={submit} disabled={loading||!!titleDupe||(plagResults[0]?.score>=0.5)}>{loading?<><span className="spin spin-dark"/>Uploading…</>:<><Ico.up/> Upload Study</>}</button>
      </div>
    </Modal>
  );
}
