<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#0d0f14"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>SABNAHIS STE Research Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
/* ══════════════════════════════════════════
   DESIGN TOKENS
══════════════════════════════════════════ */
:root {
  /* Colors */
  --ink:#0d0f14; --ink-2:#1e2130; --ink-3:#2e3250;
  --slate:#4a5174; --muted:#7c85a8;
  --border:#e2e5f0; --surface:#f5f6fa; --white:#ffffff;
  --gold:#c9a227; --gold-light:#f0d882; --gold-bg:#fdf8ec;
  --teal:#1a7f6e; --teal-light:#e6f5f2;
  --red:#c0392b; --red-light:#fdf0ee;
  --green:#1a7f4a; --green-light:#e6f5ee;
  --blue:#1a5fa8; --blue-light:#e6f0fd;
  --purple:#6d3fa8; --purple-light:#f3eeff;

  /* Shape */
  --radius: 10px;
  --radius-lg: 16px;
  --radius-xl: 22px;

  /* Elevation */
  --shadow: 0 2px 12px rgba(13,15,20,0.08);
  --shadow-lg: 0 8px 32px rgba(13,15,20,0.12);
  --shadow-xl: 0 24px 64px rgba(13,15,20,0.18);

  /* Typography */
  --font-display: 'Playfair Display', Georgia, serif;
  --font-body: 'DM Sans', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;

  /* Fluid scale */
  --text-xs:  clamp(0.65rem, 1.8vw, 0.72rem);
  --text-sm:  clamp(0.78rem, 2.2vw, 0.875rem);
  --text-base:clamp(0.875rem, 2.5vw, 1rem);
  --text-lg:  clamp(1rem, 3vw, 1.15rem);
  --text-xl:  clamp(1.1rem, 3.5vw, 1.35rem);
  --text-2xl: clamp(1.25rem, 4.5vw, 1.65rem);

  /* Motion */
  --transition: 0.2s cubic-bezier(0.4,0,0.2,1);
  --spring: 0.3s cubic-bezier(0.34,1.56,0.64,1);

  /* Layout */
  --sidebar-w: 260px;
  --topbar-h: 58px;
  --mob-header-h: 54px;
  --mob-nav-h: 62px;

  /* Safe areas */
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);

  /* Touch targets */
  --tap-min: 44px;

  /* Sidebar (light mode defaults) */
  --sidebar-bg: #ffffff;
  --sidebar-border: #e2e5f0;
  --sidebar-text: #4a5174;
  --sidebar-text-strong: #0d0f14;
  --sidebar-text-sub: #7c85a8;
  --sidebar-text-label: #9ca3be;
  --sidebar-item-hover-bg: #f5f6fa;
  --sidebar-item-hover-text: #0d0f14;
  --sidebar-item-active-bg: #fdf8ec;
}

/* ══════════════════════════════════════════
   DARK MODE TOKENS
══════════════════════════════════════════ */
[data-theme="dark"] {
  --ink:#e8eaf2; --ink-2:#cdd0e0; --ink-3:#b0b5cc;
  --slate:#8891b0; --muted:#6a7090;
  --border:#2a2e42; --surface:#12141c; --white:#1a1d2e;
  --gold:#e0b830; --gold-light:#f5e080; --gold-bg:#1e1a08;
  --teal:#22a98e; --teal-light:#0d2520;
  --red:#e05447; --red-light:#1f0f0d;
  --green:#27a862; --green-light:#0d1f14;
  --blue:#3b82d4; --blue-light:#0d1826;
  --purple:#9b65e0; --purple-light:#1a0f2e;
  --shadow: 0 2px 12px rgba(0,0,0,0.3);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.45);
  --shadow-xl: 0 24px 64px rgba(0,0,0,0.6);

  /* Sidebar dark */
  --sidebar-bg: #1a1d2e;
  --sidebar-border: rgba(255,255,255,0.06);
  --sidebar-text: rgba(255,255,255,0.5);
  --sidebar-text-strong: #e8eaf2;
  --sidebar-text-sub: rgba(255,255,255,0.32);
  --sidebar-text-label: rgba(255,255,255,0.22);
  --sidebar-item-hover-bg: rgba(255,255,255,0.06);
  --sidebar-item-hover-text: #e8eaf2;
  --sidebar-item-active-bg: rgba(224,184,48,0.14);
}
/* ── Reviews ────────────────────────────── */
.review-list { display:flex; flex-direction:column; gap:10px; margin-top:10px; }

/* ── Teacher Feedback ───────────────────────────────── */
.tf-grade-badge {
  display:inline-flex; align-items:center; gap:6px;
  padding:4px 14px; border-radius:99px;
  font-weight:700; font-size:0.85rem; letter-spacing:0.3px;
}
.tf-grade-A  { background:linear-gradient(135deg,#d1fae5,#a7f3d0); color:#065f46; border:1.5px solid #6ee7b7; }
.tf-grade-B  { background:linear-gradient(135deg,#dbeafe,#bfdbfe); color:#1e40af; border:1.5px solid #93c5fd; }
.tf-grade-C  { background:linear-gradient(135deg,#fef9c3,#fde68a); color:#92400e; border:1.5px solid #fbbf24; }
.tf-grade-D  { background:linear-gradient(135deg,#ffedd5,#fed7aa); color:#9a3412; border:1.5px solid #fb923c; }
.tf-grade-F  { background:linear-gradient(135deg,#fee2e2,#fecaca); color:#991b1b; border:1.5px solid #f87171; }
.tf-card { background:var(--surface); border:1.5px solid var(--teal); border-radius:var(--radius); padding:16px 18px; position:relative; }
.tf-criteria { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:12px 0; }
.tf-criterion { background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:9px 12px; }
.tf-criterion-label { font-size:0.68rem; font-weight:600; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted); margin-bottom:4px; }
.tf-criterion-score { font-size:1.1rem; font-weight:700; color:var(--teal); }
@media(max-width:500px){ .tf-criteria{ grid-template-columns:1fr 1fr; } }
.review-item { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px; }
.review-header { display:flex; align-items:center; gap:9px; margin-bottom:5px; flex-wrap:wrap; }
.review-avatar { width:30px; height:30px; border-radius:50%; background:var(--teal); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:0.75rem; flex-shrink:0; }
.review-name { font-weight:600; font-size:var(--text-sm); flex:1; }
.review-date { font-size:0.7rem; color:var(--muted); }
.review-stars { display:flex; gap:2px; }
.review-star { font-size:0.95rem; line-height:1; cursor:pointer; transition:transform .1s; }
.review-star:hover { transform:scale(1.2); }
.review-comment { font-size:var(--text-sm); color:var(--ink); line-height:1.55; }
.review-own { border-color:var(--gold); background:var(--gold-bg); }

/* ── Sidebar light mode ─────────────────── */
[data-theme="light"] {
  --sidebar-bg: #ffffff;
  --sidebar-border: #e2e5f0;
  --sidebar-text: #4a5174;
  --sidebar-text-strong: #0d0f14;
  --sidebar-text-sub: #7c85a8;
  --sidebar-text-label: #9ca3be;
  --sidebar-item-hover-bg: #f5f6fa;
  --sidebar-item-hover-text: #0d0f14;
  --sidebar-item-active-bg: #fdf8ec;
}

/* ── Theme toggle button ─────────────────── */
.theme-toggle {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  color: rgba(255,255,255,0.65);
  border-radius: 99px;
  padding: 5px 11px;
  font-size: 0.75rem;
  font-family: var(--font-body);
  cursor: pointer;
  display: flex; align-items: center; gap: 5px;
  transition: all var(--transition);
  min-height: 32px;
  white-space: nowrap;
}
.theme-toggle:hover { background: rgba(255,255,255,0.14); color: #fff; }

/* Topbar theme toggle */
.topbar-theme-toggle {
  background: var(--surface);
  border: 1.5px solid var(--border);
  color: var(--ink-3);
  border-radius: 99px;
  padding: 5px 12px;
  font-size: 0.75rem;
  font-family: var(--font-body);
  cursor: pointer;
  display: flex; align-items: center; gap: 5px;
  transition: all var(--transition);
  min-height: 32px;
}
.topbar-theme-toggle:hover { border-color: var(--gold); color: var(--gold); background: var(--gold-bg); }

/* ── Google Drive input style ─────────────── */
.gdrive-input-wrap {
  display: flex; align-items: center; gap: 9px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 0 13px;
  background: var(--white);
  transition: border-color var(--transition), box-shadow var(--transition);
  min-height: var(--tap-min);
}
.gdrive-input-wrap:focus-within {
  border-color: var(--teal);
  box-shadow: 0 0 0 3px rgba(26,127,110,0.12);
}
.gdrive-input-wrap input {
  border: none; background: none; padding: 9px 0;
  flex: 1; outline: none; font-size: var(--text-sm);
}
.gdrive-icon { flex-shrink: 0; display: flex; align-items: center; }
.gdrive-preview {
  display: flex; align-items: center; gap: 9px;
  padding: 10px 14px;
  background: var(--teal-light);
  border: 1.5px solid var(--teal);
  border-radius: var(--radius);
  font-size: var(--text-sm);
  color: var(--teal);
}
.gdrive-preview a { color: var(--teal); font-weight: 600; text-decoration: underline; word-break: break-all; }
.gdrive-preview .gdrive-remove {
  background: none; border: none; cursor: pointer;
  color: var(--teal); font-size: 1rem; padding: 2px 6px;
  border-radius: 4px; margin-left: auto; flex-shrink: 0;
  transition: all var(--transition);
}
.gdrive-preview .gdrive-remove:hover { background: rgba(26,127,110,0.15); }

/* ── Search History Dropdown ─────────────── */
.search-history-wrap { position: relative; flex: 1; min-width: 200px; }
.search-history-dropdown {
  position: absolute; top: calc(100% + 6px); left: 0; right: 0;
  background: var(--white); border: 1.5px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow-lg);
  z-index: 200; overflow: hidden;
  animation: fIn .15s ease;
}
.search-history-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 7px 12px 5px;
  font-size: 0.65rem; font-weight: 700; letter-spacing: 0.8px;
  text-transform: uppercase; color: var(--muted);
  border-bottom: 1px solid var(--border);
}
.search-history-clear {
  background: none; border: none; cursor: pointer;
  font-size: 0.7rem; color: var(--muted); padding: 0;
  font-family: var(--font-body);
  transition: color var(--transition);
}
.search-history-clear:hover { color: var(--red); }
.search-history-item {
  display: flex; align-items: center; gap: 9px;
  padding: 9px 12px;
  cursor: pointer; font-size: var(--text-sm);
  color: var(--ink-3); transition: background var(--transition);
  border: none; background: none; width: 100%; text-align: left;
  font-family: var(--font-body);
}
.search-history-item:hover { background: var(--surface); color: var(--ink); }
.search-history-item svg { opacity: 0.4; flex-shrink: 0; }
.shi-del {
  margin-left: auto; padding: 1px 5px; border-radius: 4px;
  font-size: 0.75rem; color: var(--muted); opacity: 0;
  transition: opacity var(--transition), background var(--transition);
  background: none; border: none; cursor: pointer; font-family: var(--font-body);
}
.search-history-item:hover .shi-del { opacity: 1; }
.shi-del:hover { background: var(--red-light) !important; color: var(--red) !important; }

/* ── QoL: keyboard shortcut badge ────────── */
.kbd-hint {
  font-size: 0.65rem; color: var(--muted);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 4px; padding: 1px 5px;
  font-family: var(--font-mono);
  display: inline-flex; align-items: center;
}

/* ── QoL: char counter ───────────────────── */
.char-counter {
  font-size: var(--text-xs); color: var(--muted);
  text-align: right; margin-top: 3px;
  transition: color var(--transition);
}
.char-counter.warn { color: #b7860b; }
.char-counter.over { color: var(--red); }

/* ── QoL: progress step indicator ─────────── */
.upload-steps {
  display: flex; gap: 0; margin-bottom: 20px;
  border-radius: var(--radius); overflow: hidden;
  border: 1px solid var(--border);
}
.upload-step {
  flex: 1; padding: 8px 4px; text-align: center;
  font-size: 0.68rem; font-weight: 600;
  color: var(--muted); background: var(--surface);
  border-right: 1px solid var(--border);
  transition: all var(--transition);
}
.upload-step:last-child { border-right: none; }
.upload-step.done { background: var(--green-light); color: var(--green); }
.upload-step.active { background: var(--gold-bg); color: var(--gold); }

/* ══════════════════════════════════════════
   RESET & BASE
══════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* Block all text selection and copy-paste site-wide */
html, body, * {
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
}

/* Allow selection ONLY in form inputs and the APA citation box */
input, textarea, .apa-box {
  -webkit-user-select: text;
  -moz-user-select: text;
  -ms-user-select: text;
  user-select: text;
}

html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

body {
  font-family: var(--font-body);
  background: var(--surface);
  color: var(--ink);
  min-height: 100vh;
  font-size: var(--text-base);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
  transition: background 0.25s ease, color 0.25s ease;
}

img { max-width: 100%; height: auto; }
button { font-family: var(--font-body); cursor: pointer; }
a { color: inherit; }

/* Prevent zoom on iOS input focus */
@media (max-width: 768px) {
  input, select, textarea {
    font-size: 16px !important;
  }
}

/* ══════════════════════════════════════════
   LAYOUT SHELL
══════════════════════════════════════════ */
.app-shell { display: flex; min-height: 100vh; }

.sidebar {
  width: var(--sidebar-w);
  min-height: 100vh;
  background: var(--sidebar-bg);
  color: var(--sidebar-text-strong);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0;
  left: 0;
  z-index: 150;
  transition: transform .3s cubic-bezier(0.4,0,0.2,1), background 0.25s ease;
  will-change: transform;
  border-right: 1px solid var(--sidebar-border);
  box-shadow: var(--shadow-lg);
}

.sidebar-logo {
  padding: clamp(16px,4vw,24px) clamp(16px,4vw,24px) 18px;
  border-bottom: 1px solid var(--sidebar-border);
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
}

.sidebar-logo h1 {
  font-family: var(--font-display);
  font-size: clamp(0.92rem,2.5vw,1.05rem);
  font-weight: 700;
  color: var(--sidebar-text-strong);
  line-height: 1.3;
}
.sidebar-logo h1 span { color: var(--gold); }
.sidebar-logo p { font-size: var(--text-xs); color: var(--sidebar-text-sub); margin-top: 4px; }

.sidebar-nav { flex: 1; padding: 16px 12px; overflow-y: auto; overscroll-behavior: contain; }

.nav-label {
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--sidebar-text-label);
  padding: 12px 12px 5px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 12px;
  min-height: var(--tap-min);
  border-radius: 8px;
  cursor: pointer;
  font-size: var(--text-sm);
  color: var(--sidebar-text);
  transition: all var(--transition);
  margin-bottom: 2px;
  border: none;
  background: none;
  width: 100%;
  text-align: left;
}
.nav-item:hover { background: var(--sidebar-item-hover-bg); color: var(--sidebar-item-hover-text); }
.nav-item.active { background: var(--sidebar-item-active-bg); color: var(--gold-light); font-weight: 500; }
.nav-item svg { width: 17px; flex-shrink: 0; opacity: 0.7; }
.nav-badge {
  margin-left: auto;
  background: var(--gold); color: var(--ink);
  font-size: 0.63rem; font-weight: 700;
  padding: 2px 7px; border-radius: 99px;
  min-width: 20px; text-align: center;
}

.sidebar-footer {
  padding: 14px;
  border-top: 1px solid var(--sidebar-border);
}
.user-chip {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px;
  border-radius: 8px;
}
.avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: linear-gradient(135deg,var(--gold),var(--teal));
  display: flex; align-items: center; justify-content: center;
  font-size: 0.78rem; font-weight: 700; color: #fff;
  flex-shrink: 0;
}
.user-info strong { display: block; font-size: var(--text-sm); color: var(--sidebar-text-strong); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
.user-info span { font-size: var(--text-xs); color: var(--sidebar-text-sub); text-transform: capitalize; }

.sidebar-close-btn {
  background: none; border: none;
  color: var(--sidebar-text-sub);
  cursor: pointer;
  padding: 6px;
  border-radius: 6px;
  min-width: var(--tap-min);
  min-height: var(--tap-min);
  display: flex; align-items: center; justify-content: center;
  transition: color var(--transition);
}
.sidebar-close-btn:hover { color: var(--sidebar-text-strong); }

.main-content {
  flex: 1;
  margin-left: var(--sidebar-w);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.topbar {
  background: var(--white);
  border-bottom: 1px solid var(--border);
  padding: 0 clamp(16px,4vw,28px);
  height: var(--topbar-h);
  display: flex;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 50;
  transition: background 0.25s ease, border-color 0.25s ease;
}
.topbar-title {
  font-family: var(--font-display);
  font-size: var(--text-lg);
  font-weight: 600;
  color: var(--ink);
  flex: 1;
}

.page {
  padding: clamp(14px,4vw,26px);
  flex: 1;
  max-width: 100%;
  overflow-x: hidden;
}

/* ══════════════════════════════════════════
   MOBILE HEADER & NAV
══════════════════════════════════════════ */
.mob-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 149;
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
}
.mob-overlay.show { display: block; animation: fIn .2s ease; }

.mob-header {
  display: none;
  position: fixed; top: 0; left: 0; right: 0;
  z-index: 99;
  background: var(--sidebar-bg);
  height: var(--mob-header-h);
  align-items: center;
  padding: 0 16px;
  padding-top: var(--safe-top);
  gap: 10px;
  border-bottom: 1px solid var(--sidebar-border);
}
.mob-header-title {
  font-family: var(--font-display);
  font-size: 1rem;
  color: var(--gold);
  flex: 1;
}
.mob-menu-btn {
  background: none; border: none;
  color: var(--sidebar-text);
  cursor: pointer;
  padding: 6px;
  border-radius: 8px;
  min-width: var(--tap-min);
  min-height: var(--tap-min);
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
}

.mob-nav {
  display: none;
  position: fixed; bottom: 0; left: 0; right: 0;
  z-index: 200;
  background: var(--sidebar-bg);
  border-top: 1px solid var(--sidebar-border);
  padding-bottom: var(--safe-bottom);
}
.mob-nav-inner {
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 6px 0;
}
.mob-nav-btn {
  display: flex; flex-direction: column;
  align-items: center; gap: 3px;
  padding: 8px;
  min-width: 56px;
  min-height: var(--tap-min);
  border: none; background: none;
  color: var(--sidebar-text);
  cursor: pointer; border-radius: 10px;
  transition: all .2s;
  font-family: var(--font-body);
  -webkit-tap-highlight-color: transparent;
}
.mob-nav-btn.active { color: var(--gold); }
.mob-nav-btn svg { width: 20px; height: 20px; }
.mob-nav-btn span { font-size: 0.6rem; font-weight: 500; white-space: nowrap; }

/* ══════════════════════════════════════════
   AUTH PAGE
══════════════════════════════════════════ */
/* auth styles moved to end of stylesheet */

/* ══════════════════════════════════════════
   FORMS
══════════════════════════════════════════ */
.fg { margin-bottom: 14px; }
.fr { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }

label {
  display: block;
  font-size: var(--text-xs);
  font-weight: 500;
  color: var(--ink-3);
  margin-bottom: 5px;
}

input, select, textarea {
  width: 100%;
  padding: clamp(10px,2.5vw,11px) clamp(12px,3vw,14px);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  font-family: var(--font-body);
  font-size: 0.9rem;
  color: var(--ink);
  background: var(--white);
  transition: border-color var(--transition), box-shadow var(--transition);
  outline: none;
  -webkit-appearance: none;
  appearance: none;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(201,162,39,0.1);
}
textarea { resize: vertical; min-height: 90px; }
.hint { font-size: var(--text-xs); color: var(--muted); margin-top: 3px; }

/* ══════════════════════════════════════════
   CATEGORY PICKER
══════════════════════════════════════════ */
.cat-picker { display: flex; flex-direction: column; gap: 7px; }
.cat-opt {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 13px;
  min-height: var(--tap-min);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  transition: all var(--transition);
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.cat-opt:hover, .cat-opt.sel { border-color: var(--gold); background: var(--gold-bg); }
.cat-opt.dis { opacity: 0.4; cursor: not-allowed; pointer-events: none; }
.cat-cb {
  width: 16px; height: 16px;
  border: 2px solid var(--border);
  border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: all var(--transition);
}
.cat-opt.sel .cat-cb { border-color: var(--gold); background: var(--gold); }

/* ══════════════════════════════════════════
   BUTTONS
══════════════════════════════════════════ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: clamp(10px,2.5vw,11px) clamp(14px,3.5vw,18px);
  min-height: var(--tap-min);
  border-radius: var(--radius);
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 500;
  cursor: pointer;
  transition: all var(--transition);
  border: none;
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
}
.btn-ink  { background:var(--ink);    color:#fff; }  .btn-ink:hover  { background:var(--ink-2); transform:translateY(-1px); }
.btn-gold { background:var(--gold);   color:var(--ink); font-weight:600; } .btn-gold:hover { background:#b8911f; transform:translateY(-1px); }
.btn-ol   { background:none; border:1.5px solid var(--border); color:var(--ink-3); } .btn-ol:hover { border-color:var(--ink-3); background:var(--surface); }
.btn-red  { background:var(--red);    color:#fff; } .btn-red:hover  { background:#a93226; }
.btn-grn  { background:var(--green);  color:#fff; } .btn-grn:hover  { background:#156b3c; }
.btn-pur  { background:var(--purple); color:#fff; } .btn-pur:hover  { background:#5c2d99; }
.btn-teal { background:var(--teal);   color:#fff; } .btn-teal:hover { background:#156b5c; }
.btn-sm   { padding: 7px 13px; font-size: var(--text-xs); min-height: 36px; }
.btn-full { width: 100%; }
.btn:disabled { opacity: 0.48; cursor: not-allowed; transform: none !important; }
.btn:active:not(:disabled) { transform: scale(0.97) !important; }

/* ══════════════════════════════════════════
   CARDS
══════════════════════════════════════════ */
.card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: clamp(16px,4vw,22px);
  box-shadow: var(--shadow);
}
.card-hd {
  display: flex; align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
  flex-wrap: wrap; gap: 9px;
}
.card-title { font-family:var(--font-display); font-size:var(--text-base); font-weight:600; color:var(--ink); }

/* ══════════════════════════════════════════
   SKELETON LOADERS
══════════════════════════════════════════ */
@keyframes shimmer {
  0%   { background-position: -600px 0; }
  100% { background-position:  600px 0; }
}

.skel {
  background: linear-gradient(90deg,
    var(--border) 25%,
    var(--surface) 50%,
    var(--border) 75%);
  background-size: 600px 100%;
  animation: shimmer 1.6s ease-in-out infinite;
  border-radius: 6px;
}

[data-theme="dark"] .skel {
  background: linear-gradient(90deg,
    rgba(255,255,255,0.06) 25%,
    rgba(255,255,255,0.12) 50%,
    rgba(255,255,255,0.06) 75%);
  background-size: 600px 100%;
  animation: shimmer 1.6s ease-in-out infinite;
}

/* Study card skeleton */
.sc-skel {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: clamp(14px,3.5vw,20px);
  display: flex; flex-direction: column; gap: 10px;
  box-shadow: var(--shadow);
  overflow: hidden;
  position: relative;
}
.sc-skel::before {
  content: '';
  position: absolute; top:0; left:0; right:0; height:3px;
  background: var(--border);
}
.skel-cat   { height:20px; width:90px; border-radius:99px; }
.skel-title { height:16px; border-radius:5px; }
.skel-title.w80 { width:80%; }
.skel-title.w60 { width:60%; }
.skel-author { height:13px; width:55%; border-radius:5px; }
.skel-abs-line { height:12px; border-radius:5px; }
.skel-abs-line.w100 { width:100%; }
.skel-abs-line.w90  { width:90%; }
.skel-abs-line.w70  { width:70%; }
.skel-meta  { display:flex; gap:10px; align-items:center; margin-top:4px; }
.skel-meta-item { height:13px; width:36px; border-radius:5px; }
.skel-meta-item.wide { width:64px; }

/* Stat card skeleton */
.stat-skel {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: clamp(14px,3vw,18px);
  display: flex; flex-direction: column; gap: 8px;
  border-left: 4px solid var(--border);
}
.skel-stat-lbl  { height:11px; width:70%; border-radius:5px; }
.skel-stat-val  { height:32px; width:50%; border-radius:6px; }
.skel-stat-sub  { height:10px; width:80%; border-radius:5px; }

/* Page header skeleton */
.skel-page-hd {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:18px; flex-wrap:wrap; gap:10px;
}
.skel-page-title { height:22px; width:200px; border-radius:6px; }
.skel-page-sub   { height:13px; width:140px; border-radius:5px; margin-top:6px; }
.skel-btn        { height:38px; width:130px; border-radius:var(--radius); }


.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(160px, 100%), 1fr));
  gap: 14px;
  margin-bottom: 24px;
}
.stat {
  background: var(--white); border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: clamp(14px,3vw,18px);
  display: flex; flex-direction: column; gap: 6px;
}
.stat.gold  { border-left: 4px solid var(--gold); }
.stat.teal  { border-left: 4px solid var(--teal); }
.stat.blue  { border-left: 4px solid var(--blue); }
.stat.red   { border-left: 4px solid var(--red);  }
.stat.pur   { border-left: 4px solid var(--purple); }
.stat.slate { border-left: 4px solid var(--slate); }
.stat-lbl { font-size: var(--text-xs); font-weight:500; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; }
.stat-val { font-family:var(--font-display); font-size:clamp(1.5rem,4vw,1.9rem); font-weight:700; color:var(--ink); line-height:1; }
.stat-sub { font-size:var(--text-xs); color:var(--muted); }

/* ══════════════════════════════════════════
   STUDY CARDS
══════════════════════════════════════════ */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(290px, 100%), 1fr));
  gap: 18px;
}
.sc {
  background: var(--white); border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: clamp(14px,3.5vw,20px);
  display: flex; flex-direction: column; gap: 10px;
  box-shadow: var(--shadow);
  transition: all var(--transition);
  cursor: pointer; position: relative; overflow: hidden;
}
.sc::before {
  content: '';
  position: absolute; top:0; left:0; right:0; height:3px;
  background: linear-gradient(90deg,var(--gold),var(--teal));
  transform: scaleX(0); transform-origin: left;
  transition: transform var(--transition);
}
.sc:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); border-color: rgba(201,162,39,0.3); }
.sc:hover::before { transform: scaleX(1); }
.sc:active { transform: scale(0.98); }
.sc-cats { display:flex; flex-wrap:wrap; gap:4px; }
.sc-cat { font-size:var(--text-xs); font-weight:600; padding:2px 7px; border-radius:4px; background:var(--gold-bg); color:var(--gold); }
.sc-title { font-family:var(--font-display); font-size:clamp(0.88rem,2.5vw,0.97rem); font-weight:600; color:var(--ink); line-height:1.4; }
.sc-authors { font-size:var(--text-xs); color:var(--muted); }
.sc-abs { font-size:var(--text-sm); color:var(--slate); line-height:1.5; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; transition:all .25s ease; }
.sc-abs.expanded { display:block; -webkit-line-clamp:unset; overflow:visible; }
.sc-abs-toggle { background:none; border:none; cursor:pointer; font-size:var(--text-xs); color:var(--teal); font-family:var(--font-body); font-weight:600; padding:2px 0; margin-top:3px; display:inline-flex; align-items:center; gap:3px; transition:color var(--transition); }
.sc-abs-toggle:hover { color:var(--gold); }
.sc-meta { display:flex; align-items:center; gap:10px; font-size:var(--text-xs); color:var(--muted); flex-wrap:wrap; margin-top:auto; }
.sc-meta span { display:flex; align-items:center; gap:3px; }

/* ══════════════════════════════════════════
   TABLE
══════════════════════════════════════════ */
.tw { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: var(--radius); }
table { width: 100%; border-collapse: collapse; min-width: 500px; }
th {
  font-size: var(--text-xs); font-weight: 600; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.5px;
  padding: 9px 13px; text-align: left;
  border-bottom: 1.5px solid var(--border); white-space: nowrap;
}
td { padding: 12px 13px; border-bottom: 1px solid var(--border); font-size: var(--text-sm); color: var(--ink-3); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--surface); }

/* ══════════════════════════════════════════
   BADGES
══════════════════════════════════════════ */
.badge { display:inline-flex; align-items:center; gap:3px; padding:3px 9px; border-radius:99px; font-size:var(--text-xs); font-weight:600; }
.badge-pend { background:#fff8e6; color:#b7860b; }
.badge-appr { background:var(--green-light); color:var(--green); }
.badge-rej  { background:var(--red-light);   color:var(--red); }
.badge-teacher{ background:var(--blue-light);  color:var(--blue); }

/* ══════════════════════════════════════════
   SEARCH / FILTER
══════════════════════════════════════════ */
.sb {
  display: flex; align-items: center; gap: 9px;
  background: var(--white);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 0 13px;
  min-height: var(--tap-min);
  transition: border-color var(--transition);
}
.sb:focus-within { border-color:var(--gold); box-shadow:0 0 0 3px rgba(201,162,39,0.1); }
.sb input { border:none; background:none; padding:9px 0; flex:1; outline:none; font-size:var(--text-sm); }
.fb { display:flex; align-items:center; gap:9px; flex-wrap:wrap; }

/* ══════════════════════════════════════════
   DRAFT BANNER
══════════════════════════════════════════ */
.draft-banner {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  background: var(--gold-bg);
  border: 1.5px solid var(--gold);
  border-radius: var(--radius);
  margin-bottom: 16px;
  font-size: var(--text-sm);
  color: var(--gold);
  animation: draftIn .3s var(--spring);
}
@keyframes draftIn { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }
.draft-banner-icon { font-size: 1.05rem; flex-shrink: 0; }
.draft-banner-text { flex: 1; }
.draft-banner-text strong { color: var(--gold); font-weight: 700; }
.draft-banner-text span { display: block; font-size: var(--text-xs); color: var(--muted); margin-top: 2px; }
.draft-status {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: var(--text-xs); color: var(--muted);
  padding: 3px 8px; border-radius: 99px;
  border: 1px solid var(--border);
  background: var(--surface);
  transition: all .25s;
}
.draft-status.saving { color: var(--gold); border-color: var(--gold); }
.draft-status.saved  { color: var(--green); border-color: var(--green); }

/* ══════════════════════════════════════════
   UPLOAD ZONE
══════════════════════════════════════════ */
.uz {
  border: 2px dashed var(--border);
  border-radius: var(--radius);
  padding: clamp(20px,5vw,28px);
  text-align: center;
  cursor: pointer;
  transition: all var(--transition);
  -webkit-tap-highlight-color: transparent;
}
.uz:hover, .uz.drag { border-color:var(--gold); background:var(--gold-bg); }
.uz.has { border-color:var(--green); background:var(--green-light); }
.uz p { color:var(--muted); font-size:var(--text-sm); }
.uz strong { color:var(--ink); display:block; margin-bottom:3px; }
.uz input[type=file] { display:none; }

/* ══════════════════════════════════════════
   MODAL — mobile bottom sheet
══════════════════════════════════════════ */
.overlay {
  position: fixed; inset: 0;
  background: rgba(13,15,20,0.6);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
  animation: fIn .2s ease;
  overscroll-behavior: contain;
}
.modal {
  background: var(--white);
  border-radius: var(--radius-lg);
  width: 100%; max-width: 620px;
  max-height: 90vh;
  overflow-y: auto;
  overscroll-behavior: contain;
  box-shadow: var(--shadow-xl);
  animation: sUp var(--spring);
}
.modal-hd {
  padding: 22px 24px 0;
  display: flex; align-items: flex-start; justify-content: space-between; gap: 11px;
  position: sticky; top: 0;
  background: var(--white); z-index: 1;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--border);
}
.modal-bd { padding: 20px 24px 28px; }
.modal-title { font-family:var(--font-display); font-size:var(--text-xl); font-weight:600; color:var(--ink); }
.modal-x {
  background: none; border: none;
  cursor: pointer; color: var(--muted);
  padding: 6px; border-radius: 6px;
  min-width: 36px; min-height: 36px;
  display: flex; align-items: center; justify-content: center;
  transition: all var(--transition);
  flex-shrink: 0;
}
.modal-x:hover { background:var(--surface); color:var(--ink); }

/* ══════════════════════════════════════════
   TOASTS
══════════════════════════════════════════ */
.toasts {
  position: fixed;
  bottom: max(22px, calc(var(--mob-nav-h) + 12px + var(--safe-bottom)));
  right: 22px; left: auto;
  z-index: 9999;
  display: flex; flex-direction: column; gap: 7px;
  pointer-events: none;
  max-width: min(360px, calc(100vw - 44px));
}
.toast {
  background: var(--ink); color: #fff;
  padding: 12px 15px;
  border-radius: var(--radius);
  font-size: var(--text-sm);
  display: flex; align-items: center; gap: 9px;
  min-width: 240px;
  box-shadow: var(--shadow-lg);
  animation: sRight .3s ease;
  pointer-events: all;
  word-break: break-word;
}
.toast.ok  { background:var(--green); }
.toast.err { background:var(--red);   }
.toast.info{ background:var(--blue);  }

/* ══════════════════════════════════════════
   EMPTY STATE
══════════════════════════════════════════ */
.empty { text-align:center; padding:clamp(36px,8vw,52px) 20px; color:var(--muted); }
.empty-ico { font-size:2.8rem; margin-bottom:10px; opacity:0.45; }
.empty h3 { font-family:var(--font-display); font-size:var(--text-lg); color:var(--slate); margin-bottom:5px; }

/* ══════════════════════════════════════════
   SPINNERS
══════════════════════════════════════════ */
.spin {
  width:19px; height:19px;
  border: 2px solid rgba(255,255,255,0.28);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spinning .7s linear infinite;
  flex-shrink: 0;
  display: inline-block;
}
.spin-dark { border-color:rgba(13,15,20,0.15)!important; border-top-color:var(--ink)!important; }
.spin-gold { border-color:rgba(201,162,39,0.25)!important; border-top-color:var(--gold)!important; }

/* ══════════════════════════════════════════
   PAGINATION
══════════════════════════════════════════ */
.pages { display:flex; align-items:center; gap:5px; margin-top:24px; justify-content:center; flex-wrap:wrap; }
.pg {
  width:36px; height:36px;
  border-radius:8px;
  border: 1.5px solid var(--border);
  background: var(--white); color: var(--ink);
  cursor: pointer; font-size: var(--text-sm);
  display: flex; align-items: center; justify-content: center;
  transition: all var(--transition);
  min-width: 36px;
}
.pg:hover { border-color:var(--gold); background:var(--gold-bg); }
.pg.active { background:var(--ink); color:#fff; border-color:var(--ink); }
.pg:disabled { opacity:0.38; cursor:not-allowed; }

/* ══════════════════════════════════════════
   ALERTS
══════════════════════════════════════════ */
.al {
  display:flex; align-items:flex-start; gap:9px;
  padding: 11px 14px;
  border-radius: var(--radius);
  font-size: var(--text-sm);
  margin-bottom: 14px;
  line-height: 1.5;
}
.al-info{ background:var(--blue-light); color:var(--blue); }
.al-ok  { background:var(--green-light); color:var(--green); }
.al-err { background:var(--red-light); color:var(--red); }
.al-warn{ background:#fff8e6; color:#b7860b; }

/* ══════════════════════════════════════════
   STUDY DETAIL
══════════════════════════════════════════ */
.sd-title { font-family:var(--font-display); font-size:clamp(1.15rem,4vw,1.5rem); font-weight:700; color:var(--ink); line-height:1.3; margin-bottom:10px; }
.sd-auth  { font-size:var(--text-base); color:var(--slate); margin-bottom:14px; }
.kw { display:inline-block; padding:2px 9px; background:var(--surface); border:1px solid var(--border); border-radius:99px; font-size:var(--text-xs); color:var(--slate); margin:2px; }

/* ── Co-author tag input ────────────────── */
.author-field {
  display:flex; flex-wrap:wrap; align-items:center; gap:6px;
  border:1.5px solid var(--border); border-radius:var(--radius);
  padding:7px 10px; background:var(--white); cursor:text;
  transition:border-color var(--transition), box-shadow var(--transition);
  min-height:var(--tap-min);
}
.author-field:focus-within { border-color:var(--teal); box-shadow:0 0 0 3px rgba(26,127,110,0.12); }
.author-tag {
  display:inline-flex; align-items:center; gap:5px;
  padding:3px 10px 3px 8px; border-radius:99px;
  font-size:var(--text-xs); font-weight:600; line-height:1.4;
  background:var(--teal-light); color:var(--teal);
  border:1px solid rgba(26,127,110,0.3);
  white-space:nowrap; max-width:220px;
  animation:tagIn .18s var(--spring);
}
.author-tag.registered { background:var(--blue-light); color:var(--blue); border-color:rgba(26,95,168,0.25); }
.author-tag.self { background:var(--gold-bg); color:var(--gold); border-color:rgba(201,162,39,0.3); }
@keyframes tagIn { from{opacity:0;transform:scale(.8)} to{opacity:1;transform:scale(1)} }
.author-tag-avatar {
  width:16px; height:16px; border-radius:50%; background:currentColor; opacity:0.2;
  display:flex; align-items:center; justify-content:center; font-size:0.55rem; font-weight:900;
  flex-shrink:0; position:relative;
}
.author-tag-avatar span { position:absolute; color:var(--teal); opacity:5; font-weight:700; }
.author-tag.registered .author-tag-avatar span { color:var(--blue); }
.author-tag.self .author-tag-avatar span { color:var(--gold); }
.author-tag-remove {
  background:none; border:none; cursor:pointer; padding:0; line-height:1;
  color:currentColor; opacity:0.55; font-size:0.75rem; display:flex; align-items:center;
  transition:opacity .15s;
}
.author-tag-remove:hover { opacity:1; }
.author-tag-input {
  border:none; outline:none; background:transparent; font-family:var(--font-body);
  font-size:var(--text-sm); color:var(--ink); min-width:140px; flex:1; padding:2px 0;
}
.author-dropdown {
  position:absolute; left:0; right:0; top:calc(100% + 4px);
  background:var(--white); border:1.5px solid var(--border);
  border-radius:var(--radius); box-shadow:var(--shadow-lg);
  z-index:300; max-height:220px; overflow-y:auto;
  animation:sUp .15s var(--spring);
}
.author-dropdown-item {
  display:flex; align-items:center; gap:10px;
  padding:9px 12px; cursor:pointer; transition:background .12s;
  font-size:var(--text-sm);
}
.author-dropdown-item:hover, .author-dropdown-item.active { background:var(--surface); }
.author-dropdown-item.no-match { color:var(--muted); cursor:default; font-style:italic; }
.author-dropdown-avatar {
  width:28px; height:28px; border-radius:50%; flex-shrink:0;
  background:linear-gradient(135deg,var(--teal),var(--blue));
  color:#fff; display:flex; align-items:center; justify-content:center;
  font-size:0.65rem; font-weight:700;
}
.author-dropdown-info { flex:1; min-width:0; }
.author-dropdown-name { font-weight:600; color:var(--ink); }
.author-dropdown-sub { font-size:var(--text-xs); color:var(--muted); }
.author-dropdown-badge { font-size:0.62rem; padding:1px 6px; border-radius:99px; background:var(--blue-light); color:var(--blue); font-weight:600; flex-shrink:0; }
.ds h4 { font-size:var(--text-xs); font-weight:600; text-transform:uppercase; letter-spacing:0.8px; color:var(--muted); margin-bottom:7px; }
.ds p  { color:var(--ink-3); font-size:var(--text-sm); line-height:1.7; }
.apa-box {
  background:var(--surface);
  border-left: 3px solid var(--gold);
  padding: 11px 14px;
  border-radius: 0 var(--radius) var(--radius) 0;
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  color: var(--ink-3);
  line-height: 1.6;
  word-break: break-word;
  position: relative;
  padding-right: 70px;
}
.apa-cp {
  position:absolute; top:7px; right:7px;
  background:var(--gold); border:none; border-radius:5px;
  padding:3px 9px; font-size:var(--text-xs);
  cursor:pointer; color:var(--ink); font-weight:600;
  transition:all var(--transition);
  min-height:28px;
}
.apa-cp:hover { background:#b8911f; }

/* ══════════════════════════════════════════
   CATEGORY MANAGER
══════════════════════════════════════════ */
.cm-item {
  display:flex; align-items:center; gap:9px;
  padding:9px 13px; min-height:var(--tap-min);
  border:1px solid var(--border);
  border-radius:var(--radius);
  margin-bottom:7px;
  background:var(--white);
  flex-wrap:wrap;
}
.cm-name { flex:1; font-size:var(--text-sm); font-weight:500; color:var(--ink-3); min-width:0; }
.cm-in { border:none; background:none; font-size:var(--text-sm); color:var(--ink); flex:1; outline:none; padding:0; min-width:100px; }

/* ══════════════════════════════════════════
   CHAT — UPGRADED
══════════════════════════════════════════ */
.chat-layout {
  display: flex;
  height: calc(100vh - var(--topbar-h) - clamp(14px,4vw,26px) * 2 - 80px);
  min-height: 480px;
  gap: 16px;
}
.chat-main { flex:1; display:flex; flex-direction:column; min-width:0; }
.chat-sidebar { width:280px; flex-shrink:0; display:flex; flex-direction:column; gap:12px; overflow-y:auto; }

.chat-msgs {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding: clamp(10px,2.5vw,16px);
  display: flex; flex-direction: column; gap: 14px;
  background: var(--surface);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  border: 1px solid var(--border);
  border-bottom: none;
  scroll-behavior: smooth;
}

/* Message */
.cm { display:flex; gap:10px; align-items:flex-start; animation:msgIn .3s ease; }
.cm.user { flex-direction:row-reverse; }
.cm-av {
  width:34px; height:34px;
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:0.8rem; font-weight:700;
  flex-shrink:0;
  box-shadow:var(--shadow);
}
.cm-av.bot  { background:linear-gradient(135deg,var(--purple),var(--blue)); color:#fff; }
.cm-av.user { background:linear-gradient(135deg,var(--gold),var(--teal)); color:#fff; }

.cm-body { display:flex; flex-direction:column; gap:4px; max-width:80%; }
.cm.user .cm-body { align-items:flex-end; }

.cm-bub {
  padding: clamp(9px,2vw,11px) clamp(12px,3vw,15px);
  border-radius: var(--radius-lg);
  font-size: var(--text-sm);
  line-height: 1.65;
  word-break: break-word;
  overflow-wrap: break-word;
}
.cm-bub.bot {
  background:var(--white);
  border:1px solid var(--border);
  color:var(--ink-3);
  border-radius: 4px var(--radius-lg) var(--radius-lg) var(--radius-lg);
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}
.cm-bub.user {
  background: var(--gold);
  color: #1a1400;
  border-radius: var(--radius-lg) 4px var(--radius-lg) var(--radius-lg);
}
[data-theme="dark"] .cm-bub.user {
  background: var(--gold);
  color: #1a1400;
}

.cm-meta { font-size:var(--text-xs); color:var(--muted); display:flex; align-items:center; gap:5px; flex-wrap:wrap; }
.cm-src  { font-size:var(--text-xs); padding:1px 6px; border-radius:4px; font-weight:500; }
.cm-src.claude { background:var(--purple-light); color:var(--purple); }
.cm-src.gemini { background:var(--blue-light); color:var(--blue); }
.cm-src.groq { background:var(--green-light); color:var(--green); }
.cm-src.local  { background:var(--surface); color:var(--muted); border:1px solid var(--border); }

/* Typing dots */
.typing { display:flex; gap:5px; padding:4px 2px; align-items:center; }
.dot { width:7px; height:7px; background:var(--muted); border-radius:50%; animation:pulse 1.4s infinite; }
.dot:nth-child(2){ animation-delay:.2s; } .dot:nth-child(3){ animation-delay:.4s; }

/* Chat input area */
.chat-input-area {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 0 0 var(--radius-lg) var(--radius-lg);
  padding: clamp(10px,2.5vw,13px) clamp(11px,3vw,14px);
  padding-bottom: max(clamp(10px,2.5vw,13px), var(--safe-bottom));
}
.chat-input-row { display:flex; gap:9px; align-items:flex-end; }
.chat-in {
  flex: 1;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: clamp(9px,2.5vw,11px) 13px;
  font-family: var(--font-body);
  font-size: 0.9rem;
  outline: none; resize: none;
  max-height: 130px;
  min-height: 44px;
  transition: border-color var(--transition), box-shadow var(--transition);
  background: var(--surface);
  line-height: 1.5;
  overflow-y: auto;
}
.chat-in:focus {
  border-color: var(--purple);
  background: var(--white);
  box-shadow: 0 0 0 3px rgba(109,63,168,0.1);
}

.chat-send-btn {
  flex-shrink: 0;
  background: var(--purple); color: #fff;
  border: none; border-radius: var(--radius);
  width: var(--tap-min); height: var(--tap-min);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all var(--transition);
}
.chat-send-btn:hover:not(:disabled) { background: #5c2d99; }
.chat-send-btn:disabled { opacity:0.48; cursor:not-allowed; }

.chat-actions {
  display:flex; gap:6px; margin-top:8px;
  flex-wrap:wrap; align-items:center;
}
.chat-action-btn {
  font-size: var(--text-xs);
  padding: 6px 10px;
  min-height: 32px;
  border-radius:99px;
  border:1.5px solid var(--border);
  background:var(--surface);
  color:var(--ink-3);
  cursor:pointer;
  transition:all var(--transition);
  display:flex; align-items:center; gap:4px;
  white-space:nowrap;
  -webkit-tap-highlight-color:transparent;
}
.chat-action-btn:hover,.chat-action-btn.active {
  border-color:var(--purple); background:var(--purple-light); color:var(--purple);
}

/* Research gap indicator */
.gap-alert {
  background: linear-gradient(135deg, #fff8e6, #fdf3d0);
  border: 1px solid rgba(201,162,39,0.3);
  border-radius: var(--radius);
  padding: 10px 14px;
  margin-top: 10px;
  font-size: var(--text-xs);
  color: #8a6a00;
  display: flex; align-items: flex-start; gap: 7px;
}
.gap-alert strong { color: #6a4f00; }

/* Chat refs */
.chat-refs { margin-top:10px; padding-top:10px; border-top:1px dashed var(--border); }
.chat-ref-lbl { font-size:var(--text-xs); font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:5px; display:flex; align-items:center; gap:4px; }
.chat-ref {
  font-family:var(--font-mono); font-size:var(--text-xs); color:var(--slate);
  padding:5px 9px; background:var(--surface);
  border-radius:5px; margin-bottom:3px;
  border-left:2px solid var(--gold);
  line-height:1.5; cursor:pointer;
  transition:background var(--transition);
  display:flex; align-items:flex-start; gap:6px;
}
.chat-ref:hover { background:var(--gold-bg); }

/* Chat sidebar panels */
.chat-panel { background:var(--white); border:1px solid var(--border); border-radius:var(--radius-lg); overflow:hidden; }
.chat-panel-hd {
  padding:12px 14px;
  border-bottom:1px solid var(--border);
  font-size:var(--text-xs); font-weight:600; color:var(--ink);
  display:flex; align-items:center; gap:6px;
  background:var(--surface);
}
.chat-panel-body { padding:12px 14px; max-height:280px; overflow-y:auto; overscroll-behavior:contain; }
.sugg-chip {
  display:block; width:100%;
  text-align:left; font-size:var(--text-xs);
  padding:8px 10px; min-height:34px;
  border-radius:7px; border:none; background:none;
  color:var(--ink-3); cursor:pointer;
  transition:all var(--transition);
  margin-bottom:3px; line-height:1.4;
  -webkit-tap-highlight-color:transparent;
}
.sugg-chip:hover { background:var(--purple-light); color:var(--purple); }

.chat-stat-row {
  display:flex; justify-content:space-between; align-items:center;
  padding:6px 0;
  border-bottom:1px solid var(--border);
  font-size:var(--text-xs);
}
.chat-stat-row:last-child { border-bottom:none; }
.chat-stat-val { font-weight:600; color:var(--ink); }

/* Mode pills */
.mode-pills {
  display:flex; gap:5px; flex-wrap:wrap;
  padding:8px clamp(10px,2.5vw,14px);
  background:var(--surface);
  border-left:1px solid var(--border);
  border-right:1px solid var(--border);
}
.mode-pill {
  font-size:var(--text-xs);
  padding:5px 11px; min-height:32px;
  border-radius:99px; border:1.5px solid var(--border);
  background:var(--white); color:var(--muted);
  cursor:pointer; transition:all var(--transition);
  font-weight:500; white-space:nowrap;
  -webkit-tap-highlight-color:transparent;
}
.mode-pill.on { border-color:var(--purple); background:var(--purple-light); color:var(--purple); font-weight:600; }
.mode-pill:active { transform:scale(0.96); }

/* Export/actions */
.chat-export-btn {
  font-size:var(--text-xs); padding:5px 11px; min-height:32px;
  border-radius:99px; border:1.5px solid var(--border);
  background:var(--surface); color:var(--ink-3);
  cursor:pointer; transition:all var(--transition);
  display:flex; align-items:center; gap:4px;
  -webkit-tap-highlight-color:transparent;
}
.chat-export-btn:hover { border-color:var(--teal); background:var(--teal-light); color:var(--teal); }

.saved-cite { font-size:var(--text-xs); padding:1px 6px; border-radius:4px; background:var(--green-light); color:var(--green); font-weight:600; margin-left:4px; }

/* ══════════════════════════════════════════
   MARKDOWN RENDERER
══════════════════════════════════════════ */
.md strong { font-weight:600; color:var(--ink); }
.md em { font-style:italic; color:var(--slate); }
.md code { font-family:var(--font-mono); background:var(--surface); padding:1px 5px; border-radius:4px; font-size:0.85em; border:1px solid var(--border); }
.md h3 { font-family:var(--font-display); font-size:var(--text-base); font-weight:600; color:var(--ink); margin:8px 0 4px; }
.md-bullet { display:flex; gap:7px; padding-left:2px; margin:2px 0; }
.md-bullet-dot { color:var(--gold); flex-shrink:0; font-weight:700; }
.md-num { display:flex; gap:7px; padding-left:2px; margin:2px 0; }
.md-num-n { color:var(--purple); flex-shrink:0; font-weight:700; min-width:18px; }

/* ══════════════════════════════════════════
   MISC UTILITIES
══════════════════════════════════════════ */
.divider { height:1px; background:var(--border); margin:14px 0; }
.sec-title { font-family:var(--font-display); font-size:var(--text-xl); font-weight:600; color:var(--ink); margin-bottom:14px; }
.muted { color:var(--muted); font-size:var(--text-sm); }
.mt12{margin-top:12px} .mb12{margin-bottom:12px} .mt16{margin-top:16px}
.page-hd { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:12px; }
.page-hd-left h2 { font-family:var(--font-display); font-size:var(--text-2xl); font-weight:600; margin-bottom:2px; }

/* ══════════════════════════════════════════
   ANIMATIONS
══════════════════════════════════════════ */
@keyframes fIn    { from{opacity:0} to{opacity:1} }
@keyframes sUp    { from{opacity:0;transform:translateY(20px) scale(0.97)} to{opacity:1;transform:none} }
@keyframes sRight { from{opacity:0;transform:translateX(20px)} to{opacity:1;transform:none} }
@keyframes spinning { to{transform:rotate(360deg)} }
@keyframes pulse  { 0%,80%,100%{transform:scale(1);opacity:.4} 40%{transform:scale(1.3);opacity:1} }
@keyframes msgIn  { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
@keyframes slideUp{ from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }

/* ══════════════════════════════════════════
   SCROLL TO TOP
══════════════════════════════════════════ */
.scroll-top {
  position:fixed; bottom:calc(var(--mob-nav-h) + 14px + var(--safe-bottom)); right:16px;
  width:44px; height:44px;
  border-radius:50%;
  background:var(--ink); color:#fff;
  border:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  box-shadow:var(--shadow-lg); z-index:50;
  transition:all .2s;
  opacity:0; pointer-events:none;
}
.scroll-top.show { opacity:1; pointer-events:all; }

/* ══════════════════════════════════════════
   RESPONSIVE: TABLET
══════════════════════════════════════════ */
@media (max-width:900px) {
  .chat-layout { flex-direction:column; }
  .chat-sidebar { width:100%; flex-direction:row; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .chat-panel { min-width:220px; flex-shrink:0; }
}

/* ══════════════════════════════════════════
   RESPONSIVE: MOBILE
══════════════════════════════════════════ */
@media (max-width:768px) {
  /* Sidebar */
  .sidebar {
    transform: translateX(-100%);
    transition: transform .3s cubic-bezier(0.4,0,0.2,1);
    z-index:150;
    width: min(var(--sidebar-w), 90vw);
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar-close-btn { display:flex !important; }
  .sidebar { padding-bottom: calc(var(--mob-nav-h) + var(--safe-bottom)); box-sizing: border-box; }

  /* Layout */
  .main-content { margin-left: 0; }
  .topbar { display:none; }
  .mob-nav { display:block; }
  .mob-header { display:flex; }

  /* Page padding: header + bottom nav + safe areas */
  .page {
    padding: clamp(12px,3vw,18px);
    padding-top: calc(var(--mob-header-h) + var(--safe-top) + 14px);
    padding-bottom: calc(var(--mob-nav-h) + var(--safe-bottom) + 14px);
    overflow-x: hidden;
  }

  /* Grids */
  .grid { grid-template-columns: 1fr; }
  .fr   { grid-template-columns: 1fr; }
  .stats{ grid-template-columns: repeat(2,1fr); }

  /* Chat mobile */
  .chat-sidebar { display:none; }
  .chat-layout {
    height: calc(100dvh - var(--mob-header-h) - var(--mob-nav-h) - var(--safe-top) - var(--safe-bottom) - clamp(12px,3vw,18px) * 2 - 70px);
    min-height: 340px;
    gap: 0;
  }
  .chat-msgs { padding: 10px 12px; }
  .cm-body { max-width: 86%; }
  .cm-bub  { font-size: var(--text-sm); }
  .mode-pills {
    overflow-x: auto;
    flex-wrap: nowrap;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding: 8px 12px;
    gap: 6px;
  }
  .mode-pills::-webkit-scrollbar { display:none; }
  .mode-pill { flex-shrink:0; }
  .chat-actions {
    overflow-x: auto; flex-wrap: nowrap;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding-bottom: 2px;
  }
  .chat-actions::-webkit-scrollbar { display:none; }
  .chat-action-btn { flex-shrink:0; }

  /* Modal → bottom sheet */
  .modal {
    max-height: 96vh;
    border-radius: var(--radius-xl) var(--radius-xl) 0 0;
    position: fixed; bottom:0; left:0; right:0;
    width: 100%; max-width: 100%;
    animation: slideUp var(--spring);
    padding-bottom: var(--safe-bottom);
  }
  .overlay { align-items:flex-end; padding:0; }

  /* Misc */
  .page-hd { flex-direction:column; gap:8px; }
  .auth-inner { padding:16px; }
  .auth-card { padding:20px 18px; }
  .stats { grid-template-columns: repeat(2,1fr); }

  /* Toast */
  .toasts { right:12px; left:12px; max-width:100%; bottom:calc(var(--mob-nav-h) + 10px + var(--safe-bottom)); }

  /* Sticky search bar on mobile */
  .mob-search-sticky {
    position: sticky;
    top: calc(var(--mob-header-h) + var(--safe-top));
    z-index: 90;
    background: var(--bg);
    padding: 8px 0 10px;
    margin: -6px 0 10px;
    border-bottom: 1px solid var(--border);
  }
  .mob-search-sticky .sb { width: 100%; }
  .mob-search-hidden { display: none; }
}

/* Desktop: hide sticky, show normal */
@media (min-width: 769px) {
  .mob-search-sticky { display: none; }
  .mob-search-hidden { display: flex !important; }
}

@media (max-width:400px) {
  .stats { grid-template-columns: 1fr; }
  .fr    { grid-template-columns: 1fr; }
}

/* Reduce motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration:.01ms!important; transition-duration:.01ms!important; }
}

/* High contrast */
@media (prefers-contrast: high) {
  .nav-item.active { background:rgba(201,162,39,0.3); }
}

/* ══════════════════════════════════════════
   LOADING SCREEN (SABNAHIS branded)
══════════════════════════════════════════ */
#sabnahis-loader {
  position: fixed; inset: 0; z-index: 9999;
  background: #0d0f14;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  transition: opacity 0.6s ease, visibility 0.6s ease;
}
#sabnahis-loader.fade-out { opacity: 0; visibility: hidden; pointer-events: none; }

.loader-grid-overlay {
  position: absolute; inset: 0; pointer-events: none;
  background-image:
    linear-gradient(to right, rgba(45,55,72,0.1) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(45,55,72,0.1) 1px, transparent 1px);
  background-size: 48px 48px;
}
.loader-corner {
  position: absolute; z-index: 1;
  opacity: 0.3;
}
.loader-corner--tl { top: 24px; left: 24px; }
.loader-corner--tr { top: 24px; right: 24px; text-align: right; }
.loader-corner--bl { bottom: 24px; left: 24px; }
.loader-corner--br { bottom: 24px; right: 24px; text-align: right; }
.loader-corner-h { width: 48px; height: 1px; background: #4d4635; display: block; }
.loader-corner-v { width: 1px; height: 48px; background: #4d4635; display: block; }

.loader-body { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 32px; }

.loader-icon-wrap {
  position: relative;
}
.loader-icon-glow {
  position: absolute; inset: -16px;
  background: rgba(201,162,39,0.08);
  border-radius: 50%;
  filter: blur(24px);
  animation: loaderGlowPulse 3s ease-in-out infinite;
}
@keyframes loaderGlowPulse { 0%,100%{opacity:0.5} 50%{opacity:1} }
.loader-icon-box {
  position: relative;
  width: auto; height: 96px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 18px;
  border: 1px solid rgba(201,162,39,0.18);
  background: rgba(26,27,33,0.85);
  backdrop-filter: blur(8px);
  animation: loaderFloat 6s ease-in-out infinite;
}
@keyframes loaderFloat {
  0%,100%{ transform: translateY(0); }
  50%{ transform: translateY(-10px); }
}
.loader-heart {
  font-size: 48px;
  color: #ecc246;
  text-shadow: 0 0 24px rgba(201,162,39,0.5);
  line-height: 1;
  user-select: none;
}

.loader-brand { text-align: center; }
.loader-brand-name {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: clamp(28px, 6vw, 48px);
  font-weight: 700;
  color: #ecc246;
  letter-spacing: -0.02em;
  line-height: 1.1;
  text-shadow: 0 0 24px rgba(201,162,39,0.4);
}
.loader-brand-sub {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(209,197,175,0.5);
  margin-top: 6px;
}

.loader-progress-wrap { width: clamp(240px, 60vw, 320px); }
.loader-track {
  height: 2px; width: 100%;
  background: rgba(255,255,255,0.06);
  border-radius: 99px;
  overflow: hidden;
  position: relative;
}
.loader-bar {
  position: absolute; top: 0; left: 0; height: 100%;
  background: #7dd7c2;

// ── Screenshot / screen-capture blur protection ────────────────────
(function() {
  // KEY iOS SAFARI FIX: overlay must use opacity:0 not display:none
  // so it is ALWAYS in the compositor layer. display:none means iOS
  // composites the screenshot before JS can flip it to visible.
  var style = document.createElement('style');
  style.textContent = [
    '#ss-blur-overlay{',
      'position:fixed;inset:0;z-index:2147483647;',
      'backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);',
      'background:rgba(13,15,20,0.88);',
      'align-items:center;justify-content:center;flex-direction:column;gap:16px;',
      /* Always in the render tree — just invisible */
      'opacity:0;pointer-events:none;',
      'display:flex;',
      /* GPU-composited layer so iOS can flip it synchronously */
      '-webkit-transform:translateZ(0);transform:translateZ(0);',
      'will-change:opacity;',
      'transition:opacity 0.15s ease;',
    '}',
    '#ss-blur-overlay.active{opacity:1;pointer-events:all;}',
    '#ss-blur-overlay p{',
      'font-family:"JetBrains Mono",monospace;font-size:13px;letter-spacing:0.1em;',
      'color:rgba(236,194,70,0.85);text-transform:uppercase;margin:0;',
      'text-align:center;padding:0 24px;',
    '}',
    /* Print / AirPrint protection */
    '@media print{',
      'body>*:not(#ss-blur-overlay){filter:blur(40px)!important;opacity:0!important;}',
      '#ss-blur-overlay{opacity:1!important;pointer-events:all!important;}',
    '}',
  ].join('');
  document.head.appendChild(style);

  var overlay = document.createElement('div');
  overlay.id = 'ss-blur-overlay';
  overlay.innerHTML = '<p>&#128683; Screen capture restricted</p>';
  document.body.appendChild(overlay);

  function showBlur() { overlay.classList.add('active'); }
  function hideBlur() { overlay.classList.remove('active'); }

  var blurTimer = null;
  function showThenHide(ms) {
    showBlur();
    clearTimeout(blurTimer);
    blurTimer = setTimeout(hideBlur, ms || 2000);
  }

  // ── 1. PrintScreen (Windows/Linux) ──────────────────────────────
  document.addEventListener('keyup', function(e) {
    if (e.key === 'PrintScreen' || e.key === 'Print') {
      showThenHide(2000);
      try { navigator.clipboard.writeText(''); } catch(_) {}
    }
  });

  // ── 2. Keyboard combos (Win+Shift+S, Mac Cmd+Shift+3/4/5) ───────
  document.addEventListener('keydown', function(e) {
    if ((e.metaKey || e.ctrlKey) && e.shiftKey && /^[s345]$/i.test(e.key)) {
      showThenHide(2000);
    }
  });

  // ── 3. visibilitychange ──────────────────────────────────────────
  // iOS Safari DOES fire this for screenshots on iOS 14.5+.
  // The overlay must already be in the compositor (opacity:0 not display:none)
  // for this to work — that's the critical fix above.
  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'hidden') {
      showBlur();
      clearTimeout(blurTimer);
    } else {
      blurTimer = setTimeout(hideBlur, 1800);
    }
  });

  // ── 4. window blur/focus ─────────────────────────────────────────
  // Catches Android Chrome app-switching, desktop alt-tab, Samsung Internet
  window.addEventListener('blur', function() {
    showBlur();
    clearTimeout(blurTimer);
  });
  window.addEventListener('focus', function() {
    blurTimer = setTimeout(hideBlur, 1800);
  });

  // ── 5. pagehide/pageshow ─────────────────────────────────────────
  // iOS Safari back/forward cache (bfcache) — fires when user swipes back
  window.addEventListener('pagehide', function() { showBlur(); });
  window.addEventListener('pageshow', function(e) {
    // e.persisted = true means restored from bfcache
    blurTimer = setTimeout(hideBlur, e.persisted ? 2000 : 1800);
  });

  // ── 6. iOS touch-edge heuristic ──────────────────────────────────
  // iPhone screenshot = Side button + Volume Up pressed simultaneously.
  // Hardware presses register as touches near the screen edges in some cases.
  document.addEventListener('touchstart', function(e) {
    if (e.touches.length >= 2) {
      var hasEdge = false;
      for (var i = 0; i < e.touches.length; i++) {
        var t = e.touches[i];
        if (t.clientX < 25 || t.clientX > window.innerWidth  - 25 ||
            t.clientY < 25 || t.clientY > window.innerHeight - 25) {
          hasEdge = true; break;
        }
      }
      if (hasEdge) showThenHide(2500);
    }
  }, { passive: true });

  // ── 7. iOS DeviceMotion flash detection ──────────────────────────
  // iOS flashes the screen white for ~120ms when a screenshot is taken.
  // We can't detect the flash directly, but we can watch for the
  // accelerometer going quiet (phone held still for screenshot) then
  // a sharp jolt (the button press vibration on older iPhones).
  var lastAccel = null;
  var motionTimeout = null;
  if (window.DeviceMotionEvent) {
    window.addEventListener('devicemotion', function(e) {
      var a = e.accelerationIncludingGravity;
      if (!a) return;
      if (lastAccel) {
        var dx = Math.abs(a.x - lastAccel.x);
        var dy = Math.abs(a.y - lastAccel.y);
        var dz = Math.abs(a.z - lastAccel.z);
        // Sharp jolt > 8 m/s² delta in any axis = button press
        if (dx > 8 || dy > 8 || dz > 8) {
          showThenHide(2000);
        }
      }
      lastAccel = { x: a.x, y: a.y, z: a.z };
    }, { passive: true });
  }

  // ── 8. CSS ::backdrop ────────────────────────────────────────────
  var backdropStyle = document.createElement('style');
  backdropStyle.textContent = '::backdrop{filter:blur(40px);}';
  document.head.appendChild(backdropStyle);
})();

  const inflight = new Map(); // key → Promise  (dedup concurrent calls)

  const TTL = {
    studies:     30_000,   // 30s  — repository list (changes on upload/delete)
    allStudies:  30_000,   // 30s  — chat AI context
    categories:  120_000,  // 2 min — rarely changes
    stats:       20_000,   // 20s  — admin dashboard numbers
    users:       20_000,   // 20s  — user management list
    favorites:   15_000,   // 15s  — per-user bookmarks
    lastRead:    60_000,   // 1 min — per-user last-opened
    reviews:     20_000,   // 20s  — per-study reviews
    tfeedback:   30_000,   // 30s  — per-study teacher feedback
    announcements:30_000,  // 30s  — announcements list
    recognized:  30_000,   // 30s  — recognized studies
    profile:     60_000,   // 1 min — user profile
  };

  return {
    // Return cached value if still fresh, otherwise null
    get(key) {
      const entry = store.get(key);
      if (!entry) return null;
      if (Date.now() > entry.expiresAt) { store.delete(key); return null; }
      return entry.value;
    },

    // Store a value with a given TTL type
    set(key, value, ttlType) {
      store.set(key, { value, expiresAt: Date.now() + (TTL[ttlType] || 20_000) });
    },

    // Invalidate keys matching a prefix or exact key
    invalidate(...prefixes) {
      for (const prefix of prefixes) {
        for (const key of store.keys()) {
          if (key === prefix || key.startsWith(prefix + ':')) store.delete(key);
        }
      }
    },

    // Wrap an async fn with cache + in-flight dedup
    async wrap(key, ttlType, fn) {
      const cached = this.get(key);
      if (cached !== null) return cached;
      if (inflight.has(key)) return inflight.get(key);
      const promise = fn().then(result => {
        this.set(key, result, ttlType);
        inflight.delete(key);
        return result;
      }).catch(err => {
        inflight.delete(key);
        throw err;
      });
      inflight.set(key, promise);
      return promise;
    },

    // Clear everything (e.g. on logout)
    clear() { store.clear(); inflight.clear(); },

    // Debug: how many entries are live
    size() { return store.size; },
  };
})();

const API = {
  async register({ name, email, password, institution, gradeLevel, section, secQ, secA }) {
    if (!name||!email||!password) throw new Error('Name, email and password are required.');
    if (password.length < 8)       throw new Error('Password must be at least 8 characters.');
    if (!secA?.trim())             throw new Error('Security answer is required.');
    window._registering = true;
    try {
      const cred = await auth.createUserWithEmailAndPassword(email.trim(), password);
      await db.collection('users').doc(cred.user.uid).set({
        name: name.trim(), email: email.toLowerCase(),
        role: 'student', status: 'pending',
        institution: institution?.trim()||'', gradeLevel: gradeLevel||'', section: section?.trim()||'',
        secQ: secQ||SEC_QS[0], secA: secA.trim().toLowerCase(),
        uploadCount: 0, createdAt: new Date().toISOString()
      });
      await auth.signOut();
    } finally {
      window._registering = false;
    }
  },

  async login(email, password) {
    try {
      const cred = await auth.signInWithEmailAndPassword(email.trim(), password);
      const snap = await db.collection('users').doc(cred.user.uid).get();
      if (!snap.exists) { await auth.signOut(); throw new Error('User profile not found. Please contact your teacher.'); }
      const data = snap.data();
      if (data.status==='pending')  { await auth.signOut(); throw new Error('Your account is awaiting teacher approval. Please check back later.'); }
      if (data.status==='rejected') { await auth.signOut(); throw new Error('Your registration was rejected. Please contact your teacher.'); }
      // Apply any pending on-site password reset
      if (data._pwReset) {
        try {
          await cred.user.updatePassword(data._pwReset);
          await db.collection('users').doc(cred.user.uid).update({ _pwReset: firebase.firestore.FieldValue.delete(), _pwResetAt: firebase.firestore.FieldValue.delete() });
        } catch(pe) { /* non-fatal: clear it anyway */ await db.collection('users').doc(cred.user.uid).update({ _pwReset: firebase.firestore.FieldValue.delete(), _pwResetAt: firebase.firestore.FieldValue.delete() }).catch(()=>{}); }
      }
      await db.collection('users').doc(cred.user.uid).update({ lastLogin: new Date().toISOString() }).catch(()=>{});
      return { id: cred.user.uid, ...data };
    } catch(e) {
      // Translate Firebase error codes to friendly messages
      const code = e.code || '';
      if (code === 'auth/user-not-found' || code === 'auth/wrong-password' || code === 'auth/invalid-credential') throw new Error('Incorrect email or password. Please try again.');
      if (code === 'auth/invalid-email') throw new Error('Please enter a valid email address.');
      if (code === 'auth/user-disabled') throw new Error('This account has been disabled. Contact your teacher.');
      if (code === 'auth/too-many-requests') throw new Error('Too many failed attempts. Please wait a few minutes and try again.');
      if (code === 'auth/network-request-failed') throw new Error('Network error. Please check your internet connection and try again.');
      if (code === 'auth/unauthorized-domain') throw new Error('This domain is not authorized for login. The admin must add this domain in Firebase Console → Authentication → Settings → Authorized Domains.');
      throw e;
    }
  },

  async logout() { await auth.signOut(); Cache.clear(); },

  async getProfile(uid) {

  async getStudies({ search='', category='', year='', uploadedBy='', status='active', page=1, perPage=6 }={}) {
    try {
      // Fetch raw list once and cache it; filtering/pagination happens in-memory
      const allRaw = await Cache.wrap('studies:raw', 'studies', async () => {
        const snap = await db.collection('studies').orderBy('createdAt','desc').get();
        return snap.docs.map(d=>({id:d.id,...d.data()}));
      });
      let items = [...allRaw];
      if (status)     items = items.filter(s=>s.status===status);
      if (uploadedBy) items = items.filter(s=>s.uploadedBy===uploadedBy);
      if (category)   items = items.filter(s=>(s.categories||[]).includes(category));
      if (year)       items = items.filter(s=>String(s.year)===String(year));
      if (search) {
        const q = search.toLowerCase();
        items = items.filter(s=>[s.title,...(s.authors||[]),s.abstract||'',...(s.keywords||[])].join(' ').toLowerCase().includes(q));
      }
      const total = items.length;
      return { data: items.slice((page-1)*perPage, page*perPage), total, totalPages:Math.ceil(total/perPage)||1, page };
    } catch(e) { return {data:[],total:0,totalPages:1,page:1}; }
  },

  async createStudy({ title, authors, coAuthors, abstract, keywords, categories, year, gdrive, uploadedBy, uploadedByName }) {

    if (!categories?.length) throw new Error('At least one category is required.');

    // Duplicate detection — check if a study with the same title already exists
    const normalized = title.trim().toLowerCase().replace(/\s+/g,' ');
    const existing = await db.collection('studies')
      .where('titleNorm','==', normalized)
      .limit(1).get();
    if (!existing.empty) throw new Error(`⚠️ A study with this title already exists: "${existing.docs[0].data().title}"`);

    await db.collection('studies').add({
      title:title.trim(), titleNorm: normalized, authors, coAuthors:coAuthors||[], abstract:abstract.trim(),
      keywords:keywords||[], categories,
      year:parseInt(year)||new Date().getFullYear(),
      gdrive:gdrive||null, uploadedBy, uploadedByName,
      viewCount:0, downloadCount:0, status:'active',
      createdAt:new Date().toISOString()
    });

      uploadCount: firebase.firestore.FieldValue.increment(1)
    });
    Cache.invalidate('studies', 'allStudies', 'stats');

  async submitReview(studyId, userId, userName, userInstitution, rating, comment) {
    if(!rating||rating<1||rating>5) throw new Error('Please select a rating.');
    if(!comment.trim()) throw new Error('Please write a comment.');
    if(comment.trim().length<10) throw new Error('Comment must be at least 10 characters.');
    await db.collection('studies').doc(studyId).collection('reviews').doc(userId).set({
      userId, userName, userInstitution:userInstitution||'',
      rating, comment:comment.trim(),
      createdAt:new Date().toISOString()
    });
    const allSnap = await db.collection('studies').doc(studyId).collection('reviews').get();
    const ratings = allSnap.docs.map(d=>d.data().rating||0);
    const avg = ratings.reduce((a,b)=>a+b,0)/ratings.length;
    await db.collection('studies').doc(studyId).update({
      avgRating: Math.round(avg*10)/10,
      reviewCount: ratings.length
    }).catch(()=>{});
    Cache.invalidate(`reviews:${studyId}`, 'studies', 'allStudies');
  },

    await db.collection('studies').doc(studyId).collection('reviews').doc(userId).delete();
    const allSnap = await db.collection('studies').doc(studyId).collection('reviews').get();
    const ratings = allSnap.docs.map(d=>d.data().rating||0);
    const avg = ratings.length ? ratings.reduce((a,b)=>a+b,0)/ratings.length : 0;
    await db.collection('studies').doc(studyId).update({
      avgRating: ratings.length ? Math.round(avg*10)/10 : 0,
      reviewCount: ratings.length
    }).catch(()=>{});
    Cache.invalidate(`reviews:${studyId}`, 'studies', 'allStudies');

  // ── Announcements ──────────────────────────────────────
  /* FIRESTORE RULE NEEDED — add this to your Firestore rules:
     match /announcements/{doc} {
       allow read: if request.auth != null;
       allow write: if request.auth != null
         && get(/databases/$(database)/documents/users/$(request.auth.uid)).data.role == 'admin';
     }
  */
  async getAnnouncements(limitN=20) {
    return Cache.wrap(`announcements:${limitN}`, 'announcements', async () => {
    try {
      const snap = await db.collection('announcements').orderBy('createdAt','desc').limit(limitN).get();
      const now = new Date();
      const active = [];
      const expired = [];
      snap.docs.forEach(d => {
        const data = { id: d.id, ...d.data() };
        const expiresAt = data.expiresAt ? new Date(data.expiresAt) : null;
        if (expiresAt && now > expiresAt) {
          expired.push(d.ref); // mark for deletion
        } else {
          active.push(data);
        }
      });
      // Auto-delete expired announcements from Firestore
      if (expired.length > 0) {
        const batch = db.batch();
        expired.forEach(ref => batch.delete(ref));
        batch.commit().catch(() => {});
      }
      return active;
    } catch(e) {
      console.warn('Announcements read failed — check Firestore rules:', e.message);
      return [];
    }
    }); // end Cache.wrap
  },
  async createAnnouncement({ title, body, priority, authorId, authorName, durationHours }) {
    if(!title.trim()) throw new Error('Title is required.');
    if(!body.trim())  throw new Error('Message is required.');
    const now = new Date();
    const hours = parseFloat(durationHours) || 24;
    const expiresAt = new Date(now.getTime() + hours * 60 * 60 * 1000).toISOString();
    await db.collection('announcements').add({
      title:title.trim(), body:body.trim(),
      priority:priority||'normal',
      authorId, authorName,
      createdAt:now.toISOString(),
      expiresAt,
      durationHours: hours,
      pinned:priority==='urgent'
    });
    Cache.invalidate('announcements');
  },

  async _withAnon(fn) {
    let anonUser = null;
    try {
      const cred = await auth.signInAnonymously();
      anonUser = cred.user;
      return await fn();
    } finally {
      if (anonUser) await auth.signOut().catch(()=>{});
    }
  },

  async getSecurityQuestion(email) {
    return this._withAnon(async () => {
      const snap = await db.collection('users').where('email','==',email.trim().toLowerCase()).limit(1).get();
      if (snap.empty) throw new Error('No account found with that email address.');
      const doc = snap.docs[0];
      const data = doc.data();
      if (!data.secQ || !data.secA) throw new Error('No security question is set for this account. Please contact an administrator.');
      return { uid: doc.id, secQ: data.secQ };
    });
  },

  async verifySecurityAnswer(uid, answer) {
    return this._withAnon(async () => {

function fmtAPA(name) {
  if (!name) return '';
  const p = name.trim().split(/\s+/);
  if (p.length===1) return p[0];
  const last = p[p.length-1];
  const inits = p.slice(0,-1).map(x=>x[0].toUpperCase()+'.').join(' ');
  return `${last}, ${inits}`;
}

function generateAPA(s) {
  if (!s) return '';
  const authors = s.authors||[];
  let a = 'Unknown Author';
  if (authors.length===1) a=fmtAPA(authors[0]);
  else if (authors.length===2) a=`${fmtAPA(authors[0])}, & ${fmtAPA(authors[1])}`;
  else if (authors.length>2) { const f=authors.map(fmtAPA),l=f.pop(); a=f.join(', ')+', & '+l; }
  const year = s.year||new Date().getFullYear();
  const cat  = (s.categories||[])[0]||'';
  return `${a}. (${year}). ${s.title||'Untitled'}.${cat?` [${cat}].`:''}`;
}

function generateInText(s) {
  const authors = s.authors||[];
  const year    = s.year||new Date().getFullYear();
  const last    = n=>n?.trim().split(/\s+/).pop()||'Unknown';
  if (!authors.length)   return `(Unknown, ${year})`;
  if (authors.length===1) return `(${last(authors[0])}, ${year})`;
  if (authors.length===2) return `(${last(authors[0])} & ${last(authors[1])}, ${year})`;
  return `(${last(authors[0])} et al., ${year})`;
}
