  font-size: clamp(1.5rem, 5vw, 1.9rem);

/* ══════════════════════════════════════════
   TOOLTIPS
══════════════════════════════════════════ */
/* Attribute-based tooltips via [data-tip] */
[data-tip] {
  position: relative;
}
[data-tip]::after {
  content: attr(data-tip);
  position: absolute;
  bottom: calc(100% + 7px);
  left: 50%;
  transform: translateX(-50%) scale(0.88);
  white-space: nowrap;
  background: var(--ink);
  color: #fff;
  font-family: var(--font-body);
  font-size: 0.68rem;
  font-weight: 500;
  line-height: 1.4;
  padding: 4px 9px;
  border-radius: 6px;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.15s ease, transform 0.15s ease;
  z-index: 9999;
  box-shadow: 0 3px 10px rgba(0,0,0,0.18);
  letter-spacing: 0.01em;
  max-width: 220px;
  white-space: normal;
  text-align: center;
}
[data-tip]::before {
  content: '';
  position: absolute;
  bottom: calc(100% + 2px);
  left: 50%;
  transform: translateX(-50%) scale(0.88);
  border: 5px solid transparent;
  border-top-color: var(--ink);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.15s ease, transform 0.15s ease;
  z-index: 9999;
}
[data-tip]:hover::after,
[data-tip]:focus-visible::after {
  opacity: 1;
  transform: translateX(-50%) scale(1);
}
[data-tip]:hover::before,
[data-tip]:focus-visible::before {
  opacity: 1;
  transform: translateX(-50%) scale(1);
}
/* Tip below variant */
[data-tip-pos="bottom"]::after {
  bottom: auto;
  top: calc(100% + 7px);
}
[data-tip-pos="bottom"]::before {
  bottom: auto;
  top: calc(100% + 2px);
  border-top-color: transparent;
  border-bottom-color: var(--ink);
}
/* Tip left-anchored (for right-edge buttons) */
[data-tip-pos="left"]::after {
  left: auto;
  right: 0;
  transform: translateX(0) scale(0.88);
}
[data-tip-pos="left"]:hover::after,
[data-tip-pos="left"]:focus-visible::after {
  transform: translateX(0) scale(1);
}
[data-tip-pos="left"]::before {
  left: auto;
  right: 14px;
  transform: scale(0.88);
}
[data-tip-pos="left"]:hover::before,
[data-tip-pos="left"]:focus-visible::before {
  transform: scale(1);
}
/* Tip right-anchored (for collapsed sidebar icons) */
[data-tip-pos="right"]::after {
  bottom: auto;
  top: 50%;
  left: calc(100% + 10px);
  right: auto;
  transform: translateY(-50%) scale(0.88);
}
[data-tip-pos="right"]:hover::after,
[data-tip-pos="right"]:focus-visible::after {
  transform: translateY(-50%) scale(1);
}
[data-tip-pos="right"]::before {
  bottom: auto;
  top: 50%;
  left: calc(100% + 4px);
  right: auto;
  transform: translateY(-50%) scale(0.88);
  border-top-color: transparent;
  border-right-color: var(--ink);
}
[data-tip-pos="right"]:hover::before,
[data-tip-pos="right"]:focus-visible::before {
  transform: translateY(-50%) scale(1);
}
[data-theme="dark"] [data-tip-pos="right"]::before {
  border-right-color: #e8eaf2;
}
/* Dark mode inversion */
[data-theme="dark"] [data-tip]::after {
  background: #e8eaf2;
  color: #0d0f14;
  box-shadow: 0 3px 14px rgba(0,0,0,0.5);
}
[data-theme="dark"] [data-tip]::before {
  border-top-color: #e8eaf2;
}
[data-theme="dark"] [data-tip-pos="bottom"]::before {
  border-top-color: transparent;
  border-bottom-color: #e8eaf2;
}

// Block right-click context menu everywhere except inputs and APA citation box
document.addEventListener('contextmenu', function(e) {
  var t = e.target;
  var allowed = t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || (t.closest && t.closest('.apa-box'));

});

// Block copy event everywhere except inputs and APA citation box
document.addEventListener('copy', function(e) {
  var s = window.getSelection();
  if (!s || s.rangeCount === 0) return;
  var n = s.getRangeAt(0).commonAncestorContainer;
  var el = n.nodeType === 3 ? n.parentElement : n;
  if (el && el.closest && el.closest('.apa-box')) return;
  if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA')) return;
  e.preventDefault();

});

// Block Ctrl+C, Ctrl+A, Ctrl+P keyboard shortcuts except in inputs/apa-box
document.addEventListener('keydown', function(e) {
  var isShortcut = (e.ctrlKey || e.metaKey) && (e.key === 'c' || e.key === 'a' || e.key === 'p');

  var t = document.activeElement;
  var allowed = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || (t.closest && t.closest('.apa-box')));
  if (!allowed) e.preventDefault();
});

// ── Screenshot / screen-capture blur protection ────────────────────
(function() {
  // KEY iOS SAFARI FIX: overlay must use opacity:0 not display:none
  // so it is ALWAYS in the compositor layer. display:none means iOS
  // composites the screenshot before JS can flip it to visible.
  var style = document.createElement('style');
  style.textContent = [
    '#ss-blur-overlay{',
      'position:fixed;inset:0;z-index:2147483647;',
      'backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);',
      'background:rgba(13,15,20,0.88);',
      'align-items:center;justify-content:center;flex-direction:column;gap:16px;',
      /* Always in the render tree — just invisible */
      'opacity:0;pointer-events:none;',
      'display:flex;',
      /* GPU-composited layer so iOS can flip it synchronously */
      '-webkit-transform:translateZ(0);transform:translateZ(0);',
      'will-change:opacity;',
      'transition:opacity 0.15s ease;',
    '}',
    '#ss-blur-overlay.active{opacity:1;pointer-events:all;}',
    '#ss-blur-overlay p{',
      'font-family:"JetBrains Mono",monospace;font-size:13px;letter-spacing:0.1em;',
      'color:rgba(236,194,70,0.85);text-transform:uppercase;margin:0;',
      'text-align:center;padding:0 24px;',
    '}',
    /* Print / AirPrint protection */
    '@media print{',
      'body>*:not(#ss-blur-overlay){filter:blur(40px)!important;opacity:0!important;}',
      '#ss-blur-overlay{opacity:1!important;pointer-events:all!important;}',
    '}',
  ].join('');
  document.head.appendChild(style);

  var overlay = document.createElement('div');
  overlay.id = 'ss-blur-overlay';
  overlay.innerHTML = '<p>&#128683; Screen capture restricted</p>';
  document.body.appendChild(overlay);

  function showBlur() { overlay.classList.add('active'); }
  function hideBlur() { overlay.classList.remove('active'); }

  var blurTimer = null;
  function showThenHide(ms) {
    showBlur();
    clearTimeout(blurTimer);
    blurTimer = setTimeout(hideBlur, ms || 2000);
  }

  // ── 1. PrintScreen (Windows/Linux) ──────────────────────────────
  document.addEventListener('keyup', function(e) {
    if (e.key === 'PrintScreen' || e.key === 'Print') {
      showThenHide(2000);
      try { navigator.clipboard.writeText(''); } catch(_) {}
    }
  });

  // ── 2. Keyboard combos (Win+Shift+S, Mac Cmd+Shift+3/4/5) ───────
  document.addEventListener('keydown', function(e) {
    if ((e.metaKey || e.ctrlKey) && e.shiftKey && /^[s345]$/i.test(e.key)) {
      showThenHide(2000);
    }
  });

  // ── 3. visibilitychange ──────────────────────────────────────────
  // iOS Safari DOES fire this for screenshots on iOS 14.5+.
  // The overlay must already be in the compositor (opacity:0 not display:none)
  // for this to work — that's the critical fix above.
  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'hidden') {
      showBlur();
      clearTimeout(blurTimer);
    } else {
      blurTimer = setTimeout(hideBlur, 1800);
    }
  });

  // ── 4. window blur/focus ─────────────────────────────────────────
  // Catches Android Chrome app-switching, desktop alt-tab, Samsung Internet
  window.addEventListener('blur', function() {
    showBlur();
    clearTimeout(blurTimer);
  });
  window.addEventListener('focus', function() {
    blurTimer = setTimeout(hideBlur, 1800);
  });

  // ── 5. pagehide/pageshow ─────────────────────────────────────────
  // iOS Safari back/forward cache (bfcache) — fires when user swipes back
  window.addEventListener('pagehide', function() { showBlur(); });
  window.addEventListener('pageshow', function(e) {
    // e.persisted = true means restored from bfcache
    blurTimer = setTimeout(hideBlur, e.persisted ? 2000 : 1800);
  });

  // ── 6. iOS touch-edge heuristic ──────────────────────────────────
  // iPhone screenshot = Side button + Volume Up pressed simultaneously.
  // Hardware presses register as touches near the screen edges in some cases.
  document.addEventListener('touchstart', function(e) {
    if (e.touches.length >= 2) {
      var hasEdge = false;
      for (var i = 0; i < e.touches.length; i++) {
        var t = e.touches[i];
        if (t.clientX < 25 || t.clientX > window.innerWidth  - 25 ||
            t.clientY < 25 || t.clientY > window.innerHeight - 25) {
          hasEdge = true; break;
        }
      }
      if (hasEdge) showThenHide(2500);
    }
  }, { passive: true });

  // ── 7. iOS DeviceMotion flash detection ──────────────────────────
  // iOS flashes the screen white for ~120ms when a screenshot is taken.
  // We can't detect the flash directly, but we can watch for the
  // accelerometer going quiet (phone held still for screenshot) then
  // a sharp jolt (the button press vibration on older iPhones).
  var lastAccel = null;
  var motionTimeout = null;
  if (window.DeviceMotionEvent) {
    window.addEventListener('devicemotion', function(e) {
      var a = e.accelerationIncludingGravity;
      if (!a) return;
      if (lastAccel) {
        var dx = Math.abs(a.x - lastAccel.x);
        var dy = Math.abs(a.y - lastAccel.y);
        var dz = Math.abs(a.z - lastAccel.z);
        // Sharp jolt > 8 m/s² delta in any axis = button press
        if (dx > 8 || dy > 8 || dz > 8) {
          showThenHide(2000);
        }
      }
      lastAccel = { x: a.x, y: a.y, z: a.z };
    }, { passive: true });
  }

  // ── 8. CSS ::backdrop ────────────────────────────────────────────
  var backdropStyle = document.createElement('style');
  backdropStyle.textContent = '::backdrop{filter:blur(40px);}';
  document.head.appendChild(backdropStyle);
})();

<script type="text/babel">
const { useState, useEffect, useCallback, useRef, useMemo, memo } = React;

// ══════════════════════════════════════════════════════════════════
//  THEME SYSTEM
// ══════════════════════════════════════════════════════════════════
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('sabnahis-theme', theme);
}
function getInitialTheme() {
  try { const t = localStorage.getItem('sabnahis-theme'); if (t) return t; } catch {}
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
// Apply immediately to prevent flash
applyTheme(getInitialTheme());

function useTheme() {
  const [theme, setTheme] = useState(getInitialTheme);
  const toggle = () => {
    setTheme(t => {
      const next = t === 'dark' ? 'light' : 'dark';
      applyTheme(next);
      return next;
    });
  };
  return [theme, toggle];
}

// ── Google Drive URL validator ──────────────────────────────────
function parseGDriveLink(url) {
  if (!url) return null;
  // Accept various GDrive URL formats and normalize to view link
  const patterns = [
    /drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/,
    /drive\.google\.com\/open\?id=([a-zA-Z0-9_-]+)/,
    /docs\.google\.com\/.*\/d\/([a-zA-Z0-9_-]+)/,
    /drive\.google\.com\/uc\?.*id=([a-zA-Z0-9_-]+)/,
  ];
  for (const p of patterns) {
    const m = url.match(p);
    if (m) return { id: m[1], viewUrl: `https://drive.google.com/file/d/${m[1]}/view`, downloadUrl: `https://drive.google.com/uc?export=download&id=${m[1]}` };
  }
  // If it's just any https URL treat as-is
  if (url.startsWith('https://')) return { id: null, viewUrl: url, downloadUrl: url };
  return null;
}

//  FIREBASE API
// ══════════════════════════════════════════════════════════════════
// ══════════════════════════════════════════════════════════════════
//  API CACHE — in-memory, TTL-based, with in-flight deduplication
// ══════════════════════════════════════════════════════════════════
const Cache = (() => {
  const store   = new Map(); // key → { value, expiresAt }
  const inflight = new Map(); // key → Promise  (dedup concurrent calls)

  const TTL = {
    studies:     30_000,   // 30s  — repository list (changes on upload/delete)
    allStudies:  30_000,   // 30s  — chat AI context
    categories:  120_000,  // 2 min — rarely changes
    stats:       20_000,   // 20s  — admin dashboard numbers
    users:       20_000,   // 20s  — user management list
    favorites:   15_000,   // 15s  — per-user bookmarks
    lastRead:    60_000,   // 1 min — per-user last-opened
    readStudies: 30_000,   // 30s  — per-user fully-read studies (for badges)
    streak:      60_000,   // 1 min — per-user daily login streak
    reviews:     20_000,   // 20s  — per-study reviews
    tfeedback:   30_000,   // 30s  — per-study teacher feedback
    announcements:30_000,  // 30s  — announcements list
    recognized:  30_000,   // 30s  — recognized studies
    profile:     60_000,   // 1 min — user profile
    weekly:      300_000,  // 5 min — weekly highlights
  };

  return {
    // Return cached value if still fresh, otherwise null
    get(key) {
      const entry = store.get(key);
      if (!entry) return null;
      if (Date.now() > entry.expiresAt) { store.delete(key); return null; }
      return entry.value;
    },

    // Store a value with a given TTL type
    set(key, value, ttlType) {
      store.set(key, { value, expiresAt: Date.now() + (TTL[ttlType] || 20_000) });
    },

    // Invalidate keys matching a prefix or exact key
    invalidate(...prefixes) {
      for (const prefix of prefixes) {
        for (const key of store.keys()) {
          if (key === prefix || key.startsWith(prefix + ':')) store.delete(key);
        }
      }
    },

    // Wrap an async fn with cache + in-flight dedup
    async wrap(key, ttlType, fn) {
      const cached = this.get(key);
      if (cached !== null) return cached;
      if (inflight.has(key)) return inflight.get(key);
      const promise = fn().then(result => {
        this.set(key, result, ttlType);
        inflight.delete(key);
        return result;
      }).catch(err => {
        inflight.delete(key);
        throw err;
      });
      inflight.set(key, promise);
      return promise;
    },

    // Clear everything (e.g. on logout)
    clear() { store.clear(); inflight.clear(); },

    // Debug: how many entries are live
    size() { return store.size; },
  };
})();

const API = {
  async register({ name, email, password, institution, gradeLevel, section, secQ, secA }) {
    if (!name||!email||!password) throw new Error('Name, email and password are required.');
    if (password.length < 8)       throw new Error('Password must be at least 8 characters.');
    if (!secA?.trim())             throw new Error('Security answer is required.');
    window._registering = true;
    try {
      const cred = await auth.createUserWithEmailAndPassword(email.trim(), password);
      await db.collection('users').doc(cred.user.uid).set({
        name: name.trim(), email: email.toLowerCase(),
        role: 'student', status: 'pending',
        institution: institution?.trim()||'', gradeLevel: gradeLevel||'', section: section?.trim()||'',
        secQ: secQ||SEC_QS[0], secA: secA.trim().toLowerCase(),
        uploadCount: 0, createdAt: new Date().toISOString()
      });
      await auth.signOut();
    } finally {
      window._registering = false;
    }
  },

  async login(email, password) {
    try {
      const cred = await auth.signInWithEmailAndPassword(email.trim(), password);
      const snap = await db.collection('users').doc(cred.user.uid).get();
      if (!snap.exists) { await auth.signOut(); throw new Error('User profile not found. Please contact your teacher.'); }
      const data = snap.data();
      if (data.status==='pending')  { await auth.signOut(); throw new Error('Your account is awaiting teacher approval. Please check back later.'); }
      if (data.status==='rejected') { await auth.signOut(); throw new Error('Your registration was rejected. Please contact your teacher.'); }
      // Apply any pending on-site password reset
      if (data._pwReset) {
        try {
          await cred.user.updatePassword(data._pwReset);
          await db.collection('users').doc(cred.user.uid).update({ _pwReset: firebase.firestore.FieldValue.delete(), _pwResetAt: firebase.firestore.FieldValue.delete() });
        } catch(pe) { /* non-fatal: clear it anyway */ await db.collection('users').doc(cred.user.uid).update({ _pwReset: firebase.firestore.FieldValue.delete(), _pwResetAt: firebase.firestore.FieldValue.delete() }).catch(()=>{}); }
      }
      await db.collection('users').doc(cred.user.uid).update({ lastLogin: new Date().toISOString() }).catch(()=>{});
      return { id: cred.user.uid, ...data };
    } catch(e) {
      // Translate Firebase error codes to friendly messages
      const code = e.code || '';
      if (code === 'auth/user-not-found' || code === 'auth/wrong-password' || code === 'auth/invalid-credential') throw new Error('Incorrect email or password. Please try again.');
      if (code === 'auth/invalid-email') throw new Error('Please enter a valid email address.');
      if (code === 'auth/user-disabled') throw new Error('This account has been disabled. Contact your teacher.');
      if (code === 'auth/too-many-requests') throw new Error('Too many failed attempts. Please wait a few minutes and try again.');
      if (code === 'auth/network-request-failed') throw new Error('Network error. Please check your internet connection and try again.');
      if (code === 'auth/unauthorized-domain') throw new Error('This domain is not authorized for login. The admin must add this domain in Firebase Console → Authentication → Settings → Authorized Domains.');
      throw e;
    }
  },

  async logout() { await auth.signOut(); Cache.clear(); },

  async getProfile(uid) {
    try {
      const snap = await db.collection('users').doc(uid).get();
      if (!snap.exists) return null;
      return { id: uid, ...snap.data() };
    } catch { return null; }
  },

  async getStudies({ search='', category='', year='', uploadedBy='', status='active', grade='', section='', page=1, perPage=6, sortBy='newest' }={}) {
    try {
      const allRaw = await Cache.wrap('studies:raw', 'studies', async () => {
        const snap = await db.collection('studies').orderBy('createdAt','desc').get();
        return snap.docs.map(d=>({id:d.id,...d.data()}));
      });
      let items = [...allRaw];
      if (status)     items = items.filter(s=>s.status===status);
      if (uploadedBy) items = items.filter(s=>s.uploadedBy===uploadedBy);
      if (category)   items = items.filter(s=>(s.categories||[]).includes(category));
      if (year)       items = items.filter(s=>String(s.year)===String(year));
      if (grade)      items = items.filter(s=>String(s.uploaderGrade||'')===String(grade));
      if (section)    items = items.filter(s=>(s.uploaderSection||'').trim().toLowerCase()===(section.trim().toLowerCase()));
      if (search) {
        const q = search.toLowerCase();
        items = items.filter(s=>[s.title,...(s.authors||[]),s.abstract||'',...(s.keywords||[])].join(' ').toLowerCase().includes(q));
      }
      // Sort BEFORE paginating so ordering applies across all pages
      if      (sortBy==='oldest')    items.sort((a,b)=>new Date(a.createdAt||0)-new Date(b.createdAt||0));
      else if (sortBy==='views')     items.sort((a,b)=>(b.viewCount||0)-(a.viewCount||0));
      else if (sortBy==='downloads') items.sort((a,b)=>(b.downloadCount||0)-(a.downloadCount||0));
      else if (sortBy==='az')        items.sort((a,b)=>a.title.localeCompare(b.title));
      else                           items.sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0));
      const total = items.length;
      return { data: items.slice((page-1)*perPage, page*perPage), total, totalPages:Math.ceil(total/perPage)||1, page };
    } catch(e) { return {data:[],total:0,totalPages:1,page:1}; }
  },

  async getAllStudies() {
    return Cache.wrap('allStudies', 'allStudies', async () => {
      try {
        const snap = await db.collection('studies').orderBy('createdAt','desc').get();
        return snap.docs.map(d=>({id:d.id,...d.data()})).filter(s=>s.status==='active');
      } catch { return []; }
    });
  },

  async createStudy({ title, authors, coAuthors, abstract, keywords, categories, year, gdrive, uploadedBy, uploadedByName, uploaderGrade='', uploaderSection='' }) {
    if (!title||!abstract)   throw new Error('Title and abstract are required.');
    if (!authors?.length)    throw new Error('At least one author is required.');
    if (!categories?.length) throw new Error('At least one category is required.');

    // Duplicate detection — check if a study with the same title already exists
    const normalized = title.trim().toLowerCase().replace(/\s+/g,' ');
    const existing = await db.collection('studies')
      .where('titleNorm','==', normalized)
      .limit(1).get();
    if (!existing.empty) throw new Error(`⚠️ A study with this title already exists: "${existing.docs[0].data().title}"`);

    await db.collection('studies').add({
      title:title.trim(), titleNorm: normalized, authors, coAuthors:coAuthors||[], abstract:abstract.trim(),
      keywords:keywords||[], categories,
      year:parseInt(year)||new Date().getFullYear(),
      gdrive:gdrive||null, uploadedBy, uploadedByName, uploaderGrade, uploaderSection,
      viewCount:0, downloadCount:0, status:'active',
      createdAt:new Date().toISOString()
    });
    await db.collection('users').doc(uploadedBy).update({
      uploadCount: firebase.firestore.FieldValue.increment(1)
    });
    // ── Notify admins of the new submission ──────────────────
    // FIX: Write ONE doc to `pendingReviews` instead of one doc per admin.
    // All admins query this shared collection — no fan-out, no per-user accumulation.
    try {
      const newStudyRef = (await db.collection('studies').where('titleNorm','==', normalized).limit(1).get()).docs[0];
      const newStudyId = newStudyRef ? newStudyRef.id : null;
      await db.collection('pendingReviews').add({
        type: 'new_study',
        studyId: newStudyId,
        studyTitle: title.trim(),
        submittedBy: uploadedByName,
        submittedByUid: uploadedBy,
        categories,
        createdAt: new Date().toISOString(),
        status: 'pending', // set to 'reviewed' when an admin acts on it
      });
      Cache.invalidate('studyNotifications');
    } catch(e) { console.warn('Notification write failed:', e.message); }
    // ── Notify registered co-authors they were tagged ────────────
    try {
      const registeredCoAuthors = (coAuthors || []).filter(ca => ca.userId && ca.registered);
      if (registeredCoAuthors.length > 0) {
        const coAuthorBatch = db.batch();
        const studyRef = (await db.collection('studies').where('titleNorm','==',normalized).limit(1).get()).docs[0];
        const studyId = studyRef ? studyRef.id : null;
        registeredCoAuthors.forEach(ca => {
          const ref = db.collection('users').doc(ca.userId).collection('notifications').doc();
          coAuthorBatch.set(ref, {
            type: 'coauthor_tag',
            title: 'You were tagged as co-author',
            body: `"${title.trim()}" by ${uploadedByName} lists you as a co-author.`,
            link: studyId,
            createdAt: new Date().toISOString(),
            read: false,
          });
        });
        await coAuthorBatch.commit();
      }
    } catch(e) { console.warn('Co-author notification failed:', e.message); }
    Cache.invalidate('studies', 'allStudies', 'stats');
  },

  async deleteStudy(id) { await db.collection('studies').doc(id).delete(); Cache.invalidate('studies', 'allStudies', 'stats'); },

  async addFavorite(userId, study) {
    const BOOKMARK_LIMIT = 10;
    const existing = await db.collection('users').doc(userId).collection('favorites').get();
    if (existing.size >= BOOKMARK_LIMIT) throw new Error(`📌 Bookmark limit reached (${BOOKMARK_LIMIT} max). Remove one to add a new one.`);
    await db.collection('users').doc(userId).collection('favorites').doc(study.id).set({
      studyId:study.id, title:study.title, authors:study.authors||[],
      categories:study.categories||[], year:study.year,
      savedAt:new Date().toISOString()
    });
    await db.collection('studies').doc(study.id).collection('favoriteBy').doc(userId).set({
      userId, savedAt:new Date().toISOString()
    });
    await db.collection('studies').doc(study.id).update({
      favoriteCount: firebase.firestore.FieldValue.increment(1)
    }).catch(()=>{});
    Cache.invalidate(`favorites:${userId}`, 'studies', 'allStudies');
  },
  async removeFavorite(userId, studyId) {
    await db.collection('users').doc(userId).collection('favorites').doc(studyId).delete();
    await db.collection('studies').doc(studyId).collection('favoriteBy').doc(userId).delete();
    await db.collection('studies').doc(studyId).update({

  // ── Daily Login Streak ─────────────────────────────────
  // Call once per session. Increments the streak if the user's last
  // recorded visit was "yesterday" (relative to local date), resets to 1
  // if a day was missed, and leaves it unchanged if already visited today.
  async recordDailyVisit(userId) {
    const ref = db.collection('users').doc(userId).collection('streak').doc('current');
    const todayKey = new Date().toDateString(); // e.g. "Fri Jun 13 2026" — local-date based
    const snap = await ref.get();
    const data = snap.exists ? snap.data() : null;

    if (data && data.lastVisit === todayKey) {
      return { streak: data.streak || 1, isNew: false }; // already counted today
    }

    let streak = 1;
    if (data && data.lastVisit) {
      const last = new Date(data.lastVisit);
      const today = new Date(todayKey);
      const diffDays = Math.round((today - last) / 86_400_000);
      if (diffDays === 1) streak = (data.streak || 0) + 1; // consecutive day
      else if (diffDays <= 0) streak = data.streak || 1;   // same day, safety
      else streak = 1;                                     // missed a day — reset
    }

    await ref.set({
      streak,
      lastVisit: todayKey,
      longestStreak: Math.max(streak, (data && data.longestStreak) || 0),
      updatedAt: new Date().toISOString()
    });
    Cache.invalidate(`streak:${userId}`);
    return { streak, isNew: true };
  },
  async getStreak(userId) {
    return Cache.wrap(`streak:${userId}`, 'streak', async () => {
      const snap = await db.collection('users').doc(userId).collection('streak').doc('current').get();
      if (!snap.exists) return { streak: 0, longestStreak: 0, lastVisit: null };
      return snap.data();
    });
  },

  async submitTeacherFeedback(studyId, { teacherId, teacherName, grade, criteria, comments, recommendations, requestsRevision=false }) {
    if (!grade) throw new Error('Please select a grade.');
    if (!comments.trim()) throw new Error('Overall feedback is required.');
    const totalScore = Object.values(criteria).reduce((a,b)=>a+(b||0),0);
    await db.collection('studies').doc(studyId).collection('teacherFeedback').doc(teacherId).set({
      teacherId, teacherName, grade, criteria, totalScore,
      comments: comments.trim(),
      recommendations: recommendations.trim(),
      requestsRevision,
      gradedAt: new Date().toISOString()
    });
    await db.collection('studies').doc(studyId).update({
      teacherGrade: grade, teacherScore: totalScore,
      gradedBy: teacherName, gradedAt: new Date().toISOString(),
      revisionStatus: requestsRevision ? 'revision_requested' : firebase.firestore.FieldValue.delete(),
    }).catch(()=>{});
    // ── Notify the study's uploader ──────────────────────
    try {
      const studyDoc = await db.collection('studies').doc(studyId).get();
      const sd = studyDoc.data();
      if (sd?.uploadedBy) {
        await API.createNotification(sd.uploadedBy, {
          type: requestsRevision ? 'revision_requested' : 'feedback',
          title: requestsRevision ? `Revision requested on "${sd.title}"` : `New feedback on "${sd.title}"`,
          body: requestsRevision
            ? `${teacherName} requests changes: ${comments.trim().slice(0,80)}${comments.length>80?'…':''}`
            : `${teacherName} graded your study: ${grade}`,
          link: studyId
        });
      }
    } catch(e) { console.warn('Feedback notification failed:', e.message); }
    Cache.invalidate(`tfeedback:${studyId}`, 'studies', 'allStudies');
  },

  async resubmitStudy(studyId, { title, abstract, keywords, gdrive, resubmittedBy, resubmittedByName }) {
    // Archive current version to revisions subcollection
    const snap = await db.collection('studies').doc(studyId).get();
    const current = snap.data();
    const version = (current.version || 1);

    // FIX: Store only the fields that actually changed (delta), not full copies.
    // This cuts revision doc size by ~60-80%.
    const changedFields = {};
    if (title.trim() !== current.title) changedFields.title = current.title;
    if (abstract.trim() !== current.abstract) changedFields.abstract = current.abstract;
    if (JSON.stringify(keywords||[]) !== JSON.stringify(current.keywords||[])) changedFields.keywords = current.keywords||[];
    if ((gdrive||null) !== (current.gdrive||null)) changedFields.gdrive = current.gdrive||null;

    await db.collection('studies').doc(studyId).collection('revisions').doc(`v${version}`).set({
      version,
      archivedAt: new Date().toISOString(),
      archivedBy: resubmittedByName,
      changedFields: Object.keys(changedFields),
      previousValues: changedFields, // only what changed
    });

    // FIX: Cap revisions to 5 — delete the oldest if we now have more than 5
    const revSnap = await db.collection('studies').doc(studyId).collection('revisions')
      .orderBy('archivedAt','desc').get();
    if (revSnap.size > 5) {
      const batch = db.batch();
      revSnap.docs.slice(5).forEach(d => batch.delete(d.ref));
      batch.commit().catch(() => {});
    }
    // Update main doc with new content
    const normalized = title.trim().toLowerCase().replace(/\s+/g,' ');
    await db.collection('studies').doc(studyId).update({
      title: title.trim(),
      titleNorm: normalized,
      abstract: abstract.trim(),
      keywords: keywords || [],
      gdrive: gdrive || current.gdrive || null,
      revisionStatus: 'resubmitted',
      version: version + 1,
      resubmittedAt: new Date().toISOString(),
    });
    // Notify teacher
    try {
      if (current.gradedBy) {

  // ── Announcements ──────────────────────────────────────
  /* FIRESTORE RULE NEEDED — add this to your Firestore rules:
     match /announcements/{doc} {
       allow read: if request.auth != null;
       allow write: if request.auth != null
         && get(/databases/$(database)/documents/users/$(request.auth.uid)).data.role == 'admin';
     }
  */
  async getAnnouncements(limitN=20, user=null) {
    const cacheKey = user ? `announcements:${limitN}:${user.gradeLevel||''}:${(user.section||'').toLowerCase()}` : `announcements:${limitN}`;
    return Cache.wrap(cacheKey, 'announcements', async () => {
    try {
      const snap = await db.collection('announcements').orderBy('createdAt','desc').limit(limitN).get();
      const now = new Date();
      const active = [];
      const expired = [];
      snap.docs.forEach(d => {
        const data = { id: d.id, ...d.data() };
        const expiresAt = data.expiresAt ? new Date(data.expiresAt) : null;
        const scheduledAt = data.scheduledAt ? new Date(data.scheduledAt) : null;
        if (expiresAt && now > expiresAt) {
          expired.push(d.ref);
        } else {
          // Grade/section targeting filter (students only — teachers see all)
          if (user && user.role !== 'admin') {
            const tg = data.targetGrades || [];
            const ts = data.targetSections || [];
            const gradeMatch   = !tg.length || tg.includes(user.gradeLevel||'');
            const sectionMatch = !ts.length  || ts.includes((user.section||'').toLowerCase().trim());
            if (!gradeMatch || !sectionMatch) return; // skip — not targeted at this student
          }
          active.push({ ...data, isScheduled: scheduledAt && scheduledAt > now });
        }
      });
      if (expired.length > 0) {
        const batch = db.batch();
        expired.forEach(ref => batch.delete(ref));
        batch.commit().catch(() => {});
      }
      return active;
    } catch(e) {
      console.warn('Announcements read failed — check Firestore rules:', e.message);
      return [];
    }
    }); // end Cache.wrap
  },
  async createAnnouncement({ title, body, priority, authorId, authorName, durationHours, scheduledAt, targetGrades=[], targetSections=[] }) {
    if(!title.trim()) throw new Error('Title is required.');
    if(!body.trim())  throw new Error('Message is required.');
    const now = new Date();
    const publishAt = scheduledAt ? new Date(scheduledAt) : now;
    const hours = parseFloat(durationHours) || 24;
    const expiresAt = new Date(publishAt.getTime() + hours * 60 * 60 * 1000).toISOString();
    // Normalise sections: lowercase, trimmed, de-duped
    const normSections = [...new Set(targetSections.map(s=>s.trim().toLowerCase()).filter(Boolean))];
    await db.collection('announcements').add({
      title:title.trim(), body:body.trim(),
      priority:priority||'normal',
      authorId, authorName,
      createdAt:now.toISOString(),
      scheduledAt: publishAt.toISOString(),
      expiresAt,
      durationHours: hours,
      pinned:priority==='urgent',
      scheduled: scheduledAt ? true : false,
      targetGrades: targetGrades.length ? targetGrades : [],   // [] means all grades
      targetSections: normSections,                             // [] means all sections
    });
    // FIX: Removed per-student notification fan-out (was writing 1 doc per student per announcement).
    // Announcements are already stored once in `announcements` with expiresAt — students
    // read from that shared collection directly. No fan-out needed.
    Cache.invalidate('announcements');
  },

  // ── Weekly Highlights: most viewed / most downloaded study this week ──
  async getWeeklyHighlights() {
    return Cache.wrap('weeklyHighlights', 'weekly', async () => {
      const allStudies = await API.getAllStudies();
      const active = allStudies.filter(s=>s.status==='active');
      const find = id => active.find(s=>s.id===id);

      try {
        const since = new Date(Date.now() - 7*24*60*60*1000).toISOString();
        const [vSnap, dSnap] = await Promise.all([
          db.collectionGroup('views').where('timestamp','>=',since).get(),
          db.collectionGroup('downloads').where('timestamp','>=',since).get()
        ]);
        const countBy = snap => {
          const counts = {};
          snap.docs.forEach(d=>{
            const studyId = d.ref.parent.parent.id;
            counts[studyId] = (counts[studyId]||0) + 1;
          });
          return counts;
        };
        const topOf = counts => {
          let bestId=null, bestN=0;
          for(const [id,n] of Object.entries(counts)){
            if(n>bestN && find(id)){ bestN=n; bestId=id; }
          }
          return bestId ? {study:find(bestId), count:bestN} : null;
        };
        const mostViewed = topOf(countBy(vSnap));
        const mostDownloaded = topOf(countBy(dSnap));
        if(mostViewed || mostDownloaded){
          return { mostViewed, mostDownloaded, range:'week' };
        }
      } catch(e) { console.warn('Weekly highlights (collectionGroup) failed, falling back:', e); }

      // Fallback: all-time top by viewCount/downloadCount
      const byViews = [...active].sort((a,b)=>(b.viewCount||0)-(a.viewCount||0));
      const byDls   = [...active].sort((a,b)=>(b.downloadCount||0)-(a.downloadCount||0));
      return {
        mostViewed: byViews[0] && byViews[0].viewCount ? {study:byViews[0], count:byViews[0].viewCount} : null,
        mostDownloaded: byDls[0] && byDls[0].downloadCount ? {study:byDls[0], count:byDls[0].downloadCount} : null,
        range:'all'
      };
    });
  },

//  APA CITATION ENGINE
// ══════════════════════════════════════════════════════════════════
function fmtAPA(name) {
  if (!name) return '';
  const p = name.trim().split(/\s+/);
  if (p.length===1) return p[0];
  const last = p[p.length-1];
  const inits = p.slice(0,-1).map(x=>x[0].toUpperCase()+'.').join(' ');
  return `${last}, ${inits}`;
}

function generateAPA(s) {
  if (!s) return '';
  const authors = s.authors||[];
  let a = 'Unknown Author';
  if (authors.length===1) a=fmtAPA(authors[0]);
  else if (authors.length===2) a=`${fmtAPA(authors[0])}, & ${fmtAPA(authors[1])}`;
  else if (authors.length>2) { const f=authors.map(fmtAPA),l=f.pop(); a=f.join(', ')+', & '+l; }
  const year = s.year||new Date().getFullYear();
  const cat  = (s.categories||[])[0]||'';
  return `${a}. (${year}). ${s.title||'Untitled'}.${cat?` [${cat}].`:''}`;
}

function generateInText(s) {
  const authors = s.authors||[];
  const year    = s.year||new Date().getFullYear();
  const last    = n=>n?.trim().split(/\s+/).pop()||'Unknown';
  if (!authors.length)   return `(Unknown, ${year})`;
  if (authors.length===1) return `(${last(authors[0])}, ${year})`;
  if (authors.length===2) return `(${last(authors[0])} & ${last(authors[1])}, ${year})`;
  return `(${last(authors[0])} et al., ${year})`;
}

//  INTELLIGENT SEARCH ENGINE
// ══════════════════════════════════════════════════════════════════
const STEM_STOPWORDS = new Set(['the','a','an','of','in','for','to','and','or','is','are','was','were','be','been','it','this','that','with','by','from','on','at','as','its','study','research','about','using','based']);

function extractKeyTerms(text) {
  return text.toLowerCase()
    .replace(/[^\w\s]/g,' ')
    .split(/\s+/)
    .filter(w => w.length > 3 && !STEM_STOPWORDS.has(w))
    .slice(0, 12);
}

function scoreStudy(study, terms) {
  const fields = [
    { text: study.title||'',        weight: 3 },
    { text: (study.keywords||[]).join(' '), weight: 2.5 },
    { text: (study.categories||[]).join(' '), weight: 2 },
    { text: (study.authors||[]).join(' '), weight: 1.5 },
    { text: study.abstract||'',     weight: 1 },
  ];
  let score = 0;
  const fullText = fields.map(f=>f.text).join(' ').toLowerCase();
  terms.forEach(term => {
    fields.forEach(f => {
      const matches = (f.text.toLowerCase().match(new RegExp(term,'g'))||[]).length;
      score += matches * f.weight;
    });
    // Bonus for exact phrase in title
    if ((study.title||'').toLowerCase().includes(term)) score += 2;
  });
  return score;
}

function findRelevant(query, studies, limit=5) {
  if (!query||!studies?.length) return [];
  const terms = extractKeyTerms(query);
  if (!terms.length) return studies.slice(0,limit);
  return studies
    .map(s=>({s, score:scoreStudy(s, terms)}))
    .filter(x=>x.score>0)
    .sort((a,b)=>b.score-a.score)
    .slice(0, limit)
    .map(x=>x.s);
}

// Research gap detection
function detectResearchGaps(studies, query='') {
  if (!studies.length) return [];
  
  const allText = studies.map(s=>[s.title,s.abstract,...(s.keywords||[]),...(s.categories||[])].join(' ').toLowerCase()).join(' ');
  const allCats = {};
  studies.forEach(s=>(s.categories||[]).forEach(c=>{allCats[c]=(allCats[c]||0)+1;}));
  
  const gaps = [];
  const DEFAULT_CATS_SET = ['Biology','Chemistry','Physics','Mathematics','Computer Science','Environmental Science','Engineering','Health Science','Earth Science','Social Science'];
  DEFAULT_CATS_SET.forEach(cat => {
    if (!allCats[cat]) gaps.push(cat);
  });
  
  // Content-based gap detection
  const gapTopics = [
    { topic:'climate change impacts', check:/climate|global warming|carbon/ },
    { topic:'machine learning applications', check:/machine learning|neural|deep learning|AI/ },
    { topic:'renewable energy', check:/solar|wind energy|renewable|clean energy/ },
    { topic:'mental health in students', check:/mental health|anxiety|depression|wellbeing/ },
    { topic:'biodiversity conservation', check:/biodiversity|conservation|species|ecosystem/ },
    { topic:'data privacy and cybersecurity', check:/privacy|cybersecurity|data security|encryption/ },
  ];
  
  const contentGaps = gapTopics
    .filter(g => !g.check.test(allText))
    .map(g => g.topic)
    .slice(0, 2);
  
  return contentGaps;
}

// Cluster studies by theme
function clusterStudies(studies) {
  const clusters = {};
  studies.forEach(s => {
    (s.categories||['General']).forEach(cat => {
      if (!clusters[cat]) clusters[cat] = [];
      clusters[cat].push(s);
    });
  });
  return clusters;
}

// Groq key — fetched from Firestore, cached in memory
let _groqKeyCache = null;
const getGroqKey = () => _groqKeyCache || localStorage.getItem('sabnahis_groq_key') || '';
async function loadGroqKeyFromFirestore() {
  try {
    const snap = await db.collection('config').doc('groq').get();
    if (snap.exists && snap.data().apiKey) {
      _groqKeyCache = snap.data().apiKey;
    }
  } catch(e) { /* silent — fallback to localStorage */ }
}

async function callAI(query, history, studies, mode='general') {
  const recent = history.slice(-6).map(m=>`${m.role==='user'?'Student':'Assistant'}: ${m.content.slice(0,200)}`).join('\n');
  const system = buildSystemPrompt(studies, mode, recent);

  const GROQ_API_KEY = getGroqKey();
  if (!GROQ_API_KEY) return buildLocalResponse(query, studies, mode);

  const messages = [
    { role:'system', content: system },
    ...history.slice(-12).map(m=>({ role: m.role==='user'?'user':'assistant', content: m.content })),
    { role:'user', content: query }
  ];

  try {
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${GROQ_API_KEY}`
      },
      body: JSON.stringify({
        model: GROQ_MODEL,
        messages,
        max_tokens: 1600,
        temperature: 0.7
      })
    });
    const data = await res.json();
    if (data.error) {
      console.error('Groq API error:', data.error);
      toast.err(`Groq: ${data.error.message}`);
      throw new Error(data.error.message);
    }
    const text = data.choices?.[0]?.message?.content || 'No response generated.';
    const relevant = findRelevant(query, studies, 4);
    return { text, citations: relevant, source: 'groq' };
  } catch(err) {
    console.error('AI call failed:', err);
    return buildLocalResponse(query, studies, mode);
  }
}

    const list = relevant.map((s,i)=>`**${i+1}. ${s.title}** ${generateInText(s)}\n👤 *${(s.authors||[]).join(', ')}* · 📅 ${s.year} · 🏷 ${(s.categories||[]).join(', ')}\n${(s.abstract||'').slice(0,200)}${(s.abstract||'').length>200?'...':''}`).join('\n\n');
    const refs = '\n\n---\n### References\n'+relevant.map(s=>generateAPA(s)).join('\n');
    
    // Smart connection detection
    const yearRange = relevant.length > 1 ? `${Math.min(...relevant.map(s=>s.year))}–${Math.max(...relevant.map(s=>s.year))}` : null;
    const categories = [...new Set(relevant.flatMap(s=>s.categories||[]))];
    const connectionNote = relevant.length >= 2
      ? `\n\n💡 *These studies span ${yearRange ? `${yearRange}` : 'multiple years'} and cover ${categories.slice(0,3).join(', ')}. You might ask me to compare them or summarize their findings.*`
      : '';
    
    const gaps = detectResearchGaps(all);
    const gapNote = gaps.length ? `\n\n📌 *Research gap spotted: No studies in the repository cover **${gaps[0]}** yet.*` : '';
    
    return { text:`Found **${relevant.length}** relevant ${relevant.length===1?'study':'studies'}:\n\n${list}${connectionNote}${gapNote}${refs}`, citations:relevant, source:'local' };
  }

  // Off-topic detection
  const stemKeywords = ['science','biology','chemistry','physics','math','engineering','technology','research','study','data','experiment','hypothesis','theory','algorithm','robotics','environment','health','genetics','ecology','climate','energy','computer','programming','statistics','quantum','genomics','nanotechnology'];
  const hasStemContext = stemKeywords.some(k => q.includes(k));
  if (!hasStemContext && q.length > 10 && !/repository|upload|portal|study|studies/.test(q)) {
    return { text:`I'm focused on academic and STEM topics. I can help you with:\n• **Definitions** of scientific concepts\n• **APA citations** for studies\n• **Finding** studies in the repository\n• **Research gaps** and topic suggestions\n\nWhat STEM topic can I help you with?`, citations:[], source:'local' };
  }

  // No results — intelligent fallback
  const gaps = detectResearchGaps(all);
  const gapNote = gaps.includes(query.split(' ')[0]) ? `\n\n📌 *"${query}" appears to be an unexplored area in this repository — a potential research opportunity!*` : '';
  return { text:`No studies matched **"${query}"** in the repository.${gapNote}\n\n**I can still help:**\n• Ask *"Define ${query}"* for an academic definition\n• Try broader keywords or a different phrasing\n• Ask *"List all studies"* to browse everything\n• Use the **Repository** tab to filter by category\n• Ask *"Suggest topics related to ${query}"* for research ideas`, citations:[], source:'local' };
}

// ══════════════════════════════════════════════════════════════════
//  PLAGIARISM ENGINE — TF-IDF cosine similarity
// ══════════════════════════════════════════════════════════════════
const STOPWORDS = new Set(['the','a','an','and','or','but','in','on','at','to','for','of','with','by','from','as','is','was','are','were','be','been','being','have','has','had','do','does','did','will','would','could','should','may','might','can','this','that','these','those','it','its','we','our','they','their','i','my','he','she','his','her','us','which','who','what','when','where','how','all','also','into','than','then','so','if','not','no','up','out','about','over','such','through','more','other','very','just','because','between','after','before','during','while','study','research','paper','analysis','using','based','results','data','show','found','effect','used','new','two','one','first','second','three']);

function tokenize(text) {
  return (text||'').toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(w=>w.length>2&&!STOPWORDS.has(w));
}
function buildTF(tokens) {
  const tf={};
  tokens.forEach(t=>tf[t]=(tf[t]||0)+1);
  const total=tokens.length||1;
  Object.keys(tf).forEach(k=>tf[k]/=total);
  return tf;
}
function cosineSimilarity(tfA,tfB) {
  const keys=new Set([...Object.keys(tfA),...Object.keys(tfB)]);
  let dot=0,magA=0,magB=0;
  keys.forEach(k=>{const a=tfA[k]||0,b=tfB[k]||0;dot+=a*b;magA+=a*a;magB+=b*b;});
  return (magA&&magB)?dot/(Math.sqrt(magA)*Math.sqrt(magB)):0;
}
function getSharedTerms(textA,textB) {
  const wordsA=tokenize(textA),wordsB=new Set(tokenize(textB));
  const freq={};
  wordsA.filter(w=>wordsB.has(w)).forEach(w=>freq[w]=(freq[w]||0)+1);
  return Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([w])=>w);
}
function checkPlagiarism(inputText,studies,excludeId=null) {
  if(!inputText||inputText.trim().length<50) return [];
  const tokensA=tokenize(inputText);
  if(tokensA.length<10) return [];
  const tfA=buildTF(tokensA);
  return studies.filter(s=>s.id!==excludeId&&s.abstract).map(s=>{
    const tfB=buildTF(tokenize(s.abstract));
    const score=cosineSimilarity(tfA,tfB);
    return {study:s,score,shared:getSharedTerms(inputText,s.abstract)};
  }).filter(r=>r.score>0.08).sort((a,b)=>b.score-a.score).slice(0,5);
}
function plagiarismLevel(score) {
  if(score>=0.5) return {label:'High Similarity',  color:'var(--red)',  bg:'var(--red-light)',  block:true};
  if(score>=0.3) return {label:'Moderate Similarity',color:'#f59e0b',  bg:'#fef9c3',           block:false};
  if(score>=0.15)return {label:'Low Similarity',   color:'var(--teal)',bg:'var(--teal-light)', block:false};
  return              {label:'Minimal Similarity', color:'var(--green)',bg:'var(--green-light)',block:false};
}

const MD = memo(function MD({ text }) {
  const lines = (text||'').split('\n');
  return (
    <div className="md">
      {lines.map((line,i) => {
        if (!line.trim()) return <div key={i} style={{height:5}}/>;
        if (line.startsWith('---')) return <hr key={i} style={{border:'none',borderTop:'1px solid var(--border)',margin:'8px 0'}}/>;
        if (/^#{1,3}\s/.test(line)) return <div key={i} className="md" style={{fontFamily:'var(--font-display)',fontWeight:600,fontSize:'0.97rem',color:'var(--ink)',margin:'8px 0 4px'}}>{line.replace(/^#{1,3}\s/,'')}</div>;
        const html = line
          .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
          .replace(/\*(.+?)\*/g,'<em>$1</em>')
          .replace(/`(.+?)`/g,'<code>$1</code>');
        if (/^\d+\.\s/.test(line)) {
          const num = line.match(/^(\d+)\./)[1];
          return <div key={i} className="md-num"><span className="md-num-n">{num}.</span><span dangerouslySetInnerHTML={{__html:html.replace(/^\d+\.\s*/,'')}}/></div>;
        }
        if (/^[•\-]\s/.test(line)) return <div key={i} className="md-bullet"><span className="md-bullet-dot">•</span><span dangerouslySetInnerHTML={{__html:html.replace(/^[•\-]\s*/,'')}}/></div>;
        return <div key={i} dangerouslySetInnerHTML={{__html:html}}/>;
      })}
    </div>
  );
});

let toastFn = null;
function ToastProvider({ children }) {
  const [toasts,setToasts] = useState([]);
  toastFn = useCallback((msg,type='ok')=>{
    const id=Date.now();
    setToasts(t=>[...t,{id,msg,type}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),3800);
  },[]);
  return (<>
    {children}
    <div className="toasts">
      {toasts.map(t=><div key={t.id} className={`toast ${t.type}`}><span>{t.type==='ok'?'✓':t.type==='err'?'✕':'ℹ'}</span>{t.msg}</div>)}
    </div>
  </>);
}
const toast = { ok:m=>toastFn?.(m,'ok'), err:m=>toastFn?.(m,'err'), info:m=>toastFn?.(m,'info') };

function GlobalSearch({ onOpenStudy }) {
  const [query,setQuery]=useState('');
  const [results,setResults]=useState([]);
  const [loading,setLoading]=useState(false);
  const [open,setOpen]=useState(false);
  const ref=useRef(null);
  const debounceRef=useRef(null);

  useEffect(()=>{
    if(!open) return;
    const close=e=>{ if(ref.current && !ref.current.contains(e.target)) setOpen(false); };
    const esc=e=>e.key==='Escape'&&setOpen(false);
    document.addEventListener('mousedown',close);
    document.addEventListener('keydown',esc);
    return ()=>{ document.removeEventListener('mousedown',close); document.removeEventListener('keydown',esc); };
  },[open]);

  useEffect(()=>{
    clearTimeout(debounceRef.current);
    const q=query.trim();
    if(!q){ setResults([]); setLoading(false); return; }
    setLoading(true);
    debounceRef.current=setTimeout(async()=>{
      try{
        const res=await API.getStudies({search:q,status:'active',perPage:8});
        setResults(res.data||[]);
      }catch{ setResults([]); }
      setLoading(false);
    },300);
    return ()=>clearTimeout(debounceRef.current);
  },[query]);

  const pick=(s)=>{
    onOpenStudy?.(s);
    setOpen(false);
    setQuery('');
    setResults([]);
  };

  return (
    <div className="topbar-search" ref={ref} data-tour="global-search">
      <div className="sb">
        <Ico.search/>
        <input
          placeholder="Search studies, authors, keywords…"
          value={query}
          onChange={e=>{setQuery(e.target.value);setOpen(true);}}
          onFocus={()=>query&&setOpen(true)}
          aria-label="Global search"
        />
        {query&&<button onClick={()=>{setQuery('');setResults([]);}} style={{background:'none',border:'none',cursor:'pointer',color:'var(--muted)',padding:'0 2px',fontSize:'1rem',lineHeight:1}} aria-label="Clear search">✕</button>}
      </div>
      {open && query.trim() && (
        <div className="topbar-search-results">
          {loading ? (
            <div className="topbar-search-empty"><span className="spin"/></div>
          ) : results.length===0 ? (
            <div className="topbar-search-empty">No studies found for "{query}"</div>
          ) : results.map(s=>(
            <button key={s.id} className="topbar-search-item" onClick={()=>pick(s)}>
              <div className="avatar" style={{width:30,height:30,fontSize:'0.7rem',flexShrink:0}}>{initials(s.uploadedByName)}</div>
              <div style={{flex:1,minWidth:0}}>
                <div className="topbar-search-title">{s.title}</div>
                <div className="topbar-search-sub">{(s.authors||[]).join(', ')}{s.year?` · ${s.year}`:''}</div>
              </div>
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

function Modal({ title, onClose, children, wide }) {
  useEffect(()=>{

    document.addEventListener('keydown',esc);
    document.body.style.overflow = 'hidden';
    return ()=>{ document.removeEventListener('keydown',esc); document.body.style.overflow=''; };
  },[onClose]);
  return (
    <div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose?.()}>

      </div>

  );

// ── Command palette: Ctrl/Cmd+K quick page switcher ──────────────
function CommandPalette({ items, onNavigate, onClose }) {
  const [query, setQuery] = useState('');
  const [activeIndex, setActiveIndex] = useState(0);
  const inputRef = useRef(null);

  useEffect(()=>{
    inputRef.current?.focus();
    document.body.style.overflow = 'hidden';
    return ()=>{ document.body.style.overflow = ''; };
  },[]);

  const filtered = useMemo(()=>{
    const q = query.trim().toLowerCase();
    if(!q) return items;
    return items.filter(it=>it.label.toLowerCase().includes(q));
  },[query, items]);

  useEffect(()=>{ setActiveIndex(0); },[query]);

  const select = item => { if(item){ onNavigate(item.id); onClose(); } };

  const onKeyDown = e => {
    if(e.key==='ArrowDown'){ e.preventDefault(); setActiveIndex(i=>Math.min(i+1, filtered.length-1)); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); setActiveIndex(i=>Math.max(i-1, 0)); }
    else if(e.key==='Enter'){ e.preventDefault(); select(filtered[activeIndex]); }
    else if(e.key==='Escape'){ e.preventDefault(); onClose(); }
  };

  return (
    <div className="cmdk-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="cmdk-modal" role="dialog" aria-modal="true" aria-label="Quick navigation">
        <div className="cmdk-input-row">
          <Ico.search/>
          <input
            ref={inputRef}
            value={query}
            onChange={e=>setQuery(e.target.value)}
            onKeyDown={onKeyDown}
            placeholder="Jump to a page…"
            aria-label="Search pages"
            autoFocus
          />
          <span className="kbd">Esc</span>
        </div>
        <div className="cmdk-list" role="listbox">
          {filtered.length===0 && <div className="cmdk-empty">No matching pages.</div>}
          {filtered.map((item,i)=>{
            const IconComp = Ico[item.icon];
            return (
              <button key={item.id}
                className={`cmdk-item${i===activeIndex?' active':''}`}
                onMouseEnter={()=>setActiveIndex(i)}
                onClick={()=>select(item)}
                role="option"
                aria-selected={i===activeIndex}>
                <span className="cmdk-item-icon">{IconComp&&<IconComp/>}</span>
                <span className="cmdk-item-label">{item.label}</span>
                <span className="cmdk-item-enter">↵</span>
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}


function APABox({ study, currentUser }) {
  const [copied,setCopied]=useState(false);
  const apa=generateAPA(study);
  const copy=()=>navigator.clipboard?.writeText(apa).then(()=>{
    setCopied(true);
    setTimeout(()=>setCopied(false),2000);
    // track citation count + log who cited
    db.collection('studies').doc(study.id).update({
      citationCount: firebase.firestore.FieldValue.increment(1)
    }).catch(()=>{});
    if(currentUser){
      // FIX: use userId as doc ID — one doc per user per study, ever.
      // .set({merge:true}) upserts so repeated citations never create new docs.
      const citRef = db.collection('studies').doc(study.id).collection('citations').doc(currentUser.id);
      citRef.get().then(snap => {
        citRef.set({
          userId: currentUser.id,
          userName: currentUser.name,
          userEmail: currentUser.email,
          institution: currentUser.institution||'',
          department: currentUser.department||'',
          ...(snap.exists ? {} : { firstCitedAt: new Date().toISOString() }),
          lastCitedAt: new Date().toISOString(),
          count: firebase.firestore.FieldValue.increment(1),
        }, { merge: true });
      }).catch(()=>{});
    }
  });
  return (
    <div>
      <div className="apa-box">{apa}<button className="apa-cp" onClick={copy}>{copied?'✓ Copied':'Copy'}</button></div>
      {(study.citationCount||0)>0&&<div style={{fontSize:'0.7rem',color:'var(--muted)',marginTop:4,textAlign:'right'}}>📋 Cited {study.citationCount} time{study.citationCount!==1?'s':''}</div>}
    </div>
  );
}

function CatPicker({ selected, onChange, max=2, cats=[] }) {
  const toggle=cat=>{
    if (selected.includes(cat)){onChange(selected.filter(c=>c!==cat));return;}
    if (selected.length>=max){toast.err(`Select up to ${max} categories only.`);return;}
    onChange([...selected,cat]);
  };
  return (
    <div className="cat-picker" role="group" aria-label="Category selection">
      {cats.map(cat=>{
        const isSel=selected.includes(cat),isDis=!isSel&&selected.length>=max;
        return (
          <div key={cat} className={`cat-opt${isSel?' sel':''}${isDis?' dis':''}`}
            onClick={()=>!isDis&&toggle(cat)}
            role="checkbox" aria-checked={isSel} tabIndex={isDis?-1:0}
            onKeyDown={e=>(e.key==='Enter'||e.key===' ')&&!isDis&&toggle(cat)}>
            <div className="cat-cb">{isSel&&<span style={{color:'var(--ink)',fontSize:'0.63rem',fontWeight:900}}>✓</span>}</div>
            <span style={{fontSize:'0.875rem',fontWeight:500,color:'var(--ink-3)'}}>{cat}</span>
          </div>
        );
      })}
      <p className="hint">Select 1–{max} categories. {selected.length}/{max} selected.</p>
    </div>
  );
}

function ForgotModal({ onClose }) {
  const [step,setStep]=useState('email');       // 'email' → 'question' → 'newpw' → 'done'
  const [email,setEmail]=useState('');
  const [secQ,setSecQ]=useState('');
  const [answer,setAnswer]=useState('');
  const [uid,setUid]=useState('');
  const [pw,setPw]=useState('');
  const [pw2,setPw2]=useState('');
  const [showPw,setShowPw]=useState(false);
  const [err,setErr]=useState('');
  const [loading,setLoading]=useState(false);

  // Step indicators
  const steps=['Email','Security Question','New Password'];
  const stepIdx={'email':0,'question':1,'newpw':2,'done':3};

  const stepEmail=async()=>{
    setErr('');
    if(!email.trim()){setErr('Please enter your email address.');return;}
    setLoading(true);
    try{
      const res=await API.getSecurityQuestion(email);
      setUid(res.uid);setSecQ(res.secQ);setStep('question');
    }catch(e){
      const msg=e.message||'';
      if(msg.includes('anonymous')||msg.includes('ANONYMOUS')||e.code==='auth/operation-not-allowed')
        setErr('On-site reset requires Anonymous Authentication to be enabled in Firebase Console → Authentication → Sign-in methods → Anonymous.');
      else setErr(msg);
    }
    setLoading(false);
  };

  const stepQuestion=async()=>{
    setErr('');
    if(!answer.trim()){setErr('Please enter your security answer.');return;}
    setLoading(true);
    try{
      await API.verifySecurityAnswer(uid,answer);
      setStep('newpw');
    }catch(e){setErr(e.message);}
    setLoading(false);
  };

  const stepNewPw=async()=>{
    setErr('');
    if(pw.length<8){setErr('Password must be at least 8 characters.');return;}
    if(pw!==pw2){setErr('Passwords do not match.');return;}
    setLoading(true);
    try{
      await API.resetPasswordOnSite(uid,pw);
      setStep('done');
    }catch(e){setErr(e.message);}
    setLoading(false);
  };

  const titles={announcements:'Announcements','email':'Reset Your Password','question':'Security Question','newpw':'Set New Password','done':'Password Updated'};

  return (
    <Modal title={titles[step]} onClose={onClose}>
      {/* Progress bar */}
      {step!=='done'&&(
        <div style={{display:'flex',gap:0,marginBottom:20,borderRadius:8,overflow:'hidden',border:'1px solid var(--border)'}}>
          {steps.map((s,i)=>(
            <div key={s} style={{
              flex:1,padding:'6px 4px',textAlign:'center',
              fontSize:'0.68rem',fontWeight:600,
              background:i<stepIdx[step]?'var(--green-light)':i===stepIdx[step]?'var(--gold-bg)':'var(--surface)',
              color:i<stepIdx[step]?'var(--green)':i===stepIdx[step]?'var(--gold)':'var(--muted)',
              borderRight:i<2?'1px solid var(--border)':'none',
              transition:'all .3s'
            }}>
              {i<stepIdx[step]?'✓ ':''}{s}
            </div>
          ))}
        </div>
      )}

      {err&&<div className="al al-err" role="alert">{err}</div>}

      {step==='email'&&(
        <>
          <p className="muted" style={{marginBottom:16,fontSize:'var(--text-sm)'}}>
            Enter your registered email address and we'll verify your identity using your security question — no email needed.
          </p>
          <div className="fg">
            <label htmlFor="fp-email">Email Address</label>
            <input id="fp-email" type="email" placeholder="your@email.com"
              value={email} onChange={e=>setEmail(e.target.value)}
              onKeyDown={e=>e.key==='Enter'&&stepEmail()} autoFocus/>
          </div>
          <div style={{display:'flex',gap:9,justifyContent:'flex-end',marginTop:4}}>
            <button className="btn btn-ol" onClick={onClose}>Cancel</button>
            <button className="btn btn-gold" onClick={stepEmail} disabled={loading||!email.trim()}>
              {loading?<><span className="spin spin-dark"/>Checking…</>:'Continue →'}
            </button>
          </div>
        </>
      )}

      {step==='question'&&(
        <>
          <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'var(--radius)',padding:'12px 14px',marginBottom:16}}>
            <p style={{fontSize:'var(--text-xs)',color:'var(--muted)',marginBottom:4,fontWeight:600,textTransform:'uppercase',letterSpacing:'0.5px'}}>Your Security Question</p>
            <p style={{fontSize:'var(--text-sm)',color:'var(--ink)',fontWeight:500}}>{secQ}</p>
          </div>
          <div className="fg">
            <label htmlFor="fp-answer">Your Answer</label>
            <input id="fp-answer" placeholder="Type your answer…"
              value={answer} onChange={e=>setAnswer(e.target.value)}
              onKeyDown={e=>e.key==='Enter'&&stepQuestion()} autoFocus/>
            <p style={{fontSize:'var(--text-xs)',color:'var(--muted)',marginTop:4}}>Answer is not case-sensitive.</p>
          </div>
          <div style={{display:'flex',gap:9,justifyContent:'flex-end',marginTop:4}}>
            <button className="btn btn-ol" onClick={()=>{setStep('email');setAnswer('');setErr('');}}>← Back</button>
            <button className="btn btn-gold" onClick={stepQuestion} disabled={loading||!answer.trim()}>
              {loading?<><span className="spin spin-dark"/>Verifying…</>:'Verify Answer →'}
            </button>
          </div>
        </>
      )}

      {step==='newpw'&&(
        <>
          <p className="muted" style={{marginBottom:16,fontSize:'var(--text-sm)'}}>
            Identity verified! Choose a new password for your account.
          </p>
          <div className="fg">
            <label htmlFor="fp-pw">New Password</label>
            <div style={{position:'relative'}}>
              <input id="fp-pw" type={showPw?'text':'password'} placeholder="Min. 8 characters"
                value={pw} onChange={e=>setPw(e.target.value)} autoFocus
                style={{paddingRight:42}}/>
              <button type="button" onClick={()=>setShowPw(v=>!v)}
                style={{position:'absolute',right:10,top:'50%',transform:'translateY(-50%)',background:'none',border:'none',color:'var(--muted)',cursor:'pointer',fontSize:'1rem',padding:'2px 4px'}}>
                {showPw?'🙈':'👁'}
              </button>
            </div>
            {pw&&(
              <div style={{marginTop:5,display:'flex',gap:4,alignItems:'center'}}>
                {[1,2,3,4].map(i=>(
                  <div key={i} style={{height:3,flex:1,borderRadius:4,background:
                    pw.length>=12&&/[A-Z]/.test(pw)&&/[0-9]/.test(pw)&&/[^A-Za-z0-9]/.test(pw)?'var(--green)':
                    pw.length>=10&&/[A-Z]/.test(pw)&&/[0-9]/.test(pw)?'var(--teal)':
                    pw.length>=8?'var(--gold)':'var(--red)',
                    opacity:i===1?1:i===2&&pw.length>=8?1:i===3&&pw.length>=10&&/[A-Z]/.test(pw)?1:i===4&&pw.length>=12&&/[^A-Za-z0-9]/.test(pw)?1:0.2
                  }}/>
                ))}
                <span style={{fontSize:'0.65rem',color:'var(--muted)',whiteSpace:'nowrap'}}>
                  {pw.length<8?'Too short':pw.length<10?'Fair':pw.length<12?'Good':'Strong'}
                </span>
              </div>
            )}
          </div>
          <div className="fg">
            <label htmlFor="fp-pw2">Confirm New Password</label>
            <input id="fp-pw2" type={showPw?'text':'password'} placeholder="Repeat new password"
              value={pw2} onChange={e=>setPw2(e.target.value)}
              onKeyDown={e=>e.key==='Enter'&&stepNewPw()}
              style={{borderColor:pw2&&pw!==pw2?'var(--red)':pw2&&pw===pw2?'var(--green)':''}}/>
            {pw2&&pw!==pw2&&<p style={{fontSize:'var(--text-xs)',color:'var(--red)',marginTop:3}}>Passwords do not match.</p>}
            {pw2&&pw===pw2&&<p style={{fontSize:'var(--text-xs)',color:'var(--green)',marginTop:3}}>✓ Passwords match.</p>}
          </div>
          <div style={{display:'flex',gap:9,justifyContent:'flex-end',marginTop:4}}>
            <button className="btn btn-ol" onClick={()=>{setStep('question');setPw('');setPw2('');setErr('');}}>← Back</button>
            <button className="btn btn-gold" onClick={stepNewPw} disabled={loading||!pw||!pw2}>
              {loading?<><span className="spin spin-dark"/>Saving…</>:'Save New Password'}
            </button>
          </div>
        </>
      )}

      {step==='done'&&(
        <div style={{textAlign:'center',padding:'18px 0'}}>
          <div style={{fontSize:'3rem',marginBottom:12}}>🔓</div>
          <h3 style={{fontFamily:'var(--font-display)',fontSize:'1.15rem',marginBottom:8,color:'var(--green)'}}>Password Updated!</h3>
          <p className="muted" style={{marginBottom:8,fontSize:'var(--text-sm)'}}>

          <p style={{fontSize:'var(--text-xs)',color:'var(--muted)',marginBottom:22,background:'var(--surface)',borderRadius:8,padding:'8px 12px',border:'1px solid var(--border)'}}>
            💡 The new password takes effect on your next sign-in.
          </p>
          <button className="btn btn-gold btn-full" onClick={onClose}>Back to Sign In</button>
        </div>
      )}
    </Modal>
  );
}

//  OFFLINE READING — IndexedDB wrapper
// ══════════════════════════════════════════════════════════════════
const OfflineDB = (() => {
  const DB_NAME = 'sabnahis_offline';
  const STORE   = 'studies';
  const VERSION = 1;
  let _db = null;

  function open() {
    if (_db) return Promise.resolve(_db);
    return new Promise((res, rej) => {
      const req = indexedDB.open(DB_NAME, VERSION);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(STORE)) {
          db.createObjectStore(STORE, { keyPath: 'id' });
        }
      };
      req.onsuccess = e => { _db = e.target.result; res(_db); };
      req.onerror   = e => rej(e.target.error);
    });
  }

  async function save(study) {
    const db = await open();
    return new Promise((res, rej) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put({ ...study, savedAt: new Date().toISOString() });
      tx.oncomplete = res;
      tx.onerror    = e => rej(e.target.error);
    });
  }

  async function remove(id) {
    const db = await open();
    return new Promise((res, rej) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).delete(id);
      tx.oncomplete = res;
      tx.onerror    = e => rej(e.target.error);
    });
  }

  async function getAll() {
    const db = await open();
    return new Promise((res, rej) => {
      const tx  = db.transaction(STORE, 'readonly');
      const req = tx.objectStore(STORE).getAll();
      req.onsuccess = e => res(e.target.result || []);
      req.onerror   = e => rej(e.target.error);
    });
  }

  async function has(id) {
    const db = await open();
    return new Promise((res, rej) => {
      const tx  = db.transaction(STORE, 'readonly');
      const req = tx.objectStore(STORE).getKey(id);
      req.onsuccess = e => res(!!e.target.result);
      req.onerror   = e => rej(e.target.error);
    });
  }

  return { save, remove, getAll, has };
})();

//  OFFLINE READING PAGE
// ══════════════════════════════════════════════════════════════════
function OfflineReadingPage({ currentUser, onOpenStudy }) {
  const [studies, setStudies] = useState([]);
  const [loading, setLoading] = useState(true);
  const toast = useToast();

  useEffect(() => {
    OfflineDB.getAll().then(all => {
      setStudies(all.sort((a, b) => new Date(b.savedAt) - new Date(a.savedAt)));
      setLoading(false);
    });
  }, []);

  const handleRemove = async (id) => {
    await OfflineDB.remove(id);
    setStudies(prev => prev.filter(s => s.id !== id));
    toast.ok('Removed from offline library.');
  };

  return (
    <div className="page-wrap">
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:20,flexWrap:'wrap'}}>
        <div>
          <h1 style={{fontSize:'1.35rem',fontWeight:700,margin:0}}>📥 Offline Reading</h1>
          <p style={{margin:'4px 0 0',color:'var(--muted)',fontSize:'0.82rem'}}>Studies saved to your device — readable without internet.</p>
        </div>
        <span style={{marginLeft:'auto',background:'var(--surface)',border:'1px solid var(--border)',borderRadius:99,padding:'4px 14px',fontSize:'0.78rem',fontWeight:600,color:'var(--muted)'}}>
          {studies.length} saved
        </span>
      </div>

      {loading && <div style={{color:'var(--muted)',padding:40,textAlign:'center'}}>Loading saved studies…</div>}

      {!loading && studies.length === 0 && (
        <div style={{textAlign:'center',padding:'60px 20px',color:'var(--muted)'}}>
          <div style={{fontSize:'2.5rem',marginBottom:12}}>📭</div>
          <div style={{fontWeight:600,marginBottom:6}}>No offline studies yet</div>
          <div style={{fontSize:'0.82rem'}}>Open any study and tap <strong>Save Offline</strong> to read it without internet.</div>
        </div>
      )}

      <div style={{display:'grid',gap:14}}>
        {studies.map(s => (
          <div key={s.id} style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:'var(--radius)',padding:'16px 18px',display:'flex',gap:14,alignItems:'flex-start'}}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontWeight:600,fontSize:'0.92rem',marginBottom:4,lineHeight:1.35}}>{s.title}</div>
              <div style={{fontSize:'0.75rem',color:'var(--muted)',marginBottom:8}}>
                {(s.authors||[]).join(', ')} {s.year ? `· ${s.year}` : ''}
              </div>
              {s.abstract && (
                <p style={{fontSize:'0.78rem',color:'var(--ink-2)',margin:'0 0 10px',lineHeight:1.55,display:'-webkit-box',WebkitLineClamp:3,WebkitBoxOrient:'vertical',overflow:'hidden'}}>
                  {s.abstract}
                </p>
              )}
              <div style={{display:'flex',gap:6,flexWrap:'wrap',alignItems:'center'}}>
                {(s.categories||[]).map(c=>(
                  <span key={c} style={{fontSize:'0.68rem',background:'var(--blue-light)',color:'var(--blue)',padding:'2px 8px',borderRadius:99,fontWeight:600}}>{c}</span>
                ))}
                <span style={{fontSize:'0.68rem',color:'var(--muted)',marginLeft:'auto'}}>Saved {new Date(s.savedAt).toLocaleDateString('en-PH',{month:'short',day:'numeric',year:'numeric'})}</span>
              </div>
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:7,flexShrink:0}}>
              <button className="btn btn-primary btn-sm" onClick={() => {
                API.trackStudy(s.id,'viewCount',currentUser).catch(()=>{});
                API.setLastRead(currentUser.id,s).catch(()=>{});
                trackRecentlyViewed(s);
                onOpenStudy && onOpenStudy(s);
              }}>Read</button>
              <button className="btn btn-ol btn-sm" style={{color:'var(--red)',borderColor:'var(--red)'}} onClick={() => handleRemove(s.id)}>Remove</button>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function StudyDetailModal({ study, onClose, currentUser, onDelete, allStudies=[], onOpenStudy }) {
  const canDel = currentUser.role==='admin';
  const handleDL = () => { API.trackStudy(study.id,'downloadCount',currentUser); toast.ok('Download tracked!'); };
  const gdriveData = study.gdrive || study.file || null;
  const gdriveUrl = gdriveData ? (gdriveData.driveUrl || gdriveData.viewUrl || null) : null;
  const gdriveDownload = gdriveData ? (gdriveData.downloadUrl || null) : null;
  const [faved, setFaved] = useState(false);
  const [favLoading, setFavLoading] = useState(true);
  const [favBy, setFavBy] = useState([]);
  const [showFavBy, setShowFavBy] = useState(false);
  const [absExpanded, setAbsExpanded] = useState(false);
  const [savedOffline, setSavedOffline] = useState(false);
  const [offlineLoading, setOfflineLoading] = useState(false);
  const isOwner = currentUser.id === study.uploadedBy;
  const ABS_CLAMP = 60;
  const absWords = (study.abstract||'').split(/\s+/).filter(Boolean);
  const absIsLong = absWords.length > ABS_CLAMP;
  const absPreview = absIsLong ? absWords.slice(0, ABS_CLAMP).join(' ') + '…' : study.abstract;

  useEffect(()=>{
    API.isFavorited(currentUser.id, study.id).then(v=>{setFaved(v);setFavLoading(false);});
    if(isOwner) API.getFavoritedBy(study.id).then(setFavBy);
    OfflineDB.has(study.id).then(setSavedOffline);
  },[]);

  // Reading badge tracking — only counts toward badges after the student
  // has spent meaningful time with the study (not just opened it).
  useEffect(()=>{
    if(currentUser.role==='admin'||isOwner) return;
    console.log('[readBadge] dwell timer started for', study.id, 'will fire in', READ_DWELL_MS, 'ms');
    const t = setTimeout(()=>{
      console.log('[readBadge] dwell timer fired for', study.id);
      API.markStudyRead(currentUser.id, study).then(isNew=>{
        console.log('[readBadge] markStudyRead result, isNew=', isNew);
        if(!isNew) return;
        toast.ok('📖 Marked as read!');
        API.getReadCount(currentUser.id).then(count=>{
          console.log('[readBadge] new read count=', count);
          const b = [...READING_BADGES].reverse().find(x=>x.min<=count);
          const prevB = [...READING_BADGES].reverse().find(x=>x.min<=count-1);
          if(b && b!==prevB) toast.ok(`${b.icon} New badge earned: ${b.label}!`);
        }).catch(e=>console.warn('getReadCount failed:',e));
      }).catch(e=>console.warn('markStudyRead failed:',e));
    }, READ_DWELL_MS);
    return ()=>{console.log('[readBadge] timer cleared for', study.id);clearTimeout(t);};
  },[study.id]);

  const toggleFav = async () => {
    // Optimistic update — flip state immediately, revert on failure
    const prev = faved;
    setFaved(!prev);
    setFavLoading(false); // keep button responsive
    try {
      if(prev){ await API.removeFavorite(currentUser.id, study.id); toast.ok('Removed from bookmarks.'); }
      else { await API.addFavorite(currentUser.id, study); toast.ok('📌 Bookmarked!'); }

    <Modal title="Study Details" onClose={onClose} wide>

      <h2 className="sd-title">{study.title}</h2>

        <span style={{fontSize:'var(--text-xs)',color:'var(--muted)',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.5px',flexShrink:0}}>Authors</span>
        {(study.coAuthors && study.coAuthors.length > 0)
          ? [
              <span key="uploader" className="author-tag self" style={{fontSize:'var(--text-xs)'}}>
                <span className="author-tag-avatar"><span>{(study.uploadedByName||(study.authors&&study.authors[0])||'?').charAt(0).toUpperCase()}</span></span>
                <span style={{overflow:'hidden',textOverflow:'ellipsis',maxWidth:160}}>{study.uploadedByName||(study.authors&&study.authors[0])||'Unknown'}</span>
                <span style={{fontSize:'0.6rem',opacity:0.6,fontWeight:400,marginLeft:1}}>(owner)</span>
              </span>,
              ...study.coAuthors.map((ca,i)=>(
                <span key={i} className={`author-tag${ca.registered?' registered':''}`} style={{fontSize:'var(--text-xs)'}}>
                  <span className="author-tag-avatar"><span>{(ca.name||'?').charAt(0).toUpperCase()}</span></span>
                  <span style={{overflow:'hidden',textOverflow:'ellipsis',maxWidth:160}}>{ca.name}</span>
                  {!ca.registered&&<span style={{fontSize:'0.6rem',opacity:0.55,fontWeight:400,marginLeft:1}}>(ext.)</span>}
                </span>

          : (study.authors||[]).map((a,i)=>(
