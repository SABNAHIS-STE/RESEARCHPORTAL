      {selected.size>0&&(
        <div style={{display:'flex',flexDirection:'column',gap:8,marginBottom:12}}>
          <div style={{display:'flex',alignItems:'center',gap:9,padding:'10px 14px',background:'var(--gold-bg)',border:'1px solid var(--gold)',borderRadius:'var(--radius)',flexWrap:'wrap'}}>
            <span style={{fontSize:'0.82rem',fontWeight:600,color:'var(--gold)',flex:1}}>{selected.size} student{selected.size!==1?'s':''} selected</span>
            <button className="btn btn-ol btn-sm" onClick={()=>setBulkAssignOpen(o=>!o)}>🏷 Assign Grade/Section</button>
            <button className="btn btn-grn btn-sm" onClick={()=>bulkAction('approved')} disabled={bulkLoading}>{bulkLoading?<span className="spin" style={{width:12,height:12}}/>:<><Ico.chk/> Approve All</>}</button>
            <button className="btn btn-ol btn-sm" onClick={()=>bulkAction('rejected')} disabled={bulkLoading}>✕ Reject All</button>
            <button className="btn btn-ol btn-sm" onClick={()=>setSelected(new Set())}>Clear</button>
          </div>
          {bulkAssignOpen&&(
            <div className="card" style={{padding:'12px 14px',display:'flex',gap:10,flexWrap:'wrap',alignItems:'flex-end'}}>
              <div className="fg" style={{minWidth:140,marginBottom:0}}>
                <label>Grade Level</label>
                <select value={bulkGrade} onChange={e=>setBulkGrade(e.target.value)}>
                  <option value="">— Leave unchanged —</option>
                  {['8','9','10','11','12'].map(g=><option key={g} value={g}>Grade {g}</option>)}
                </select>
              </div>
              <div className="fg" style={{minWidth:160,marginBottom:0}}>
                <label>Section</label>
                <input placeholder="e.g. Rizal, STEM-A" value={bulkSection} onChange={e=>setBulkSection(e.target.value)}/>
              </div>
              <button className="btn btn-ink btn-sm" onClick={bulkAssignGrade} disabled={bulkLoading}>{bulkLoading?<span className="spin" style={{width:12,height:12}}/>:'Apply to Selected'}</button>
              <button className="btn btn-ol btn-sm" onClick={()=>{setBulkAssignOpen(false);setBulkGrade('');setBulkSection('');}}>Cancel</button>
            </div>
          )}
        </div>
      )}

      {loading?<div className="card" style={{textAlign:'center',padding:'30px',color:'var(--muted)'}}>Loading…</div>
      :filtered.length===0?<div className="card"><div className="empty" style={{padding:'36px 0'}}><div className="empty-ico">👤</div><h3>No students found</h3></div></div>
      :viewMode==='grouped'?(
        /* ── Grouped by Grade → Section ── */
        <div style={{display:'flex',flexDirection:'column',gap:18}}>
          {Object.entries(grouped).map(([grade,sections])=>(
            <div key={grade}>
              <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:10}}>
                <div style={{width:4,height:28,borderRadius:2,background:GRADE_COLORS[grade]||'var(--muted)',flexShrink:0}}/>
                <h3 style={{fontFamily:'var(--font-display)',fontSize:'var(--text-lg)',fontWeight:600,color:'var(--ink)'}}>
                  {grade==='Unknown'?'No Grade Assigned':`Grade ${grade}`}
                </h3>
                <span style={{fontSize:'0.72rem',color:'var(--muted)',marginLeft:4}}>
                  {Object.values(sections).flat().length} student{Object.values(sections).flat().length!==1?'s':''}
                </span>
              </div>
              <div style={{display:'flex',flexDirection:'column',gap:10,paddingLeft:14,borderLeft:`2px solid ${GRADE_BG[grade]||'var(--border)'}`}}>
                {Object.entries(sections).sort(([a],[b])=>a.localeCompare(b)).map(([sec,list])=>(
                  <div key={sec} className="card" style={{padding:'12px 16px',borderLeft:`3px solid ${GRADE_COLORS[grade]||'var(--border)'}`}}>
                    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10,flexWrap:'wrap',gap:6}}>
                      <div style={{display:'flex',alignItems:'center',gap:8}}>
                        <span style={{fontWeight:600,fontSize:'var(--text-sm)',color:'var(--ink)'}}>{sec}</span>
                        <span style={{fontSize:'0.68rem',color:'var(--muted)',background:'var(--surface)',border:'1px solid var(--border)',borderRadius:99,padding:'1px 8px'}}>{list.length} student{list.length!==1?'s':''}</span>
                      </div>
                      <div style={{display:'flex',gap:5}}>
                        {list.some(u=>!selected.has(u.id))
                          ?<button className="btn btn-ol btn-sm" style={{fontSize:'0.68rem',minHeight:28,padding:'3px 10px'}} onClick={()=>toggleAll(list)}>☐ Select All</button>
                          :<button className="btn btn-ol btn-sm" style={{fontSize:'0.68rem',minHeight:28,padding:'3px 10px'}} onClick={()=>toggleAll(list)}>☑ Deselect</button>
                        }
                      </div>
                    </div>
                    <div style={{display:'flex',flexDirection:'column',gap:6}}>
                      {list.map(u=>(
                        <div key={u.id} style={{display:'flex',alignItems:'center',gap:9,padding:'8px 10px',borderRadius:'var(--radius)',background:selected.has(u.id)?'var(--gold-bg)':'var(--surface)',transition:'background .15s'}}>
                          <input type="checkbox" checked={selected.has(u.id)} onChange={()=>toggleSelect(u.id)} style={{accentColor:'var(--gold)',flexShrink:0}}/>
                          <div className="avatar" style={{width:28,height:28,fontSize:'0.68rem',background:GRADE_COLORS[grade]||'var(--ink-3)',flexShrink:0}}>{initials(u.name)}</div>
                          <div style={{flex:1,minWidth:0}}>
                            <div style={{fontWeight:500,fontSize:'0.85rem',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{u.name}</div>
                            <div style={{fontSize:'0.68rem',color:'var(--muted)'}}>{u.email}</div>
                          </div>
                          <span className={`badge badge-${u.status==='approved'?'appr':u.status==='rejected'?'rej':'pend'}`} style={{flexShrink:0,fontSize:'0.62rem'}}>{u.status}</span>
                          <span style={{fontSize:'0.72rem',color:'var(--muted)',flexShrink:0}}>{u.uploadCount||0} upload{(u.uploadCount||0)!==1?'s':''}</span>
                          <div style={{display:'flex',gap:4,flexShrink:0}}>
                            <button className="btn btn-ol btn-sm" style={{minHeight:28,padding:'3px 8px'}} onClick={()=>setEditingUser(u)} data-tip="Edit grade & section"><Ico.edit/></button>
                            {u.status!=='approved'&&<button className="btn btn-grn btn-sm" style={{minHeight:28,padding:'3px 8px'}} onClick={()=>upd(u.id,'approved')} data-tip="Approve"><Ico.chk/></button>}
                            {u.status!=='rejected'&&<button className="btn btn-ol btn-sm" style={{minHeight:28,padding:'3px 8px',fontSize:'0.72rem'}} onClick={()=>upd(u.id,'rejected')}>Reject</button>}
                            <button className="btn btn-red btn-sm" style={{minHeight:28,padding:'3px 8px'}} onClick={()=>del(u.id)} data-tip="Delete"><Ico.trash/></button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          ))}
        </div>
      ):(
        /* ── Flat table view ── */
        <div className="card">
          <div className="tw"><table>
            <thead><tr>
              <th style={{width:36}}><input type="checkbox" checked={selected.size===filtered.length&&filtered.length>0} onChange={()=>toggleAll(filtered)} style={{accentColor:'var(--gold)'}}/></th>
              <th>Student</th><th>School</th><th>Grade</th><th>Section</th><th>Status</th><th>Uploads</th><th>Registered</th><th>Actions</th>
            </tr></thead>
            <tbody>{filtered.map(u=><StudentRow key={u.id} u={u}/>)}</tbody>
          </table></div>
        </div>
      )}
      {editingUser&&<EditGradeModal user={editingUser} onClose={()=>setEditingUser(null)} onSaved={load}/>}
    </div>
  );
}

function AdminStudies() {
  const [search,setSearch]=useState('');
  const [searchInput,setSearchInput]=useState('');
  const [studies,setStudies]=useState([]);
  const [loading,setLoading]=useState(true);
  const [activityMap,setActivityMap]=useState({});
  const [historyStudy,setHistoryStudy]=useState(null);
  const searchTimeout=useRef(null);

  const load=useCallback(async()=>{
    setLoading(true);
    const res=await API.getStudies({search,status:'',perPage:100});
    const list=res.data;
    setStudies(list);
    setLoading(false);
    // Fetch latest viewer + downloader for each study in parallel
    const entries = await Promise.all(
      list.map(async s => {
        try {
          const logs = await API.getStudyLogs(s.id);
          const latestView = logs.views[0] || null;
          const latestDl   = logs.downloads[0] || null;
          return [s.id, { latestView, latestDl }];
        } catch { return [s.id, { latestView:null, latestDl:null }]; }
      })
    );
    setActivityMap(Object.fromEntries(entries));
  },[search]);
  useEffect(()=>{load();},[load]);

  const handleSearch=e=>{
    const val=e.target.value;
    setSearchInput(val);
    clearTimeout(searchTimeout.current);
    searchTimeout.current=setTimeout(()=>setSearch(val),350);
  };

  const del=async id=>{if(!confirm('Delete this study?'))return;await API.deleteStudy(id);toast.ok('Study deleted.');load();};

  const ActivityCell = ({ sid }) => {
    const act = activityMap[sid];
    if (!act) return <span style={{color:'var(--muted)',fontSize:'0.72rem'}}>—</span>;
    const { latestView, latestDl } = act;
    return (
      <div style={{display:'flex',flexDirection:'column',gap:4,minWidth:130}}>
        {latestView ? (
          <div style={{display:'flex',alignItems:'center',gap:5}}>
            <span style={{fontSize:'0.65rem',background:'var(--teal-light)',color:'var(--teal)',borderRadius:4,padding:'1px 5px',fontWeight:600,flexShrink:0}}>👁 View</span>
            <div style={{minWidth:0}}>
              <div style={{fontSize:'0.72rem',fontWeight:500,color:'var(--ink-3)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',maxWidth:110}}>{latestView.userName||'Unknown'}</div>
              <div style={{fontSize:'0.65rem',color:'var(--muted)'}}>{fmtDate(latestView.timestamp)}</div>
            </div>
          </div>
        ) : (
          <div style={{fontSize:'0.68rem',color:'var(--muted)'}}>👁 No views yet</div>
        )}
        {latestDl ? (
          <div style={{display:'flex',alignItems:'center',gap:5}}>
            <span style={{fontSize:'0.65rem',background:'var(--blue-light)',color:'var(--blue)',borderRadius:4,padding:'1px 5px',fontWeight:600,flexShrink:0}}>⬇ DL</span>
            <div style={{minWidth:0}}>
              <div style={{fontSize:'0.72rem',fontWeight:500,color:'var(--ink-3)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',maxWidth:110}}>{latestDl.userName||'Unknown'}</div>
              <div style={{fontSize:'0.65rem',color:'var(--muted)'}}>{fmtDate(latestDl.timestamp)}</div>
            </div>
          </div>
        ) : (
          <div style={{fontSize:'0.68rem',color:'var(--muted)'}}>⬇ No downloads yet</div>
        )}
      </div>
    );
  };

  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',flexWrap:'wrap',gap:10,marginBottom:18}}>
        <div><h2 className="sec-title" style={{marginBottom:1}}>Manage Studies</h2><p className="muted">{studies.length} studies</p></div>
        <button className="btn btn-ol btn-sm" onClick={()=>{
          const rows=[['Title','Authors','Categories','Year','Uploader','Views','Downloads','Citations','Drive Link','Uploaded']];
          studies.forEach(s=>rows.push([s.title,(s.authors||[]).join('; '),(s.categories||[]).join('; '),s.year,s.uploadedByName,s.viewCount||0,s.downloadCount||0,s.citationCount||0,(s.gdrive?.driveUrl||s.file?.driveUrl||''),fmtDate(s.createdAt)]));
          const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
          const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
          a.download='studies.csv';a.click();toast.ok('Studies exported!');
        }}>⬇ Export CSV</button>
      </div>
      <div className="fb" style={{marginBottom:16}}>
        <div className="sb" style={{flex:1,minWidth:200}}>
          <Ico.search/>
          <input placeholder="Search by title, author, or keyword…" value={searchInput} onChange={handleSearch} aria-label="Search studies"/>
          {searchInput&&<button onClick={()=>{setSearchInput('');setSearch('');}} style={{background:'none',border:'none',cursor:'pointer',color:'var(--muted)',padding:'0 2px',fontSize:'1rem',lineHeight:1}} data-tip="Clear search">✕</button>}
        </div>
      </div>
      <div className="card">
        {loading?<div style={{textAlign:'center',padding:'30px',color:'var(--muted)'}}>Loading…</div>
        :studies.length===0?<div className="empty" style={{padding:'36px 0'}}><div className="empty-ico">📚</div><h3>No studies yet</h3></div>
        :<div className="tw"><table>
          <thead><tr><th>Title</th><th>Authors</th><th>Categories</th><th>Uploader</th><th>Views</th><th>Dls</th><th>Citations</th><th>Latest Activity</th><th>Date</th><th style={{position:'sticky',right:0,background:'var(--white)',zIndex:2}}>Actions</th></tr></thead>
          <tbody>{studies.map(s=><tr key={s.id}>
            <td style={{maxWidth:190}}><div style={{fontWeight:500,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{s.title}</div></td>
            <td style={{fontSize:'0.78rem'}}>{(s.authors||[]).join(', ')}</td>
            <td><div style={{display:'flex',gap:3,flexWrap:'wrap'}}>{(s.categories||[]).map(c=><span key={c} className="badge" style={{background:'var(--gold-bg)',color:'var(--gold)',fontSize:'0.63rem'}}>{c}</span>)}</div></td>
            <td style={{fontSize:'0.82rem'}}>{s.uploadedByName}</td>
            <td>{s.viewCount||0}</td><td>{s.downloadCount||0}</td>
            <td><span style={{color:'var(--purple)',fontWeight:500}}>📋 {s.citationCount||0}</span></td>
            <td><ActivityCell sid={s.id}/></td>
            <td style={{whiteSpace:'nowrap'}}>{fmtDate(s.createdAt)}</td>
            <td style={{position:'sticky',right:0,background:'var(--white)',zIndex:1}}><div style={{display:'flex',gap:5}}>
              <button className="btn btn-ol btn-sm" onClick={()=>setHistoryStudy(s)} data-tip="View activity log" style={{display:'flex',alignItems:'center',gap:4}}><Ico.eye/> Log</button>
              <button className="btn btn-red btn-sm" onClick={()=>del(s.id)} data-tip-pos="left" data-tip="Delete study"><Ico.trash/></button>
            </div></td>
          </tr>)}</tbody>
        </table></div>}
      </div>
      {historyStudy&&<StudyHistoryModal study={historyStudy} onClose={()=>setHistoryStudy(null)}/>}
    </div>
  );
}

function AdminCats() {
  const [cats,setCats]=useState([]);
  const [newCat,setNewCat]=useState('');
  const [editIdx,setEditIdx]=useState(null);
  const [editVal,setEditVal]=useState('');
  const [loading,setLoading]=useState(true);
  const [activeSection,setActiveSection]=useState('categories'); // 'categories' | 'by-year'
  const [studies,setStudies]=useState([]);
  const [studiesLoading,setStudiesLoading]=useState(false);
  const [expandedYear,setExpandedYear]=useState(null);
  const [selectedStudy,setSelectedStudy]=useState(null);

  useEffect(()=>{API.getCategories().then(c=>{setCats(c);setLoading(false);});},[]);

  // Load studies when By Year tab is activated
  useEffect(()=>{
    if(activeSection==='by-year'&&studies.length===0){
      setStudiesLoading(true);
      API.getAllStudies().then(s=>{setStudies(s);setStudiesLoading(false);}).catch(()=>setStudiesLoading(false));
    }
  },[activeSection]);

  const save=async()=>{await API.setCategories(cats);toast.ok('Categories saved!');};
  const add=()=>{const t=newCat.trim();if(!t)return;if(cats.includes(t)){toast.err('Already exists.');return;}setCats([...cats,t]);setNewCat('');};
  const rem=i=>{if(cats.length<=1){toast.err('Need at least one category.');return;}setCats(cats.filter((_,idx)=>idx!==i));};
  const startEdit=i=>{setEditIdx(i);setEditVal(cats[i]);};
  const saveEdit=()=>{if(!editVal.trim())return;setCats(cats.map((c,i)=>i===editIdx?editVal.trim():c));setEditIdx(null);};

  // Group studies by year
  const byYear = useMemo(()=>{
    const map={};
    studies.forEach(s=>{
      const yr=s.year||'Unknown';
      if(!map[yr])map[yr]=[];
      map[yr].push(s);
    });
    return Object.entries(map).sort((a,b)=>b[0]-a[0]);
  },[studies]);

  const TAB_BTN = (id,label,icon)=>(
    <button
      onClick={()=>setActiveSection(id)}
      style={{flex:1,padding:'9px 10px',borderRadius:6,border:'none',cursor:'pointer',fontFamily:'var(--font-body)',fontSize:'var(--text-sm)',fontWeight:500,transition:'all var(--transition)',
        background:activeSection===id?'var(--white)':'transparent',
        color:activeSection===id?'var(--ink)':'var(--muted)',
        boxShadow:activeSection===id?'0 1px 4px rgba(0,0,0,0.08)':'none',
        display:'flex',alignItems:'center',justifyContent:'center',gap:5}}>
      <span>{icon}</span>{label}
    </button>
  );

  if(loading)return <div style={{textAlign:'center',padding:'40px',color:'var(--muted)'}}>Loading…</div>;

  return (
    <div>
      <div style={{marginBottom:18}}>
        <h2 className="sec-title" style={{marginBottom:1}}>Manage Categories</h2>
        <p className="muted">Manage category labels and browse studies by publication year.</p>
      </div>

      {/* Tab switcher */}
      <div style={{display:'flex',gap:4,background:'var(--surface)',borderRadius:10,padding:4,marginBottom:20,border:'1px solid var(--border)'}}>
        {TAB_BTN('categories','Categories','🏷️')}
        {TAB_BTN('by-year','By Year','📅')}
      </div>

      {/* ── CATEGORIES TAB ── */}
      {activeSection==='categories'&&(
        <>
          <div className="card" style={{marginBottom:18}}>
            <div className="card-hd"><span className="card-title">Current Categories ({cats.length})</span></div>
            {cats.map((cat,idx)=>(
              <div key={idx} className="cm-item">
                {editIdx===idx?(
                  <><input className="cm-in" value={editVal} onChange={e=>setEditVal(e.target.value)} onKeyDown={e=>e.key==='Enter'&&saveEdit()} autoFocus aria-label="Edit category name"/>
                  <button className="btn btn-grn btn-sm" onClick={saveEdit}><Ico.chk/> Save</button>
                  <button className="btn btn-ol btn-sm" onClick={()=>setEditIdx(null)}>Cancel</button></>
                ):(
                  <><span className="cm-name">{cat}</span>
                  <button className="btn btn-ol btn-sm" onClick={()=>startEdit(idx)} aria-label={`Edit ${cat}`}><Ico.edit/> Edit</button>
                  <button className="btn btn-red btn-sm" onClick={()=>rem(idx)} aria-label={`Delete ${cat}`}><Ico.trash/></button></>
                )}
              </div>
            ))}
            <div style={{display:'flex',gap:9,marginTop:14,flexWrap:'wrap'}}>
              <input placeholder="Add new category…" value={newCat} onChange={e=>setNewCat(e.target.value)} onKeyDown={e=>e.key==='Enter'&&add()} style={{flex:1,minWidth:160}} aria-label="New category name"/>
              <button className="btn btn-ink" onClick={add}><Ico.plus/> Add</button>
            </div>
          </div>
          <div style={{display:'flex',justifyContent:'flex-end'}}><button className="btn btn-gold" onClick={save}>Save All Changes</button></div>
        </>
      )}

      {/* ── BY YEAR TAB ── */}
      {activeSection==='by-year'&&(
        <div>
          {studiesLoading?(
            <div style={{textAlign:'center',padding:'50px',color:'var(--muted)'}}>
              <span className="spin spin-gold" style={{width:28,height:28,border:'3px solid rgba(201,162,39,0.25)',borderTopColor:'var(--gold)',display:'inline-block',marginBottom:12}}/>
              <p>Loading studies…</p>
            </div>
          ):byYear.length===0?(
            <div className="empty"><div className="empty-ico">📚</div><h3>No studies yet</h3><p>Upload research studies to see them grouped by year.</p></div>
          ):(
            <>
              {/* Summary pills */}
              <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:18}}>
                {byYear.map(([yr,ss])=>(
                  <button key={yr} onClick={()=>setExpandedYear(expandedYear===yr?null:yr)}
                    style={{display:'flex',alignItems:'center',gap:6,padding:'6px 14px',borderRadius:99,
                      border:`1.5px solid ${expandedYear===yr?'var(--gold)':'var(--border)'}`,
                      background:expandedYear===yr?'var(--gold-bg)':'var(--white)',
                      cursor:'pointer',fontSize:'var(--text-xs)',fontFamily:'var(--font-body)',
                      transition:'all var(--transition)',color:expandedYear===yr?'var(--gold)':'var(--ink-3)',
                      fontWeight:expandedYear===yr?700:400}}>
                    <span style={{fontWeight:700,color:expandedYear===yr?'var(--gold)':'var(--purple)'}}>{yr}</span>
                    <span style={{background:expandedYear===yr?'rgba(201,162,39,0.18)':'var(--surface)',color:expandedYear===yr?'var(--gold)':'var(--muted)',borderRadius:99,padding:'1px 7px',fontSize:'0.67rem',fontWeight:600}}>{ss.length}</span>
                  </button>
                ))}
              </div>

              {/* Year groups */}
              <div style={{display:'flex',flexDirection:'column',gap:14}}>
                {byYear.map(([yr,ss])=>{
                  const isOpen=expandedYear===yr||expandedYear===null;
                  return(
                    <div key={yr} className="card" style={{padding:0,overflow:'hidden'}}>
                      {/* Year header */}
                      <button onClick={()=>setExpandedYear(expandedYear===yr?null:yr)}
                        style={{width:'100%',display:'flex',alignItems:'center',gap:12,padding:'13px 18px',background:'none',border:'none',cursor:'pointer',textAlign:'left',transition:'background var(--transition)'}}
                        onMouseEnter={e=>e.currentTarget.style.background='var(--surface)'}
                        onMouseLeave={e=>e.currentTarget.style.background='none'}>
                        <div style={{background:'var(--purple)',color:'#fff',borderRadius:6,padding:'3px 12px',fontSize:'var(--text-xs)',fontWeight:700,flexShrink:0}}>
                          📅 {yr}
                        </div>
                        <div style={{height:1,flex:1,background:'var(--border)'}}/>
                        <span style={{fontSize:'var(--text-xs)',color:'var(--muted)',flexShrink:0,fontWeight:500}}>
                          {ss.length} {ss.length===1?'study':'studies'}
                        </span>
                        <span style={{color:'var(--muted)',fontSize:'0.8rem',flexShrink:0,transform:isOpen?'rotate(180deg)':'rotate(0deg)',transition:'transform .2s'}}>▾</span>
                      </button>

                      {/* Studies list */}
                      {isOpen&&(
                        <div style={{borderTop:'1px solid var(--border)'}}>
                          {ss.map((s,i)=>(
                            <div key={s.id||i}
                              style={{display:'flex',alignItems:'flex-start',gap:12,padding:'12px 18px',borderBottom:i<ss.length-1?'1px solid var(--border)':'none',cursor:'pointer',transition:'background var(--transition)'}}
                              onClick={()=>setSelectedStudy(selectedStudy?.id===s.id?null:s)}
                              onMouseEnter={e=>e.currentTarget.style.background='var(--surface)'}
                              onMouseLeave={e=>e.currentTarget.style.background='none'}>
                              <div style={{width:28,height:28,borderRadius:6,background:'var(--gold-bg)',color:'var(--gold)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'0.7rem',fontWeight:700,flexShrink:0,marginTop:1}}>{i+1}</div>
                              <div style={{flex:1,minWidth:0}}>
                                <div style={{fontFamily:'var(--font-display)',fontSize:'var(--text-sm)',fontWeight:600,color:'var(--ink)',lineHeight:1.4,marginBottom:3}}>{s.title}</div>
                                <div style={{fontSize:'var(--text-xs)',color:'var(--muted)',marginBottom:4}}>By: {(s.authors||[]).join(', ')}</div>
                                <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
                                  {(s.categories||[]).map(c=><span key={c} style={{fontSize:'0.65rem',fontWeight:600,padding:'1px 6px',borderRadius:4,background:'var(--gold-bg)',color:'var(--gold)'}}>{c}</span>)}
                                  {s.keywords?.length>0&&s.keywords.slice(0,3).map(k=><span key={k} style={{fontSize:'0.65rem',padding:'1px 6px',borderRadius:4,background:'var(--surface)',color:'var(--muted)',border:'1px solid var(--border)'}}>{k}</span>)}
                                </div>
                                {selectedStudy?.id===s.id&&(
                                  <div style={{marginTop:10,padding:'10px 12px',background:'var(--surface)',borderRadius:8,border:'1px solid var(--border)'}}>
                                    <p style={{fontSize:'var(--text-xs)',color:'var(--slate)',lineHeight:1.6,marginBottom:8}}>{s.abstract}</p>
                                    <div style={{display:'flex',gap:14,fontSize:'0.68rem',color:'var(--muted)'}}>
                                      <span>👁 {s.viewCount||0} views</span>
                                      <span>⬇ {s.downloadCount||0} downloads</span>
                                      <span>🗓 Added {fmtDate(s.createdAt)}</span>
                                    </div>
                                  </div>
                                )}
                              </div>
                              <div style={{fontSize:'0.68rem',color:'var(--muted)',flexShrink:0,marginTop:4}}>
                                {s.gdrive&&<span style={{color:'var(--teal)'}}>🔗</span>}
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </>
          )}
        </div>
      )}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════
//  RECOGNIZED STUDIES PAGE
// ══════════════════════════════════════════════════════════════════
function RecognizedStudiesPage({ currentUser, isAdmin }) {
  const [entries, setEntries] = useState([]);
  const [cats, setCats] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showForm, setShowForm] = useState(false);
  const [editId, setEditId] = useState(null);
  const [form, setForm] = useState({ title:'', authors:'', award:'', year:String(new Date().getFullYear()), description:'', institution:'', category:'' });
  const [search, setSearch] = useState('');
  const [filterCat, setFilterCat] = useState('');
  const [deleteConfirm, setDeleteConfirm] = useState(null);
  const [saving, setSaving] = useState(false);

  const load = useCallback(async () => {
    setLoading(true);
    const [data, catsArr] = await Promise.all([API.getRecognizedStudies(), API.getCategories()]);
    setEntries(data);
    setCats(catsArr);
    setLoading(false);
  }, []);

  useEffect(() => { load(); }, [load]);

  const sf = (k,v) => setForm(f => ({...f, [k]:v}));

  const openNew = () => {
    setEditId(null);
    setForm({ title:'', authors:'', award:'', year:String(new Date().getFullYear()), description:'', institution:'', category:'' });
    setShowForm(true);
  };

  const openEdit = entry => {
    setEditId(entry.id);
    setForm({ title:entry.title, authors:entry.authors, award:entry.award, year:entry.year, description:entry.description||'', institution:entry.institution||'', category:entry.category||'' });
    setShowForm(true);
  };

  const submit = async () => {
    if (!form.title.trim()) { toast.err('Title is required.'); return; }
    if (!form.authors.trim()) { toast.err('Author(s) are required.'); return; }
    if (!form.award.trim()) { toast.err('Award / Recognition is required.'); return; }
    setSaving(true);
    try {
      if (editId) {
        await API.updateRecognizedStudy(editId, form);
        toast.ok('Entry updated!');
      } else {
        await API.addRecognizedStudy({ ...form, addedBy: currentUser.name });
        toast.ok('Recognized study added!');
      }
      setShowForm(false);
      await load();
    } catch(e) { toast.err(e.message); }
    setSaving(false);
  };

  const remove = async id => {
    try {
      await API.deleteRecognizedStudy(id);
      setDeleteConfirm(null);
      toast.ok('Entry removed.');
      await load();
    } catch(e) { toast.err(e.message); }
  };

  const filtered = entries.filter(e => {
    const matchSearch = !search || [e.title, e.authors, e.award, e.institution].join(' ').toLowerCase().includes(search.toLowerCase());
    const matchCat = !filterCat || e.category === filterCat;
    return matchSearch && matchCat;
  });

  const AWARD_COLORS = {
    default: { bg:'var(--gold-bg)', color:'var(--gold)', border:'var(--gold)' },
  };

  return (
    <div>
      {/* Header */}
      <div className="page-hd">
        <div className="page-hd-left">
          <h2>Recognized Studies</h2>
          <p className="muted">{entries.length} recognized {entries.length===1?'study':'studies'}{filterCat && <span style={{color:'var(--gold)',marginLeft:5}}>· {filterCat}</span>}</p>
        </div>
        {isAdmin && (
          <button className="btn btn-gold" onClick={openNew}>
            <Ico.plus/> Add Recognition
          </button>
        )}
      </div>

      {/* Admin notice */}
      {!isAdmin && (
        <div style={{display:'flex',alignItems:'center',gap:9,padding:'10px 14px',background:'var(--blue-light)',border:'1.5px solid var(--blue)',borderRadius:'var(--radius)',marginBottom:18,fontSize:'var(--text-sm)',color:'var(--blue)'}}>
          <Ico.award/>
          <span>This page showcases research studies that have received awards or formal recognition. New entries are added by a teacher.</span>
        </div>
      )}

      {/* Search + Category filter */}
      {entries.length > 0 && (
        <div className="fb" style={{marginBottom:18,flexWrap:'wrap',gap:9}}>
          <div className="sb" style={{flex:1,minWidth:200}}>
            <Ico.search/>
            <input placeholder="Search by title, author, award…" value={search} onChange={e=>setSearch(e.target.value)} aria-label="Search recognized studies"/>
            {search&&<button onClick={()=>setSearch('')} style={{background:'none',border:'none',cursor:'pointer',color:'var(--muted)',padding:'0 2px',fontSize:'1rem'}}>✕</button>}
          </div>
          {cats.length > 0 && (
            <select value={filterCat} onChange={e=>setFilterCat(e.target.value)} style={{width:'auto',padding:'10px 13px'}} aria-label="Filter by category">
              <option value="">All Categories</option>
              {cats.map(c=><option key={c}>{c}</option>)}
            </select>
          )}
          {(search || filterCat) && (
            <button className="btn btn-ol btn-sm" onClick={()=>{setSearch('');setFilterCat('');}} style={{whiteSpace:'nowrap'}}>✕ Clear</button>
          )}
        </div>
      )}

      {loading ? (
        <div style={{textAlign:'center',padding:'50px',color:'var(--muted)'}}>
          <span className="spin spin-gold" style={{width:28,height:28,border:'3px solid rgba(201,162,39,0.25)',borderTopColor:'var(--gold)',display:'inline-block',marginBottom:12}}/>
          <p>Loading…</p>
        </div>
      ) : entries.length === 0 ? (
        <div className="empty">
          <div style={{fontSize:'2.5rem',marginBottom:8}}>🏆</div>
          <h3>No recognized studies yet</h3>
          <p>{isAdmin ? 'Click "Add Recognition" to showcase award-winning research.' : 'Check back later — recognized studies will appear here.'}</p>
        </div>
      ) : filtered.length === 0 ? (
        <div className="empty">
          <div className="empty-ico">🔍</div>
          <h3>No results found</h3>
          <p>Try a different search term.</p>
        </div>
      ) : (
        <div style={{display:'flex',flexDirection:'column',gap:14}}>
          {filtered.map((entry, idx) => (
            <div key={entry.id} className="card" style={{position:'relative',borderLeft:'4px solid var(--gold)',transition:'box-shadow var(--transition)'}}>
              {/* Rank badge */}
              <div style={{position:'absolute',top:16,right:16,display:'flex',gap:6,alignItems:'center'}}>
                {isAdmin && (
                  <>
                    <button className="btn btn-ol btn-sm" onClick={()=>openEdit(entry)} data-tip="Edit entry" aria-label={`Edit ${entry.title}`}><Ico.edit/></button>
                    <button className="btn btn-red btn-sm" onClick={()=>setDeleteConfirm(entry.id)} data-tip-pos="left" data-tip="Delete entry" aria-label={`Delete ${entry.title}`}><Ico.trash/></button>
                  </>
                )}
              </div>

              <div style={{display:'flex',alignItems:'flex-start',gap:14,flexWrap:'wrap',paddingRight:isAdmin?100:0}}>
                {/* Trophy icon */}
                <div style={{width:44,height:44,borderRadius:10,background:'var(--gold-bg)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'1.4rem',flexShrink:0}}>
                  🏆
                </div>
                <div style={{flex:1,minWidth:200}}>
                  <h3 style={{fontFamily:'var(--font-display)',fontSize:'var(--text-lg)',fontWeight:700,color:'var(--ink)',marginBottom:4,lineHeight:1.3}}>{entry.title}</h3>
                  <p style={{fontSize:'var(--text-sm)',color:'var(--slate)',marginBottom:8}}>By: <strong>{entry.authors}</strong></p>

                  {/* Category + Award badges */}
                  <div style={{display:'flex',flexWrap:'wrap',gap:6,marginBottom:entry.description||entry.institution?10:0}}>
                    {entry.category && (
                      <span style={{display:'inline-flex',alignItems:'center',gap:4,padding:'3px 10px',borderRadius:99,background:'var(--purple-light)',color:'var(--purple)',border:'1.5px solid var(--purple)',fontSize:'var(--text-xs)',fontWeight:600}}>
                        🏷️ {entry.category}
                      </span>
                    )}
                    <span style={{display:'inline-flex',alignItems:'center',gap:5,padding:'4px 11px',borderRadius:99,background:'var(--gold-bg)',color:'var(--gold)',border:'1.5px solid var(--gold)',fontSize:'var(--text-xs)',fontWeight:700}}>
                      🥇 {entry.award}
                    </span>
                  </div>

                  {(entry.description || entry.institution) && (
                    <div style={{display:'flex',flexDirection:'column',gap:4}}>
                      {entry.institution && (
                        <p style={{fontSize:'var(--text-xs)',color:'var(--muted)',display:'flex',alignItems:'center',gap:4}}>
                          🏫 {entry.institution}
                        </p>
                      )}
                      {entry.description && (
                        <p style={{fontSize:'var(--text-sm)',color:'var(--slate)',lineHeight:1.55}}>{entry.description}</p>
                      )}
                    </div>
                  )}

                  <div style={{display:'flex',gap:14,marginTop:10,fontSize:'var(--text-xs)',color:'var(--muted)',flexWrap:'wrap'}}>
                    <span><Ico.cal/> {entry.year}</span>
                    <span>Added by {entry.addedBy}</span>
                    <span>{fmtDate(entry.createdAt)}</span>
                  </div>
                </div>
              </div>
            </div>
          ))}
        </div>
      )}

      {/* Add / Edit Modal — Admin only */}
      {showForm && isAdmin && (
        <Modal title={editId ? 'Edit Recognition' : 'Add Recognized Study'} onClose={()=>setShowForm(false)} wide>
          <div style={{display:'flex',alignItems:'center',gap:9,padding:'10px 14px',background:'var(--blue-light)',border:'1px solid var(--blue)',borderRadius:'var(--radius)',marginBottom:18,fontSize:'var(--text-sm)',color:'var(--blue)'}}>
            ℹ️ Only teachers can add or edit entries. This listing is visible to all users.
          </div>
          <div className="fg"><label>Study Title *</label><input placeholder="Full title of the recognized research study" value={form.title} onChange={e=>sf('title',e.target.value)} autoFocus/></div>
          <div className="fg"><label>Author(s) * <span style={{fontWeight:300,color:'var(--muted)'}}>(comma-separated)</span></label><input placeholder="e.g. Juan dela Cruz, Maria Santos" value={form.authors} onChange={e=>sf('authors',e.target.value)}/></div>
          <div className="fg"><label>Award / Recognition *</label><input placeholder="e.g. Best Research Paper – Regional Science Fair 2024" value={form.award} onChange={e=>sf('award',e.target.value)}/></div>
          <div className="fr">
            <div className="fg"><label>Year</label><input type="number" min="1900" max="2099" value={form.year} onChange={e=>sf('year',e.target.value)}/></div>
            <div className="fg">
              <label>Category</label>
              <select value={form.category} onChange={e=>sf('category',e.target.value)}>
                <option value="">— None —</option>
                {cats.map(c=><option key={c} value={c}>{c}</option>)}
              </select>
            </div>
          </div>
          <div className="fg"><label>Institution / Organization</label><input placeholder="e.g. SABNAHIS" value={form.institution} onChange={e=>sf('institution',e.target.value)}/></div>
          <div className="fg"><label>Description <span style={{fontWeight:300,color:'var(--muted)'}}>(optional)</span></label><textarea placeholder="Brief description of the recognition or study significance…" value={form.description} onChange={e=>sf('description',e.target.value)} style={{minHeight:80}}/></div>
          <div style={{display:'flex',gap:9,justifyContent:'flex-end',flexWrap:'wrap',marginTop:4}}>
            <button className="btn btn-ol" onClick={()=>setShowForm(false)}>Cancel</button>
            <button className="btn btn-gold" onClick={submit} disabled={saving}>{saving?<><span className="spin spin-dark"/>Saving…</>:editId?<><Ico.chk/> Save Changes</>:<><Ico.plus/> Add Recognition</>}</button>
          </div>
        </Modal>
      )}

      {/* Delete Confirm Modal */}
      {deleteConfirm && (
        <Modal title="Remove Recognition" onClose={()=>setDeleteConfirm(null)}>
          <p style={{marginBottom:20,color:'var(--slate)'}}>Are you sure you want to remove this recognized study entry? This cannot be undone.</p>
          <div style={{display:'flex',gap:9,justifyContent:'flex-end'}}>
            <button className="btn btn-ol" onClick={()=>setDeleteConfirm(null)}>Cancel</button>
            <button className="btn btn-red" onClick={()=>remove(deleteConfirm)}><Ico.trash/> Remove</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════
//  ANNOUNCEMENTS PAGE
// ══════════════════════════════════════════════════════════════════
function AnnouncementsPage({ currentUser }) {
  const isTeacher = currentUser.role === 'admin';
  const [announcements, setAnnouncements] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showForm, setShowForm] = useState(false);
  const [title, setTitle] = useState('');
  const [body, setBody] = useState('');
  const [priority, setPriority] = useState('normal');
  const [durationHours, setDurationHours] = useState('24');
  const [submitting, setSubmitting] = useState(false);
  const [now, setNow] = useState(new Date());

  // Live clock — ticks every minute to update countdowns
  useEffect(() => {
    const t = setInterval(() => setNow(new Date()), 60000);
    return () => clearInterval(t);
  }, []);

  const load = async () => {
    setLoading(true);
    const data = await API.getAnnouncements();
    data.sort((a,b) => {
      if (a.pinned && !b.pinned) return -1;
      if (!a.pinned && b.pinned) return 1;
      return new Date(b.createdAt) - new Date(a.createdAt);
    });
    setAnnouncements(data);
    setLoading(false);
  };
  useEffect(() => { load(); }, []);

  const submit = async () => {
    setSubmitting(true);
    try {
      await API.createAnnouncement({ title, body, priority, authorId:currentUser.id, authorName:currentUser.name, durationHours });
      toast.ok('Announcement posted!');
      setTitle(''); setBody(''); setPriority('normal'); setDurationHours('24'); setShowForm(false);
      load();
    } catch(e) { toast.err(e.message); }
    setSubmitting(false);
  };

  const del = async id => {
    if (!confirm('Delete this announcement?')) return;
    // Optimistic removal
    const prev = announcements;
    setAnnouncements(a => a.filter(x => x.id !== id));
    try {
      await API.deleteAnnouncement(id);
      toast.ok('Deleted.');
    } catch(e) {
      setAnnouncements(prev);
      toast.err('Failed to delete announcement.');
    }
  };

  const togglePin = async (id, pinned) => {
    // Optimistic pin toggle
    setAnnouncements(a => a.map(x => x.id === id ? {...x, pinned: !pinned} : x));
    try {
      await API.pinAnnouncement(id, !pinned);
    } catch(e) {
      setAnnouncements(a => a.map(x => x.id === id ? {...x, pinned} : x)); // revert
      toast.err('Failed to update pin.');
    }
  };

  // Format countdown string
  const getCountdown = expiresAt => {
    if (!expiresAt) return null;
    const diff = new Date(expiresAt) - now;
    if (diff <= 0) return { text: 'Expired', urgent: true };
    const totalMins = Math.floor(diff / 60000);
    const hrs = Math.floor(totalMins / 60);
    const mins = totalMins % 60;
    const days = Math.floor(hrs / 24);
    const remHrs = hrs % 24;
    let text = '';
    if (days > 0)      text = `${days}d ${remHrs}h left`;
    else if (hrs > 0)  text = `${hrs}h ${mins}m left`;
    else               text = `${mins}m left`;
    const urgent = diff < 3 * 60 * 60 * 1000; // < 3 hours
    const warn   = diff < 6 * 60 * 60 * 1000; // < 6 hours
    return { text, urgent, warn };
  };

  const DURATION_OPTS = [
    { value:'1',   label:'1 hour' },
    { value:'3',   label:'3 hours' },
    { value:'6',   label:'6 hours' },
    { value:'12',  label:'12 hours' },
    { value:'24',  label:'24 hours (default)' },
    { value:'48',  label:'2 days' },
    { value:'72',  label:'3 days' },
    { value:'168', label:'1 week' },
  ];

  const priorityStyle = p => ({
    urgent:   { accent:'#ef4444', bg:'linear-gradient(135deg,#fef2f2 0%,#fff5f5 100%)', bgDark:'linear-gradient(135deg,rgba(239,68,68,0.12) 0%,rgba(239,68,68,0.06) 100%)', border:'rgba(239,68,68,0.3)', icon:'🚨', label:'Urgent', tagBg:'#ef4444', tagColor:'#fff' },
    important:{ accent:'#f59e0b', bg:'linear-gradient(135deg,#fffbeb 0%,#fefce8 100%)', bgDark:'linear-gradient(135deg,rgba(245,158,11,0.12) 0%,rgba(245,158,11,0.06) 100%)', border:'rgba(245,158,11,0.35)', icon:'⚠️', label:'Important', tagBg:'#f59e0b', tagColor:'#fff' },
    normal:   { accent:'#3b82f6', bg:'linear-gradient(135deg,#eff6ff 0%,#f0f9ff 100%)', bgDark:'linear-gradient(135deg,rgba(59,130,246,0.1) 0%,rgba(59,130,246,0.05) 100%)', border:'rgba(59,130,246,0.25)', icon:'📢', label:'Notice', tagBg:'#3b82f6', tagColor:'#fff' },
  }[p||'normal']);

  return (
    <div>
      <div className="page-hd">
        <div className="page-hd-left">
          <h2>Announcements</h2>
          <p className="muted">{announcements.length} announcement{announcements.length!==1?'s':''} · auto-expire after set duration</p>
        </div>
        {isTeacher&&(
          <button className="btn btn-gold" onClick={()=>setShowForm(s=>!s)}>
            {showForm?'✕ Cancel':'📢 Post Announcement'}
          </button>
        )}
      </div>

      {/* Post form — teachers only */}
      {isTeacher&&showForm&&(
        <div className="card" style={{marginBottom:20,border:'1.5px solid var(--gold)'}}>
          <div style={{fontWeight:600,fontSize:'var(--text-sm)',marginBottom:14,color:'var(--gold)'}}>📢 New Announcement</div>
          <div className="fg">
            <label>Title *</label>
            <input placeholder="Announcement title…" value={title} onChange={e=>setTitle(e.target.value)} autoFocus/>
          </div>
          <div className="fg">
            <label style={{display:'flex',justifyContent:'space-between'}}>
              <span>Message *</span>
              <span style={{fontWeight:300,color:body.length>800?'var(--red)':'var(--muted)',fontSize:'0.75rem'}}>{body.length} chars</span>
            </label>
            <textarea placeholder="Write your announcement here…" value={body} onChange={e=>setBody(e.target.value)} style={{minHeight:100}}/>
          </div>
          <div className="fr">
            <div className="fg">
              <label>Priority</label>
              <div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:4}}>
                {['normal','important','urgent'].map(p=>{
                  const s=priorityStyle(p);
                  return(
                    <button key={p} onClick={()=>setPriority(p)}
                      style={{padding:'7px 16px',borderRadius:99,border:`1.5px solid ${priority===p?s.accent:'var(--border)'}`,
                        background:priority===p?s.tagBg:'none',color:priority===p?s.tagColor:'var(--muted)',
                        cursor:'pointer',fontSize:'0.78rem',fontWeight:priority===p?600:400,transition:'all .2s',display:'flex',alignItems:'center',gap:5}}>
                      {s.icon} {s.label}
                    </button>
                  );
                })}
              </div>
            </div>
            <div className="fg">
              <label style={{display:'flex',alignItems:'center',gap:5}}>
                <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                Expires After *
              </label>
              <select value={durationHours} onChange={e=>setDurationHours(e.target.value)} style={{marginTop:4}}>
                {DURATION_OPTS.map(o=><option key={o.value} value={o.value}>{o.label}</option>)}
              </select>
              <p className="hint">
                Announcement will auto-delete {durationHours==='1'?'in 1 hour':`after ${DURATION_OPTS.find(o=>o.value===durationHours)?.label||durationHours+' hours'}`}.
              </p>
            </div>
          </div>
          <div style={{display:'flex',gap:9,justifyContent:'flex-end',marginTop:4}}>
            <button className="btn btn-ol" onClick={()=>setShowForm(false)}>Cancel</button>
            <button className="btn btn-gold" onClick={submit} disabled={submitting||!title.trim()||!body.trim()}>
              {submitting?<><span className="spin spin-dark"/>Posting…</>:'Post Announcement'}
            </button>
          </div>
        </div>
      )}

      {/* List */}
      {loading?(
        <div className="empty"><span className="spin"/></div>
      ):announcements.length===0?(
        <div className="empty">
          <div className="empty-ico">📢</div>
          <h3>No announcements yet</h3>
          <p>{isTeacher?'Post the first announcement above.':'Check back later for updates from your teachers.'}</p>
        </div>
      ):(
        <div style={{display:'flex',flexDirection:'column',gap:14}}>
          {announcements.map(a=>{
            const s = priorityStyle(a.priority);
            const countdown = getCountdown(a.expiresAt);
            return(
              <div key={a.id} style={{
                background:'var(--surface)',
                borderRadius:12,
                border:`1px solid ${countdown?.urgent?'rgba(239,68,68,0.4)':countdown?.warn?'rgba(245,158,11,0.35)':'var(--border)'}`,
                overflow:'hidden',
                boxShadow:'0 2px 8px rgba(0,0,0,0.06)',
                display:'flex',
                transition:'box-shadow .2s, border-color .2s',
                opacity: countdown?.urgent ? 0.92 : 1,
              }}>
                {/* Left accent bar */}
                <div style={{width:5,flexShrink:0,background:s.accent}}/>

                <div style={{flex:1,padding:'16px 18px'}}>
                  {/* Top row — tag + pin + countdown + date */}
                  <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10,flexWrap:'wrap'}}>
                    <span style={{display:'inline-flex',alignItems:'center',gap:4,background:s.tagBg,color:s.tagColor,fontSize:'0.68rem',fontWeight:700,letterSpacing:'0.5px',textTransform:'uppercase',padding:'3px 10px',borderRadius:99}}>
                      {s.icon} {s.label}
                    </span>
                    {a.pinned&&<span style={{display:'inline-flex',alignItems:'center',gap:3,background:'var(--purple-light)',color:'var(--purple)',fontSize:'0.68rem',fontWeight:600,padding:'3px 9px',borderRadius:99}}>📌 Pinned</span>}

                    {/* Expiry countdown badge */}
                    {countdown&&(
                      <span style={{
                        display:'inline-flex',alignItems:'center',gap:4,
                        background: countdown.urgent ? '#fef2f2' : countdown.warn ? '#fffbeb' : 'var(--surface)',
                        color: countdown.urgent ? '#ef4444' : countdown.warn ? '#f59e0b' : 'var(--muted)',
                        border: `1px solid ${countdown.urgent?'rgba(239,68,68,0.3)':countdown.warn?'rgba(245,158,11,0.3)':'var(--border)'}`,
                        fontSize:'0.68rem',fontWeight:600,padding:'3px 9px',borderRadius:99,
                      }}>
                        <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" strokeWidth="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                        {countdown.text}
                      </span>
                    )}

                    <span style={{marginLeft:'auto',fontSize:'0.72rem',color:'var(--muted)'}}>{fmtDate(a.createdAt)}</span>
                  </div>

                  {/* Title */}
                  <h3 style={{fontFamily:'var(--font-display)',fontSize:'1.1rem',fontWeight:700,marginBottom:8,color:'var(--ink)',lineHeight:1.3}}>{a.title}</h3>

                  {/* Body */}
                  <p style={{fontSize:'var(--text-sm)',color:'var(--muted)',lineHeight:1.65,whiteSpace:'pre-wrap',marginBottom:12}}>{a.body}</p>

                  {/* Expiry info bar */}
                  {a.expiresAt&&(
                    <div style={{
                      display:'flex',alignItems:'center',gap:6,
                      padding:'6px 10px',
                      background: countdown?.urgent ? 'rgba(239,68,68,0.07)' : countdown?.warn ? 'rgba(245,158,11,0.07)' : 'var(--surface)',
                      borderRadius:6,
                      marginBottom:12,
                      fontSize:'0.72rem',
                      color: countdown?.urgent ? '#ef4444' : countdown?.warn ? '#f59e0b' : 'var(--muted)',
                      border:`1px solid ${countdown?.urgent?'rgba(239,68,68,0.15)':countdown?.warn?'rgba(245,158,11,0.15)':'var(--border)'}`,
                    }}>
                      <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                      <span>Expires: <strong>{new Date(a.expiresAt).toLocaleDateString('en-PH',{month:'short',day:'numeric',year:'numeric'})} at {new Date(a.expiresAt).toLocaleTimeString('en-PH',{hour:'2-digit',minute:'2-digit'})}</strong></span>
                      {a.durationHours&&<span style={{marginLeft:'auto',opacity:0.7}}>({a.durationHours}h duration)</span>}
                    </div>
                  )}

                  {/* Footer */}
                  <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:8,borderTop:'1px solid var(--border)',paddingTop:10}}>
                    <div style={{display:'flex',alignItems:'center',gap:6}}>
                      <div style={{width:26,height:26,borderRadius:'50%',background:s.accent,color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700,fontSize:'0.68rem',flexShrink:0}}>
                        {a.authorName?.charAt(0).toUpperCase()}
                      </div>
                      <div>
                        <div style={{fontSize:'0.75rem',fontWeight:600,color:'var(--ink)'}}>{a.authorName}</div>
                        <div style={{fontSize:'0.65rem',color:'var(--muted)'}}>Teacher</div>
                      </div>
                    </div>
                    {isTeacher&&(
                      <div style={{display:'flex',gap:6}}>
                        <button className="btn btn-ol btn-sm" onClick={()=>togglePin(a.id,a.pinned)}>
                          {a.pinned?'Unpin':'📌 Pin'}
                        </button>
                        <button className="btn btn-red btn-sm" onClick={()=>del(a.id)}>Delete</button>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ── BACK TO TOP ──────────────────────────────────────────────────
function BackToTop() {
  const [show,setShow]=useState(false);
  useEffect(()=>{
    const el=document.getElementById('main-content');
    if(!el)return;
    const fn=()=>setShow(el.scrollTop>300);
    el.addEventListener('scroll',fn,{passive:true});
    return()=>el.removeEventListener('scroll',fn);
  },[]);
  if(!show)return null;
  return(
    <button
      onClick={()=>document.getElementById('main-content')?.scrollTo({top:0,behavior:'smooth'})}
      style={{position:'fixed',bottom:24,right:24,zIndex:300,width:42,height:42,borderRadius:'50%',background:'var(--gold)',color:'#1a1400',border:'none',cursor:'pointer',boxShadow:'var(--shadow-lg)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'1.1rem',transition:'all .2s'}}
      title="Back to top"
      aria-label="Scroll to top">
      ↑
    </button>
  );
}

//  SET SECURITY QUESTION  (shown once for accounts missing it)
// ══════════════════════════════════════════════════════════════════
function SetSecurityQuestionModal({ user, onDone }) {
  const [secQ,setSecQ]=useState(SEC_QS[0]);
  const [secA,setSecA]=useState('');
  const [showA,setShowA]=useState(false);
  const [err,setErr]=useState('');
  const [loading,setLoading]=useState(false);
  const [done,setDone]=useState(false);

  const save=async()=>{
    setErr('');
    if(!secA.trim()){setErr('Please provide an answer to your security question.');return;}
    setLoading(true);
    try{
      await API.saveSecurityQuestion(user.id,secQ,secA);
      setDone(true);
    }catch(e){setErr(e.message);}
    setLoading(false);
  };

  return (
    <div style={{
      position:'fixed',inset:0,zIndex:900,
      background:'rgba(13,15,20,0.72)',
      backdropFilter:'blur(4px)',WebkitBackdropFilter:'blur(4px)',
      display:'flex',alignItems:'center',justifyContent:'center',
      padding:'20px'
    }}>
      <div style={{
        background:'var(--white)',borderRadius:'var(--radius-xl)',
        width:'100%',maxWidth:460,
        boxShadow:'var(--shadow-xl)',
        padding:'clamp(22px,5vw,36px)',
        animation:'slideUp .25s cubic-bezier(0.34,1.56,0.64,1)'
      }}>
        {!done ? (<>
          {/* Header */}
          <div style={{display:'flex',alignItems:'flex-start',gap:14,marginBottom:20}}>
            <div style={{width:46,height:46,borderRadius:12,background:'var(--gold-bg)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'1.5rem',flexShrink:0}}>🛡️</div>
            <div>
              <h2 style={{fontFamily:'var(--font-display)',fontSize:'var(--text-xl)',fontWeight:700,color:'var(--ink)',marginBottom:4}}>Set a Security Question</h2>
              <p style={{fontSize:'var(--text-sm)',color:'var(--muted)',lineHeight:1.5}}>
                Welcome, <strong>{user.name.split(' ')[0]}</strong>! Your account needs a security question so you can reset your password on-site without email.
              </p>
            </div>
          </div>

          {err&&<div className="al al-err" role="alert" style={{marginBottom:14}}>{err}</div>}

          <div className="fg">
            <label htmlFor="sq-select">Security Question</label>
            <select id="sq-select" value={secQ} onChange={e=>setSecQ(e.target.value)}>
              {SEC_QS.map(q=><option key={q}>{q}</option>)}
            </select>
          </div>

          <div className="fg">
            <label htmlFor="sq-answer">Your Answer</label>
            <div style={{position:'relative'}}>
              <input
                id="sq-answer"
                type={showA?'text':'password'}
                placeholder="Type your answer…"
                value={secA}
                onChange={e=>setSecA(e.target.value)}
                onKeyDown={e=>e.key==='Enter'&&save()}
                style={{paddingRight:42}}
                autoFocus
              />
              <button type="button" onClick={()=>setShowA(v=>!v)}
                style={{position:'absolute',right:10,top:'50%',transform:'translateY(-50%)',background:'none',border:'none',color:'var(--muted)',cursor:'pointer',fontSize:'1rem',padding:'2px 4px'}}>
                {showA?'🙈':'👁'}
              </button>
            </div>
            <p style={{fontSize:'var(--text-xs)',color:'var(--muted)',marginTop:4}}>Remember this — it's used to verify your identity when you forget your password.</p>
          </div>

          <div style={{display:'flex',alignItems:'center',gap:9,padding:'10px 14px',background:'var(--blue-light)',border:'1px solid var(--blue)',borderRadius:'var(--radius)',marginBottom:18,fontSize:'var(--text-xs)',color:'var(--blue)'}}>
            ℹ️ Your answer is stored securely and is not case-sensitive.
          </div>

          <button className="btn btn-gold btn-full" style={{height:46}} onClick={save} disabled={loading||!secA.trim()}>
            {loading?<><span className="spin spin-dark"/>Saving…</>:'Save Security Question'}
          </button>
        </>) : (
          <div style={{textAlign:'center',padding:'18px 0'}}>
            <div style={{fontSize:'3rem',marginBottom:12}}>✅</div>
            <h3 style={{fontFamily:'var(--font-display)',fontSize:'1.2rem',marginBottom:8,color:'var(--green)'}}>All Set!</h3>
            <p className="muted" style={{marginBottom:24,fontSize:'var(--text-sm)'}}>
              Your security question has been saved. You can now reset your password directly on this site if you ever forget it.
            </p>
            <button className="btn btn-gold btn-full" onClick={onDone}>Go to Dashboard</button>
          </div>
        )}
      </div>
    </div>
  );
}

function App() {
  const [currentUser,setCurrentUser]=useState(null);
  const [authChecked,setAuthChecked]=useState(false);
  const [loaderDone,setLoaderDone]=useState(false);
  const [activeTab,setActiveTab]=useState('dashboard');
  const [pendingCount,setPendingCount]=useState(0);
  const [initError,setInitError]=useState('');
  const [sidebarOpen,setSidebarOpen]=useState(false);
  const [showSecQ,setShowSecQ]=useState(false);
  const [theme,toggleTheme]=useTheme();

  // ── Keyboard shortcuts ─────────────────────────────────
  useEffect(()=>{
    const handler=e=>{
      if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)){
        e.preventDefault();
        const sb=document.querySelector('.sb input');
        if(sb){setActiveTab('repository');setTimeout(()=>sb.focus(),100);}
      }
    };
    window.addEventListener('keydown',handler);
    return()=>window.removeEventListener('keydown',handler);
  },[]);

  useEffect(()=>{
    let unsub=()=>{};
    try{
      unsub=auth.onAuthStateChanged(async fbUser=>{
        if(window._registering){setAuthChecked(true);return;}
        if(fbUser){
          try{
            const profile=await API.getProfile(fbUser.uid);
            if(profile&&(profile.status==='approved'||profile.role==='admin')){
              setCurrentUser(profile);
              if(!profile.secQ||!profile.secA||!profile.secQ.trim()||!profile.secA.trim()) setShowSecQ(true);
              if(profile.role==='admin'){
                API.getUsers({role:'student',status:'pending'}).then(p=>setPendingCount(p.length)).catch(()=>{});
              }
            } else {
              await auth.signOut().catch(()=>{});
            }
          }catch(e){
            await auth.signOut().catch(()=>{});
          }
        }
        setAuthChecked(true);
      },err=>{
        setInitError(err.message);
        setAuthChecked(true);
      });
    }catch(e){
      setInitError(e.message);
      setAuthChecked(true);
    }
    return ()=>{try{unsub();}catch{}};
  },[]);

  const titles={dashboard:'Dashboard',users:'User Management',announcements:'Announcements','studies-admin':'Manage Studies',categories:'Manage Categories',repository:'Research Repository',chatbot:'AI Research Assistant',recognized:'Recognized Studies'};

  if(!authChecked || !loaderDone){
    // Keep React from rendering anything until auth is known AND the loader has fully faded out
    if(authChecked && !loaderDone){
      // Auth is ready — trigger the loader dismiss and wait for its fade-out (700ms) before showing app
      if(typeof window.sabnahisLoaderDone==='function'){
        window.sabnahisLoaderDone();
        window.sabnahisLoaderDone=null;
      }
      setTimeout(()=>setLoaderDone(true), 750);
    }
    return null;
  }

  if(initError){
    return (
      <div style={{minHeight:'100vh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',background:'var(--ink)',gap:14,padding:24}}>
        <div style={{fontSize:'2rem'}}>⚠️</div>
        <div style={{fontFamily:'var(--font-display)',fontSize:'1.1rem',color:'#fff'}}>Connection Error</div>
        <div style={{background:'rgba(255,255,255,0.07)',borderRadius:8,padding:'12px 18px',maxWidth:480,color:'rgba(255,255,255,0.6)',fontSize:'0.85rem',fontFamily:'var(--font-mono)',wordBreak:'break-all'}}>{initError}</div>
        <p style={{color:'rgba(255,255,255,0.4)',fontSize:'0.82rem',textAlign:'center',maxWidth:400}}>Check that your Firebase project is active and the domain is authorized in Firebase Console → Authentication → Settings → Authorized domains.</p>
        <button className="btn btn-gold" onClick={()=>window.location.reload()}>Reload Page</button>
      </div>
    );
  }

  if(!currentUser){
    return (
      <ToastProvider>
        <AuthPage onLogin={user=>{
          setCurrentUser(user);
          if(!user.secQ||!user.secA||!user.secQ.trim()||!user.secA.trim()) setShowSecQ(true);
          if(user.role==='admin') API.getUsers({role:'student',status:'pending'}).then(p=>setPendingCount(p.length)).catch(()=>{});
        }}/>
      </ToastProvider>
    );
  }

  const isAdmin=currentUser.role==='admin';

  const renderPage=()=>{
    switch(activeTab){
      case 'dashboard':     return isAdmin?<AdminDash currentUser={currentUser}/>:<StudentDash currentUser={currentUser}/>;
      case 'users':         return isAdmin?<AdminUsers/>:null;
      case 'studies-admin': return isAdmin?<AdminStudies/>:null;
      case 'categories':    return isAdmin?<AdminCats/>:null;
      case 'repository':    return <StudiesPage currentUser={currentUser}/>;
      case 'recognized':    return <RecognizedStudiesPage currentUser={currentUser} isAdmin={isAdmin}/>;
      case 'announcements': return <AnnouncementsPage currentUser={currentUser}/>
      case 'chatbot':       return <ChatPage currentUser={currentUser}/>;
      default:              return null;
    }
  };

  const mobNav = isAdmin
    ? [{id:'dashboard',label:'Home',icon:<Ico.home/>},{id:'repository',label:'Studies',icon:<Ico.book/>},{id:'recognized',label:'Recognized',icon:<Ico.award/>},{id:'chatbot',label:'AI Chat',icon:<Ico.bot/>},{id:'users',label:'Users',icon:<Ico.users/>}]
    : [{id:'dashboard',label:'Home',icon:<Ico.home/>},{id:'repository',label:'Studies',icon:<Ico.book/>},{id:'announcements',label:'Notices',icon:<Ico.bell/>},{id:'chatbot',label:'AI Chat',icon:<Ico.bot/>}];

  return (
    <ToastProvider>
      <div className="app-shell">
        <Sidebar
          currentUser={currentUser}
          activeTab={activeTab}
          setActiveTab={setActiveTab}
          pendingCount={pendingCount}
          isOpen={sidebarOpen}
          onClose={()=>setSidebarOpen(false)}
          onLogout={async()=>{await API.logout();setCurrentUser(null);setActiveTab('dashboard');}}
          theme={theme}
          toggleTheme={toggleTheme}
        />
        <div className="main-content" id="main-content">
          {/* Desktop topbar */}
          <div className="topbar">
            <span className="topbar-title">{titles[activeTab]||'Dashboard'}</span>
            <span className={`badge${isAdmin?' badge-teacher':' badge-appr'}`}>{isAdmin?'⚙ Teacher':'🎓 Student'}</span>
            <div style={{display:'flex',gap:4,marginLeft:8}}>
              <button className="topbar-theme-toggle" onClick={()=>theme!=='light'&&toggleTheme()} style={theme==='light'?{borderColor:'var(--gold)',color:'var(--gold)',background:'var(--gold-bg)',fontWeight:600}:{}} aria-pressed={theme==='light'}>☀ Light</button>
              <button className="topbar-theme-toggle" onClick={()=>theme!=='dark'&&toggleTheme()} style={theme==='dark'?{borderColor:'var(--gold)',color:'var(--gold)',background:'var(--gold-bg)',fontWeight:600}:{}} aria-pressed={theme==='dark'}>☾ Dark</button>
            </div>
          </div>

          {/* Mobile header */}
          <div className="mob-header" role="banner">
            <button className="mob-menu-btn" onClick={()=>setSidebarOpen(o=>!o)} aria-label="Open menu" aria-expanded={sidebarOpen}>
              <Ico.menu/>
            </button>
            <span className="mob-header-title">SABNAHIS STE</span>
            <div style={{display:'flex',gap:4,alignItems:'center'}}>
              <button className="theme-toggle" onClick={()=>theme!=='light'&&toggleTheme()} style={theme==='light'?{background:'rgba(201,162,39,0.25)',color:'var(--gold-light)',border:'1px solid rgba(201,162,39,0.4)'}:{}} aria-pressed={theme==='light'}>☀</button>
              <button className="theme-toggle" onClick={()=>theme!=='dark'&&toggleTheme()} style={theme==='dark'?{background:'rgba(201,162,39,0.25)',color:'var(--gold-light)',border:'1px solid rgba(201,162,39,0.4)'}:{}} aria-pressed={theme==='dark'}>☾</button>
            </div>
          </div>

          <main className="page">{renderPage()}</main>
        </div>

        {/* Mobile bottom navigation */}
        <nav className="mob-nav" aria-label="Mobile navigation">
          <div className="mob-nav-inner">
            {mobNav.map(item=>(
              <button key={item.id}
                className={`mob-nav-btn${activeTab===item.id?' active':''}`}
                onClick={()=>setActiveTab(item.id)}
                aria-current={activeTab===item.id?'page':undefined}
                aria-label={item.label}>
                {item.icon}<span>{item.label}</span>
              </button>
            ))}
            {isAdmin&&(
              <button
                className={`mob-nav-btn${activeTab==='studies-admin'?' active':''}`}
                onClick={()=>setActiveTab('studies-admin')}
                aria-current={activeTab==='studies-admin'?'page':undefined}
                aria-label="Manage studies">
                <Ico.book/><span>Manage</span>
              </button>
            )}
            <button
              className="mob-nav-btn"
              onClick={()=>setSidebarOpen(o=>!o)}
              aria-label="More options"
              aria-expanded={sidebarOpen}>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" width="20" height="20"><circle cx="12" cy="5" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="19" r="1.5" fill="currentColor"/></svg>
              <span>More</span>
            </button>
          </div>
        </nav>
      </div>
      {showSecQ&&<SetSecurityQuestionModal user={currentUser} onDone={()=>setShowSecQ(false)}/>}
    </ToastProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

<script>
// ── Loading screen counter + dismiss ──────────────────────────────
(function() {
  var pctEl = document.getElementById('loader-pct');
  var progress = 0;
  var interval = setInterval(function() {
    var inc = Math.random() > 0.8 ? 0.5 : 1.8;
    progress = Math.min(progress + inc, 100);
    if (pctEl) pctEl.textContent = Math.floor(progress) + '%';
    if (progress >= 100) clearInterval(interval);
  }, 80);

  // Parallax on mouse
  document.addEventListener('mousemove', function(e) {
    var body = document.querySelector('.loader-body');
    if (!body) return;
    var x = (e.clientX - window.innerWidth  / 2) / 60;
    var y = (e.clientY - window.innerHeight / 2) / 60;
    body.style.transform = 'translate(' + x + 'px,' + y + 'px)';
  });

  // Expose dismiss so React can call it
  window.sabnahisLoaderDone = function() {
    var el = document.getElementById('sabnahis-loader');
    if (el) { el.classList.add('fade-out'); setTimeout(function(){ el.remove(); }, 700); }
  };

  // Expose show — re-creates the loader if already removed, or re-shows it
  window.sabnahisLoaderShow = function(onComplete) {
    var el = document.getElementById('sabnahis-loader');
    if (!el) {
      // Rebuild loader element
      el = document.createElement('div');
      el.id = 'sabnahis-loader';
      el.innerHTML = [
        '<div class="loader-grid-overlay"></div>',
        '<div class="loader-corner loader-corner--tl"><span class="loader-corner-h" style="margin-bottom:12px;display:block;"></span><span class="loader-corner-v"></span></div>',
        '<div class="loader-corner loader-corner--tr"><span class="loader-corner-h" style="margin-bottom:12px;display:block;margin-left:auto;"></span><span class="loader-corner-v" style="margin-left:auto;"></span></div>',
        '<div class="loader-corner loader-corner--bl"><span class="loader-corner-v"></span><span class="loader-corner-h" style="margin-top:12px;display:block;"></span></div>',
        '<div class="loader-corner loader-corner--br"><span class="loader-corner-v" style="margin-left:auto;"></span><span class="loader-corner-h" style="margin-top:12px;display:block;margin-left:auto;"></span></div>',
        '<div class="loader-body">',
          '<div class="loader-icon-wrap">',
            '<div class="loader-icon-glow"></div>',
            '<div class="loader-icon-box" style="flex-direction:row;gap:10px;width:auto;padding:0 16px;">',
              '<img src="LOGO.png" alt="Logo 1" style="width:48px;height:48px;object-fit:contain;border-radius:6px;"/>',
              '<img src="LOGO2.png" alt="Logo 2" style="width:48px;height:48px;object-fit:contain;border-radius:6px;"/>',
            '</div>',
          '</div>',
          '<div class="loader-brand">',
            '<div class="loader-brand-name">SABNAHIS STE</div>',
            '<div class="loader-brand-sub">Advanced Research Environment</div>',
          '</div>',
          '<div class="loader-progress-wrap">',
            '<div class="loader-track"><div class="loader-bar"></div></div>',
            '<div class="loader-meta">',
              '<span class="loader-meta-left"><span class="loader-meta-dot"></span>Authenticating…</span>',
              '<span class="loader-meta-pct" id="loader-pct">0%</span>',
            '</div>',
          '</div>',
        '</div>',
        '<div class="loader-footer">',
          '<div class="loader-tagline">Securing the Future of STEM Research</div>',
        '</div>',
      ].join('');
      document.body.appendChild(el);
    } else {
      el.classList.remove('fade-out');
      // Reset progress text
      var p = el.querySelector('#loader-pct');
      if (p) p.textContent = '0%';
      // Update status label
      var lbl = el.querySelector('.loader-meta-left');
      if (lbl) lbl.innerHTML = '<span class="loader-meta-dot"></span>Authenticating…';
    }

    // Animate progress to 100% over ~1.8s then call onComplete
    var pct = el.querySelector('#loader-pct');
    var prog = 0;
    var iv = setInterval(function() {
      var inc = Math.random() > 0.7 ? 0.8 : 2.2;
      prog = Math.min(prog + inc, 100);
      if (pct) pct.textContent = Math.floor(prog) + '%';
      if (prog >= 100) {
        clearInterval(iv);
        setTimeout(function() {
          el.classList.add('fade-out');
          setTimeout(function() { if (onComplete) onComplete(); }, 650);
        }, 300);
      }
    }, 40);
  };
})();
</script>
</body>
</html>
