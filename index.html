const STEM_STOPWORDS = new Set(['the','a','an','of','in','for','to','and','or','is','are','was','were','be','been','it','this','that','with','by','from','on','at','as','its','study','research','about','using','based']);

function extractKeyTerms(text) {
  return text.toLowerCase()
    .replace(/[^\w\s]/g,' ')
    .split(/\s+/)
    .filter(w => w.length > 3 && !STEM_STOPWORDS.has(w))
    .slice(0, 12);
}

function scoreStudy(study, terms) {
  const fields = [
    { text: study.title||'',        weight: 3 },
    { text: (study.keywords||[]).join(' '), weight: 2.5 },
    { text: (study.categories||[]).join(' '), weight: 2 },
    { text: (study.authors||[]).join(' '), weight: 1.5 },
    { text: study.abstract||'',     weight: 1 },
  ];
  let score = 0;
  const fullText = fields.map(f=>f.text).join(' ').toLowerCase();
  terms.forEach(term => {
    fields.forEach(f => {
      const matches = (f.text.toLowerCase().match(new RegExp(term,'g'))||[]).length;
      score += matches * f.weight;
    });
    // Bonus for exact phrase in title
    if ((study.title||'').toLowerCase().includes(term)) score += 2;
  });
  return score;
}

function findRelevant(query, studies, limit=5) {
  if (!query||!studies?.length) return [];
  const terms = extractKeyTerms(query);
  if (!terms.length) return studies.slice(0,limit);
  return studies
    .map(s=>({s, score:scoreStudy(s, terms)}))
    .filter(x=>x.score>0)
    .sort((a,b)=>b.score-a.score)
    .slice(0, limit)
    .map(x=>x.s);
}

// Research gap detection
function detectResearchGaps(studies, query='') {
  if (!studies.length) return [];
  
  const allText = studies.map(s=>[s.title,s.abstract,...(s.keywords||[]),...(s.categories||[])].join(' ').toLowerCase()).join(' ');
  const allCats = {};
  studies.forEach(s=>(s.categories||[]).forEach(c=>{allCats[c]=(allCats[c]||0)+1;}));
  
  const gaps = [];
  const DEFAULT_CATS_SET = ['Biology','Chemistry','Physics','Mathematics','Computer Science','Environmental Science','Engineering','Health Science','Earth Science','Social Science'];
  DEFAULT_CATS_SET.forEach(cat => {
    if (!allCats[cat]) gaps.push(cat);
  });
  
  // Content-based gap detection
  const gapTopics = [
    { topic:'climate change impacts', check:/climate|global warming|carbon/ },
    { topic:'machine learning applications', check:/machine learning|neural|deep learning|AI/ },
    { topic:'renewable energy', check:/solar|wind energy|renewable|clean energy/ },
    { topic:'mental health in students', check:/mental health|anxiety|depression|wellbeing/ },
    { topic:'biodiversity conservation', check:/biodiversity|conservation|species|ecosystem/ },
    { topic:'data privacy and cybersecurity', check:/privacy|cybersecurity|data security|encryption/ },
  ];
  
  const contentGaps = gapTopics
    .filter(g => !g.check.test(allText))
    .map(g => g.topic)
    .slice(0, 2);
  
  return contentGaps;
}

// Cluster studies by theme
function clusterStudies(studies) {
  const clusters = {};
  studies.forEach(s => {
    (s.categories||['General']).forEach(cat => {
      if (!clusters[cat]) clusters[cat] = [];
      clusters[cat].push(s);
    });
  });
  return clusters;
}

// Groq key — fetched from Firestore, cached in memory
let _groqKeyCache = null;
const getGroqKey = () => _groqKeyCache || localStorage.getItem('sabnahis_groq_key') || '';
async function loadGroqKeyFromFirestore() {
  try {
    const snap = await db.collection('config').doc('groq').get();
    if (snap.exists && snap.data().apiKey) {
      _groqKeyCache = snap.data().apiKey;
    }
  } catch(e) { /* silent — fallback to localStorage */ }

async function callAI(query, history, studies, mode='general') {
  const recent = history.slice(-6).map(m=>`${m.role==='user'?'Student':'Assistant'}: ${m.content.slice(0,200)}`).join('\n');
  const system = buildSystemPrompt(studies, mode, recent);

  const GROQ_API_KEY = getGroqKey();
  if (!GROQ_API_KEY) return buildLocalResponse(query, studies, mode);

  const messages = [
    { role:'system', content: system },
    ...history.slice(-12).map(m=>({ role: m.role==='user'?'user':'assistant', content: m.content })),
    { role:'user', content: query }
  ];

  try {
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${GROQ_API_KEY}`
      },
      body: JSON.stringify({
        model: GROQ_MODEL,
        messages,
        max_tokens: 1600,
        temperature: 0.7
      })
    });
    const data = await res.json();
    if (data.error) {
      console.error('Groq API error:', data.error);
      toast.err(`Groq: ${data.error.message}`);
      throw new Error(data.error.message);
    }
    const text = data.choices?.[0]?.message?.content || 'No response generated.';
    const relevant = findRelevant(query, studies, 4);
    return { text, citations: relevant, source: 'groq' };
  } catch(err) {
    console.error('AI call failed:', err);
    return buildLocalResponse(query, studies, mode);
  }
}

      'energy': { def: 'The capacity to do work or cause change. Energy exists in many forms and can be converted from one form to another but cannot be created or destroyed (Law of Conservation of Energy).', detail: 'Forms: kinetic (motion), potential (stored), thermal (heat), chemical, electrical, nuclear, electromagnetic. Formula for kinetic energy: KE = ½mv². The SI unit is the joule (J).', apps: 'Power generation, engineering, nutrition science, environmental science.', related: 'Work, power, force, thermodynamics, renewable energy.' },
      'statistics': { def: 'The branch of mathematics that involves collecting, analyzing, interpreting, and presenting numerical data.', detail: 'Descriptive statistics summarize data (mean, median, mode, standard deviation). Inferential statistics make predictions about populations from samples (t-tests, ANOVA, regression, p-value).', apps: 'Research methodology, public health, economics, data science, quality control.', related: 'Mean, median, mode, standard deviation, probability, data analysis.' },
      'evolution': { def: 'The process of change in the heritable characteristics of biological populations over successive generations, driven by natural selection, mutation, genetic drift, and gene flow.', detail: 'Key mechanisms: Natural selection (favorable traits increase), Mutation (source of new variation), Genetic drift (random changes in allele frequency), Gene flow (movement of genes between populations). Darwin\'s theory is supported by fossil records, comparative anatomy, and molecular biology.', apps: 'Medicine (antibiotic resistance), agriculture (selective breeding), conservation biology.', related: 'Natural selection, genetics, mutation, adaptation, speciation.' },
    };

    // Try to find a matching definition
    let foundDef = null;
    let foundKey = null;
    for (const [key, val] of Object.entries(DEFINITIONS)) {
      if (topicLow.includes(key) || key.includes(topicLow)) {
        foundDef = val;
        foundKey = key;
        break;
      }
    }

    const repoNote = relevant.length
      ? `\n\n**📚 Related studies in the repository:**\n${relevant.map(s=>`• **${s.title}** ${generateInText(s)}`).join('\n')}`
      : `\n\n*No repository studies specifically cover "${topic}" yet — this could be a research gap worth exploring.*`;

    if (foundDef) {
      return { text: `### 📖 Definition: ${topic.charAt(0).toUpperCase()+topic.slice(1)}\n\n**${foundDef.def}**\n\n**Key Details:**\n${foundDef.detail}\n\n**Real-World Applications:**\n${foundDef.apps}\n\n**Related Concepts:**\n${foundDef.related}${repoNote}`, citations: relevant, source: 'local' };
    }

    // Generic definition structure for unknown topics
    return { text: `### 📖 Definition: ${topic.charAt(0).toUpperCase()+topic.slice(1)}\n\nFor a full academic definition of **"${topic}"** — including examples, characteristics, applications, and related concepts — the Groq AI connection provides the most complete answer.\n\n**What I can tell you:**\n• This topic appears to be in the domain of STEM/academic research\n• Use **Define Topic** mode and type your question\n• If Groq AI is connected, you'll get a structured definition with examples and analogies\n\n*(Tip: Try asking "What is [specific term]?" for built-in definitions of common STEM concepts like photosynthesis, algorithm, DNA, hypothesis, ecosystem, and more.)*${repoNote}`, citations: relevant, source: 'local' };
  }

  // Suggest / Gap mode
  if (mode==='suggest' || /suggest|gap|missing|what topics|ideas for|research direction/.test(q)) {
    const gaps = detectResearchGaps(all);
    const gapText = gaps.length
      ? `**🔭 Detected Research Gaps:**\n${gaps.map(g=>`• **${g}** — no studies in the repository cover this yet`).join('\n')}`
      : '• The repository has decent coverage across core STEM areas.';
    return { text:`### Research Direction Suggestions\n\n${gapText}\n\n**💡 Ideas for Novel Studies:**\n• Interdisciplinary studies combining ${Object.keys(clusterStudies(all)).slice(0,2).join(' + ')}\n• Longitudinal follow-ups to existing studies\n• Comparative studies across different years\n\n*For detailed, context-specific suggestions with full research questions, use Groq AI mode.*`, citations:[], source:'local' };
  }

  // Relevant results found — intelligent response
  if (relevant.length) {
    const list = relevant.map((s,i)=>`**${i+1}. ${s.title}** ${generateInText(s)}\n👤 *${(s.authors||[]).join(', ')}* · 📅 ${s.year} · 🏷 ${(s.categories||[]).join(', ')}\n${(s.abstract||'').slice(0,200)}${(s.abstract||'').length>200?'...':''}`).join('\n\n');
    const refs = '\n\n---\n### References\n'+relevant.map(s=>generateAPA(s)).join('\n');
    
    // Smart connection detection
    const yearRange = relevant.length > 1 ? `${Math.min(...relevant.map(s=>s.year))}–${Math.max(...relevant.map(s=>s.year))}` : null;
    const categories = [...new Set(relevant.flatMap(s=>s.categories||[]))];
    const connectionNote = relevant.length >= 2
      ? `\n\n💡 *These studies span ${yearRange ? `${yearRange}` : 'multiple years'} and cover ${categories.slice(0,3).join(', ')}. You might ask me to compare them or summarize their findings.*`
      : '';
    
    const gaps = detectResearchGaps(all);
    const gapNote = gaps.length ? `\n\n📌 *Research gap spotted: No studies in the repository cover **${gaps[0]}** yet.*` : '';
    
    return { text:`Found **${relevant.length}** relevant ${relevant.length===1?'study':'studies'}:\n\n${list}${connectionNote}${gapNote}${refs}`, citations:relevant, source:'local' };
  }

  // Off-topic detection
  const stemKeywords = ['science','biology','chemistry','physics','math','engineering','technology','research','study','data','experiment','hypothesis','theory','algorithm','robotics','environment','health','genetics','ecology','climate','energy','computer','programming','statistics','quantum','genomics','nanotechnology'];
  const hasStemContext = stemKeywords.some(k => q.includes(k));
  if (!hasStemContext && q.length > 10 && !/repository|upload|portal|study|studies/.test(q)) {
    return { text:`I'm focused on academic and STEM topics. I can help you with:\n• **Definitions** of scientific concepts\n• **APA citations** for studies\n• **Finding** studies in the repository\n• **Research gaps** and topic suggestions\n\nWhat STEM topic can I help you with?`, citations:[], source:'local' };
  }

  // No results — intelligent fallback
  const gaps = detectResearchGaps(all);
  const gapNote = gaps.includes(query.split(' ')[0]) ? `\n\n📌 *"${query}" appears to be an unexplored area in this repository — a potential research opportunity!*` : '';
  return { text:`No studies matched **"${query}"** in the repository.${gapNote}\n\n**I can still help:**\n• Ask *"Define ${query}"* for an academic definition\n• Try broader keywords or a different phrasing\n• Ask *"List all studies"* to browse everything\n• Use the **Repository** tab to filter by category\n• Ask *"Suggest topics related to ${query}"* for research ideas`, citations:[], source:'local' };
}

//  PLAGIARISM ENGINE — TF-IDF cosine similarity
// ══════════════════════════════════════════════════════════════════
const STOPWORDS = new Set(['the','a','an','and','or','but','in','on','at','to','for','of','with','by','from','as','is','was','are','were','be','been','being','have','has','had','do','does','did','will','would','could','should','may','might','can','this','that','these','those','it','its','we','our','they','their','i','my','he','she','his','her','us','which','who','what','when','where','how','all','also','into','than','then','so','if','not','no','up','out','about','over','such','through','more','other','very','just','because','between','after','before','during','while','study','research','paper','analysis','using','based','results','data','show','found','effect','used','new','two','one','first','second','three']);

function tokenize(text) {
  return (text||'').toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(w=>w.length>2&&!STOPWORDS.has(w));
}
function buildTF(tokens) {
  const tf={};
  tokens.forEach(t=>tf[t]=(tf[t]||0)+1);
  const total=tokens.length||1;
  Object.keys(tf).forEach(k=>tf[k]/=total);
  return tf;
}
function cosineSimilarity(tfA,tfB) {
  const keys=new Set([...Object.keys(tfA),...Object.keys(tfB)]);
  let dot=0,magA=0,magB=0;
  keys.forEach(k=>{const a=tfA[k]||0,b=tfB[k]||0;dot+=a*b;magA+=a*a;magB+=b*b;});
  return (magA&&magB)?dot/(Math.sqrt(magA)*Math.sqrt(magB)):0;
}
function getSharedTerms(textA,textB) {
  const wordsA=tokenize(textA),wordsB=new Set(tokenize(textB));
  const freq={};
  wordsA.filter(w=>wordsB.has(w)).forEach(w=>freq[w]=(freq[w]||0)+1);
  return Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([w])=>w);
}
function checkPlagiarism(inputText,studies,excludeId=null) {
  if(!inputText||inputText.trim().length<50) return [];
  const tokensA=tokenize(inputText);
  if(tokensA.length<10) return [];
  const tfA=buildTF(tokensA);
  return studies.filter(s=>s.id!==excludeId&&s.abstract).map(s=>{
    const tfB=buildTF(tokenize(s.abstract));
    const score=cosineSimilarity(tfA,tfB);
    return {study:s,score,shared:getSharedTerms(inputText,s.abstract)};
  }).filter(r=>r.score>0.08).sort((a,b)=>b.score-a.score).slice(0,5);
}
function plagiarismLevel(score) {
  if(score>=0.5) return {label:'High Similarity',  color:'var(--red)',  bg:'var(--red-light)',  block:true};
  if(score>=0.3) return {label:'Moderate Similarity',color:'#f59e0b',  bg:'#fef9c3',           block:false};
  if(score>=0.15)return {label:'Low Similarity',   color:'var(--teal)',bg:'var(--teal-light)', block:false};
  return              {label:'Minimal Similarity', color:'var(--green)',bg:'var(--green-light)',block:false};
}

const MD = memo(function MD({ text }) {
  const lines = (text||'').split('\n');
  return (
    <div className="md">
      {lines.map((line,i) => {
        if (!line.trim()) return <div key={i} style={{height:5}}/>;
        if (line.startsWith('---')) return <hr key={i} style={{border:'none',borderTop:'1px solid var(--border)',margin:'8px 0'}}/>;
        if (/^#{1,3}\s/.test(line)) return <div key={i} className="md" style={{fontFamily:'var(--font-display)',fontWeight:600,fontSize:'0.97rem',color:'var(--ink)',margin:'8px 0 4px'}}>{line.replace(/^#{1,3}\s/,'')}</div>;
        const html = line
          .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
          .replace(/\*(.+?)\*/g,'<em>$1</em>')
          .replace(/`(.+?)`/g,'<code>$1</code>');
        if (/^\d+\.\s/.test(line)) {
          const num = line.match(/^(\d+)\./)[1];
          return <div key={i} className="md-num"><span className="md-num-n">{num}.</span><span dangerouslySetInnerHTML={{__html:html.replace(/^\d+\.\s*/,'')}}/></div>;
        }
        if (/^[•\-]\s/.test(line)) return <div key={i} className="md-bullet"><span className="md-bullet-dot">•</span><span dangerouslySetInnerHTML={{__html:html.replace(/^[•\-]\s*/,'')}}/></div>;
        return <div key={i} dangerouslySetInnerHTML={{__html:html}}/>;
      })}
    </div>
  );
});

let toastFn = null;
function ToastProvider({ children }) {
  const [toasts,setToasts] = useState([]);
  toastFn = useCallback((msg,type='ok')=>{
    const id=Date.now();
    setToasts(t=>[...t,{id,msg,type}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),3800);
  },[]);
  return (<>
    {children}
    <div className="toasts">
      {toasts.map(t=><div key={t.id} className={`toast ${t.type}`}><span>{t.type==='ok'?'✓':t.type==='err'?'✕':'ℹ'}</span>{t.msg}</div>)}
    </div>
  </>);
}
const toast = { ok:m=>toastFn?.(m,'ok'), err:m=>toastFn?.(m,'err'), info:m=>toastFn?.(m,'info') };

function Modal({ title, onClose, children, wide }) {
  useEffect(()=>{
    const esc = e=>e.key==='Escape'&&onClose?.();
    document.addEventListener('keydown',esc);
    document.body.style.overflow = 'hidden';
    return ()=>{ document.removeEventListener('keydown',esc); document.body.style.overflow=''; };
  },[onClose]);
  return (
    <div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose?.()}>
      <div className="modal" style={wide?{maxWidth:740}:{}} role="dialog" aria-modal="true" aria-label={title}>
        <div className="modal-hd">
          <h2 className="modal-title">{title}</h2>
          <button className="modal-x" onClick={onClose} aria-label="Close dialog"><Ico.X/></button>
        </div>
        <div className="modal-bd">{children}</div>
      </div>
    </div>
  );
}

function APABox({ study, currentUser }) {
  const [copied,setCopied]=useState(false);
  const apa=generateAPA(study);
  const copy=()=>navigator.clipboard?.writeText(apa).then(()=>{
    setCopied(true);
    setTimeout(()=>setCopied(false),2000);
    // track citation count + log who cited
    db.collection('studies').doc(study.id).update({
      citationCount: firebase.firestore.FieldValue.increment(1)
    }).catch(()=>{});
    if(currentUser){
      db.collection('studies').doc(study.id).collection('citations').add({
        userId: currentUser.id,
        userName: currentUser.name,
        userEmail: currentUser.email,
        institution: currentUser.institution||'',
        department: currentUser.department||'',
        timestamp: new Date().toISOString()
      }).catch(()=>{});
    }
  });
  return (
    <div>
      <div className="apa-box">{apa}<button className="apa-cp" onClick={copy}>{copied?'✓ Copied':'Copy'}</button></div>
      {(study.citationCount||0)>0&&<div style={{fontSize:'0.7rem',color:'var(--muted)',marginTop:4,textAlign:'right'}}>📋 Cited {study.citationCount} time{study.citationCount!==1?'s':''}</div>}
    </div>
  );
}

function CatPicker({ selected, onChange, max=2, cats=[] }) {
  const toggle=cat=>{
    if (selected.includes(cat)){onChange(selected.filter(c=>c!==cat));return;}
    if (selected.length>=max){toast.err(`Select up to ${max} categories only.`);return;}
    onChange([...selected,cat]);
  };
  return (
    <div className="cat-picker" role="group" aria-label="Category selection">
      {cats.map(cat=>{
        const isSel=selected.includes(cat),isDis=!isSel&&selected.length>=max;
        return (
          <div key={cat} className={`cat-opt${isSel?' sel':''}${isDis?' dis':''}`}
            onClick={()=>!isDis&&toggle(cat)}
            role="checkbox" aria-checked={isSel} tabIndex={isDis?-1:0}
            onKeyDown={e=>(e.key==='Enter'||e.key===' ')&&!isDis&&toggle(cat)}>
            <div className="cat-cb">{isSel&&<span style={{color:'var(--ink)',fontSize:'0.63rem',fontWeight:900}}>✓</span>}</div>
            <span style={{fontSize:'0.875rem',fontWeight:500,color:'var(--ink-3)'}}>{cat}</span>
          </div>
        );
      })}
      <p className="hint">Select 1–{max} categories. {selected.length}/{max} selected.</p>
    </div>
  );
}

//  FORGOT PASSWORD  (on-site, no email required)
// ══════════════════════════════════════════════════════════════════
function ForgotModal({ onClose }) {
  const [step,setStep]=useState('email');       // 'email' → 'question' → 'newpw' → 'done'
  const [email,setEmail]=useState('');
  const [secQ,setSecQ]=useState('');
  const [answer,setAnswer]=useState('');
  const [uid,setUid]=useState('');
  const [pw,setPw]=useState('');
  const [pw2,setPw2]=useState('');
  const [showPw,setShowPw]=useState(false);
  const [err,setErr]=useState('');
  const [loading,setLoading]=useState(false);

  // Step indicators
  const steps=['Email','Security Question','New Password'];
  const stepIdx={'email':0,'question':1,'newpw':2,'done':3};

  const stepEmail=async()=>{
    setErr('');
    if(!email.trim()){setErr('Please enter your email address.');return;}
    setLoading(true);
    try{
      const res=await API.getSecurityQuestion(email);
      setUid(res.uid);setSecQ(res.secQ);setStep('question');
    }catch(e){
      const msg=e.message||'';
      if(msg.includes('anonymous')||msg.includes('ANONYMOUS')||e.code==='auth/operation-not-allowed')
        setErr('On-site reset requires Anonymous Authentication to be enabled in Firebase Console → Authentication → Sign-in methods → Anonymous.');
      else setErr(msg);
    }
    setLoading(false);
  };

  const stepQuestion=async()=>{
    setErr('');
    if(!answer.trim()){setErr('Please enter your security answer.');return;}
    setLoading(true);
    try{
      await API.verifySecurityAnswer(uid,answer);
      setStep('newpw');
    }catch(e){setErr(e.message);}
    setLoading(false);
  };

  const stepNewPw=async()=>{
    setErr('');
    if(pw.length<8){setErr('Password must be at least 8 characters.');return;}
    if(pw!==pw2){setErr('Passwords do not match.');return;}
    setLoading(true);
    try{
      await API.resetPasswordOnSite(uid,pw);
      setStep('done');
    }catch(e){setErr(e.message);}
    setLoading(false);
  };

  const titles={announcements:'Announcements','email':'Reset Your Password','question':'Security Question','newpw':'Set New Password','done':'Password Updated'};

  return (
    <Modal title={titles[step]} onClose={onClose}>
      {/* Progress bar */}
      {step!=='done'&&(
        <div style={{display:'flex',gap:0,marginBottom:20,borderRadius:8,overflow:'hidden',border:'1px solid var(--border)'}}>
          {steps.map((s,i)=>(
            <div key={s} style={{
              flex:1,padding:'6px 4px',textAlign:'center',
              fontSize:'0.68rem',fontWeight:600,
              background:i<stepIdx[step]?'var(--green-light)':i===stepIdx[step]?'var(--gold-bg)':'var(--surface)',
              color:i<stepIdx[step]?'var(--green)':i===stepIdx[step]?'var(--gold)':'var(--muted)',
              borderRight:i<2?'1px solid var(--border)':'none',
              transition:'all .3s'
            }}>
              {i<stepIdx[step]?'✓ ':''}{s}
            </div>
          ))}
        </div>
      )}

      {err&&<div className="al al-err" role="alert">{err}</div>}

      {step==='email'&&(
        <>
          <p className="muted" style={{marginBottom:16,fontSize:'var(--text-sm)'}}>
            Enter your registered email address and we'll verify your identity using your security question — no email needed.
          </p>
          <div className="fg">
            <label htmlFor="fp-email">Email Address</label>
            <input id="fp-email" type="email" placeholder="your@email.com"
              value={email} onChange={e=>setEmail(e.target.value)}
              onKeyDown={e=>e.key==='Enter'&&stepEmail()} autoFocus/>
          </div>
          <div style={{display:'flex',gap:9,justifyContent:'flex-end',marginTop:4}}>
            <button className="btn btn-ol" onClick={onClose}>Cancel</button>
            <button className="btn btn-gold" onClick={stepEmail} disabled={loading||!email.trim()}>
              {loading?<><span className="spin spin-dark"/>Checking…</>:'Continue →'}
            </button>
          </div>
        </>
      )}

      {step==='question'&&(
        <>
          <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'var(--radius)',padding:'12px 14px',marginBottom:16}}>
            <p style={{fontSize:'var(--text-xs)',color:'var(--muted)',marginBottom:4,fontWeight:600,textTransform:'uppercase',letterSpacing:'0.5px'}}>Your Security Question</p>
            <p style={{fontSize:'var(--text-sm)',color:'var(--ink)',fontWeight:500}}>{secQ}</p>
          </div>
          <div className="fg">
            <label htmlFor="fp-answer">Your Answer</label>
            <input id="fp-answer" placeholder="Type your answer…"
              value={answer} onChange={e=>setAnswer(e.target.value)}
              onKeyDown={e=>e.key==='Enter'&&stepQuestion()} autoFocus/>
            <p style={{fontSize:'var(--text-xs)',color:'var(--muted)',marginTop:4}}>Answer is not case-sensitive.</p>
          </div>
          <div style={{display:'flex',gap:9,justifyContent:'flex-end',marginTop:4}}>
            <button className="btn btn-ol" onClick={()=>{setStep('email');setAnswer('');setErr('');}}>← Back</button>
            <button className="btn btn-gold" onClick={stepQuestion} disabled={loading||!answer.trim()}>
              {loading?<><span className="spin spin-dark"/>Verifying…</>:'Verify Answer →'}
            </button>
          </div>
        </>
      )}

      {step==='newpw'&&(
        <>
          <p className="muted" style={{marginBottom:16,fontSize:'var(--text-sm)'}}>
            Identity verified! Choose a new password for your account.
          </p>
          <div className="fg">
            <label htmlFor="fp-pw">New Password</label>
            <div style={{position:'relative'}}>
              <input id="fp-pw" type={showPw?'text':'password'} placeholder="Min. 8 characters"
                value={pw} onChange={e=>setPw(e.target.value)} autoFocus
                style={{paddingRight:42}}/>
              <button type="button" onClick={()=>setShowPw(v=>!v)}
                style={{position:'absolute',right:10,top:'50%',transform:'translateY(-50%)',background:'none',border:'none',color:'var(--muted)',cursor:'pointer',fontSize:'1rem',padding:'2px 4px'}}>
                {showPw?'🙈':'👁'}
              </button>
            </div>
            {pw&&(
              <div style={{marginTop:5,display:'flex',gap:4,alignItems:'center'}}>
                {[1,2,3,4].map(i=>(
                  <div key={i} style={{height:3,flex:1,borderRadius:4,background:
                    pw.length>=12&&/[A-Z]/.test(pw)&&/[0-9]/.test(pw)&&/[^A-Za-z0-9]/.test(pw)?'var(--green)':
                    pw.length>=10&&/[A-Z]/.test(pw)&&/[0-9]/.test(pw)?'var(--teal)':
                    pw.length>=8?'var(--gold)':'var(--red)',
                    opacity:i===1?1:i===2&&pw.length>=8?1:i===3&&pw.length>=10&&/[A-Z]/.test(pw)?1:i===4&&pw.length>=12&&/[^A-Za-z0-9]/.test(pw)?1:0.2
                  }}/>
                ))}
                <span style={{fontSize:'0.65rem',color:'var(--muted)',whiteSpace:'nowrap'}}>
                  {pw.length<8?'Too short':pw.length<10?'Fair':pw.length<12?'Good':'Strong'}
                </span>
              </div>
            )}
          </div>
          <div className="fg">
            <label htmlFor="fp-pw2">Confirm New Password</label>
            <input id="fp-pw2" type={showPw?'text':'password'} placeholder="Repeat new password"
              value={pw2} onChange={e=>setPw2(e.target.value)}
              onKeyDown={e=>e.key==='Enter'&&stepNewPw()}
              style={{borderColor:pw2&&pw!==pw2?'var(--red)':pw2&&pw===pw2?'var(--green)':''}}/>
            {pw2&&pw!==pw2&&<p style={{fontSize:'var(--text-xs)',color:'var(--red)',marginTop:3}}>Passwords do not match.</p>}
            {pw2&&pw===pw2&&<p style={{fontSize:'var(--text-xs)',color:'var(--green)',marginTop:3}}>✓ Passwords match.</p>}
          </div>
          <div style={{display:'flex',gap:9,justifyContent:'flex-end',marginTop:4}}>
            <button className="btn btn-ol" onClick={()=>{setStep('question');setPw('');setPw2('');setErr('');}}>← Back</button>
            <button className="btn btn-gold" onClick={stepNewPw} disabled={loading||!pw||!pw2}>
              {loading?<><span className="spin spin-dark"/>Saving…</>:'Save New Password'}
            </button>
          </div>
        </>
      )}

      {step==='done'&&(
        <div style={{textAlign:'center',padding:'18px 0'}}>
          <div style={{fontSize:'3rem',marginBottom:12}}>🔓</div>
          <h3 style={{fontFamily:'var(--font-display)',fontSize:'1.15rem',marginBottom:8,color:'var(--green)'}}>Password Updated!</h3>
          <p className="muted" style={{marginBottom:8,fontSize:'var(--text-sm)'}}>
            Your new password has been saved. Sign in with your new password right away.
          </p>
          <p style={{fontSize:'var(--text-xs)',color:'var(--muted)',marginBottom:22,background:'var(--surface)',borderRadius:8,padding:'8px 12px',border:'1px solid var(--border)'}}>
            💡 The new password takes effect on your next sign-in.
          </p>
          <button className="btn btn-gold btn-full" onClick={onClose}>Back to Sign In</button>
        </div>
      )}
    </Modal>
  );
}

//  AUTH PAGE
// ══════════════════════════════════════════════════════════════════
function AuthPage({ onLogin }) {
  const [theme,toggleTheme]=useTheme();
  const [tab,setTab]=useState('login');
  const [rememberMe,setRememberMe]=useState(true);
  const [loading,setLoading]=useState(false);
  const [form,setForm]=useState({name:'',email:'',password:'',confirm:'',institution:'',gradeLevel:'',section:'',secQ:SEC_QS[0],secA:''});
  const [err,setErr]=useState('');
  const [ok,setOk]=useState('');
  const [showForgot,setShowForgot]=useState(false);
  const sf=(k,v)=>setForm(f=>({...f,[k]:v}));

  const login=async()=>{
    setErr('');setLoading(true);
    try{
      const user=await API.login(form.email,form.password);
      // Show the branded loading animation, then transition into the app
      if(typeof window.sabnahisLoaderShow==='function'){
        window.sabnahisLoaderShow(()=>{
          toast.ok(`Welcome back, ${user.name.split(' ')[0]}!`);
          onLogin(user);
        });
      } else {
        toast.ok(`Welcome back, ${user.name.split(' ')[0]}!`);
        onLogin(user);
      }
    }
    catch(e){setErr(e.message);setLoading(false);}
  };

  const register=async()=>{
    setErr('');
    if(form.password!==form.confirm){setErr('Passwords do not match.');return;}
    if(!form.gradeLevel){setErr('Please select your grade level.');return;}
    if(!form.section.trim()){setErr('Please enter your section.');return;}
    setLoading(true);
    try{await API.register(form);setOk('Registration submitted! Wait for teacher approval before logging in.');setTab('login');setForm(f=>({...f,password:'',confirm:''}));}
    catch(e){setErr(e.message);}
    setLoading(false);
  };

  return (
    <div className="auth-wrap">
      <div className="auth-bg"/>
      {/* Corner marks */}
      <div className="auth-corner auth-corner--tl"><span className="auth-corner-h" style={{marginBottom:12,display:'block'}}></span><span className="auth-corner-v" style={{display:'block'}}></span></div>
      <div className="auth-corner auth-corner--tr"><span className="auth-corner-h" style={{marginBottom:12,display:'block',marginLeft:'auto'}}></span><span className="auth-corner-v" style={{display:'block',marginLeft:'auto'}}></span></div>
      <div className="auth-corner auth-corner--bl"><span className="auth-corner-v" style={{display:'block'}}></span><span className="auth-corner-h" style={{marginTop:12,display:'block'}}></span></div>
      <div className="auth-corner auth-corner--br"><span className="auth-corner-v" style={{display:'block',marginLeft:'auto'}}></span><span className="auth-corner-h" style={{marginTop:12,display:'block',marginLeft:'auto'}}></span></div>
      <div className="auth-inner">
        <div className="auth-brand">
          <div className="auth-brand-icon" style={{flexDirection:'row',gap:'8px',width:'auto',padding:'0 14px'}}><img src="LOGO.png" alt="Logo 1" style={{width:'34px',height:'34px',objectFit:'contain',borderRadius:'6px'}}/><img src="LOGO2.png" alt="Logo 2" style={{width:'34px',height:'34px',objectFit:'contain',borderRadius:'6px'}}/></div>
          <h1>SABNAHIS<span>STE Research Portal</span></h1>
          <p>Research Repository for SABNAHIS STE Students</p>
        </div>
        <div className="auth-card">
          {err&&<div className="al al-err" role="alert">{err}</div>}
          {ok&&<div className="al al-ok" role="status">{ok}</div>}
          <div className="auth-tabs" role="tablist">
            <button role="tab" aria-selected={tab==='login'} className={`auth-tab${tab==='login'?' active':''}`} onClick={()=>setTab('login')}>Sign In</button>
            <button role="tab" aria-selected={tab==='register'} className={`auth-tab${tab==='register'?' active':''}`} onClick={()=>setTab('register')}>Register</button>
          </div>

          {tab==='login'?(<>
            <div className="fg"><label htmlFor="login-email">Email</label><input id="login-email" type="email" placeholder="your@email.com" value={form.email} onChange={e=>sf('email',e.target.value)} autoComplete="email"/></div>
            <div className="fg"><label htmlFor="login-pw">Password</label><input id="login-pw" type="password" placeholder="••••••••" value={form.password} onChange={e=>sf('password',e.target.value)} onKeyDown={e=>e.key==='Enter'&&login()} autoComplete="current-password"/></div>
            <button className="btn btn-gold btn-full" style={{marginBottom:12,height:46}} onClick={login} disabled={loading}>{loading?<><span className="spin spin-gold"/>Signing in…</>:'Sign In'}</button>
            <button className="auth-forgot" style={{width:'100%',textAlign:'center',background:'none',border:'none',fontSize:'0.82rem',cursor:'pointer',padding:'6px',transition:'color 0.2s'}} onClick={()=>setShowForgot(true)}>Forgot your password?</button>
          </>):(<>
            <div className="fg"><label htmlFor="reg-name">Full Name *</label><input id="reg-name" placeholder="Juan dela Cruz" value={form.name} onChange={e=>sf('name',e.target.value)} autoComplete="name"/></div>
            <div className="fg"><label htmlFor="reg-inst">School / Institution</label><input id="reg-inst" placeholder="SABNAHIS" value={form.institution} onChange={e=>sf('institution',e.target.value)}/></div>
            <div className="fr">
              <div className="fg">
                <label htmlFor="reg-grade">Grade Level *</label>
                <select id="reg-grade" value={form.gradeLevel} onChange={e=>sf('gradeLevel',e.target.value)}>
                  <option value="">— Select Grade —</option>
                  {['8','9','10','11','12'].map(g=><option key={g} value={g}>Grade {g}</option>)}
                </select>
              </div>
              <div className="fg"><label htmlFor="reg-section">Section *</label><input id="reg-section" placeholder="e.g. Rizal, STEM-A" value={form.section} onChange={e=>sf('section',e.target.value)}/></div>
            </div>
            <div className="fg"><label htmlFor="reg-email">Email *</label><input id="reg-email" type="email" placeholder="your@email.com" value={form.email} onChange={e=>sf('email',e.target.value)} autoComplete="email"/></div>
            <div className="fr">
              <div className="fg"><label htmlFor="reg-pw">Password *</label><input id="reg-pw" type="password" placeholder="Min. 8 characters" value={form.password} onChange={e=>sf('password',e.target.value)} autoComplete="new-password"/></div>
              <div className="fg"><label htmlFor="reg-pw2">Confirm Password *</label><input id="reg-pw2" type="password" placeholder="Repeat password" value={form.confirm} onChange={e=>sf('confirm',e.target.value)} autoComplete="new-password"/></div>
            </div>
            <div className="fg"><label htmlFor="reg-sq">Security Question</label><select id="reg-sq" value={form.secQ} onChange={e=>sf('secQ',e.target.value)}>{SEC_QS.map(q=><option key={q}>{q}</option>)}</select></div>
            <div className="fg"><label htmlFor="reg-sa">Security Answer *</label><input id="reg-sa" placeholder="Your answer" value={form.secA} onChange={e=>sf('secA',e.target.value)}/></div>
            <button className="btn btn-gold btn-full" style={{height:46}} onClick={register} disabled={loading}>{loading?<><span className="spin spin-gold"/>Registering…</>:'Register Account'}</button>
          </>)}
        </div>
      </div>
      {showForgot&&<ForgotModal onClose={()=>setShowForgot(false)}/>}
    </div>
  );
}

  const gdriveUrl = gdriveData ? (gdriveData.driveUrl || gdriveData.viewUrl || null) : null;

    if(isOwner) API.getFavoritedBy(study.id).then(setFavBy);
  },[]);

  const toggleFav = async () => {
    // Optimistic update — flip state immediately, revert on failure
    const prev = faved;
    setFaved(!prev);
    setFavLoading(false); // keep button responsive
    try {
      if(prev){ await API.removeFavorite(currentUser.id, study.id); toast.ok('Removed from bookmarks.'); }
      else { await API.addFavorite(currentUser.id, study); toast.ok('📌 Bookmarked!'); }

                <span style={{fontSize:'0.6rem',opacity:0.6,fontWeight:400,marginLeft:1}}>(owner)</span>
              </span>,
              ...study.coAuthors.map((ca,i)=>(
                <span key={i} className={`author-tag${ca.registered?' registered':''}`} style={{fontSize:'var(--text-xs)'}}>
                  <span className="author-tag-avatar"><span>{(ca.name||'?').charAt(0).toUpperCase()}</span></span>
                  <span style={{overflow:'hidden',textOverflow:'ellipsis',maxWidth:160}}>{ca.name}</span>
                  {!ca.registered&&<span style={{fontSize:'0.6rem',opacity:0.55,fontWeight:400,marginLeft:1}}>(ext.)</span>}
                </span>

              <span key={i} className={`author-tag${i===0?' self':''}`} style={{fontSize:'var(--text-xs)'}}>
                <span className="author-tag-avatar"><span>{(a||'?').charAt(0).toUpperCase()}</span></span>
                <span style={{overflow:'hidden',textOverflow:'ellipsis',maxWidth:160}}>{a}</span>
              </span>
            ))
        }
      </div>
      <div style={{display:'flex',gap:18,flexWrap:'wrap',marginBottom:16}}>
        <span style={{fontSize:'0.82rem',color:'var(--muted)',display:'flex',alignItems:'center',gap:4}}><Ico.eye/>{study.viewCount||0} views</span>
        <span style={{fontSize:'0.82rem',color:'var(--muted)',display:'flex',alignItems:'center',gap:4}}><Ico.dl/>{study.downloadCount||0} downloads</span>
        <span style={{fontSize:'0.82rem',color:'var(--muted)',display:'flex',alignItems:'center',gap:4}}>📋 {study.citationCount||0} citations</span>
        <span style={{fontSize:'0.82rem',color:'var(--muted)',display:'flex',alignItems:'center',gap:4}}><Ico.cal/>{study.year}</span>
      </div>
      <div className="ds" style={{marginBottom:16}}>
        <h4 style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          Abstract
          <span style={{fontSize:'0.7rem',fontWeight:400,color:'var(--muted)',fontFamily:'var(--font-body)'}}>📖 {readingTime(study.abstract)}</span>
        </h4>
        <p style={{lineHeight:1.7,color:'var(--ink-3)',fontSize:'var(--text-sm)',transition:'all .2s'}}>
          {absIsLong && !absExpanded ? absPreview : study.abstract}
        </p>
        {absIsLong&&(
          <button className="sc-abs-toggle" style={{marginTop:6}} onClick={()=>setAbsExpanded(v=>!v)} aria-expanded={absExpanded}>
            {absExpanded
              ? <><svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="18 15 12 9 6 15"/></svg> Show less</>
              : <><svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="6 9 12 15 18 9"/></svg> Read full abstract</>
            }
          </button>
        )}
      </div>
      {(study.keywords||[]).length>0&&(
        <div style={{marginBottom:16}}>
          <div style={{fontSize:'0.72rem',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.8px',color:'var(--muted)',marginBottom:7}}>Keywords</div>
          {(study.keywords||[]).map(k=><span key={k} className="kw">{k}</span>)}
        </div>
      )}
      <div style={{marginBottom:16}}>
        <div style={{fontSize:'0.72rem',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.8px',color:'var(--muted)',marginBottom:7}}>APA Citation</div>
        <APABox study={study} currentUser={currentUser}/>
      </div>
      {gdriveUrl&&(
        <div style={{display:'flex',alignItems:'center',gap:9,padding:'10px 14px',background:'var(--teal-light)',border:'1.5px solid var(--teal)',borderRadius:'var(--radius)',marginBottom:16}}>
          <svg viewBox="0 0 87.3 78" width="22" height="22" xmlns="http://www.w3.org/2000/svg" style={{flexShrink:0}}><path d="M6.6 66.85l3.85 6.65c.8 1.4 1.95 2.5 3.3 3.3l13.75-23.8H0c0 1.55.4 3.1 1.2 4.5z" fill="#0066da"/><path d="M43.65 25L29.9 1.2C28.55 2 27.4 3.1 26.6 4.5L1.2 48.6c-.8 1.4-1.2 2.95-1.2 4.5h27.5z" fill="#00ac47"/><path d="M73.55 76.8c1.35-.8 2.5-1.9 3.3-3.3l1.6-2.75 7.65-13.25c.8-1.4 1.2-2.95 1.2-4.5H59.8l5.85 11.5z" fill="#ea4335"/><path d="M43.65 25L57.4 1.2C56.05.4 54.5 0 52.9 0H34.4c-1.6 0-3.1.45-4.5 1.2z" fill="#00832d"/><path d="M59.8 53.1H27.5L13.75 76.9c1.35.8 2.9 1.2 4.5 1.2h50.8c1.6 0 3.1-.45 4.5-1.2z" fill="#2684fc"/><path d="M73.4 26.6l-12.6-21.9C59.9 3.2 58.75 2.1 57.4 1.3L43.65 25l16.15 28.1h27.45c0-1.55-.4-3.1-1.2-4.5z" fill="#ffba00"/></svg>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontWeight:600,fontSize:'0.875rem',color:'var(--teal)'}}>Google Drive File</div>
            <div style={{fontSize:'0.73rem',color:'var(--teal)',opacity:0.8,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{gdriveUrl}</div>
          </div>
          <a href={gdriveUrl} target="_blank" rel="noopener noreferrer" onClick={handleDL} className="btn btn-teal btn-sm" style={{textDecoration:'none'}}><Ico.eye/> Open</a>
          {gdriveDownload&&<a href={gdriveDownload} target="_blank" rel="noopener noreferrer" onClick={handleDL} className="btn btn-ol btn-sm" style={{textDecoration:'none'}}><Ico.dl/> Download</a>}
        </div>
      )}
      {study.uploadedByName&&(
        <div style={{display:'flex',alignItems:'center',gap:9,padding:'10px 14px',background:'var(--surface)',borderRadius:'var(--radius)',marginBottom:16}}>
          <div className="avatar" style={{width:32,height:32,fontSize:'0.78rem'}}>{initials(study.uploadedByName)}</div>
          <div>
            <div style={{fontSize:'0.72rem',color:'var(--muted)'}}>Uploaded by</div>
            <div style={{fontWeight:500,fontSize:'0.875rem'}}>{study.uploadedByName}</div>
          </div>
        </div>
      )}
      <TeacherFeedbackSection study={study} currentUser={currentUser}/>
      <ReviewsSection study={study} currentUser={currentUser}/>
      {/* Favorited By — only visible to study owner */}
      {isOwner&&favBy.length>0&&(
        <div style={{marginBottom:14,padding:'10px 14px',background:'var(--purple-light)',border:'1px solid var(--purple)',borderRadius:'var(--radius)'}}>
          <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:6,cursor:'pointer'}} onClick={()=>setShowFavBy(s=>!s)}>
            <span style={{fontSize:'0.8rem',fontWeight:600,color:'var(--purple)'}}>📌 {favBy.length} student{favBy.length!==1?'s':''} bookmarked this study</span>
            <span style={{fontSize:'0.7rem',color:'var(--purple)',marginLeft:'auto'}}>{showFavBy?'▲ hide':'▼ show'}</span>
          </div>
          {showFavBy&&(
            <div style={{display:'flex',flexDirection:'column',gap:6}}>
              {favBy.map(u=>(
                <div key={u.uid} style={{display:'flex',alignItems:'center',gap:8,fontSize:'0.78rem'}}>
                  <div style={{width:26,height:26,borderRadius:'50%',background:'var(--purple)',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700,fontSize:'0.7rem',flexShrink:0}}>{u.name.charAt(0).toUpperCase()}</div>
                  <div><div style={{fontWeight:500}}>{u.name}</div>{u.institution&&<div style={{fontSize:'0.7rem',color:'var(--muted)'}}>{u.institution}</div>}</div>
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:6,paddingTop:14,borderTop:'1px solid var(--border)',flexWrap:'wrap',gap:9}}>
        <button
          className={faved?'btn btn-gold btn-sm':'btn btn-ol btn-sm'}
          onClick={toggleFav}
          disabled={favLoading}
          data-tip={faved?'Remove bookmark':'Bookmark this study'}>
          {favLoading?<span className="spin" style={{width:13,height:13}}/>:<>{faved?'📌 Bookmarked':'🔖 Bookmark'}</>}
        </button>
        {canDel&&<button className="btn btn-red btn-sm" data-tip="Permanently remove this study" onClick={()=>{onDelete(study.id);onClose();}}><Ico.trash/> Delete Study</button>}
      </div>
      {/* ── Similar Studies ── */}
      {(()=>{
        const cats = study.categories || [];
        const kws  = (study.keywords || []).map(k=>k.toLowerCase());
        const similar = allStudies
          .filter(s => s.id !== study.id)
          .map(s => {
            const sCats = s.categories || [];
            const sKws  = (s.keywords || []).map(k=>k.toLowerCase());
            const catScore = sCats.filter(c=>cats.includes(c)).length * 3;
            const kwScore  = sKws.filter(k=>kws.includes(k)).length * 2;
            return { ...s, _score: catScore + kwScore };
          })
          .filter(s => s._score > 0)
          .sort((a,b) => b._score - a._score)
          .slice(0, 4);

        if (!similar.length) return null;
        return (
          <div style={{borderTop:'1px solid var(--border)',paddingTop:16,marginTop:16}}>
            <div style={{fontSize:'0.72rem',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.8px',color:'var(--muted)',marginBottom:12}}>
              📚 Similar Studies
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:9}}>
              {similar.map(s=>(
                <div key={s.id}
                  onClick={()=>onOpenStudy&&onOpenStudy(s)}
                  style={{display:'flex',gap:12,padding:'11px 14px',background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'var(--radius)',cursor:'pointer',transition:'border-color .15s,box-shadow .15s'}}
                  onMouseEnter={e=>{e.currentTarget.style.borderColor='var(--gold)';e.currentTarget.style.boxShadow='0 2px 8px rgba(201,162,39,0.1)';}}
                  onMouseLeave={e=>{e.currentTarget.style.borderColor='var(--border)';e.currentTarget.style.boxShadow='none';}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:'flex',gap:4,flexWrap:'wrap',marginBottom:5}}>
                      {(s.categories||[]).filter(c=>cats.includes(c)).map(c=>(
                        <span key={c} style={{background:'var(--gold-bg)',color:'var(--gold)',fontSize:'0.62rem',fontWeight:600,padding:'1px 7px',borderRadius:99,border:'1px solid var(--gold)'}}>{c}</span>
                      ))}
                      {(s.categories||[]).filter(c=>!cats.includes(c)).map(c=>(
                        <span key={c} style={{background:'var(--surface)',color:'var(--muted)',fontSize:'0.62rem',padding:'1px 7px',borderRadius:99,border:'1px solid var(--border)'}}>{c}</span>
                      ))}
                    </div>
                    <div style={{fontWeight:600,fontSize:'0.85rem',lineHeight:1.35,marginBottom:3,color:'var(--ink)'}} title={s.title}>
                      {s.title.length>90?s.title.slice(0,90)+'…':s.title}
                    </div>
                    <div style={{fontSize:'0.72rem',color:'var(--muted)',display:'flex',gap:10,flexWrap:'wrap'}}>
                      <span>{(s.authors||[]).slice(0,2).join(', ')}{s.authors?.length>2?' et al.':''}</span>
                      <span>{s.year}</span>
                      <span><Ico.eye/>{s.viewCount||0}</span>
                      {s.teacherGrade&&<span style={{color:'var(--teal)',fontWeight:600}}>✓ {s.teacherGrade}</span>}
                    </div>
                  </div>
                  <div style={{display:'flex',alignItems:'center',color:'var(--muted)',fontSize:'0.8rem',flexShrink:0}}>›</div>
                </div>
              ))}
            </div>
          </div>
        );
      })()}
    </Modal>
  );
}

//  TEACHER FEEDBACK SECTION
// ══════════════════════════════════════════════════════════════════
const GRADE_LABELS = {
  'A+': { label:'A+', desc:'Outstanding',  color:'#065f46' },
  'A':  { label:'A',  desc:'Excellent',    color:'#065f46' },
  'A-': { label:'A-', desc:'Very Good',    color:'#065f46' },
  'B+': { label:'B+', desc:'Good',         color:'#1e40af' },
  'B':  { label:'B',  desc:'Above Average',color:'#1e40af' },
  'B-': { label:'B-', desc:'Average',      color:'#1e40af' },
  'C+': { label:'C+', desc:'Below Average',color:'#92400e' },
  'C':  { label:'C',  desc:'Satisfactory', color:'#92400e' },
  'D':  { label:'D',  desc:'Needs Work',   color:'#9a3412' },
  'F':  { label:'F',  desc:'Failing',      color:'#991b1b' },
};

const CRITERIA_LABELS = {
  methodology:   { label:'Methodology',     max:25 },
  relevance:     { label:'Relevance',       max:25 },
  presentation:  { label:'Presentation',    max:25 },
  originality:   { label:'Originality',     max:25 },
};

function ScoreInput({ label, max, value, onChange, readOnly }) {
  return (
    <div className="tf-criterion">
      <div className="tf-criterion-label">{label} <span style={{color:'var(--muted)',fontWeight:400}}>/{max}</span></div>
      {readOnly
        ? <div className="tf-criterion-score">{value ?? '—'}</div>
        : <input type="number" min="0" max={max} value={value||''} onChange={e=>onChange(Math.min(max,Math.max(0,Number(e.target.value))))}
            style={{width:'100%',padding:'4px 8px',fontSize:'1rem',fontWeight:700,color:'var(--teal)',border:'1px solid var(--border)',borderRadius:6,background:'var(--bg)'}}/>
      }
    </div>
  );
}

function TeacherFeedbackSection({ study, currentUser }) {
  const isTeacher = currentUser.role === 'admin';
  const isOwner   = currentUser.id === study.uploadedBy;
  const [feedback, setFeedback] = useState(null);
  const [loading, setLoading]   = useState(true);
  const [showForm, setShowForm] = useState(false);
  const [submitting, setSubmitting] = useState(false);
  const [grade, setGrade]       = useState('');
  const [criteria, setCriteria] = useState({ methodology:0, relevance:0, presentation:0, originality:0 });
  const [comments, setComments]     = useState('');
  const [recommendations, setRecommendations] = useState('');
  const [plagTeacher,setPlagTeacher]=useState(null);
  const [plagTeacherLoading,setPlagTeacherLoading]=useState(false);

  const totalScore = Object.values(criteria).reduce((a,b)=>a+(b||0),0);
  const gradeLetterClass = grade ? `tf-grade-${grade.charAt(0)}` : '';

  const load = async () => {
    setLoading(true);
    const fb = await API.getTeacherFeedback(study.id);
    setFeedback(fb);
    if(fb){ setGrade(fb.grade); setCriteria(fb.criteria||{}); setComments(fb.comments||''); setRecommendations(fb.recommendations||''); }
    setLoading(false);
  };
  useEffect(()=>{ load(); },[]);

  const submit = async () => {
    setSubmitting(true);
    try {
      await API.submitTeacherFeedback(study.id, { teacherId:currentUser.id, teacherName:currentUser.name, grade, criteria, comments, recommendations });
      toast.ok('Feedback submitted!');
      setShowForm(false);
      load();
    } catch(e) { toast.err(e.message); }
    setSubmitting(false);
  };

  const del = async () => {
    if(!confirm('Remove this feedback?')) return;
    await API.deleteTeacherFeedback(study.id, currentUser.id);
    setFeedback(null); setGrade(''); setCriteria({methodology:0,relevance:0,presentation:0,originality:0}); setComments(''); setRecommendations('');
    toast.ok('Feedback removed.');
  };

  const setCrit = (k,v) => setCriteria(c=>({...c,[k]:v}));

  if(loading) return null;

  // Students & owner: show feedback if exists
  if (!isTeacher) {
    if (!feedback) return (
      <div style={{padding:'12px 0',borderTop:'1px solid var(--border)',marginTop:16}}>
        <div style={{fontSize:'0.72rem',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.8px',color:'var(--muted)',marginBottom:6}}>Teacher Feedback</div>
        <p style={{fontSize:'var(--text-sm)',color:'var(--muted)',fontStyle:'italic'}}>No teacher feedback yet.</p>
      </div>
    );
    const gl = GRADE_LABELS[feedback.grade]||{};
    return (
      <div className="tf-card" style={{marginTop:16}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:8,marginBottom:12}}>
          <div style={{fontSize:'0.72rem',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.8px',color:'var(--teal)'}}>📝 Teacher Feedback</div>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <span className={`tf-grade-badge tf-grade-${feedback.grade.charAt(0)}`}>{feedback.grade} — {gl.desc}</span>
            <span style={{fontSize:'0.7rem',color:'var(--muted)'}}>{fmtDate(feedback.gradedAt)}</span>
          </div>
        </div>
        <div className="tf-criteria">
          {Object.entries(CRITERIA_LABELS).map(([k,{label,max}])=>(
            <ScoreInput key={k} label={label} max={max} value={feedback.criteria?.[k]} readOnly/>
          ))}
        </div>
        <div style={{background:'var(--bg)',borderRadius:6,padding:'2px 0',marginBottom:8}}>
          <div style={{fontSize:'0.68rem',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.5px',color:'var(--muted)',marginBottom:4}}>Overall Score</div>
          <div style={{fontSize:'1.4rem',fontWeight:700,color:'var(--teal)'}}>{feedback.totalScore}<span style={{fontSize:'0.8rem',color:'var(--muted)',fontWeight:400}}>/100</span></div>
        </div>
        <div style={{marginBottom:feedback.recommendations?10:0}}>
          <div style={{fontSize:'0.68rem',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.5px',color:'var(--muted)',marginBottom:5}}>Comments</div>
          <p style={{fontSize:'var(--text-sm)',color:'var(--ink)',lineHeight:1.6,whiteSpace:'pre-wrap'}}>{feedback.comments}</p>
        </div>
        {feedback.recommendations&&(
          <div style={{borderTop:'1px solid var(--border)',paddingTop:10,marginTop:4}}>
            <div style={{fontSize:'0.68rem',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.5px',color:'var(--muted)',marginBottom:5}}>Recommendations</div>
            <p style={{fontSize:'var(--text-sm)',color:'var(--ink)',lineHeight:1.6,whiteSpace:'pre-wrap'}}>{feedback.recommendations}</p>
          </div>
        )}
        <div style={{marginTop:10,fontSize:'0.72rem',color:'var(--muted)',display:'flex',alignItems:'center',gap:5}}>
          <div style={{width:20,height:20,borderRadius:'50%',background:'var(--teal)',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'0.6rem',fontWeight:700,flexShrink:0}}>{feedback.teacherName?.charAt(0).toUpperCase()}</div>
          {feedback.teacherName} · Teacher
        </div>
      </div>
    );
  }

  // Plagiarism check for existing study (teacher only)
  const runPlagCheck=async()=>{
    setPlagTeacherLoading(true);
    const allSnap=await API.getStudies({status:'active',perPage:200});
    const results=checkPlagiarism(study.abstract,allSnap.data||[],study.id);
    setPlagTeacher(results);
    setPlagTeacherLoading(false);
  };

  // Teacher view
  return (
    <div style={{marginTop:16,borderTop:'1px solid var(--border)',paddingTop:14}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10,flexWrap:'wrap',gap:8}}>
        <div style={{fontSize:'0.72rem',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.8px',color:'var(--teal)'}}>📝 Teacher Feedback</div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          {!showForm&&(
          <button className="btn btn-teal btn-sm" onClick={()=>setShowForm(true)}>
            {feedback?'✏️ Edit Feedback':'+ Give Feedback'}
          </button>
          )}
          <button className="btn btn-ol btn-sm" onClick={runPlagCheck} disabled={plagTeacherLoading}>
            {plagTeacherLoading?<><span className="spin" style={{width:12,height:12}}/> Checking…</>:'🔍 Check Plagiarism'}
          </button>
        </div>
        {plagTeacher!==null&&(
          <div style={{marginTop:10,borderRadius:'var(--radius)',overflow:'hidden',border:`1.5px solid ${plagTeacher.length&&plagTeacher[0].score>=0.5?'var(--red)':plagTeacher.length&&plagTeacher[0].score>=0.3?'#f59e0b':'var(--green)'}`,marginBottom:10}}>
            <div style={{padding:'8px 12px',background:plagTeacher.length&&plagTeacher[0].score>=0.5?'var(--red-light)':plagTeacher.length&&plagTeacher[0].score>=0.3?'#fef9c3':'var(--green-light)',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
              <span style={{fontWeight:700,fontSize:'0.78rem',color:plagTeacher.length&&plagTeacher[0].score>=0.5?'var(--red)':plagTeacher.length&&plagTeacher[0].score>=0.3?'#92400e':'var(--green)'}}>
                {plagTeacher.length===0?'✅ No significant similarity found':`${plagTeacher.length} similar ${plagTeacher.length===1?'study':'studies'} found`}
              </span>
              <button onClick={()=>setPlagTeacher(null)} style={{background:'none',border:'none',cursor:'pointer',color:'var(--muted)',fontSize:'0.8rem'}}>✕</button>
            </div>
            {plagTeacher.length>0&&(
              <div style={{background:'var(--surface)',padding:'10px 12px',display:'flex',flexDirection:'column',gap:7}}>
                {plagTeacher.map((r,i)=>{
                  const l=plagiarismLevel(r.score);
                  return(
                    <div key={i} style={{display:'flex',alignItems:'flex-start',gap:8}}>
                      <div style={{minWidth:42,height:20,borderRadius:99,background:l.bg,border:`1px solid ${l.color}`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'0.65rem',fontWeight:700,color:l.color,flexShrink:0}}>
                        {Math.round(r.score*100)}%
                      </div>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:'0.78rem',fontWeight:600,color:'var(--ink)'}}>{r.study.title.length>60?r.study.title.slice(0,60)+'…':r.study.title}</div>
                        <div style={{fontSize:'0.68rem',color:'var(--muted)'}}>{(r.study.authors||[]).slice(0,2).join(', ')} · {r.study.year}</div>
                        {r.shared.length>0&&<div style={{marginTop:3,display:'flex',gap:3,flexWrap:'wrap'}}>{r.shared.map(w=><span key={w} style={{background:'var(--gold-bg)',color:'var(--gold)',fontSize:'0.62rem',padding:'1px 6px',borderRadius:99,border:'1px solid var(--gold)'}}>{w}</span>)}</div>}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        )}
      </div>

      {/* Existing feedback display for teacher */}
      {feedback&&!showForm&&(
        <div className="tf-card" style={{marginBottom:10}}>
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10,flexWrap:'wrap'}}>
            <span className={`tf-grade-badge tf-grade-${feedback.grade.charAt(0)}`}>{feedback.grade} — {(GRADE_LABELS[feedback.grade]||{}).desc}</span>
            <span style={{fontSize:'0.7rem',color:'var(--muted)',marginLeft:'auto'}}>{fmtDate(feedback.gradedAt)}</span>
            <button className="btn btn-red btn-sm" onClick={del}>Delete</button>
          </div>
          <div className="tf-criteria">
            {Object.entries(CRITERIA_LABELS).map(([k,{label,max}])=>(
              <ScoreInput key={k} label={label} max={max} value={feedback.criteria?.[k]} readOnly/>
            ))}
          </div>
          <div style={{fontSize:'0.82rem',color:'var(--muted)',marginTop:6}}>Total: <strong style={{color:'var(--teal)'}}>{feedback.totalScore}/100</strong></div>
        </div>
      )}

      {/* Feedback form */}
      {showForm&&(
        <div className="tf-card">
          <div style={{fontWeight:600,fontSize:'var(--text-sm)',marginBottom:14,color:'var(--teal)'}}>
            {feedback?'Edit Feedback':'Grade this Study'}
          </div>

          {/* Grade selector */}
          <div className="fg" style={{marginBottom:12}}>
            <label>Grade *</label>
            <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
              {Object.keys(GRADE_LABELS).map(g=>(
                <button key={g} onClick={()=>setGrade(g)}
                  style={{padding:'5px 12px',borderRadius:6,border:`1.5px solid ${grade===g?GRADE_LABELS[g].color:'var(--border)'}`,
                    background:grade===g?GRADE_LABELS[g].color:'none',
                    color:grade===g?'#fff':GRADE_LABELS[g].color,
                    cursor:'pointer',fontSize:'0.78rem',fontWeight:600,transition:'all .15s'}}>
                  {g}
                </button>
              ))}
            </div>
            {grade&&<div style={{marginTop:6,fontSize:'0.78rem',color:'var(--muted)'}}>
              <span className={`tf-grade-badge tf-grade-${grade.charAt(0)}`}>{grade} — {GRADE_LABELS[grade].desc}</span>
            </div>}
          </div>

          {/* Criteria scores */}
          <div className="fg" style={{marginBottom:12}}>
            <label>Scoring Criteria (each out of their max, total: <strong style={{color:totalScore>=90?'var(--green)':totalScore>=75?'var(--teal)':totalScore>=60?'var(--gold)':'var(--red)'}}>{totalScore}/100</strong>)</label>
            <div className="tf-criteria">
              {Object.entries(CRITERIA_LABELS).map(([k,{label,max}])=>(
                <ScoreInput key={k} label={label} max={max} value={criteria[k]||0} onChange={v=>setCrit(k,v)}/>
              ))}
            </div>
          </div>

          {/* Comments */}
          <div className="fg">
            <label style={{display:'flex',justifyContent:'space-between'}}>
              <span>Overall Feedback *</span>
              <span style={{fontWeight:300,color:'var(--muted)',fontSize:'0.75rem'}}>{comments.length} chars</span>
            </label>
            <textarea placeholder="Write detailed feedback about the study's strengths and weaknesses…" value={comments} onChange={e=>setComments(e.target.value)} style={{minHeight:90}}/>
          </div>

          {/* Recommendations */}
          <div className="fg">
            <label>Recommendations <span style={{fontWeight:300,color:'var(--muted)'}}>(optional)</span></label>
            <textarea placeholder="What should the student improve or explore further?" value={recommendations} onChange={e=>setRecommendations(e.target.value)} style={{minHeight:60}}/>
          </div>

          <div style={{display:'flex',gap:9,justifyContent:'flex-end',flexWrap:'wrap'}}>
            <button className="btn btn-ol" onClick={()=>setShowForm(false)}>Cancel</button>
            <button className="btn btn-teal" onClick={submit} disabled={submitting||!grade||!comments.trim()}>
              {submitting?<><span className="spin spin-dark"/>Saving…</>:'Submit Feedback'}
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

function StarRating({ value, onChange, readOnly=false }) {
  const [hover, setHover] = useState(0);
  return (
    <div className="review-stars" role="group" aria-label="Rating">
      {[1,2,3,4,5].map(n=>(
        <span key={n} className="review-star"
          style={{color: (hover||value)>=n ? '#f59e0b' : 'var(--border)', fontSize: readOnly?'0.85rem':'1.2rem'}}
          onClick={()=>!readOnly&&onChange&&onChange(n)}
          onMouseEnter={()=>!readOnly&&setHover(n)}
          onMouseLeave={()=>!readOnly&&setHover(0)}
          role={readOnly?undefined:'button'}
          aria-label={readOnly?undefined:`Rate ${n} star${n!==1?'s':''}`}>
          ★
        </span>
      ))}
      {readOnly&&value>0&&<span style={{fontSize:'0.72rem',color:'var(--muted)',marginLeft:4}}>{value.toFixed(1)}</span>}
    </div>
  );
}

function ReviewsSection({ study, currentUser }) {
  const [reviews, setReviews] = useState([]);
  const [myReview, setMyReview] = useState(null);
  const [loading, setLoading] = useState(true);
  const [showAll, setShowAll] = useState(false);
  const [totalCount, setTotalCount] = useState(0);
  const [showForm, setShowForm] = useState(false);
  const [rating, setRating] = useState(0);
  const [comment, setComment] = useState('');
  const [submitting, setSubmitting] = useState(false);
  const isOwner = currentUser.id === study.uploadedBy;

  const load = async () => {
    setLoading(true);
    const [revs, mine, count] = await Promise.all([
      API.getReviews(study.id, showAll ? 50 : 5),
      API.getUserReview(study.id, currentUser.id),
      API.getReviewsCount(study.id)
    ]);
    setReviews(revs); setMyReview(mine); setTotalCount(count);
    if(mine){ setRating(mine.rating); setComment(mine.comment); }
    setLoading(false);
  };
  useEffect(()=>{ load(); },[showAll]);

  const submit = async () => {
    setSubmitting(true);
    // Optimistic update — show review immediately before Firestore confirms
    const prevReview = myReview;
    const prevReviews = reviews;
    const wasReview = !!myReview;
    const optimisticReview = {
      id: currentUser.id, userId: currentUser.id,
      userName: currentUser.name, userInstitution: currentUser.institution||'',
      rating, comment: comment.trim(), createdAt: new Date().toISOString(), _optimistic: true
    };
    setMyReview(optimisticReview);
    setShowForm(false);
    if(!wasReview) setReviews(r=>[optimisticReview, ...r.filter(x=>x.userId!==currentUser.id)]);
    try {
      await API.submitReview(study.id, currentUser.id, currentUser.name, currentUser.institution||'', rating, comment);
      toast.ok(wasReview ? 'Review updated!' : 'Review submitted!');
      load(); // sync to strip _optimistic flag
    } catch(e) {
      // Revert on failure
      setMyReview(prevReview); setReviews(prevReviews); setShowForm(true);
      toast.err(e.message);
    }
    setSubmitting(false);
  };

  const del = async () => {
    if(!confirm('Delete your review?')) return;
    // Optimistic removal
    const prevReview = myReview;
    const prevReviews = reviews;
    setMyReview(null); setRating(0); setComment('');
    setReviews(r=>r.filter(x=>x.userId!==currentUser.id));
    try {
      await API.deleteReview(study.id, currentUser.id);
      toast.ok('Review deleted.');
      load();
    } catch(e) {
      setMyReview(prevReview); setReviews(prevReviews);
      toast.err('Failed to delete review.');
    }
  };

  const avgRating = study.avgRating || 0;
  const reviewCount = study.reviewCount || totalCount || 0;

  return (
    <div style={{marginTop:20}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:8,marginBottom:12}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <div style={{fontSize:'0.72rem',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.8px',color:'var(--muted)'}}>Reviews</div>
          {avgRating>0&&(
            <div style={{display:'flex',alignItems:'center',gap:5}}>
              <StarRating value={avgRating} readOnly/>
              <span style={{fontSize:'0.75rem',color:'var(--muted)'}}>({reviewCount} review{reviewCount!==1?'s':''})</span>
            </div>
          )}
          {reviewCount===0&&<span style={{fontSize:'0.75rem',color:'var(--muted)'}}>No reviews yet</span>}
        </div>
        {!isOwner&&!showForm&&(
          <button className="btn btn-ol btn-sm" onClick={()=>setShowForm(true)}>
            {myReview?'✏️ Edit Review':'⭐ Write Review'}
          </button>
        )}
      </div>

      {/* Write / Edit form */}
      {showForm&&(
        <div style={{background:'var(--surface)',border:'1.5px solid var(--gold)',borderRadius:'var(--radius)',padding:'14px',marginBottom:14}}>
          <div style={{fontWeight:600,fontSize:'var(--text-sm)',marginBottom:10}}>{myReview?'Edit your review':'Write a review'}</div>
          <div style={{marginBottom:10}}>
            <div style={{fontSize:'0.75rem',color:'var(--muted)',marginBottom:5}}>Rating *</div>
            <StarRating value={rating} onChange={setRating}/>
          </div>
          <div style={{marginBottom:10}}>
            <div style={{fontSize:'0.75rem',color:'var(--muted)',marginBottom:5}}>Comment * <span style={{color:comment.length>500?'var(--red)':'var(--muted)'}}>{comment.length}/500</span></div>
            <textarea
              placeholder="Share your thoughts about this study…"
              value={comment}
              onChange={e=>setComment(e.target.value.slice(0,500))}
              style={{minHeight:80,width:'100%',resize:'vertical'}}/>
          </div>
          <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
            <button className="btn btn-ol btn-sm" onClick={()=>{setShowForm(false);if(myReview){setRating(myReview.rating);setComment(myReview.comment);}}}>Cancel</button>
            {myReview&&<button className="btn btn-red btn-sm" onClick={del}>Delete</button>}
            <button className="btn btn-gold btn-sm" onClick={submit} disabled={submitting||!rating}>
              {submitting?<span className="spin spin-dark" style={{width:13,height:13}}/>:(myReview?'Update':'Submit')}
            </button>
          </div>
        </div>
      )}

      {/* Reviews list */}
      {loading?(
        <div style={{textAlign:'center',padding:'16px',color:'var(--muted)'}}><span className="spin"/></div>
      ):(
        <>
          {myReview&&!showForm&&(
            <div className="review-item review-own" style={{marginBottom:8,opacity:myReview._optimistic?0.7:1,transition:'opacity 0.3s'}}>
              <div className="review-header">
                <div className="review-avatar">{currentUser.name.charAt(0).toUpperCase()}</div>
                <span className="review-name">{myReview.userName} <span style={{fontSize:'0.68rem',fontWeight:400,color:'var(--gold)'}}>· Your review</span></span>
                <StarRating value={myReview.rating} readOnly/>
                <span className="review-date">{fmtDate(myReview.createdAt)}</span>
                <button className="btn btn-ol btn-sm" style={{marginLeft:'auto'}} onClick={()=>setShowForm(true)}>✏️ Edit</button>
              </div>
              <p className="review-comment">{myReview.comment}</p>
            </div>
          )}
          <div className="review-list">
            {reviews.filter(r=>r.userId!==currentUser.id).map(r=>(
              <div key={r.id} className="review-item">
                <div className="review-header">
                  <div className="review-avatar" style={{background:'var(--purple)'}}>{r.userName?.charAt(0).toUpperCase()||'?'}</div>
                  <div style={{flex:1,minWidth:0}}>
                    <div className="review-name">{r.userName}</div>
                    {r.userInstitution&&<div style={{fontSize:'0.68rem',color:'var(--muted)'}}>{r.userInstitution}</div>}
                  </div>
                  <StarRating value={r.rating} readOnly/>
                  <span className="review-date">{fmtDate(r.createdAt)}</span>
                </div>
                <p className="review-comment">{r.comment}</p>
              </div>
            ))}
          </div>
          {!showAll&&totalCount>5&&(
            <button className="btn btn-ol btn-sm" style={{marginTop:10,width:'100%'}} onClick={()=>setShowAll(true)}>
              Load more reviews ({totalCount-5} remaining)
            </button>
          )}
          {reviews.filter(r=>r.userId!==currentUser.id).length===0&&!myReview&&(
            <div style={{textAlign:'center',padding:'18px',color:'var(--muted)',fontSize:'var(--text-sm)'}}>
              No reviews yet.{!isOwner?' Be the first to review this study!':''}
            </div>
          )}
        </>
      )}
    </div>
  );
}
