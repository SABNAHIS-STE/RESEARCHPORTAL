<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#0d0f14"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>SABNAHIS STE Research Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'"/>
<noscript><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/></noscript>
<style>
/* ══════════════════════════════════════════
   DESIGN TOKENS
══════════════════════════════════════════ */
:root {
  /* Colors */
  --ink:#0d0f14; --ink-2:#1e2130; --ink-3:#2e3250;
  --slate:#4a5174; --muted:#7c85a8;
  --border:#e2e5f0; --surface:#f5f6fa; --white:#ffffff;
  --gold:#c9a227; --gold-light:#f0d882; --gold-bg:#fdf8ec;
  --teal:#1a7f6e; --teal-light:#e6f5f2;
  --red:#c0392b; --red-light:#fdf0ee;
  --green:#1a7f4a; --green-light:#e6f5ee;
  --blue:#1a5fa8; --blue-light:#e6f0fd;
  --purple:#6d3fa8; --purple-light:#f3eeff;

  /* Shape */
  --radius: 10px;
  --radius-lg: 16px;
  --radius-xl: 22px;

  /* Elevation */
  --shadow: 0 2px 12px rgba(13,15,20,0.08);
  --shadow-lg: 0 8px 32px rgba(13,15,20,0.12);
  --shadow-xl: 0 24px 64px rgba(13,15,20,0.18);

  /* Typography */
  --font-display: 'Playfair Display', Georgia, serif;
  --font-body: 'DM Sans', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;

  /* Fluid scale */
  --text-xs:  clamp(0.65rem, 1.8vw, 0.72rem);
  --text-sm:  clamp(0.78rem, 2.2vw, 0.875rem);
  --text-base:clamp(0.875rem, 2.5vw, 1rem);
  --text-lg:  clamp(1rem, 3vw, 1.15rem);
  --text-xl:  clamp(1.1rem, 3.5vw, 1.35rem);
  --text-2xl: clamp(1.25rem, 4.5vw, 1.65rem);

  /* Motion */
  --transition: 0.2s cubic-bezier(0.4,0,0.2,1);
  --spring: 0.3s cubic-bezier(0.34,1.56,0.64,1);

  /* Layout */
  --sidebar-w: 260px;
  --topbar-h: 58px;
  --mob-header-h: 54px;
  --mob-nav-h: 62px;

  /* Safe areas */
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);

  /* Touch targets */
  --tap-min: 44px;

  /* Sidebar (light mode defaults) */
  --sidebar-bg: #ffffff;
  --sidebar-border: #e2e5f0;
  --sidebar-text: #4a5174;
  --sidebar-text-strong: #0d0f14;
  --sidebar-text-sub: #7c85a8;
  --sidebar-text-label: #9ca3be;
  --sidebar-item-hover-bg: #f5f6fa;
  --sidebar-item-hover-text: #0d0f14;
  --sidebar-item-active-bg: #fdf8ec;
}

/* ══════════════════════════════════════════
   DARK MODE TOKENS
══════════════════════════════════════════ */
[data-theme="dark"] {
  --ink:#e8eaf2; --ink-2:#cdd0e0; --ink-3:#b0b5cc;
  --slate:#8891b0; --muted:#6a7090;
  --border:#2a2e42; --surface:#12141c; --white:#1a1d2e;
  --gold:#e0b830; --gold-light:#f5e080; --gold-bg:#1e1a08;
  --teal:#22a98e; --teal-light:#0d2520;
  --red:#e05447; --red-light:#1f0f0d;
  --green:#27a862; --green-light:#0d1f14;
  --blue:#3b82d4; --blue-light:#0d1826;
  --purple:#9b65e0; --purple-light:#1a0f2e;
  --shadow: 0 2px 12px rgba(0,0,0,0.3);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.45);
  --shadow-xl: 0 24px 64px rgba(0,0,0,0.6);

  /* Sidebar dark */
  --sidebar-bg: #1a1d2e;
  --sidebar-border: rgba(255,255,255,0.06);
  --sidebar-text: rgba(255,255,255,0.5);
  --sidebar-text-strong: #e8eaf2;
  --sidebar-text-sub: rgba(255,255,255,0.32);
  --sidebar-text-label: rgba(255,255,255,0.22);
  --sidebar-item-hover-bg: rgba(255,255,255,0.06);
  --sidebar-item-hover-text: #e8eaf2;
  --sidebar-item-active-bg: rgba(224,184,48,0.14);
}
/* ── Sidebar light mode ─────────────────── */
[data-theme="light"] {
  --sidebar-bg: #ffffff;
  --sidebar-border: #e2e5f0;
  --sidebar-text: #4a5174;
  --sidebar-text-strong: #0d0f14;
  --sidebar-text-sub: #7c85a8;
  --sidebar-text-label: #9ca3be;
  --sidebar-item-hover-bg: #f5f6fa;
  --sidebar-item-hover-text: #0d0f14;
  --sidebar-item-active-bg: #fdf8ec;
}

/* ── Theme toggle button ─────────────────── */
.theme-toggle {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  color: rgba(255,255,255,0.65);
  border-radius: 99px;
  padding: 5px 11px;
  font-size: 0.75rem;
  font-family: var(--font-body);
  cursor: pointer;
  display: flex; align-items: center; gap: 5px;
  transition: all var(--transition);
  min-height: 32px;
  white-space: nowrap;
}
.theme-toggle:hover { background: rgba(255,255,255,0.14); color: #fff; }

/* Topbar theme toggle */
.topbar-theme-toggle {
  background: var(--surface);
  border: 1.5px solid var(--border);
  color: var(--ink-3);
  border-radius: 99px;
  padding: 5px 12px;
  font-size: 0.75rem;
  font-family: var(--font-body);
  cursor: pointer;
  display: flex; align-items: center; gap: 5px;
  transition: all var(--transition);
  min-height: 32px;
}
.topbar-theme-toggle:hover { border-color: var(--gold); color: var(--gold); background: var(--gold-bg); }

/* ── Google Drive input style ─────────────── */
.gdrive-input-wrap {
  display: flex; align-items: center; gap: 9px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 0 13px;
  background: var(--white);
  transition: border-color var(--transition), box-shadow var(--transition);
  min-height: var(--tap-min);
}
.gdrive-input-wrap:focus-within {
  border-color: var(--teal);
  box-shadow: 0 0 0 3px rgba(26,127,110,0.12);
}
.gdrive-input-wrap input {
  border: none; background: none; padding: 9px 0;
  flex: 1; outline: none; font-size: var(--text-sm);
}
.gdrive-icon { flex-shrink: 0; display: flex; align-items: center; }
.gdrive-preview {
  display: flex; align-items: center; gap: 9px;
  padding: 10px 14px;
  background: var(--teal-light);
  border: 1.5px solid var(--teal);
  border-radius: var(--radius);
  font-size: var(--text-sm);
  color: var(--teal);
}
.gdrive-preview a { color: var(--teal); font-weight: 600; text-decoration: underline; word-break: break-all; }
.gdrive-preview .gdrive-remove {
  background: none; border: none; cursor: pointer;
  color: var(--teal); font-size: 1rem; padding: 2px 6px;
  border-radius: 4px; margin-left: auto; flex-shrink: 0;
  transition: all var(--transition);
}
.gdrive-preview .gdrive-remove:hover { background: rgba(26,127,110,0.15); }

/* ── QoL: keyboard shortcut badge ────────── */
.kbd-hint {
  font-size: 0.65rem; color: var(--muted);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 4px; padding: 1px 5px;
  font-family: var(--font-mono);
  display: inline-flex; align-items: center;
}

/* ── QoL: char counter ───────────────────── */
.char-counter {
  font-size: var(--text-xs); color: var(--muted);
  text-align: right; margin-top: 3px;
  transition: color var(--transition);
}
.char-counter.warn { color: #b7860b; }
.char-counter.over { color: var(--red); }

/* ── QoL: progress step indicator ─────────── */
.upload-steps {
  display: flex; gap: 0; margin-bottom: 20px;
  border-radius: var(--radius); overflow: hidden;
  border: 1px solid var(--border);
}
.upload-step {
  flex: 1; padding: 8px 4px; text-align: center;
  font-size: 0.68rem; font-weight: 600;
  color: var(--muted); background: var(--surface);
  border-right: 1px solid var(--border);
  transition: all var(--transition);
}
.upload-step:last-child { border-right: none; }
.upload-step.done { background: var(--green-light); color: var(--green); }
.upload-step.active { background: var(--gold-bg); color: var(--gold); }

/* ══════════════════════════════════════════
   RESET & BASE
══════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

body {
  font-family: var(--font-body);
  background: var(--surface);
  color: var(--ink);
  min-height: 100vh;
  font-size: var(--text-base);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
  transition: background 0.25s ease, color 0.25s ease;
}

img { max-width: 100%; height: auto; }
button { font-family: var(--font-body); cursor: pointer; }
a { color: inherit; }

/* Prevent zoom on iOS input focus */
@media (max-width: 768px) {
  input, select, textarea {
    font-size: 16px !important;
  }
}

/* ══════════════════════════════════════════
   LAYOUT SHELL
══════════════════════════════════════════ */
.app-shell { display: flex; min-height: 100vh; }

.sidebar {
  width: var(--sidebar-w);
  min-height: 100vh;
  background: var(--sidebar-bg);
  color: var(--sidebar-text-strong);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0;
  left: 0;
  z-index: 150;
  transition: transform .3s cubic-bezier(0.4,0,0.2,1), background 0.25s ease;
  will-change: transform;
  border-right: 1px solid var(--sidebar-border);
  box-shadow: var(--shadow-lg);
}

.sidebar-logo {
  padding: clamp(16px,4vw,24px) clamp(16px,4vw,24px) 18px;
  border-bottom: 1px solid var(--sidebar-border);
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
}

.sidebar-logo h1 {
  font-family: var(--font-display);
  font-size: clamp(0.92rem,2.5vw,1.05rem);
  font-weight: 700;
  color: var(--sidebar-text-strong);
  line-height: 1.3;
}
.sidebar-logo h1 span { color: var(--gold); }
.sidebar-logo p { font-size: var(--text-xs); color: var(--sidebar-text-sub); margin-top: 4px; }

.sidebar-nav { flex: 1; padding: 16px 12px; overflow-y: auto; overscroll-behavior: contain; }

.nav-label {
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--sidebar-text-label);
  padding: 12px 12px 5px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 12px;
  min-height: var(--tap-min);
  border-radius: 8px;
  cursor: pointer;
  font-size: var(--text-sm);
  color: var(--sidebar-text);
  transition: all var(--transition);
  margin-bottom: 2px;
  border: none;
  background: none;
  width: 100%;
  text-align: left;
}
.nav-item:hover { background: var(--sidebar-item-hover-bg); color: var(--sidebar-item-hover-text); }
.nav-item.active { background: var(--sidebar-item-active-bg); color: var(--gold-light); font-weight: 500; }
.nav-item svg { width: 17px; flex-shrink: 0; opacity: 0.7; }
.nav-badge {
  margin-left: auto;
  background: var(--gold); color: var(--ink);
  font-size: 0.63rem; font-weight: 700;
  padding: 2px 7px; border-radius: 99px;
  min-width: 20px; text-align: center;
}

.sidebar-footer {
  padding: 14px;
  border-top: 1px solid var(--sidebar-border);
}
.user-chip {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px;
  border-radius: 8px;
}
.avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: linear-gradient(135deg,var(--gold),var(--teal));
  display: flex; align-items: center; justify-content: center;
  font-size: 0.78rem; font-weight: 700; color: #fff;
  flex-shrink: 0;
}
.user-info strong { display: block; font-size: var(--text-sm); color: var(--sidebar-text-strong); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
.user-info span { font-size: var(--text-xs); color: var(--sidebar-text-sub); text-transform: capitalize; }

.sidebar-close-btn {
  background: none; border: none;
  color: var(--sidebar-text-sub);
  cursor: pointer;
  padding: 6px;
  border-radius: 6px;
  min-width: var(--tap-min);
  min-height: var(--tap-min);
  display: flex; align-items: center; justify-content: center;
  transition: color var(--transition);
}
.sidebar-close-btn:hover { color: var(--sidebar-text-strong); }

.main-content {
  flex: 1;
  margin-left: var(--sidebar-w);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.topbar {
  background: var(--white);
  border-bottom: 1px solid var(--border);
  padding: 0 clamp(16px,4vw,28px);
  height: var(--topbar-h);
  display: flex;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 50;
  transition: background 0.25s ease, border-color 0.25s ease;
}
.topbar-title {
  font-family: var(--font-display);
  font-size: var(--text-lg);
  font-weight: 600;
  color: var(--ink);
  flex: 1;
}

.page {
  padding: clamp(14px,4vw,26px);
  flex: 1;
  max-width: 100%;
  overflow-x: hidden;
}

/* ══════════════════════════════════════════
   MOBILE HEADER & NAV
══════════════════════════════════════════ */
.mob-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 149;
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
}
.mob-overlay.show { display: block; animation: fIn .2s ease; }

.mob-header {
  display: none;
  position: fixed; top: 0; left: 0; right: 0;
  z-index: 99;
  background: var(--sidebar-bg);
  height: var(--mob-header-h);
  align-items: center;
  padding: 0 16px;
  padding-top: var(--safe-top);
  gap: 10px;
  border-bottom: 1px solid var(--sidebar-border);
}
.mob-header-title {
  font-family: var(--font-display);
  font-size: 1rem;
  color: var(--gold);
  flex: 1;
}
.mob-menu-btn {
  background: none; border: none;
  color: var(--sidebar-text);
  cursor: pointer;
  padding: 6px;
  border-radius: 8px;
  min-width: var(--tap-min);
  min-height: var(--tap-min);
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
}

.mob-nav {
  display: none;
  position: fixed; bottom: 0; left: 0; right: 0;
  z-index: 200;
  background: var(--sidebar-bg);
  border-top: 1px solid var(--sidebar-border);
  padding-bottom: var(--safe-bottom);
}
.mob-nav-inner {
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 6px 0;
}
.mob-nav-btn {
  display: flex; flex-direction: column;
  align-items: center; gap: 3px;
  padding: 8px;
  min-width: 56px;
  min-height: var(--tap-min);
  border: none; background: none;
  color: var(--sidebar-text);
  cursor: pointer; border-radius: 10px;
  transition: all .2s;
  font-family: var(--font-body);
  -webkit-tap-highlight-color: transparent;
}
.mob-nav-btn.active { color: var(--gold); }
.mob-nav-btn svg { width: 20px; height: 20px; }
.mob-nav-btn span { font-size: 0.6rem; font-weight: 500; white-space: nowrap; }

/* ══════════════════════════════════════════
   AUTH PAGE
══════════════════════════════════════════ */
.auth-wrap {
  min-height: 100vh;
  display: flex;
  background: var(--sidebar-bg);
  position: relative;
  overflow: hidden;
  padding-top: var(--safe-top);
  transition: background 0.25s ease;
}
.auth-bg {
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse at 20% 50%,rgba(201,162,39,0.12) 0%,transparent 60%),
    radial-gradient(ellipse at 80% 20%,rgba(26,127,110,0.09) 0%,transparent 50%),
    radial-gradient(ellipse at 60% 80%,rgba(109,63,168,0.07) 0%,transparent 40%);
  pointer-events: none;
}
.auth-inner {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: clamp(20px,5vw,40px);
  position: relative; z-index: 1;
}
.auth-brand { text-align: center; margin-bottom: clamp(22px,4vw,32px); }
.auth-brand h1 {
  font-family: var(--font-display);
  font-size: clamp(1.6rem,5vw,2rem);
  font-weight: 700; color: var(--sidebar-text-strong);
  letter-spacing: -1px; line-height: 1.2;
}
.auth-brand h1 span { color: var(--gold); display: block; font-size: clamp(1rem,3vw,1.3rem); margin-top: 4px; }
.auth-brand p { color: var(--sidebar-text-sub); margin-top: 8px; font-size: var(--text-sm); }

.auth-card {
  background: var(--white);
  border-radius: var(--radius-lg);
  padding: clamp(20px,5vw,32px);
  width: 100%; max-width: 440px;
  box-shadow: var(--shadow-xl);
}

.auth-tabs {
  display: flex; gap: 4px;
  background: var(--surface);
  border-radius: 8px; padding: 4px;
  margin-bottom: 22px;
}
.auth-tab {
  flex: 1;
  padding: 10px;
  min-height: var(--tap-min);
  text-align: center;
  border-radius: 6px;
  cursor: pointer;
  font-size: var(--text-sm);
  font-weight: 500;
  color: var(--muted);
  transition: all var(--transition);
  border: none; background: none;
}
.auth-tab.active {
  background: var(--white);
  color: var(--ink);
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
}

/* ══════════════════════════════════════════
   FORMS
══════════════════════════════════════════ */
.fg { margin-bottom: 14px; }
.fr { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }

label {
  display: block;
  font-size: var(--text-xs);
  font-weight: 500;
  color: var(--ink-3);
  margin-bottom: 5px;
}

input, select, textarea {
  width: 100%;
  padding: clamp(10px,2.5vw,11px) clamp(12px,3vw,14px);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  font-family: var(--font-body);
  font-size: 0.9rem;
  color: var(--ink);
  background: var(--white);
  transition: border-color var(--transition), box-shadow var(--transition);
  outline: none;
  -webkit-appearance: none;
  appearance: none;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(201,162,39,0.1);
}
textarea { resize: vertical; min-height: 90px; }
.hint { font-size: var(--text-xs); color: var(--muted); margin-top: 3px; }

/* ══════════════════════════════════════════
   CATEGORY PICKER
══════════════════════════════════════════ */
.cat-picker { display: flex; flex-direction: column; gap: 7px; }
.cat-opt {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 13px;
  min-height: var(--tap-min);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  transition: all var(--transition);
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.cat-opt:hover, .cat-opt.sel { border-color: var(--gold); background: var(--gold-bg); }
.cat-opt.dis { opacity: 0.4; cursor: not-allowed; pointer-events: none; }
.cat-cb {
  width: 16px; height: 16px;
  border: 2px solid var(--border);
  border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: all var(--transition);
}
.cat-opt.sel .cat-cb { border-color: var(--gold); background: var(--gold); }

/* ══════════════════════════════════════════
   BUTTONS
══════════════════════════════════════════ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: clamp(10px,2.5vw,11px) clamp(14px,3.5vw,18px);
  min-height: var(--tap-min);
  border-radius: var(--radius);
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 500;
  cursor: pointer;
  transition: all var(--transition);
  border: none;
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
}
.btn-ink  { background:var(--ink);    color:#fff; }  .btn-ink:hover  { background:var(--ink-2); transform:translateY(-1px); }
.btn-gold { background:var(--gold);   color:var(--ink); font-weight:600; } .btn-gold:hover { background:#b8911f; transform:translateY(-1px); }
.btn-ol   { background:none; border:1.5px solid var(--border); color:var(--ink-3); } .btn-ol:hover { border-color:var(--ink-3); background:var(--surface); }
.btn-red  { background:var(--red);    color:#fff; } .btn-red:hover  { background:#a93226; }
.btn-grn  { background:var(--green);  color:#fff; } .btn-grn:hover  { background:#156b3c; }
.btn-pur  { background:var(--purple); color:#fff; } .btn-pur:hover  { background:#5c2d99; }
.btn-teal { background:var(--teal);   color:#fff; } .btn-teal:hover { background:#156b5c; }
.btn-sm   { padding: 7px 13px; font-size: var(--text-xs); min-height: 36px; }
.btn-full { width: 100%; }
.btn:disabled { opacity: 0.48; cursor: not-allowed; transform: none !important; }
.btn:active:not(:disabled) { transform: scale(0.97) !important; }

/* ══════════════════════════════════════════
   CARDS
══════════════════════════════════════════ */
.card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: clamp(16px,4vw,22px);
  box-shadow: var(--shadow);
}
.card-hd {
  display: flex; align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
  flex-wrap: wrap; gap: 9px;
}
.card-title { font-family:var(--font-display); font-size:var(--text-base); font-weight:600; color:var(--ink); }

/* ══════════════════════════════════════════
   STATS
══════════════════════════════════════════ */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(160px, 100%), 1fr));
  gap: 14px;
  margin-bottom: 24px;
}
.stat {
  background: var(--white); border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: clamp(14px,3vw,18px);
  display: flex; flex-direction: column; gap: 6px;
}
.stat.gold  { border-left: 4px solid var(--gold); }
.stat.teal  { border-left: 4px solid var(--teal); }
.stat.blue  { border-left: 4px solid var(--blue); }
.stat.red   { border-left: 4px solid var(--red);  }
.stat.pur   { border-left: 4px solid var(--purple); }
.stat.slate { border-left: 4px solid var(--slate); }
.stat-lbl { font-size: var(--text-xs); font-weight:500; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; }
.stat-val { font-family:var(--font-display); font-size:clamp(1.5rem,4vw,1.9rem); font-weight:700; color:var(--ink); line-height:1; }
.stat-sub { font-size:var(--text-xs); color:var(--muted); }

/* ══════════════════════════════════════════
   STUDY CARDS
══════════════════════════════════════════ */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(290px, 100%), 1fr));
  gap: 18px;
}
.sc {
  background: var(--white); border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: clamp(14px,3.5vw,20px);
  display: flex; flex-direction: column; gap: 10px;
  box-shadow: var(--shadow);
  transition: all var(--transition);
  cursor: pointer; position: relative; overflow: hidden;
}
.sc::before {
  content: '';
  position: absolute; top:0; left:0; right:0; height:3px;
  background: linear-gradient(90deg,var(--gold),var(--teal));
  transform: scaleX(0); transform-origin: left;
  transition: transform var(--transition);
}
.sc:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); border-color: rgba(201,162,39,0.3); }
.sc:hover::before { transform: scaleX(1); }
.sc:active { transform: scale(0.98); }
.sc-cats { display:flex; flex-wrap:wrap; gap:4px; }
.sc-cat { font-size:var(--text-xs); font-weight:600; padding:2px 7px; border-radius:4px; background:var(--gold-bg); color:var(--gold); }
.sc-title { font-family:var(--font-display); font-size:clamp(0.88rem,2.5vw,0.97rem); font-weight:600; color:var(--ink); line-height:1.4; }
.sc-authors { font-size:var(--text-xs); color:var(--muted); }
.sc-abs { font-size:var(--text-sm); color:var(--slate); line-height:1.5; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.sc-meta { display:flex; align-items:center; gap:10px; font-size:var(--text-xs); color:var(--muted); flex-wrap:wrap; margin-top:auto; }
.sc-meta span { display:flex; align-items:center; gap:3px; }

/* ══════════════════════════════════════════
   TABLE
══════════════════════════════════════════ */
.tw { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: var(--radius); }
table { width: 100%; border-collapse: collapse; min-width: 500px; }
th {
  font-size: var(--text-xs); font-weight: 600; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.5px;
  padding: 9px 13px; text-align: left;
  border-bottom: 1.5px solid var(--border); white-space: nowrap;
}
td { padding: 12px 13px; border-bottom: 1px solid var(--border); font-size: var(--text-sm); color: var(--ink-3); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--surface); }

/* ══════════════════════════════════════════
   BADGES
══════════════════════════════════════════ */
.badge { display:inline-flex; align-items:center; gap:3px; padding:3px 9px; border-radius:99px; font-size:var(--text-xs); font-weight:600; }
.badge-pend { background:#fff8e6; color:#b7860b; }
.badge-appr { background:var(--green-light); color:var(--green); }
.badge-rej  { background:var(--red-light);   color:var(--red); }
.badge-admin{ background:var(--blue-light);  color:var(--blue); }

/* ══════════════════════════════════════════
   SEARCH / FILTER
══════════════════════════════════════════ */
.sb {
  display: flex; align-items: center; gap: 9px;
  background: var(--white);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 0 13px;
  min-height: var(--tap-min);
  transition: border-color var(--transition);
}
.sb:focus-within { border-color:var(--gold); box-shadow:0 0 0 3px rgba(201,162,39,0.1); }
.sb input { border:none; background:none; padding:9px 0; flex:1; outline:none; font-size:var(--text-sm); }
.fb { display:flex; align-items:center; gap:9px; flex-wrap:wrap; }

/* ══════════════════════════════════════════
   UPLOAD ZONE
══════════════════════════════════════════ */
.uz {
  border: 2px dashed var(--border);
  border-radius: var(--radius);
  padding: clamp(20px,5vw,28px);
  text-align: center;
  cursor: pointer;
  transition: all var(--transition);
  -webkit-tap-highlight-color: transparent;
}
.uz:hover, .uz.drag { border-color:var(--gold); background:var(--gold-bg); }
.uz.has { border-color:var(--green); background:var(--green-light); }
.uz p { color:var(--muted); font-size:var(--text-sm); }
.uz strong { color:var(--ink); display:block; margin-bottom:3px; }
.uz input[type=file] { display:none; }

/* ══════════════════════════════════════════
   MODAL — mobile bottom sheet
══════════════════════════════════════════ */
.overlay {
  position: fixed; inset: 0;
  background: rgba(13,15,20,0.6);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
  animation: fIn .2s ease;
  overscroll-behavior: contain;
}
.modal {
  background: var(--white);
  border-radius: var(--radius-lg);
  width: 100%; max-width: 620px;
  max-height: 90vh;
  overflow-y: auto;
  overscroll-behavior: contain;
  box-shadow: var(--shadow-xl);
  animation: sUp var(--spring);
}
.modal-hd {
  padding: 22px 24px 0;
  display: flex; align-items: flex-start; justify-content: space-between; gap: 11px;
  position: sticky; top: 0;
  background: var(--white); z-index: 1;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--border);
}
.modal-bd { padding: 20px 24px 28px; }
.modal-title { font-family:var(--font-display); font-size:var(--text-xl); font-weight:600; color:var(--ink); }
.modal-x {
  background: none; border: none;
  cursor: pointer; color: var(--muted);
  padding: 6px; border-radius: 6px;
  min-width: 36px; min-height: 36px;
  display: flex; align-items: center; justify-content: center;
  transition: all var(--transition);
  flex-shrink: 0;
}
.modal-x:hover { background:var(--surface); color:var(--ink); }

/* ══════════════════════════════════════════
   TOASTS
══════════════════════════════════════════ */
.toasts {
  position: fixed;
  bottom: max(22px, calc(var(--mob-nav-h) + 12px + var(--safe-bottom)));
  right: 22px; left: auto;
  z-index: 9999;
  display: flex; flex-direction: column; gap: 7px;
  pointer-events: none;
  max-width: min(360px, calc(100vw - 44px));
}
.toast {
  background: var(--ink); color: #fff;
  padding: 12px 15px;
  border-radius: var(--radius);
  font-size: var(--text-sm);
  display: flex; align-items: center; gap: 9px;
  min-width: 240px;
  box-shadow: var(--shadow-lg);
  animation: sRight .3s ease;
  pointer-events: all;
  word-break: break-word;
}
.toast.ok  { background:var(--green); }
.toast.err { background:var(--red);   }
.toast.info{ background:var(--blue);  }

/* ══════════════════════════════════════════
   EMPTY STATE
══════════════════════════════════════════ */
.empty { text-align:center; padding:clamp(36px,8vw,52px) 20px; color:var(--muted); }
.empty-ico { font-size:2.8rem; margin-bottom:10px; opacity:0.45; }
.empty h3 { font-family:var(--font-display); font-size:var(--text-lg); color:var(--slate); margin-bottom:5px; }

/* ══════════════════════════════════════════
   SPINNERS
══════════════════════════════════════════ */
.spin {
  width:19px; height:19px;
  border: 2px solid rgba(255,255,255,0.28);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spinning .7s linear infinite;
  flex-shrink: 0;
  display: inline-block;
}
.spin-dark { border-color:rgba(13,15,20,0.15)!important; border-top-color:var(--ink)!important; }
.spin-gold { border-color:rgba(201,162,39,0.25)!important; border-top-color:var(--gold)!important; }

/* ══════════════════════════════════════════
   PAGINATION
══════════════════════════════════════════ */
.pages { display:flex; align-items:center; gap:5px; margin-top:24px; justify-content:center; flex-wrap:wrap; }
.pg {
  width:36px; height:36px;
  border-radius:8px;
  border: 1.5px solid var(--border);
  background: var(--white); color: var(--ink);
  cursor: pointer; font-size: var(--text-sm);
  display: flex; align-items: center; justify-content: center;
  transition: all var(--transition);
  min-width: 36px;
}
.pg:hover { border-color:var(--gold); background:var(--gold-bg); }
.pg.active { background:var(--ink); color:#fff; border-color:var(--ink); }
.pg:disabled { opacity:0.38; cursor:not-allowed; }

/* ══════════════════════════════════════════
   ALERTS
══════════════════════════════════════════ */
.al {
  display:flex; align-items:flex-start; gap:9px;
  padding: 11px 14px;
  border-radius: var(--radius);
  font-size: var(--text-sm);
  margin-bottom: 14px;
  line-height: 1.5;
}
.al-info{ background:var(--blue-light); color:var(--blue); }
.al-ok  { background:var(--green-light); color:var(--green); }
.al-err { background:var(--red-light); color:var(--red); }
.al-warn{ background:#fff8e6; color:#b7860b; }

/* ══════════════════════════════════════════
   STUDY DETAIL
══════════════════════════════════════════ */
.sd-title { font-family:var(--font-display); font-size:clamp(1.15rem,4vw,1.5rem); font-weight:700; color:var(--ink); line-height:1.3; margin-bottom:10px; }
.sd-auth  { font-size:var(--text-base); color:var(--slate); margin-bottom:14px; }
.kw { display:inline-block; padding:2px 9px; background:var(--surface); border:1px solid var(--border); border-radius:99px; font-size:var(--text-xs); color:var(--slate); margin:2px; }
.ds h4 { font-size:var(--text-xs); font-weight:600; text-transform:uppercase; letter-spacing:0.8px; color:var(--muted); margin-bottom:7px; }
.ds p  { color:var(--ink-3); font-size:var(--text-sm); line-height:1.7; }
.apa-box {
  background:var(--surface);
  border-left: 3px solid var(--gold);
  padding: 11px 14px;
  border-radius: 0 var(--radius) var(--radius) 0;
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  color: var(--ink-3);
  line-height: 1.6;
  word-break: break-word;
  position: relative;
  padding-right: 70px;
}
.apa-cp {
  position:absolute; top:7px; right:7px;
  background:var(--gold); border:none; border-radius:5px;
  padding:3px 9px; font-size:var(--text-xs);
  cursor:pointer; color:var(--ink); font-weight:600;
  transition:all var(--transition);
  min-height:28px;
}
.apa-cp:hover { background:#b8911f; }

/* ══════════════════════════════════════════
   CATEGORY MANAGER
══════════════════════════════════════════ */
.cm-item {
  display:flex; align-items:center; gap:9px;
  padding:9px 13px; min-height:var(--tap-min);
  border:1px solid var(--border);
  border-radius:var(--radius);
  margin-bottom:7px;
  background:var(--white);
  flex-wrap:wrap;
}
.cm-name { flex:1; font-size:var(--text-sm); font-weight:500; color:var(--ink-3); min-width:0; }
.cm-in { border:none; background:none; font-size:var(--text-sm); color:var(--ink); flex:1; outline:none; padding:0; min-width:100px; }

/* ══════════════════════════════════════════
   CHAT — UPGRADED
══════════════════════════════════════════ */
.chat-layout {
  display: flex;
  height: calc(100vh - var(--topbar-h) - clamp(14px,4vw,26px) * 2 - 80px);
  min-height: 480px;
  gap: 16px;
}
.chat-main { flex:1; display:flex; flex-direction:column; min-width:0; }
.chat-sidebar { width:280px; flex-shrink:0; display:flex; flex-direction:column; gap:12px; overflow-y:auto; }

.chat-msgs {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding: clamp(10px,2.5vw,16px);
  display: flex; flex-direction: column; gap: 14px;
  background: var(--surface);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  border: 1px solid var(--border);
  border-bottom: none;
  scroll-behavior: smooth;
}

/* Message */
.cm { display:flex; gap:10px; align-items:flex-start; animation:msgIn .3s ease; }
.cm.user { flex-direction:row-reverse; }
.cm-av {
  width:34px; height:34px;
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:0.8rem; font-weight:700;
  flex-shrink:0;
  box-shadow:var(--shadow);
}
.cm-av.bot  { background:linear-gradient(135deg,var(--purple),var(--blue)); color:#fff; }
.cm-av.user { background:linear-gradient(135deg,var(--gold),var(--teal)); color:#fff; }

.cm-body { display:flex; flex-direction:column; gap:4px; max-width:80%; }
.cm.user .cm-body { align-items:flex-end; }

.cm-bub {
  padding: clamp(9px,2vw,11px) clamp(12px,3vw,15px);
  border-radius: var(--radius-lg);
  font-size: var(--text-sm);
  line-height: 1.65;
  word-break: break-word;
  overflow-wrap: break-word;
}
.cm-bub.bot {
  background:var(--white);
  border:1px solid var(--border);
  color:var(--ink-3);
  border-radius: 4px var(--radius-lg) var(--radius-lg) var(--radius-lg);
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}
.cm-bub.user {
  background:var(--ink); color:#fff;
  border-radius: var(--radius-lg) 4px var(--radius-lg) var(--radius-lg);
}

.cm-meta { font-size:var(--text-xs); color:var(--muted); display:flex; align-items:center; gap:5px; flex-wrap:wrap; }
.cm-src  { font-size:var(--text-xs); padding:1px 6px; border-radius:4px; font-weight:500; }
.cm-src.claude { background:var(--purple-light); color:var(--purple); }
.cm-src.local  { background:var(--surface); color:var(--muted); border:1px solid var(--border); }

/* Typing dots */
.typing { display:flex; gap:5px; padding:4px 2px; align-items:center; }
.dot { width:7px; height:7px; background:var(--muted); border-radius:50%; animation:pulse 1.4s infinite; }
.dot:nth-child(2){ animation-delay:.2s; } .dot:nth-child(3){ animation-delay:.4s; }

/* Chat input area */
.chat-input-area {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 0 0 var(--radius-lg) var(--radius-lg);
  padding: clamp(10px,2.5vw,13px) clamp(11px,3vw,14px);
  padding-bottom: max(clamp(10px,2.5vw,13px), var(--safe-bottom));
}
.chat-input-row { display:flex; gap:9px; align-items:flex-end; }
.chat-in {
  flex: 1;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: clamp(9px,2.5vw,11px) 13px;
  font-family: var(--font-body);
  font-size: 0.9rem;
  outline: none; resize: none;
  max-height: 130px;
  min-height: 44px;
  transition: border-color var(--transition), box-shadow var(--transition);
  background: var(--surface);
  line-height: 1.5;
  overflow-y: auto;
}
.chat-in:focus {
  border-color: var(--purple);
  background: var(--white);
  box-shadow: 0 0 0 3px rgba(109,63,168,0.1);
}

.chat-send-btn {
  flex-shrink: 0;
  background: var(--purple); color: #fff;
  border: none; border-radius: var(--radius);
  width: var(--tap-min); height: var(--tap-min);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all var(--transition);
}
.chat-send-btn:hover:not(:disabled) { background: #5c2d99; }
.chat-send-btn:disabled { opacity:0.48; cursor:not-allowed; }

.chat-actions {
  display:flex; gap:6px; margin-top:8px;
  flex-wrap:wrap; align-items:center;
}
.chat-action-btn {
  font-size: var(--text-xs);
  padding: 6px 10px;
  min-height: 32px;
  border-radius:99px;
  border:1.5px solid var(--border);
  background:var(--surface);
  color:var(--ink-3);
  cursor:pointer;
  transition:all var(--transition);
  display:flex; align-items:center; gap:4px;
  white-space:nowrap;
  -webkit-tap-highlight-color:transparent;
}
.chat-action-btn:hover,.chat-action-btn.active {
  border-color:var(--purple); background:var(--purple-light); color:var(--purple);
}

/* Research gap indicator */
.gap-alert {
  background: linear-gradient(135deg, #fff8e6, #fdf3d0);
  border: 1px solid rgba(201,162,39,0.3);
  border-radius: var(--radius);
  padding: 10px 14px;
  margin-top: 10px;
  font-size: var(--text-xs);
  color: #8a6a00;
  display: flex; align-items: flex-start; gap: 7px;
}
.gap-alert strong { color: #6a4f00; }

/* Chat refs */
.chat-refs { margin-top:10px; padding-top:10px; border-top:1px dashed var(--border); }
.chat-ref-lbl { font-size:var(--text-xs); font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:5px; display:flex; align-items:center; gap:4px; }
.chat-ref {
  font-family:var(--font-mono); font-size:var(--text-xs); color:var(--slate);
  padding:5px 9px; background:var(--surface);
  border-radius:5px; margin-bottom:3px;
  border-left:2px solid var(--gold);
  line-height:1.5; cursor:pointer;
  transition:background var(--transition);
  display:flex; align-items:flex-start; gap:6px;
}
.chat-ref:hover { background:var(--gold-bg); }

/* Chat sidebar panels */
.chat-panel { background:var(--white); border:1px solid var(--border); border-radius:var(--radius-lg); overflow:hidden; }
.chat-panel-hd {
  padding:12px 14px;
  border-bottom:1px solid var(--border);
  font-size:var(--text-xs); font-weight:600; color:var(--ink);
  display:flex; align-items:center; gap:6px;
  background:var(--surface);
}
.chat-panel-body { padding:12px 14px; max-height:280px; overflow-y:auto; overscroll-behavior:contain; }
.sugg-chip {
  display:block; width:100%;
  text-align:left; font-size:var(--text-xs);
  padding:8px 10px; min-height:34px;
  border-radius:7px; border:none; background:none;
  color:var(--ink-3); cursor:pointer;
  transition:all var(--transition);
  margin-bottom:3px; line-height:1.4;
  -webkit-tap-highlight-color:transparent;
}
.sugg-chip:hover { background:var(--purple-light); color:var(--purple); }

.chat-stat-row {
  display:flex; justify-content:space-between; align-items:center;
  padding:6px 0;
  border-bottom:1px solid var(--border);
  font-size:var(--text-xs);
}
.chat-stat-row:last-child { border-bottom:none; }
.chat-stat-val { font-weight:600; color:var(--ink); }

/* Mode pills */
.mode-pills {
  display:flex; gap:5px; flex-wrap:wrap;
  padding:8px clamp(10px,2.5vw,14px);
  background:var(--surface);
  border-left:1px solid var(--border);

const { useState, useEffect, useCallback, useRef, useMemo, memo } = React;

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('sabnahis-theme', theme);
}
function getInitialTheme() {
  try { const t = localStorage.getItem('sabnahis-theme'); if (t) return t; } catch {}
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
// Apply immediately to prevent flash
applyTheme(getInitialTheme());

function useTheme() {
  const [theme, setTheme] = useState(getInitialTheme);
  const toggle = () => {
    setTheme(t => {
      const next = t === 'dark' ? 'light' : 'dark';
      applyTheme(next);
      return next;
    });
  };
  return [theme, toggle];
}

// ── Google Drive URL validator ──────────────────────────────────
function parseGDriveLink(url) {
  if (!url) return null;
  // Accept various GDrive URL formats and normalize to view link
  const patterns = [
    /drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/,
    /drive\.google\.com\/open\?id=([a-zA-Z0-9_-]+)/,
    /docs\.google\.com\/.*\/d\/([a-zA-Z0-9_-]+)/,
    /drive\.google\.com\/uc\?.*id=([a-zA-Z0-9_-]+)/,
  ];
  for (const p of patterns) {
    const m = url.match(p);
    if (m) return { id: m[1], viewUrl: `https://drive.google.com/file/d/${m[1]}/view`, downloadUrl: `https://drive.google.com/uc?export=download&id=${m[1]}` };
  }
  // If it's just any https URL treat as-is
  if (url.startsWith('https://')) return { id: null, viewUrl: url, downloadUrl: url };
  return null;
}

// ══════════════════════════════════════════════════════════════════
//  FIREBASE API

const API = {
  async register({ name, email, password, institution, department, secQ, secA }) {
    if (!name||!email||!password) throw new Error('Name, email and password are required.');
    if (password.length < 8)       throw new Error('Password must be at least 8 characters.');

      uploadCount: 0, createdAt: new Date().toISOString()
    });
    await auth.signOut();
  },

  async login(email, password) {
    try {
      const cred = await auth.signInWithEmailAndPassword(email.trim(), password);
      const snap = await db.collection('users').doc(cred.user.uid).get();
      if (!snap.exists) { await auth.signOut(); throw new Error('User profile not found. Please contact your administrator.'); }
      const data = snap.data();
      if (data.status==='pending')  { await auth.signOut(); throw new Error('Your account is awaiting admin approval. Please check back later.'); }
      if (data.status==='rejected') { await auth.signOut(); throw new Error('Your registration was rejected. Please contact your administrator.'); }
      await db.collection('users').doc(cred.user.uid).update({ lastLogin: new Date().toISOString() }).catch(()=>{});
      return { id: cred.user.uid, ...data };
    } catch(e) {
      // Translate Firebase error codes to friendly messages
      const code = e.code || '';
      if (code === 'auth/user-not-found' || code === 'auth/wrong-password' || code === 'auth/invalid-credential') throw new Error('Incorrect email or password. Please try again.');
      if (code === 'auth/invalid-email') throw new Error('Please enter a valid email address.');
      if (code === 'auth/user-disabled') throw new Error('This account has been disabled. Contact your administrator.');
      if (code === 'auth/too-many-requests') throw new Error('Too many failed attempts. Please wait a few minutes and try again.');
      if (code === 'auth/network-request-failed') throw new Error('Network error. Please check your internet connection and try again.');
      if (code === 'auth/unauthorized-domain') throw new Error('This domain is not authorized for login. The admin must add this domain in Firebase Console → Authentication → Settings → Authorized Domains.');
      throw e;
    }
  },

  async logout() { await auth.signOut(); },

  async getProfile(uid) {

  async getStudies({ search='', category='', uploadedBy='', status='active', page=1, perPage=6 }={}) {

      }
      const total = items.length;
      return { data: items.slice((page-1)*perPage, page*perPage), total, totalPages:Math.ceil(total/perPage)||1, page };

// ══════════════════════════════════════════════════════════════════
//  APA CITATION ENGINE
// ══════════════════════════════════════════════════════════════════
function fmtAPA(name) {
  if (!name) return '';
  const p = name.trim().split(/\s+/);
  if (p.length===1) return p[0];
  const last = p[p.length-1];
  const inits = p.slice(0,-1).map(x=>x[0].toUpperCase()+'.').join(' ');
  return `${last}, ${inits}`;
}

function generateAPA(s) {
  if (!s) return '';
  const authors = s.authors||[];
  let a = 'Unknown Author';
  if (authors.length===1) a=fmtAPA(authors[0]);
  else if (authors.length===2) a=`${fmtAPA(authors[0])}, & ${fmtAPA(authors[1])}`;
  else if (authors.length>2) { const f=authors.map(fmtAPA),l=f.pop(); a=f.join(', ')+', & '+l; }
  const year = s.year||new Date().getFullYear();
  const cat  = (s.categories||[])[0]||'';
  return `${a}. (${year}). ${s.title||'Untitled'}.${cat?` [${cat}].`:''}`;
}

function generateInText(s) {
  const authors = s.authors||[];
  const year    = s.year||new Date().getFullYear();
  const last    = n=>n?.trim().split(/\s+/).pop()||'Unknown';
  if (!authors.length)   return `(Unknown, ${year})`;
  if (authors.length===1) return `(${last(authors[0])}, ${year})`;
  if (authors.length===2) return `(${last(authors[0])} & ${last(authors[1])}, ${year})`;
  return `(${last(authors[0])} et al., ${year})`;
}

// ══════════════════════════════════════════════════════════════════
//  INTELLIGENT SEARCH ENGINE
// ══════════════════════════════════════════════════════════════════
const STEM_STOPWORDS = new Set(['the','a','an','of','in','for','to','and','or','is','are','was','were','be','been','it','this','that','with','by','from','on','at','as','its','study','research','about','using','based']);

function extractKeyTerms(text) {
  return text.toLowerCase()
    .replace(/[^\w\s]/g,' ')
    .split(/\s+/)
    .filter(w => w.length > 3 && !STEM_STOPWORDS.has(w))
    .slice(0, 12);
}

function scoreStudy(study, terms) {
  const fields = [
    { text: study.title||'',        weight: 3 },
    { text: (study.keywords||[]).join(' '), weight: 2.5 },
    { text: (study.categories||[]).join(' '), weight: 2 },
    { text: (study.authors||[]).join(' '), weight: 1.5 },
    { text: study.abstract||'',     weight: 1 },
  ];
  let score = 0;
  const fullText = fields.map(f=>f.text).join(' ').toLowerCase();
  terms.forEach(term => {
    fields.forEach(f => {
      const matches = (f.text.toLowerCase().match(new RegExp(term,'g'))||[]).length;
      score += matches * f.weight;
    });
    // Bonus for exact phrase in title
    if ((study.title||'').toLowerCase().includes(term)) score += 2;
  });
  return score;
}

function findRelevant(query, studies, limit=5) {
  if (!query||!studies?.length) return [];
  const terms = extractKeyTerms(query);
  if (!terms.length) return studies.slice(0,limit);
  return studies
    .map(s=>({s, score:scoreStudy(s, terms)}))
    .filter(x=>x.score>0)
    .sort((a,b)=>b.score-a.score)
    .slice(0, limit)
    .map(x=>x.s);
}

// Research gap detection
function detectResearchGaps(studies, query='') {
  if (!studies.length) return [];
  
  const allText = studies.map(s=>[s.title,s.abstract,...(s.keywords||[]),...(s.categories||[])].join(' ').toLowerCase()).join(' ');
  const allCats = {};
  studies.forEach(s=>(s.categories||[]).forEach(c=>{allCats[c]=(allCats[c]||0)+1;}));
  
  const gaps = [];
  const DEFAULT_CATS_SET = ['Biology','Chemistry','Physics','Mathematics','Computer Science','Environmental Science','Engineering','Health Science','Earth Science','Social Science'];
  DEFAULT_CATS_SET.forEach(cat => {
    if (!allCats[cat]) gaps.push(cat);
  });
  
  // Content-based gap detection
  const gapTopics = [
    { topic:'climate change impacts', check:/climate|global warming|carbon/ },
    { topic:'machine learning applications', check:/machine learning|neural|deep learning|AI/ },
    { topic:'renewable energy', check:/solar|wind energy|renewable|clean energy/ },
    { topic:'mental health in students', check:/mental health|anxiety|depression|wellbeing/ },
    { topic:'biodiversity conservation', check:/biodiversity|conservation|species|ecosystem/ },
    { topic:'data privacy and cybersecurity', check:/privacy|cybersecurity|data security|encryption/ },
  ];
  
  const contentGaps = gapTopics
    .filter(g => !g.check.test(allText))
    .map(g => g.topic)
    .slice(0, 2);
  
  return contentGaps;
}

// Cluster studies by theme
function clusterStudies(studies) {
  const clusters = {};
  studies.forEach(s => {
    (s.categories||['General']).forEach(cat => {
      if (!clusters[cat]) clusters[cat] = [];
      clusters[cat].push(s);
    });
  });
  return clusters;
}

async function callAI(query, history, studies, mode='general') {
  const recent = history.slice(-6).map(m=>`${m.role==='user'?'Student':'Assistant'}: ${m.content.slice(0,200)}`).join('\n');
  const system = buildSystemPrompt(studies, mode, recent);
  const messages = [...history.slice(-14), { role:'user', content: query }];

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': window.ANTHROPIC_API_KEY || '',
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1600,
        system,
        messages
      })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    const text = data.content?.[0]?.text || 'No response generated.';
    const relevant = findRelevant(query, studies, 4);
    return { text, citations: relevant, source: 'claude' };
  } catch(err) {
    console.error('AI error:', err);
    return buildLocalResponse(query, studies, mode);
  }
}

const MD = memo(function MD({ text }) {
  const lines = (text||'').split('\n');
  return (
    <div className="md">
      {lines.map((line,i) => {
        if (!line.trim()) return <div key={i} style={{height:5}}/>;
        if (line.startsWith('---')) return <hr key={i} style={{border:'none',borderTop:'1px solid var(--border)',margin:'8px 0'}}/>;
        if (/^#{1,3}\s/.test(line)) return <div key={i} className="md" style={{fontFamily:'var(--font-display)',fontWeight:600,fontSize:'0.97rem',color:'var(--ink)',margin:'8px 0 4px'}}>{line.replace(/^#{1,3}\s/,'')}</div>;
        const html = line
          .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
          .replace(/\*(.+?)\*/g,'<em>$1</em>')
          .replace(/`(.+?)`/g,'<code>$1</code>');
        if (/^\d+\.\s/.test(line)) {
          const num = line.match(/^(\d+)\./)[1];
          return <div key={i} className="md-num"><span className="md-num-n">{num}.</span><span dangerouslySetInnerHTML={{__html:html.replace(/^\d+\.\s*/,'')}}/></div>;
        }
        if (/^[•\-]\s/.test(line)) return <div key={i} className="md-bullet"><span className="md-bullet-dot">•</span><span dangerouslySetInnerHTML={{__html:html.replace(/^[•\-]\s*/,'')}}/></div>;
        return <div key={i} dangerouslySetInnerHTML={{__html:html}}/>;
      })}
    </div>
  );
});

let toastFn = null;
function ToastProvider({ children }) {
  const [toasts,setToasts] = useState([]);
  toastFn = useCallback((msg,type='ok')=>{
    const id=Date.now();
    setToasts(t=>[...t,{id,msg,type}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),3800);
  },[]);
  return (<>
    {children}
    <div className="toasts">
      {toasts.map(t=><div key={t.id} className={`toast ${t.type}`}><span>{t.type==='ok'?'✓':t.type==='err'?'✕':'ℹ'}</span>{t.msg}</div>)}
    </div>
  </>);
}
const toast = { ok:m=>toastFn?.(m,'ok'), err:m=>toastFn?.(m,'err'), info:m=>toastFn?.(m,'info') };

function Modal({ title, onClose, children, wide }) {
  useEffect(()=>{
    const esc = e=>e.key==='Escape'&&onClose?.();
    document.addEventListener('keydown',esc);
    document.body.style.overflow = 'hidden';
    return ()=>{ document.removeEventListener('keydown',esc); document.body.style.overflow=''; };
  },[onClose]);
  return (
    <div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose?.()}>
      <div className="modal" style={wide?{maxWidth:740}:{}} role="dialog" aria-modal="true" aria-label={title}>
        <div className="modal-hd">
          <h2 className="modal-title">{title}</h2>
          <button className="modal-x" onClick={onClose} aria-label="Close dialog"><Ico.X/></button>
        </div>
        <div className="modal-bd">{children}</div>
      </div>
    </div>
  );
}

function APABox({ study }) {
  const [copied,setCopied]=useState(false);
  const apa=generateAPA(study);
  const copy=()=>navigator.clipboard?.writeText(apa).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2000);});
  return <div className="apa-box">{apa}<button className="apa-cp" onClick={copy}>{copied?'✓ Copied':'Copy'}</button></div>;
}

function CatPicker({ selected, onChange, max=2, cats=[] }) {
  const toggle=cat=>{
    if (selected.includes(cat)){onChange(selected.filter(c=>c!==cat));return;}
    if (selected.length>=max){toast.err(`Select up to ${max} categories only.`);return;}
    onChange([...selected,cat]);
  };
  return (
    <div className="cat-picker" role="group" aria-label="Category selection">
      {cats.map(cat=>{
        const isSel=selected.includes(cat),isDis=!isSel&&selected.length>=max;
        return (
          <div key={cat} className={`cat-opt${isSel?' sel':''}${isDis?' dis':''}`}
            onClick={()=>!isDis&&toggle(cat)}
            role="checkbox" aria-checked={isSel} tabIndex={isDis?-1:0}
            onKeyDown={e=>(e.key==='Enter'||e.key===' ')&&!isDis&&toggle(cat)}>
            <div className="cat-cb">{isSel&&<span style={{color:'var(--ink)',fontSize:'0.63rem',fontWeight:900}}>✓</span>}</div>
            <span style={{fontSize:'0.875rem',fontWeight:500,color:'var(--ink-3)'}}>{cat}</span>
          </div>
        );
      })}
      <p className="hint">Select 1–{max} categories. {selected.length}/{max} selected.</p>
    </div>
  );
}

function ForgotModal({ onClose }) {
  const [step,setStep]=useState('email');
  const [email,setEmail]=useState('');
  const [err,setErr]=useState('');
  const [loading,setLoading]=useState(false);
  const submit=async()=>{
    setErr('');setLoading(true);
    try{await API.sendPasswordReset(email);setStep('done');}
    catch(e){setErr(e.message);}
    setLoading(false);
  };
  return (
    <Modal title="Reset Your Password" onClose={onClose}>
      {err&&<div className="al al-err">{err}</div>}
      {step==='email'&&(<>
        <p className="muted" style={{marginBottom:14}}>Enter your email and we'll send a reset link.</p>
        <div className="fg"><label htmlFor="reset-email">Email Address</label><input id="reset-email" type="email" placeholder="your@email.com" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==='Enter'&&submit()} autoFocus/></div>
        <div style={{display:'flex',gap:9,justifyContent:'flex-end'}}>
          <button className="btn btn-ol" onClick={onClose}>Cancel</button>
          <button className="btn btn-gold" onClick={submit} disabled={loading||!email.trim()}>{loading?<><span className="spin spin-dark"/>Sending…</>:'Send Reset Link'}</button>
        </div>
      </>)}
      {step==='done'&&(
        <div style={{textAlign:'center',padding:'18px 0'}}>
          <div style={{fontSize:'2.8rem',marginBottom:10}}>📧</div>
          <h3 style={{fontFamily:'var(--font-display)',fontSize:'1.15rem',marginBottom:7}}>Check Your Email</h3>
          <p className="muted" style={{marginBottom:22}}>A reset link was sent to <strong>{email}</strong>.</p>
          <button className="btn btn-gold btn-full" onClick={onClose}>Back to Sign In</button>
        </div>
      )}
    </Modal>
  );
}

          <div style={{flex:1,minWidth:0}}>
            <div style={{fontWeight:600,fontSize:'0.875rem',color:'var(--teal)'}}>Google Drive File</div>
            <div style={{fontSize:'0.73rem',color:'var(--teal)',opacity:0.8,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{gdriveUrl}</div>

          <a href={gdriveUrl} target="_blank" rel="noopener noreferrer" onClick={handleDL} className="btn btn-teal btn-sm" style={{textDecoration:'none'}}><Ico.eye/> Open</a>
          {gdriveDownload&&<a href={gdriveDownload} target="_blank" rel="noopener noreferrer" onClick={handleDL} className="btn btn-ol btn-sm" style={{textDecoration:'none'}}><Ico.dl/> Download</a>}
        </div>
      )}
      {study.uploadedByName&&(
        <div style={{display:'flex',alignItems:'center',gap:9,padding:'10px 14px',background:'var(--surface)',borderRadius:'var(--radius)',marginBottom:16}}>
          <div className="avatar" style={{width:32,height:32,fontSize:'0.78rem'}}>{initials(study.uploadedByName)}</div>

            <div style={{fontSize:'0.72rem',color:'var(--muted)'}}>Uploaded by</div>

      {canDel&&<div style={{display:'flex',justifyContent:'flex-end',marginTop:6,paddingTop:14,borderTop:'1px solid var(--border)'}}><button className="btn btn-red btn-sm" onClick={()=>{onDelete(study.id);onClose();}}><Ico.trash/> Delete Study</button></div>}
    </Modal>
  );
}

// ══════════════════════════════════════════════════════════════════
//  UPLOAD MODAL
// ══════════════════════════════════════════════════════════════════
function UploadModal({ onClose, currentUser, onUpload, cats=[] }) {
  const [form,setForm]=useState({title:'',authors:'',abstract:'',keywords:'',year:String(new Date().getFullYear())});
  const [selCats,setSelCats]=useState([]);
  const [gdriveUrl,setGdriveUrl]=useState('');
  const [gdriveInfo,setGdriveInfo]=useState(null);
  const [loading,setLoading]=useState(false);
  const sf=(k,v)=>setForm(f=>({...f,[k]:v}));

  const handleGdriveInput=val=>{
    setGdriveUrl(val);
    const parsed=parseGDriveLink(val.trim());
    setGdriveInfo(parsed);
  };

  const submit=async()=>{
    if(!form.title.trim()){toast.err('Title is required.');return;}
    if(!form.authors.trim()){toast.err('At least one author is required.');return;}
    if(!form.abstract.trim()){toast.err('Abstract is required.');return;}
    if(!selCats.length){toast.err('Select at least one category.');return;}
    setLoading(true);
    try{
      const authors=form.authors.split(',').map(a=>a.trim()).filter(Boolean);
      const keywords=form.keywords.split(',').map(k=>k.trim()).filter(Boolean);
      const gdrive=gdriveInfo?{driveUrl:gdriveInfo.viewUrl,downloadUrl:gdriveInfo.downloadUrl,driveId:gdriveInfo.id}:null;
      await API.createStudy({title:form.title,authors,abstract:form.abstract,keywords,categories:selCats,year:form.year,gdrive,uploadedBy:currentUser.id,uploadedByName:currentUser.name});
      toast.ok('Study uploaded successfully!');onUpload();onClose();
    }catch(e){toast.err(e.message);}
    setLoading(false);
  };

  return (
    <Modal title="Upload Research Study" onClose={onClose} wide>
      <div className="fg"><label>Title *</label><input placeholder="Full title of your research study" value={form.title} onChange={e=>sf('title',e.target.value)}/></div>
      <div className="fg"><label>Author(s) * <span style={{fontWeight:300,color:'var(--muted)'}}>(comma-separated)</span></label><input placeholder="Juan dela Cruz, Maria Santos" value={form.authors} onChange={e=>sf('authors',e.target.value)}/></div>
      <div className="fg"><label>Abstract / Description *</label><textarea placeholder="Concise summary of your research…" value={form.abstract} onChange={e=>sf('abstract',e.target.value)} style={{minHeight:110}}/></div>
      <div className="fg"><label>Category * <span style={{fontWeight:300,color:'var(--muted)'}}>(select 1–2)</span></label><CatPicker selected={selCats} onChange={setSelCats} max={2} cats={cats}/></div>
      <div className="fr">
        <div className="fg"><label>Year</label><input type="number" min="1900" max="2099" value={form.year} onChange={e=>sf('year',e.target.value)}/></div>
        <div className="fg"><label>Keywords <span style={{fontWeight:300,color:'var(--muted)'}}>(comma-separated)</span></label><input placeholder="e.g. robotics, AI, biology" value={form.keywords} onChange={e=>sf('keywords',e.target.value)}/></div>
      </div>
      <div className="fg">
        <label style={{display:'flex',alignItems:'center',gap:7}}>
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          Google Drive Link
          <span style={{fontWeight:300,color:'var(--muted)',fontSize:'0.78rem'}}>(optional)</span>
        </label>
        <div className="al al-info" style={{marginBottom:10,padding:'9px 13px',fontSize:'0.78rem'}}>
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2" style={{flexShrink:0,marginTop:1}}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span>Upload your PDF to <strong>Google Drive</strong>, set sharing to <strong>"Anyone with the link"</strong>, then paste the link here.</span>
        </div>
        {gdriveInfo?(
          <div className="gdrive-preview">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2" style={{flexShrink:0}}><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontWeight:600,fontSize:'0.82rem',marginBottom:2}}>Google Drive file linked</div>
              <a href={gdriveInfo.viewUrl} target="_blank" rel="noopener noreferrer" style={{fontSize:'0.73rem'}}>{gdriveInfo.viewUrl}</a>
            </div>
            <button className="gdrive-remove" onClick={()=>{setGdriveUrl('');setGdriveInfo(null);}} title="Remove link">✕</button>
          </div>
        ):(
          <div className="gdrive-input-wrap">
            <span className="gdrive-icon">
              <svg viewBox="0 0 87.3 78" width="18" height="18" xmlns="http://www.w3.org/2000/svg"><path d="M6.6 66.85l3.85 6.65c.8 1.4 1.95 2.5 3.3 3.3l13.75-23.8H0c0 1.55.4 3.1 1.2 4.5z" fill="#0066da"/><path d="M43.65 25L29.9 1.2C28.55 2 27.4 3.1 26.6 4.5L1.2 48.6c-.8 1.4-1.2 2.95-1.2 4.5h27.5z" fill="#00ac47"/><path d="M73.55 76.8c1.35-.8 2.5-1.9 3.3-3.3l1.6-2.75 7.65-13.25c.8-1.4 1.2-2.95 1.2-4.5H59.8l5.85 11.5z" fill="#ea4335"/><path d="M43.65 25L57.4 1.2C56.05.4 54.5 0 52.9 0H34.4c-1.6 0-3.1.45-4.5 1.2z" fill="#00832d"/><path d="M59.8 53.1H27.5L13.75 76.9c1.35.8 2.9 1.2 4.5 1.2h50.8c1.6 0 3.1-.45 4.5-1.2z" fill="#2684fc"/><path d="M73.4 26.6l-12.6-21.9C59.9 3.2 58.75 2.1 57.4 1.3L43.65 25l16.15 28.1h27.45c0-1.55-.4-3.1-1.2-4.5z" fill="#ffba00"/></svg>
            </span>
            <input
              placeholder="Paste Google Drive link here…"
              value={gdriveUrl}
              onChange={e=>handleGdriveInput(e.target.value)}
              style={{color:'var(--ink)'}}
            />
            {gdriveUrl&&!gdriveInfo&&<span style={{color:'var(--red)',fontSize:'0.75rem',flexShrink:0}}>Invalid link</span>}
          </div>
        )}
      </div>
      <div style={{display:'flex',gap:9,justifyContent:'flex-end',flexWrap:'wrap'}}>
        <button className="btn btn-ol" onClick={onClose}>Cancel</button>
        <button className="btn btn-gold" onClick={submit} disabled={loading}>{loading?<><span className="spin spin-dark"/>Uploading…</>:<><Ico.up/> Upload Study</>}</button>
      </div>
    </Modal>
  );
}

// ══════════════════════════════════════════════════════════════════
//  STUDIES PAGE
// ══════════════════════════════════════════════════════════════════
function StudiesPage({ currentUser }) {
  const [studies,setStudies]=useState([]);
  const [cats,setCats]=useState([]);
  const [total,setTotal]=useState(0);
  const [totalPages,setTotalPages]=useState(1);
  const [search,setSearch]=useState('');
  const [searchInput,setSearchInput]=useState('');
  const [filterCat,setFilterCat]=useState('');
  const [page,setPage]=useState(1);
  const [selected,setSelected]=useState(null);
  const [showUpload,setShowUpload]=useState(false);
  const [loading,setLoading]=useState(true);
  const searchTimeout = useRef(null);

  const load=useCallback(async()=>{
    setLoading(true);
    try{
      const [res,catsArr]=await Promise.all([API.getStudies({search,category:filterCat,page,perPage:6}),API.getCategories()]);
      setStudies(res.data);setTotal(res.total);setTotalPages(res.totalPages);setCats(catsArr);
    }catch(e){toast.err('Failed to load studies.');}
    setLoading(false);
  },[search,filterCat,page]);

  useEffect(()=>{load();},[load]);

  const handleSearch = e => {
    const val = e.target.value;
    setSearchInput(val);
    clearTimeout(searchTimeout.current);
    searchTimeout.current = setTimeout(()=>{ setSearch(val); setPage(1); }, 350);
  };

  const handleDelete=async id=>{await API.deleteStudy(id);toast.ok('Study deleted.');load();};

  return (
    <div>
      <div className="page-hd">
        <div className="page-hd-left"><h2>Research Repository</h2><p className="muted">{total} {total===1?'study':'studies'} found</p></div>
        <button className="btn btn-gold" onClick={()=>setShowUpload(true)}><Ico.up/> Upload Study</button>
      </div>
      <div className="fb" style={{marginBottom:18}}>
        <div className="sb" style={{flex:1,minWidth:200}}><Ico.search/><input placeholder="Search by title, author, or keyword…" value={searchInput} onChange={handleSearch} aria-label="Search studies"/></div>
        <select value={filterCat} onChange={e=>{setFilterCat(e.target.value);setPage(1);}} style={{width:'auto',padding:'10px 13px'}} aria-label="Filter by category">
          <option value="">All Categories</option>
          {cats.map(c=><option key={c}>{c}</option>)}
        </select>
      </div>

      {loading?(
        <div style={{textAlign:'center',padding:'50px',color:'var(--muted)'}}>
          <span className="spin spin-gold" style={{width:28,height:28,border:'3px solid rgba(201,162,39,0.25)',borderTopColor:'var(--gold)',display:'inline-block',marginBottom:12}}/>
          <p>Loading studies…</p>
        </div>
      ):studies.length===0?(
        <div className="empty"><div className="empty-ico">📚</div><h3>No studies found</h3><p>{search||filterCat?'Try adjusting your search or filter.':'Be the first to upload a research study!'}</p></div>
      ):(
        <div className="grid">
          {studies.map(study=>(
            <div key={study.id} className="sc"
              onClick={async()=>{await API.trackStudy(study.id,'viewCount');setSelected({...study,viewCount:(study.viewCount||0)+1});}}
              role="article" tabIndex={0}
              onKeyDown={e=>e.key==='Enter'&&e.currentTarget.click()}
              aria-label={`Study: ${study.title}`}>
              <div className="sc-cats">{(study.categories||[]).map(c=><span key={c} className="sc-cat">{c}</span>)}</div>
              <h3 className="sc-title">{study.title}</h3>
              <p className="sc-authors">By: {(study.authors||[]).join(', ')}</p>
              <p className="sc-abs">{study.abstract}</p>
              <div className="sc-meta">
                <span><Ico.eye/>{study.viewCount||0}</span>
                <span><Ico.dl/>{study.downloadCount||0}</span>
                <span><Ico.cal/>{study.year}</span>
                <span style={{marginLeft:'auto'}}>{fmtDate(study.createdAt)}</span>
              </div>
            </div>
          ))}
        </div>
      )}

      {totalPages>1&&(
        <div className="pages" role="navigation" aria-label="Pagination">
          <button className="pg" disabled={page===1} onClick={()=>setPage(p=>p-1)} aria-label="Previous page">‹</button>
          {Array.from({length:totalPages},(_,i)=>i+1).filter(n=>Math.abs(n-page)<=2||n===1||n===totalPages).map((n,idx,arr)=>(
            <React.Fragment key={n}>
              {idx>0&&arr[idx-1]!==n-1&&<span style={{color:'var(--muted)',padding:'0 4px'}}>…</span>}
              <button className={`pg${page===n?' active':''}`} onClick={()=>setPage(n)} aria-current={page===n?'page':undefined}>{n}</button>
            </React.Fragment>
          ))}
          <button className="pg" disabled={page===totalPages} onClick={()=>setPage(p=>p+1)} aria-label="Next page">›</button>
        </div>
      )}

      {selected&&<StudyDetailModal study={selected} onClose={()=>setSelected(null)} currentUser={currentUser} onDelete={handleDelete}/>}
      {showUpload&&<UploadModal onClose={()=>setShowUpload(false)} currentUser={currentUser} cats={cats} onUpload={()=>{load();setShowUpload(false);}}/>}
    </div>
  );
}
