function OnboardingTour({ isAdmin, sidebarOpen, setSidebarOpen, onFinish }) {
  const steps = useMemo(() => buildTourSteps(isAdmin), [isAdmin]);
  const [stepIndex, setStepIndex] = useState(0);
  const [rect, setRect] = useState(null);
  const [ready, setReady] = useState(false);
  const step = steps[stepIndex];

  const goTo = useCallback(idx => {
    if (idx < 0) return;
    if (idx >= steps.length) { onFinish?.(); return; }
    setReady(false);
    setStepIndex(idx);
  }, [steps.length, onFinish]);

  useEffect(() => {
    let cancelled = false;

    const run = () => {
      if (cancelled) return;
      if (step.skipIf && step.skipIf()) {
        if (stepIndex < steps.length - 1) goTo(stepIndex + 1); else onFinish?.();
        return;
      }
      if (step.center || !step.target) { setRect(null); setReady(true); return; }
      const el = document.querySelector(step.target);
      if (!el || el.offsetParent === null) {
        if (stepIndex < steps.length - 1) goTo(stepIndex + 1); else onFinish?.();
        return;
      }
      el.scrollIntoView?.({ block: 'nearest', inline: 'nearest' });
      const r = el.getBoundingClientRect();
      setRect({ top: r.top, left: r.left, width: r.width, height: r.height });
      setReady(true);
    };

    const isMobile = window.innerWidth <= 768;
    const needsSidebar = step.area === 'sidebar' && !(step.skipIf && step.skipIf());

    if (isMobile) {
      if (needsSidebar && !sidebarOpen) {
        setSidebarOpen(true);
        const t = setTimeout(run, 320);
        return () => { cancelled = true; clearTimeout(t); };
      }
      if (!needsSidebar && sidebarOpen) {
        setSidebarOpen(false);
        const t = setTimeout(run, 320);
        return () => { cancelled = true; clearTimeout(t); };
      }
    }

    const raf = requestAnimationFrame(() => requestAnimationFrame(run));
    return () => { cancelled = true; cancelAnimationFrame(raf); };
  }, [stepIndex]);

  // Keep the spotlight glued to its target on resize/scroll
  useEffect(() => {
    if (step.center || !step.target) return;
    const onChange = () => {
      const el = document.querySelector(step.target);
      if (!el) return;
      const r = el.getBoundingClientRect();
      setRect({ top: r.top, left: r.left, width: r.width, height: r.height });
    };
    window.addEventListener('resize', onChange);
    window.addEventListener('scroll', onChange, true);
    return () => { window.removeEventListener('resize', onChange); window.removeEventListener('scroll', onChange, true); };
  }, [stepIndex]);

  // Keyboard navigation
  useEffect(() => {
    const onKey = e => {
      if (e.key === 'Escape') onFinish?.();
      else if (e.key === 'ArrowRight') goTo(stepIndex + 1);
      else if (e.key === 'ArrowLeft') goTo(stepIndex - 1);
    };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [stepIndex, goTo, onFinish]);

  const PAD = 8;
  const isMobileNow = window.innerWidth <= 768;
  let cardStyle = {};
  if (!step.center && rect && !isMobileNow) {
    const cardW = Math.min(340, window.innerWidth - 28);
    const cardH = 280; // more realistic estimate for cards with long body text
    const vp = window.innerHeight;
    let top, left;
    switch (step.placement) {
      case 'left':
        left = rect.left - cardW - 16;
        top = Math.min(Math.max(rect.top, 16), vp - cardH - 16);
        if (left < 16) { left = rect.left + rect.width + 16; }
        if (left + cardW > window.innerWidth - 16) { left = 16; top = rect.bottom + 12; }
        break;
      case 'top':
        top = rect.top - cardH - 12;
        left = Math.min(Math.max(rect.left, 16), window.innerWidth - cardW - 16);
        if (top < 16) top = rect.top + rect.height + 12;
        break;
      case 'right':
        left = rect.left + rect.width + 16;
        top = Math.min(Math.max(rect.top, 16), vp - cardH - 16);
        // If card goes off right edge, fall back below the element
        if (left + cardW > window.innerWidth - 16) {
          left = Math.max(16, window.innerWidth - cardW - 16);
          top = rect.top + rect.height + 12;
        }
        break;
      default:
        top = rect.top + rect.height + 12;
        left = Math.min(Math.max(rect.left, 16), window.innerWidth - cardW - 16);
        if (top + cardH > vp - 16) top = Math.max(8, rect.top - cardH - 12);
    }
    // Final clamp — never go off-screen
    top  = Math.max(8, Math.min(top,  vp - cardH - 8));
    left = Math.max(8, Math.min(left, window.innerWidth - cardW - 8));
    cardStyle = { top, left, width: cardW, maxHeight: vp - 32, overflowY: 'auto' };
  }

  return (
    <>
      <div className={`tour-overlay${step.center ? ' tour-center-bg' : ''}`} aria-hidden="true"/>
      {rect && !step.center && (
        <div className="tour-spotlight pulse" style={{ top: rect.top - PAD, left: rect.left - PAD, width: rect.width + PAD * 2, height: rect.height + PAD * 2 }} aria-hidden="true"/>
      )}
      {ready && (
        <div className={`tour-card${step.center ? ' tour-card-center' : ''}`} style={cardStyle} role="dialog" aria-modal="true" aria-label={`Onboarding tour, step ${stepIndex + 1} of ${steps.length}`}>
          <div className="tour-progress-bar-track" aria-hidden="true">
            <div className="tour-progress-bar-fill" style={{ width: `${((stepIndex + 1) / steps.length) * 100}%` }}/>
          </div>
          <div className="tour-eyebrow">{step.eyebrow || (step.center ? 'Quick tour' : 'Guide')}</div>
          <h3>{step.title}</h3>
          <p>{step.body}</p>
          <div className="tour-card-footer">
            <div className="tour-footer-row">
              <span className="tour-step-counter">{stepIndex + 1} / {steps.length}</span>
              <div className="tour-actions">
                {stepIndex > 0 && <button className="tour-btn tour-btn-ghost" onClick={() => goTo(stepIndex - 1)}>Back</button>}
                <button className="tour-btn tour-btn-primary" onClick={() => goTo(stepIndex + 1)}>{stepIndex === steps.length - 1 ? 'Done' : 'Next'}</button>
              </div>
            </div>
          </div>
          {stepIndex < steps.length - 1 && <button className="tour-skip" onClick={() => onFinish?.()}>Skip tour</button>}
        </div>
      )}
    </>
  );
}

function App() {
  const [currentUser,setCurrentUser]=useState(null);
  const [authChecked,setAuthChecked]=useState(false);
  const [loaderDone,setLoaderDone]=useState(false);
  const [activeTab,setActiveTab]=useState('dashboard');
  const [offlineStudy,setOfflineStudy]=useState(null);
  const [accountModal,setAccountModal]=useState(null); // 'profile' | 'settings' | null
  const [pendingCount,setPendingCount]=useState(0);
  const [studyNotifCount,setStudyNotifCount]=useState(0);
  const [userNotifCount,setUserNotifCount]=useState(0);
  const [globalSelectedStudy,setGlobalSelectedStudy]=useState(null);
  const [initError,setInitError]=useState('');
  const [sidebarOpen,setSidebarOpen]=useState(false);
  const [showSecQ,setShowSecQ]=useState(false);
  const [theme,toggleTheme]=useTheme();
  const [showTour,setShowTour]=useState(false);
  const [tourEnabled,setTourEnabled]=useState(()=>localStorage.getItem('sabnahis_tour_enabled')!=='false');

  // Auto-start tour for first-time users (students AND admins)
  useEffect(()=>{
    if(!currentUser||showTour) return;
    const seen=localStorage.getItem('sabnahis_tour_seen_'+currentUser.id);
    if(!seen){
      const t=setTimeout(()=>setShowTour(true),600);
      return()=>clearTimeout(t);
    }
  },[currentUser?.id]);

  const startTour=()=>{
    if(currentUser) localStorage.removeItem('sabnahis_tour_seen_'+currentUser.id);
    setTourEnabled(true);
    localStorage.setItem('sabnahis_tour_enabled','true');
    setShowTour(false);
    setTimeout(()=>setShowTour(true),50);
  };
  const finishTour=()=>{
    setShowTour(false);
    if(currentUser) localStorage.setItem('sabnahis_tour_seen_'+currentUser.id,'1');
  };
  const enableTour=()=>{
    setTourEnabled(true);
    localStorage.setItem('sabnahis_tour_enabled','true');
  };
  const disableTour=()=>{
    setTourEnabled(false);
    localStorage.setItem('sabnahis_tour_enabled','false');
  };

  // ── Poll study notification count every 30s for admins ────────
  useEffect(()=>{
    if(!currentUser||currentUser.role!=='admin') return;
    const poll=()=>API.getUnreadStudyNotificationCount(currentUser.id).then(n=>setStudyNotifCount(n)).catch(()=>{});
    const id=setInterval(poll,30_000);
    return()=>clearInterval(id);
  },[currentUser]);

  // ── Poll general notification count every 30s for everyone ────
  useEffect(()=>{
    if(!currentUser) return;
    const poll=()=>API.getUnreadNotificationCount(currentUser.id).then(n=>setUserNotifCount(n)).catch(()=>{});
    poll();
    const id=setInterval(poll,30_000);
    return()=>clearInterval(id);
  },[currentUser]);

  // ── Keyboard shortcuts ─────────────────────────────────
  useEffect(()=>{
    const handler=e=>{
      if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)){
        e.preventDefault();
        const sb=document.querySelector('.sb input');
        if(sb){setActiveTab('repository');setTimeout(()=>sb.focus(),100);}
      }
    };
    window.addEventListener('keydown',handler);
    return()=>window.removeEventListener('keydown',handler);
  },[]);

  useEffect(()=>{
    let unsub=()=>{};
    try{
      unsub=auth.onAuthStateChanged(async fbUser=>{
        if(window._registering){setAuthChecked(true);return;}
        if(fbUser){
          try{
            const profile=await API.getProfile(fbUser.uid);
            if(profile&&(profile.status==='approved'||profile.role==='admin')){
              setCurrentUser(profile);
              if(!profile.secQ||!profile.secA||!profile.secQ.trim()||!profile.secA.trim()) setShowSecQ(true);
              API.recordDailyVisit(fbUser.uid).catch(()=>{});
              if(profile.role==='admin'){
                API.getUsers({role:'student',status:'pending'}).then(p=>setPendingCount(p.length)).catch(()=>{});
                API.getUnreadStudyNotificationCount(fbUser.uid).then(n=>setStudyNotifCount(n)).catch(()=>{});
              }
            } else {
              await auth.signOut().catch(()=>{});
            }
          }catch(e){
            await auth.signOut().catch(()=>{});
          }
        }
        setAuthChecked(true);
      },err=>{
        setInitError(err.message);
        setAuthChecked(true);
      });
    }catch(e){
      setInitError(e.message);
      setAuthChecked(true);
    }
    return ()=>{try{unsub();}catch{}};
  },[]);

  const titles={dashboard:'Dashboard',users:'User Management',analytics:'Class Analytics','grade-overview':'Grade Overview',announcements:'Announcements','studies-admin':'Manage Studies',categories:'Manage Categories','audit-log':'Audit Log',repository:'Research Repository',chatbot:'AI Research Assistant',recognized:'Recognized Studies','my-stats':'My Stats','stat-analysis':'Statistical Analysis'};

  if(!authChecked || !loaderDone){
    // Keep React from rendering anything until auth is known AND the loader has fully faded out
    if(authChecked && !loaderDone){
      // Auth is ready — trigger the loader dismiss and wait for its fade-out (700ms) before showing app
      if(typeof window.sabnahisLoaderDone==='function'){
        window.sabnahisLoaderDone();
        window.sabnahisLoaderDone=null;
      }
      setTimeout(()=>setLoaderDone(true), 750);
    }
    return null;
  }

  if(initError){
    return (
      <div style={{minHeight:'100vh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',background:'var(--ink)',gap:14,padding:24}}>
        <div style={{fontSize:'2rem'}}>⚠️</div>
        <div style={{fontFamily:'var(--font-display)',fontSize:'1.1rem',color:'#fff'}}>Connection Error</div>
        <div style={{background:'rgba(255,255,255,0.07)',borderRadius:8,padding:'12px 18px',maxWidth:480,color:'rgba(255,255,255,0.6)',fontSize:'0.85rem',fontFamily:'var(--font-mono)',wordBreak:'break-all'}}>{initError}</div>
        <p style={{color:'rgba(255,255,255,0.4)',fontSize:'0.82rem',textAlign:'center',maxWidth:400}}>Check that your Firebase project is active and the domain is authorized in Firebase Console → Authentication → Settings → Authorized domains.</p>
        <button className="btn btn-gold" onClick={()=>window.location.reload()}>Reload Page</button>
      </div>
    );
  }

  if(!currentUser){
    return (
      <ToastProvider>
        <AuthPage onLogin={user=>{
          setCurrentUser(user);
          if(!user.secQ||!user.secA||!user.secQ.trim()||!user.secA.trim()) setShowSecQ(true);
          API.recordDailyVisit(user.id).catch(()=>{});
          if(user.role==='admin') API.getUsers({role:'student',status:'pending'}).then(p=>setPendingCount(p.length)).catch(()=>{});
          if(user.role==='admin') API.getUnreadStudyNotificationCount(user.id).then(n=>setStudyNotifCount(n)).catch(()=>{});
        }}/>
      </ToastProvider>
    );
  }

  const isAdmin=currentUser.role==='admin';

  const renderPage=()=>{
    switch(activeTab){
      case 'dashboard':     return isAdmin?<AdminDash currentUser={currentUser}/>:<StudentDash currentUser={currentUser}/>;
      case 'users':         return isAdmin?<AdminUsers currentUser={currentUser}/>:null;
      case 'studies-admin': return isAdmin?<AdminStudies currentUser={currentUser}/>:null;
      case 'categories':    return isAdmin?<AdminCats/>:null;
      case 'analytics':     return isAdmin?<AdminAnalytics currentUser={currentUser}/>:null;
      case 'grade-overview':return isAdmin?<GradeOverviewPage currentUser={currentUser}/>:null;
      case 'batch-grading': return isAdmin?<BatchGradingPage currentUser={currentUser}/>:null;
      case 'my-stats':      return !isAdmin?<MyStatsPage currentUser={currentUser}/>:null;
      case 'stat-analysis': return <StatAnalysisTool currentUser={currentUser}/>;
      case 'audit-log':     return isAdmin?<AdminAuditLog/>:null;
      case 'repository':    return <StudiesPage currentUser={currentUser}/>;
      case 'offline-reading': return !isAdmin?<OfflineReadingPage currentUser={currentUser} onOpenStudy={s=>{setOfflineStudy(s);}}/>:null;
      case 'recognized':    return <RecognizedStudiesPage currentUser={currentUser} isAdmin={isAdmin}/>;
      case 'announcements': return <AnnouncementsPage currentUser={currentUser}/>
      case 'chatbot':       return <ChatPage currentUser={currentUser}/>;
      default:              return null;
    }
  };

  const mobNav = isAdmin
    ? [{id:'dashboard',label:'Home',icon:<Ico.home/>},{id:'repository',label:'Studies',icon:<Ico.book/>},{id:'recognized',label:'Recognized',icon:<Ico.award/>},{id:'chatbot',label:'AI Chat',icon:<Ico.bot/>},{id:'users',label:'Users',icon:<Ico.users/>}]
    : [{id:'dashboard',label:'Home',icon:<Ico.home/>},{id:'repository',label:'Studies',icon:<Ico.book/>},{id:'announcements',label:'Notices',icon:<Ico.bell/>},{id:'chatbot',label:'AI Chat',icon:<Ico.bot/>}];

  return (
    <ToastProvider>
      <div className="app-shell">
        <Sidebar
          currentUser={currentUser}
          activeTab={activeTab}
          setActiveTab={setActiveTab}
          pendingCount={pendingCount}
          isOpen={sidebarOpen}
          onClose={()=>setSidebarOpen(false)}
          onLogout={async()=>{await API.logout();setCurrentUser(null);setActiveTab('dashboard');}}
          theme={theme}
          toggleTheme={toggleTheme}
        />
        <div className="main-content" id="main-content">
          {/* Desktop topbar */}
          <div className="topbar">
            <span className="topbar-title">{titles[activeTab]||'Dashboard'}</span>
            <GlobalSearch onOpenStudy={s=>{trackRecentlyViewed(s);setGlobalSelectedStudy(s);}}/>
            <span className={`badge${isAdmin?' badge-teacher':' badge-appr'}`}>{isAdmin?'⚙ Teacher':'🎓 Student'}</span>
            <div style={{display:'flex',gap:4,marginLeft:'auto',alignItems:'center'}}>
              {!isAdmin && <StreakPill currentUser={currentUser}/>}
              {!isAdmin && <BadgesPill currentUser={currentUser}/>}
              {isAdmin && <AdminNotifBell currentUser={currentUser} count={studyNotifCount} onCountChange={setStudyNotifCount}/>}
              <UserNotifBell currentUser={currentUser} count={userNotifCount} onCountChange={setUserNotifCount} onOpenStudy={s=>{trackRecentlyViewed(s);setGlobalSelectedStudy(s);}}/>
              <button className="topbar-theme-toggle" onClick={()=>theme!=='light'&&toggleTheme()} style={theme==='light'?{borderColor:'var(--gold)',color:'var(--gold)',background:'var(--gold-bg)',fontWeight:600}:{}} aria-pressed={theme==='light'}>☀ Light</button>
              <button className="topbar-theme-toggle" onClick={()=>theme!=='dark'&&toggleTheme()} style={theme==='dark'?{borderColor:'var(--gold)',color:'var(--gold)',background:'var(--gold-bg)',fontWeight:600}:{}} aria-pressed={theme==='dark'}>☾ Dark</button>
              <button className="topbar-theme-toggle" title="Start the guided tour" onClick={startTour} style={{borderColor:'var(--teal)',color:'var(--teal)',background:'var(--teal-light)'}}>🗺 Tour</button>
              <TopbarAccount currentUser={currentUser} isAdmin={isAdmin} onProfile={()=>setAccountModal('profile')} onSettings={()=>setAccountModal('settings')} onStartTour={startTour} onLogout={async()=>{await API.logout();setCurrentUser(null);setActiveTab('dashboard');}}/>
            </div>
          </div>

          {/* Mobile header */}
          <div className="mob-header" role="banner">
            <button className="mob-menu-btn" onClick={()=>setSidebarOpen(o=>!o)} aria-label="Open menu" aria-expanded={sidebarOpen}>
              <Ico.menu/>
            </button>
            <span className="mob-header-title">SABNAHIS STE</span>
            <div style={{display:'flex',gap:4,alignItems:'center'}}>
              {!isAdmin && <StreakPill currentUser={currentUser}/>}
              {!isAdmin && <BadgesPill currentUser={currentUser}/>}
              {isAdmin && <AdminNotifBell currentUser={currentUser} count={studyNotifCount} onCountChange={setStudyNotifCount}/>}
              <button className="theme-toggle" onClick={()=>theme!=='light'&&toggleTheme()} style={theme==='light'?{background:'rgba(201,162,39,0.25)',color:'var(--gold-light)',border:'1px solid rgba(201,162,39,0.4)'}:{}} aria-pressed={theme==='light'}>☀</button>
              <button className="theme-toggle" onClick={()=>theme!=='dark'&&toggleTheme()} style={theme==='dark'?{background:'rgba(201,162,39,0.25)',color:'var(--gold-light)',border:'1px solid rgba(201,162,39,0.4)'}:{}} aria-pressed={theme==='dark'}>☾</button>
            </div>
          </div>

          <main className="page page-transition" key={activeTab}>{renderPage()}</main>
        </div>

        {/* Mobile bottom navigation */}
        <nav className="mob-nav" aria-label="Mobile navigation">
          <div className="mob-nav-inner">
            {mobNav.map(item=>(
              <button key={item.id}
                className={`mob-nav-btn${activeTab===item.id?' active':''}`}
                onClick={()=>setActiveTab(item.id)}
                aria-current={activeTab===item.id?'page':undefined}
                aria-label={item.label}>
                {item.icon}<span>{item.label}</span>
              </button>
            ))}
            {isAdmin&&(
              <button
                className={`mob-nav-btn${activeTab==='studies-admin'?' active':''}`}
                onClick={()=>setActiveTab('studies-admin')}
                aria-current={activeTab==='studies-admin'?'page':undefined}
                aria-label="Manage studies">
                <Ico.book/><span>Manage</span>
              </button>
            )}
            <button
              className="mob-nav-btn"
              onClick={()=>setSidebarOpen(o=>!o)}
              aria-label="More options"
              aria-expanded={sidebarOpen}>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" width="20" height="20"><circle cx="12" cy="5" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="19" r="1.5" fill="currentColor"/></svg>
              <span>More</span>
            </button>
          </div>
        </nav>
      </div>
      {showSecQ&&<SetSecurityQuestionModal user={currentUser} onDone={()=>setShowSecQ(false)}/>}
      {!isAdmin && <AnnouncementPopup currentUser={currentUser}/>}
      {accountModal==='profile' && (
        <Modal title="Profile" onClose={()=>setAccountModal(null)}>
          <div style={{display:'flex',alignItems:'center',gap:14,marginBottom:16}}>
            <div className="avatar" style={{width:48,height:48,fontSize:'1rem'}}>{initials(currentUser.name)}</div>
            <div>
              <div style={{fontWeight:600,fontSize:'var(--text-md)',color:'var(--ink)'}}>{currentUser.name}</div>
              <div style={{fontSize:'var(--text-xs)',color:'var(--muted)',textTransform:'capitalize'}}>{isAdmin?'Teacher':'Student'}</div>
            </div>
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:10,fontSize:'var(--text-sm)'}}>
            <div><strong>Email:</strong> {currentUser.email||'—'}</div>
            {currentUser.institution && <div><strong>Institution:</strong> {currentUser.institution}</div>}
            {currentUser.department && <div><strong>Department:</strong> {currentUser.department}</div>}
          </div>
        </Modal>
      )}
      {accountModal==='settings' && (
        <Modal title="Settings" onClose={()=>setAccountModal(null)}>
          <div style={{display:'flex',flexDirection:'column',gap:14}}>
            <div>
              <div style={{fontWeight:600,fontSize:'var(--text-sm)',marginBottom:8}}>Theme</div>
              <div style={{display:'flex',gap:8}}>
                <button className="topbar-theme-toggle" style={theme==='light'?{borderColor:'var(--gold)',color:'var(--gold)',background:'var(--gold-bg)',fontWeight:600}:{}} onClick={()=>theme!=='light'&&toggleTheme()} aria-pressed={theme==='light'}>☀ Light</button>
                <button className="topbar-theme-toggle" style={theme==='dark'?{borderColor:'var(--gold)',color:'var(--gold)',background:'var(--gold-bg)',fontWeight:600}:{}} onClick={()=>theme!=='dark'&&toggleTheme()} aria-pressed={theme==='dark'}>☾ Dark</button>
              </div>
            </div>
            <div>
              <div style={{fontWeight:600,fontSize:'var(--text-sm)',marginBottom:8}}>Account</div>
              <button className="topbar-account-item danger" style={{borderRadius:6,border:'1px solid var(--border)'}} onClick={async()=>{await API.logout();setCurrentUser(null);setActiveTab('dashboard');}}><Ico.logout/> Logout</button>
            </div>
          </div>
        </Modal>
      )}
      {globalSelectedStudy && (
        <StudyDetailModal
          study={globalSelectedStudy}
          onClose={()=>setGlobalSelectedStudy(null)}
          currentUser={currentUser}
          onDelete={async id=>{await API.deleteStudy(id);setGlobalSelectedStudy(null);}}
          allStudies={[]}
          onOpenStudy={async s=>{
            const snap=await db.collection('studies').doc(s.studyId||s.id).get();
            if(snap.exists){const d={id:snap.id,...snap.data()};setGlobalSelectedStudy(d);trackRecentlyViewed(d);}
          }}
        />
      )}
      {offlineStudy && (
        <StudyDetailModal
          study={offlineStudy}
          onClose={()=>setOfflineStudy(null)}
          currentUser={currentUser}
          onDelete={()=>{}}
          allStudies={[]}
          onOpenStudy={s=>{
            // track view + recently viewed even from offline page (silently fails if offline)
            API.trackStudy(s.id,'viewCount',currentUser).catch(()=>{});
            API.setLastRead(currentUser.id,s).catch(()=>{});
            trackRecentlyViewed(s);
            setOfflineStudy({...s,viewCount:(s.viewCount||0)+1});
          }}
        />
      )}
      <ScrollToTopButton/>
      {showTour && (
        <OnboardingTour
          isAdmin={isAdmin}
          sidebarOpen={sidebarOpen}
          setSidebarOpen={setSidebarOpen}
          onFinish={finishTour}
        />
      )}
    </ToastProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

<script>
// ── Loading screen counter + dismiss ──────────────────────────────
(function() {
  var pctEl = document.getElementById('loader-pct');
  var progress = 0;
  var interval = setInterval(function() {
    var inc = Math.random() > 0.8 ? 0.5 : 1.8;
    progress = Math.min(progress + inc, 100);
    if (pctEl) pctEl.textContent = Math.floor(progress) + '%';
    if (progress >= 100) clearInterval(interval);
  }, 80);

  // Parallax on mouse
  document.addEventListener('mousemove', function(e) {
    var body = document.querySelector('.loader-body');
    if (!body) return;
    var x = (e.clientX - window.innerWidth  / 2) / 60;
    var y = (e.clientY - window.innerHeight / 2) / 60;
    body.style.transform = 'translate(' + x + 'px,' + y + 'px)';
  });

  // Expose dismiss so React can call it
  window.sabnahisLoaderDone = function() {
    var el = document.getElementById('sabnahis-loader');
    if (el) { el.classList.add('fade-out'); setTimeout(function(){ el.remove(); }, 700); }
  };

  // Expose show — re-creates the loader if already removed, or re-shows it
  window.sabnahisLoaderShow = function(onComplete) {
    var el = document.getElementById('sabnahis-loader');
    if (!el) {
      // Rebuild loader element
      el = document.createElement('div');
      el.id = 'sabnahis-loader';
      el.innerHTML = [
        '<div class="loader-grid-overlay"></div>',
        '<div class="loader-corner loader-corner--tl"><span class="loader-corner-h" style="margin-bottom:12px;display:block;"></span><span class="loader-corner-v"></span></div>',
        '<div class="loader-corner loader-corner--tr"><span class="loader-corner-h" style="margin-bottom:12px;display:block;margin-left:auto;"></span><span class="loader-corner-v" style="margin-left:auto;"></span></div>',
        '<div class="loader-corner loader-corner--bl"><span class="loader-corner-v"></span><span class="loader-corner-h" style="margin-top:12px;display:block;"></span></div>',
        '<div class="loader-corner loader-corner--br"><span class="loader-corner-v" style="margin-left:auto;"></span><span class="loader-corner-h" style="margin-top:12px;display:block;margin-left:auto;"></span></div>',
        '<div class="loader-body">',
          '<div class="loader-icon-wrap">',
            '<div class="loader-icon-glow"></div>',
            '<div class="loader-icon-box" style="flex-direction:row;gap:10px;width:auto;padding:0 16px;">',
              '<img src="LOGO.png" alt="Logo 1" style="width:48px;height:48px;object-fit:contain;border-radius:6px;"/>',
              '<img src="LOGO2.png" alt="Logo 2" style="width:48px;height:48px;object-fit:contain;border-radius:6px;"/>',
            '</div>',
          '</div>',
          '<div class="loader-brand">',
            '<div class="loader-brand-name">SABNAHIS STE</div>',
            '<div class="loader-brand-sub">Advanced Research Environment</div>',
          '</div>',
          '<div class="loader-progress-wrap">',
            '<div class="loader-track"><div class="loader-bar"></div></div>',
            '<div class="loader-meta">',
              '<span class="loader-meta-left"><span class="loader-meta-dot"></span>Authenticating…</span>',
              '<span class="loader-meta-pct" id="loader-pct">0%</span>',
            '</div>',
          '</div>',
        '</div>',
        '<div class="loader-footer">',
          '<div class="loader-tagline">Securing the Future of STEM Research</div>',
        '</div>',
      ].join('');
      document.body.appendChild(el);
    } else {
      el.classList.remove('fade-out');
      // Reset progress text
      var p = el.querySelector('#loader-pct');
      if (p) p.textContent = '0%';
      // Update status label
      var lbl = el.querySelector('.loader-meta-left');
      if (lbl) lbl.innerHTML = '<span class="loader-meta-dot"></span>Authenticating…';
    }

    // Animate progress to 100% over ~1.8s then call onComplete
    var pct = el.querySelector('#loader-pct');
    var prog = 0;
    var iv = setInterval(function() {
      var inc = Math.random() > 0.7 ? 0.8 : 2.2;
      prog = Math.min(prog + inc, 100);
      if (pct) pct.textContent = Math.floor(prog) + '%';
      if (prog >= 100) {
        clearInterval(iv);
        setTimeout(function() {
          el.classList.add('fade-out');
          setTimeout(function() { if (onComplete) onComplete(); }, 650);
        }, 300);
      }
    }, 40);
  };
})();
</script>
</body>
