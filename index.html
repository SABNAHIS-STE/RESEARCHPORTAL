const QUICK_PROMPTS = {
  general:   ['What is the scientific method?','Define hypothesis vs theory','Show me all studies in the repository','What research gaps exist?'],
  find:      ['Find studies about robotics','Show all Environmental Science studies','Studies from the most recent year','Research about algorithms or AI'],
  cite:      ['APA citation for all studies','Cite the most recent study','Generate a full reference list','How do I cite a journal article in APA?'],
  define:    ['Define algorithm','What is natural selection?','Explain the water cycle','What is a control variable?'],
  compare:   ['Compare the two most recent studies','Difference between hypothesis and theory','Compare Biology and Chemistry studies'],
  summarize: ['Summarize all studies','Key findings from the repository','What are the main research themes?'],
  suggest:   ['What topics are missing from the repository?','Suggest interdisciplinary research ideas','Ideas for follow-up studies','Novel research directions'],
};

// ══════════════════════════════════════════════════════════════════
//  CHAT PAGE — Upgraded Research Copilot
// ══════════════════════════════════════════════════════════════════
function ChatPage({ currentUser }) {
  const [studies,setStudies]=useState([]);
  const [msgs,setMsgs]=useState([]);
  const [input,setInput]=useState('');
  const [loading,setLoading]=useState(false);
  const [history,setHistory]=useState([]);
  const [mode,setMode]=useState('general');
  const [studiesLoaded,setStudiesLoaded]=useState(false);
  const [repoStats,setRepoStats]=useState(null);
  const [savedCites,setSavedCites]=useState([]);
  const [showSaved,setShowSaved]=useState(false);
  const bottomRef=useRef();
  const inputRef=useRef();
  const msgsRef=useRef();

  useEffect(()=>{
    API.getAllStudies().then(s=>{
      setStudies(s);
      setStudiesLoaded(true);
      const byCat={};
      s.forEach(st=>(st.categories||['Uncategorized']).forEach(c=>{byCat[c]=(byCat[c]||0)+1;}));
      const gaps = detectResearchGaps(s);
      setRepoStats({
        total:s.length,
        categories:Object.entries(byCat).sort((a,b)=>b[1]-a[1]),
        views:s.reduce((a,x)=>a+(x.viewCount||0),0),
        recent:s[0]?.title||'—',
        gaps
      });
      const gapHint = gaps.length > 0 ? `\n\n🔭 *Quick insight: I've spotted **${gaps.length} research gap${gaps.length>1?'s':''}** in the repository — topics with no studies yet. Ask me "What research gaps exist?" to learn more.*` : '';
      setMsgs([{
        id:1,role:'bot',citations:[],time:now(),source:'local',
        text:`Hello! 👋 I'm your **SABNAHIS STE Research Assistant** — powered by Claude AI.

I function as a **smart research copilot**, not just a keyword search. I can:

**🔍 Repository Intelligence:**
• Find studies and explain *why* they're relevant
• Detect research gaps and unexplored topics
• Make connections between studies you might miss

**📚 Academic Knowledge:**
• Define any STEM concept with examples
• Generate APA 7th edition citations
• Compare, summarize, and analyze research

**💡 Research Guidance:**
• Suggest novel research directions
• Identify interdisciplinary opportunities
• Generate follow-up research questions

I have **${s.length}** ${s.length===1?'study':'studies'} loaded. Use the **mode buttons** to focus, or just ask me anything!${gapHint}`
      }]);
    });
  },[]);

  useEffect(()=>{ bottomRef.current?.scrollIntoView({behavior:'smooth'}); },[msgs]);

  // Auto-resize textarea
  useEffect(()=>{
    const ta = inputRef.current;
    if (!ta) return;
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 130)+'px';
  },[input]);

  const send=useCallback(async(text)=>{
    const q=(text||input).trim();
    if(!q||loading)return;
    setInput('');
    const userMsg={id:Date.now(),role:'user',text:q,citations:[],time:now()};
    setMsgs(m=>[...m,userMsg]);
    setLoading(true);
    try{
      const r=await callAI(q,history,studies,mode);
      setMsgs(m=>[...m,{id:Date.now()+1,role:'bot',text:r.text,citations:r.citations||[],source:r.source,time:now()}]);
      setHistory(h=>[...h,{role:'user',content:q},{role:'assistant',content:r.text}]);
    }catch{
      setMsgs(m=>[...m,{id:Date.now()+1,role:'bot',text:'Sorry, something went wrong. Please try again.',citations:[],time:now()}]);
    }
    setLoading(false);
    setTimeout(()=>inputRef.current?.focus(),80);
  },[input,loading,history,studies,mode]);

  const copyMsg=text=>navigator.clipboard?.writeText(text).then(()=>toast.ok('Copied to clipboard!'));

  const clearChat=()=>{
    setMsgs([{id:Date.now(),role:'bot',citations:[],time:now(),source:'local',text:`Chat cleared. **${studies.length}** studies loaded. Mode: **${AI_MODES[mode]?.label}**.\n\nWhat would you like to explore?`}]);
    setHistory([]);
  };

  const exportChat=()=>{
    const text=msgs.map(m=>`[${m.time}] ${m.role==='bot'?'AI':'You'}:\n${m.text}`).join('\n\n---\n\n');
    const blob=new Blob([text],{type:'text/plain'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`sabnahis-chat-${new Date().toISOString().split('T')[0]}.txt`;
    a.click();
    toast.ok('Chat exported!');
  };

  const saveCitation=study=>{
    const apa=generateAPA(study);
    if(savedCites.includes(apa)){toast.info('Already saved!');return;}
    setSavedCites(c=>[...c,apa]);
    toast.ok('Citation saved!');
  };

  const exportCitations=()=>{
    if(!savedCites.length){toast.err('No saved citations yet.');return;}
    const text='References\n\n'+savedCites.join('\n');
    const blob=new Blob([text],{type:'text/plain'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`references-${new Date().toISOString().split('T')[0]}.txt`;
    a.click();
    toast.ok('Citations exported!');
  };

  const handleKeyDown = e => {
    if (e.key==='Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  };

  return (
    <div>
      {/* Header */}
      <div className="page-hd">
        <div className="page-hd-left">
          <h2 style={{fontFamily:'var(--font-display)',fontSize:'var(--text-2xl)',fontWeight:600}}>AI Research Assistant</h2>
          <p className="muted" style={{fontSize:'var(--text-xs)'}}>Claude AI · {studies.length} studies loaded · APA citations</p>
        </div>
        <div style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap'}}>
          <span style={{background:'var(--green-light)',color:'var(--green)',fontSize:'0.7rem',fontWeight:500,padding:'4px 9px',borderRadius:99,display:'flex',alignItems:'center',gap:4}}>
            <span style={{width:6,height:6,borderRadius:'50%',background:'currentColor',flexShrink:0}}/>Claude AI
          </span>
          {savedCites.length>0&&<button className="chat-export-btn" onClick={()=>setShowSaved(s=>!s)}>📝 {savedCites.length} saved</button>}
          <button className="chat-export-btn" onClick={exportChat}>⬇ Export</button>
          <button className="btn btn-ol btn-sm" onClick={clearChat}>Clear</button>
        </div>
      </div>

      {/* Saved citations panel */}
      {showSaved&&savedCites.length>0&&(
        <div className="card" style={{marginBottom:14,borderLeft:'3px solid var(--gold)'}}>
          <div className="card-hd" style={{marginBottom:10}}>
            <span className="card-title" style={{fontSize:'0.875rem'}}>📝 Saved Citations ({savedCites.length})</span>
            <div style={{display:'flex',gap:6}}>
              <button className="btn btn-grn btn-sm" onClick={exportCitations}>⬇ Export .txt</button>
              <button className="btn btn-ol btn-sm" onClick={()=>{setSavedCites([]);setShowSaved(false);}}>Clear all</button>
            </div>
          </div>
          {savedCites.map((c,i)=>(
            <div key={i} style={{fontFamily:'var(--font-mono)',fontSize:'0.73rem',color:'var(--ink-3)',padding:'6px 10px',background:'var(--surface)',borderRadius:6,marginBottom:5,borderLeft:'2px solid var(--gold)',display:'flex',alignItems:'flex-start',gap:8}}>
              <span style={{flex:1,lineHeight:1.5}}>{c}</span>
              <button style={{background:'none',border:'none',cursor:'pointer',color:'var(--muted)',flexShrink:0,fontSize:'0.75rem',minWidth:36,minHeight:28,padding:'2px 6px'}} onClick={()=>{navigator.clipboard?.writeText(c);toast.ok('Copied!');}}>Copy</button>
            </div>
          ))}
        </div>
      )}

      {/* Research gap alert */}
      {repoStats?.gaps?.length>0&&msgs.length<=1&&(
        <div className="gap-alert" style={{marginBottom:14}}>
          <span style={{fontSize:'1rem',flexShrink:0}}>📌</span>
          <div>
            <strong>Research Gap Detected:</strong> No studies cover <strong>{repoStats.gaps[0]}</strong>{repoStats.gaps[1]?<> or <strong>{repoStats.gaps[1]}</strong></>:''} yet.
            <button style={{background:'none',border:'none',color:'var(--gold)',cursor:'pointer',fontSize:'0.73rem',fontWeight:600,marginLeft:6,textDecoration:'underline'}} onClick={()=>send('What research topics are missing from the repository?')}>Explore →</button>
          </div>
        </div>
      )}

      <div className="chat-layout">
        {/* Main chat column */}
        <div className="chat-main">
          {/* Mode pills */}
          <div className="mode-pills" role="tablist" aria-label="AI modes">
            {Object.entries(AI_MODES).map(([key,m])=>(
              <button key={key} role="tab" aria-selected={mode===key}
                className={`mode-pill${mode===key?' on':''}`}
                onClick={()=>setMode(key)}>
                {m.icon} {m.label}
              </button>
            ))}
          </div>

          {/* Messages */}
          <div className="chat-msgs" ref={msgsRef} role="log" aria-live="polite" aria-label="Chat messages">
            {!studiesLoaded?(
              <div style={{textAlign:'center',padding:'50px',color:'var(--muted)'}}>
                <span className="spin spin-gold" style={{width:28,height:28,border:'3px solid rgba(201,162,39,0.25)',borderTopColor:'var(--gold)',display:'inline-block',marginBottom:12}}/>
                <p>Loading AI assistant…</p>
              </div>
            ):msgs.map(msg=>(
              <div key={msg.id} className={`cm ${msg.role}`} role={msg.role==='bot'?'article':'none'}>
                <div className={`cm-av ${msg.role}`} aria-hidden="true">
                  {msg.role==='bot'?'🤖':initials(currentUser.name)}
                </div>
                <div className="cm-body">
                  <div className={`cm-bub ${msg.role}`}>
                    {msg.role==='bot'?<MD text={msg.text}/>:msg.text}
                    {msg.citations?.length>0&&(
                      <div className="chat-refs">
                        <div className="chat-ref-lbl">📚 Referenced Studies ({msg.citations.length})</div>
                        {msg.citations.map((s,i)=>(
                          <div key={i} className="chat-ref">
                            <span style={{flex:1,cursor:'pointer'}} title="Click to copy APA" onClick={()=>{navigator.clipboard?.writeText(generateAPA(s));toast.ok('APA citation copied!');}}>
                              [{i+1}] {generateAPA(s)}
                            </span>
                            <button style={{background:'none',border:'none',cursor:'pointer',color:'var(--teal)',fontSize:'0.65rem',fontWeight:600,flexShrink:0,whiteSpace:'nowrap',minWidth:36,minHeight:24,padding:'2px 4px'}} onClick={()=>saveCitation(s)}>Save</button>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                  <div className="cm-meta">
                    <span>{msg.time}</span>
                    {msg.source&&<span className={`cm-src ${msg.source}`}>{msg.source==='claude'?'⚡ Claude AI':'🔧 Local'}</span>}
                    {msg.role==='bot'&&(
                      <button style={{background:'none',border:'none',cursor:'pointer',color:'var(--muted)',padding:'0 4px',borderRadius:4,minWidth:28,minHeight:24,display:'flex',alignItems:'center'}} onClick={()=>copyMsg(msg.text)} title="Copy response" aria-label="Copy response">
                        <Ico.copy/>
                      </button>
                    )}
                  </div>
                </div>
              </div>
            ))}
            {loading&&(
              <div className="cm bot" aria-label="AI is thinking">
                <div className="cm-av bot" aria-hidden="true">🤖</div>
                <div className="cm-body">
                  <div className="cm-bub bot"><div className="typing"><div className="dot"/><div className="dot"/><div className="dot"/></div></div>
                  <div className="cm-meta"><span>Thinking…</span></div>
                </div>
              </div>
            )}
            <div ref={bottomRef} style={{height:1}}/>
          </div>

          {/* Input area */}
          <div className="chat-input-area">
            <div className="chat-input-row">
              <textarea
                ref={inputRef}
                className="chat-in"
                placeholder={`${AI_MODES[mode]?.icon} ${AI_MODES[mode]?.desc}…`}
                value={input}
                onChange={e=>setInput(e.target.value)}
                onKeyDown={handleKeyDown}
                rows={1}
                maxLength={1200}
                aria-label="Type your message"
                aria-multiline="true"
              />
              <button
                className="chat-send-btn"
                onClick={()=>send()}
                disabled={loading||!input.trim()}
                aria-label="Send message">
                {loading?<span className="spin" style={{width:16,height:16}}/>:<Ico.send/>}
              </button>
            </div>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginTop:6,gap:8}}>
              <div className="chat-actions">
                {(QUICK_PROMPTS[mode]||[]).slice(0,3).map(q=>(
                  <button key={q} className="chat-action-btn" onClick={()=>send(q)}>
                    <Ico.spark/>{q}
                  </button>
                ))}
              </div>
              {input.length>0&&<span style={{fontSize:'0.65rem',color:'var(--muted)',flexShrink:0}}>{input.length}/1200</span>}
            </div>
          </div>
        </div>

        {/* Sidebar */}
        <div className="chat-sidebar">
          {/* Mode info */}
          <div className="chat-panel">
            <div className="chat-panel-hd">🎯 Mode</div>
            <div className="chat-panel-body" style={{padding:'12px 14px'}}>
              <div style={{fontSize:'1.2rem',marginBottom:4}}>{AI_MODES[mode]?.icon}</div>
              <div style={{fontWeight:600,fontSize:'0.875rem',marginBottom:4}}>{AI_MODES[mode]?.label}</div>
              <div style={{fontSize:'0.78rem',color:'var(--muted)'}}>{AI_MODES[mode]?.desc}</div>
            </div>
          </div>

          {/* Repository stats */}
          {repoStats&&(
            <div className="chat-panel">
              <div className="chat-panel-hd">📊 Repository</div>
              <div className="chat-panel-body">
                <div className="chat-stat-row"><span>Total Studies</span><span className="chat-stat-val">{repoStats.total}</span></div>
                <div className="chat-stat-row"><span>Total Views</span><span className="chat-stat-val">{repoStats.views}</span></div>
                <div className="chat-stat-row"><span>Categories</span><span className="chat-stat-val">{repoStats.categories.length}</span></div>
                {repoStats.categories.slice(0,5).map(([c,n])=>(
                  <div key={c} className="chat-stat-row" style={{fontSize:'0.72rem'}}>
                    <span style={{color:'var(--slate)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:'60%'}}>{c}</span>
                    <span style={{color:'var(--muted)',flexShrink:0}}>{n}</span>
                  </div>
                ))}
                {repoStats.gaps?.length>0&&(
                  <div style={{marginTop:8,padding:'6px 8px',background:'#fff8e6',borderRadius:6,fontSize:'0.7rem',color:'#8a6a00',borderLeft:'2px solid var(--gold)'}}>
                    📌 {repoStats.gaps.length} gap{repoStats.gaps.length>1?'s':''} detected
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Suggested questions */}
          <div className="chat-panel">
            <div className="chat-panel-hd"><Ico.bulb/> Suggested Questions</div>
            <div className="chat-panel-body" style={{padding:'8px'}}>
              {(QUICK_PROMPTS[mode]||[]).map(q=>(
                <button key={q} className="sugg-chip" onClick={()=>send(q)}>{q}</button>
              ))}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

      API.getStudies({perPage:1})

        <div className="stat blue"><div className="stat-lbl">Downloads</div><div className="stat-val">{myStudies.reduce((a,s)=>a+(s.downloadCount||0),0)}</div><div className="stat-sub">Total</div></div>
        <div className="stat slate"><div className="stat-lbl">Repository</div><div className="stat-val">{allTotal}</div><div className="stat-sub">Total studies</div></div>
      </div>
      <div className="card">
        <div className="card-hd"><span className="card-title">My Uploaded Studies</span><button className="btn btn-gold btn-sm" onClick={()=>setShowUpload(true)}><Ico.up/> Upload New</button></div>
        {loading?(
          <div style={{textAlign:'center',padding:'30px',color:'var(--muted)'}}>Loading…</div>
        ):myStudies.length===0?(
          <div className="empty" style={{padding:'36px 20px'}}><div className="empty-ico">📄</div><h3>No studies yet</h3><p>Upload your first research study.</p><button className="btn btn-ink mt12" onClick={()=>setShowUpload(true)}>Upload Study</button></div>
        ):(
          <div className="tw"><table>
            <thead><tr><th>Title</th><th>Categories</th><th>Year</th><th>Views</th><th>Downloads</th><th>Uploaded</th></tr></thead>
            <tbody>{myStudies.map(s=><tr key={s.id}>
              <td style={{maxWidth:230}}><div style={{fontWeight:500,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{s.title}</div></td>
              <td><div style={{display:'flex',gap:3,flexWrap:'wrap'}}>{(s.categories||[]).map(c=><span key={c} className="badge" style={{background:'var(--gold-bg)',color:'var(--gold)',fontSize:'0.66rem'}}>{c}</span>)}</div></td>
              <td>{s.year}</td><td>{s.viewCount||0}</td><td>{s.downloadCount||0}</td><td style={{whiteSpace:'nowrap'}}>{fmtDate(s.createdAt)}</td>
            </tr>)}</tbody>
          </table></div>
        )}
      </div>
      {showUpload&&<UploadModal onClose={()=>setShowUpload(false)} currentUser={currentUser} cats={cats} onUpload={()=>{load();setShowUpload(false);}}/>}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════
function AdminStudies() {

        :<div className="tw"><table>
          <thead><tr><th>Title</th><th>Authors</th><th>Categories</th><th>Uploader</th><th>Views</th><th>Dls</th><th>Date</th><th></th></tr></thead>
          <tbody>{studies.map(s=><tr key={s.id}>
            <td style={{maxWidth:190}}><div style={{fontWeight:500,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{s.title}</div></td>
            <td style={{fontSize:'0.78rem'}}>{(s.authors||[]).join(', ')}</td>
            <td><div style={{display:'flex',gap:3,flexWrap:'wrap'}}>{(s.categories||[]).map(c=><span key={c} className="badge" style={{background:'var(--gold-bg)',color:'var(--gold)',fontSize:'0.63rem'}}>{c}</span>)}</div></td>

            <td>{s.viewCount||0}</td><td>{s.downloadCount||0}</td>
            <td style={{whiteSpace:'nowrap'}}>{fmtDate(s.createdAt)}</td>
            <td><button className="btn btn-red btn-sm" onClick={()=>del(s.id)} title="Delete study"><Ico.trash/></button></td>
          </tr>)}</tbody>
        </table></div>}
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════
//  ADMIN CATEGORIES
// ══════════════════════════════════════════════════════════════════
function AdminCats() {
  const [cats,setCats]=useState([]);
  const [newCat,setNewCat]=useState('');
  const [editIdx,setEditIdx]=useState(null);
  const [editVal,setEditVal]=useState('');
  const [loading,setLoading]=useState(true);

  useEffect(()=>{API.getCategories().then(c=>{setCats(c);setLoading(false);});},[]);

  const save=async()=>{await API.setCategories(cats);toast.ok('Categories saved!');};
  const add=()=>{const t=newCat.trim();if(!t)return;if(cats.includes(t)){toast.err('Already exists.');return;}setCats([...cats,t]);setNewCat('');};
  const rem=i=>{if(cats.length<=1){toast.err('Need at least one category.');return;}setCats(cats.filter((_,idx)=>idx!==i));};
  const startEdit=i=>{setEditIdx(i);setEditVal(cats[i]);};
  const saveEdit=()=>{if(!editVal.trim())return;setCats(cats.map((c,i)=>i===editIdx?editVal.trim():c));setEditIdx(null);};

  if(loading)return <div style={{textAlign:'center',padding:'40px',color:'var(--muted)'}}>Loading…</div>;

  return (
    <div>
      <div style={{marginBottom:18}}><h2 className="sec-title" style={{marginBottom:1}}>Manage Categories</h2><p className="muted">Students can select 1–2 per upload.</p></div>
      <div className="card" style={{marginBottom:18}}>
        <div className="card-hd"><span className="card-title">Current Categories ({cats.length})</span></div>
        {cats.map((cat,idx)=>(
          <div key={idx} className="cm-item">
            {editIdx===idx?(
              <><input className="cm-in" value={editVal} onChange={e=>setEditVal(e.target.value)} onKeyDown={e=>e.key==='Enter'&&saveEdit()} autoFocus aria-label="Edit category name"/>
              <button className="btn btn-grn btn-sm" onClick={saveEdit}><Ico.chk/> Save</button>
              <button className="btn btn-ol btn-sm" onClick={()=>setEditIdx(null)}>Cancel</button></>
            ):(
              <><span className="cm-name">{cat}</span>
              <button className="btn btn-ol btn-sm" onClick={()=>startEdit(idx)} aria-label={`Edit ${cat}`}><Ico.edit/> Edit</button>
              <button className="btn btn-red btn-sm" onClick={()=>rem(idx)} aria-label={`Delete ${cat}`}><Ico.trash/></button></>
            )}
          </div>
        ))}
        <div style={{display:'flex',gap:9,marginTop:14,flexWrap:'wrap'}}>
          <input placeholder="Add new category…" value={newCat} onChange={e=>setNewCat(e.target.value)} onKeyDown={e=>e.key==='Enter'&&add()} style={{flex:1,minWidth:160}} aria-label="New category name"/>
          <button className="btn btn-ink" onClick={add}><Ico.plus/> Add</button>
        </div>
      </div>
      <div style={{display:'flex',justifyContent:'flex-end'}}><button className="btn btn-gold" onClick={save}>Save All Changes</button></div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════
//  SIDEBAR
// ══════════════════════════════════════════════════════════════════
const Sidebar = memo(function Sidebar({ currentUser, activeTab, setActiveTab, onLogout, pendingCount=0, isOpen, onClose, theme, toggleTheme }) {
  const isAdmin=currentUser.role==='admin';
  const adminNav=[
    {id:'dashboard',label:'Dashboard',icon:<Ico.home/>},
    {id:'users',label:'Users',icon:<Ico.users/>,badge:pendingCount||null},
    {id:'studies-admin',label:'All Studies',icon:<Ico.book/>},
    {id:'categories',label:'Categories',icon:<Ico.tag/>},
    {id:'repository',label:'Repository',icon:<Ico.search/>},
    {id:'chatbot',label:'AI Assistant',icon:<Ico.bot/>},
  ];
  const studentNav=[
    {id:'dashboard',label:'Dashboard',icon:<Ico.home/>},
    {id:'repository',label:'Browse Studies',icon:<Ico.book/>},
    {id:'chatbot',label:'AI Assistant',icon:<Ico.bot/>},
  ];
  const nav = isAdmin ? adminNav : studentNav;

  return (
    <>
      <div className={`mob-overlay${isOpen?' show':''}`} onClick={onClose} aria-hidden="true"/>
      <nav className={`sidebar${isOpen?' open':''}`} aria-label="Main navigation">
        <div className="sidebar-logo">
          <div style={{display:'flex',alignItems:'center',gap:10,flex:1,minWidth:0}}>
            <SchoolLogoZone context="sidebar"/>
            <div>
              <h1>SABNAHIS <span>STE Research Portal</span></h1>
              <p>Institutional Research Repository</p>
            </div>
          </div>
          <button className="sidebar-close-btn" onClick={onClose} aria-label="Close menu"><Ico.X/></button>
        </div>
        <div className="sidebar-nav">
          <div className="nav-label" role="heading" aria-level="3">{isAdmin?'Administration':'Navigation'}</div>
          {nav.map(item=>(
            <button key={item.id}
              className={`nav-item${activeTab===item.id?' active':''}`}
              onClick={()=>{setActiveTab(item.id);onClose?.();}}
              aria-current={activeTab===item.id?'page':undefined}>
              {item.icon}{item.label}
              {item.badge&&<span className="nav-badge" aria-label={`${item.badge} pending`}>{item.badge}</span>}
            </button>
          ))}
        </div>
        <div className="sidebar-footer">
          <div className="user-chip">
            <div className="avatar" aria-hidden="true">{initials(currentUser.name)}</div>
            <div className="user-info">
              <strong title={currentUser.name}>{currentUser.name}</strong>
              <span>{currentUser.role}</span>
            </div>
          </div>
          <div style={{display:'flex',gap:5,marginTop:8}}>
            <button className="theme-toggle" style={{flex:1,justifyContent:'center',...(theme==='light'?{background:'rgba(201,162,39,0.22)',color:'var(--gold-light)',border:'1px solid rgba(201,162,39,0.4)'}:{})}} onClick={()=>theme!=='light'&&toggleTheme()} aria-pressed={theme==='light'}>☀ Light</button>
            <button className="theme-toggle" style={{flex:1,justifyContent:'center',...(theme==='dark'?{background:'rgba(201,162,39,0.22)',color:'var(--gold-light)',border:'1px solid rgba(201,162,39,0.4)'}:{})}} onClick={()=>theme!=='dark'&&toggleTheme()} aria-pressed={theme==='dark'}>☾ Dark</button>
          </div>
          <button
            style={{width:'100%',textAlign:'center',marginTop:6,padding:'9px',borderRadius:6,background:'none',border:'none',color:'var(--sidebar-text-sub)',cursor:'pointer',fontSize:'0.78rem',transition:'color .2s',minHeight:36}}
            onMouseEnter={e=>e.target.style.color='var(--sidebar-text-strong)'}
            onMouseLeave={e=>e.target.style.color='var(--sidebar-text-sub)'}
            onClick={onLogout}>
            Sign Out
          </button>
        </div>
      </nav>
    </>
  );
});

// ══════════════════════════════════════════════════════════════════
//  ROOT APP
// ══════════════════════════════════════════════════════════════════
function App() {
  const [currentUser,setCurrentUser]=useState(null);
  const [authChecked,setAuthChecked]=useState(false);
  const [activeTab,setActiveTab]=useState('dashboard');
  const [pendingCount,setPendingCount]=useState(0);
  const [initError,setInitError]=useState('');
  const [sidebarOpen,setSidebarOpen]=useState(false);
  const [theme,toggleTheme]=useTheme();

  useEffect(()=>{
    let unsub=()=>{};
    try{
      unsub=auth.onAuthStateChanged(async fbUser=>{
        if(fbUser){
          try{
            const profile=await API.getProfile(fbUser.uid);
            if(profile&&(profile.status==='approved'||profile.role==='admin')){
              setCurrentUser(profile);
              if(profile.role==='admin'){
                API.getUsers({role:'student',status:'pending'}).then(p=>setPendingCount(p.length)).catch(()=>{});
              }
            } else {
              await auth.signOut().catch(()=>{});
            }
          }catch(e){
            await auth.signOut().catch(()=>{});
          }
        }
        setAuthChecked(true);
      },err=>{
        setInitError(err.message);
        setAuthChecked(true);
      });
    }catch(e){
      setInitError(e.message);
      setAuthChecked(true);
    }
    return ()=>{try{unsub();}catch{}};
  },[]);

  const titles={dashboard:'Dashboard',users:'User Management','studies-admin':'Manage Studies',categories:'Manage Categories',repository:'Research Repository',chatbot:'AI Research Assistant'};

  if(!authChecked){
    return (
      <div style={{minHeight:'100vh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',background:'var(--ink)',gap:16}}>
        <div style={{fontFamily:'var(--font-display)',fontSize:'1.3rem',color:'var(--gold)',letterSpacing:'-0.5px'}}>SABNAHIS STE Research Portal</div>
        <span className="spin" style={{width:28,height:28,border:'3px solid rgba(201,162,39,0.25)',borderTopColor:'var(--gold)'}}/>
        <p style={{color:'rgba(255,255,255,0.35)',fontSize:'0.8rem'}}>Connecting to database…</p>
      </div>
    );
  }

  if(initError){
    return (
      <div style={{minHeight:'100vh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',background:'var(--ink)',gap:14,padding:24}}>
        <div style={{fontSize:'2rem'}}>⚠️</div>
        <div style={{fontFamily:'var(--font-display)',fontSize:'1.1rem',color:'#fff'}}>Connection Error</div>
        <div style={{background:'rgba(255,255,255,0.07)',borderRadius:8,padding:'12px 18px',maxWidth:480,color:'rgba(255,255,255,0.6)',fontSize:'0.85rem',fontFamily:'var(--font-mono)',wordBreak:'break-all'}}>{initError}</div>
        <p style={{color:'rgba(255,255,255,0.4)',fontSize:'0.82rem',textAlign:'center',maxWidth:400}}>Check that your Firebase project is active and the domain is authorized in Firebase Console → Authentication → Settings → Authorized domains.</p>
        <button className="btn btn-gold" onClick={()=>window.location.reload()}>Reload Page</button>
      </div>
    );
  }

  if(!currentUser){
    return (
      <ToastProvider>
        <AuthPage onLogin={user=>{
          setCurrentUser(user);
          if(user.role==='admin') API.getUsers({role:'student',status:'pending'}).then(p=>setPendingCount(p.length)).catch(()=>{});
        }}/>
      </ToastProvider>
    );
  }

  const isAdmin=currentUser.role==='admin';

  const renderPage=()=>{
    switch(activeTab){
      case 'dashboard':     return isAdmin?<AdminDash/>:<StudentDash currentUser={currentUser}/>;
      case 'users':         return isAdmin?<AdminUsers/>:null;
      case 'studies-admin': return isAdmin?<AdminStudies/>:null;
      case 'categories':    return isAdmin?<AdminCats/>:null;
      case 'repository':    return <StudiesPage currentUser={currentUser}/>;
      case 'chatbot':       return <ChatPage currentUser={currentUser}/>;
      default:              return null;
    }
  };

  const mobNav = isAdmin
    ? [{id:'dashboard',label:'Home',icon:<Ico.home/>},{id:'repository',label:'Studies',icon:<Ico.book/>},{id:'chatbot',label:'AI Chat',icon:<Ico.bot/>},{id:'users',label:'Users',icon:<Ico.users/>}]
    : [{id:'dashboard',label:'Home',icon:<Ico.home/>},{id:'repository',label:'Studies',icon:<Ico.book/>},{id:'chatbot',label:'AI Chat',icon:<Ico.bot/>}];

  return (
    <ToastProvider>
      <div className="app-shell">
        <Sidebar
          currentUser={currentUser}
          activeTab={activeTab}
          setActiveTab={setActiveTab}
          pendingCount={pendingCount}
          isOpen={sidebarOpen}
          onClose={()=>setSidebarOpen(false)}
          onLogout={async()=>{await API.logout();setCurrentUser(null);setActiveTab('dashboard');}}
          theme={theme}
          toggleTheme={toggleTheme}
        />
        <div className="main-content">
          {/* Desktop topbar */}
          <div className="topbar">
            <span className="topbar-title">{titles[activeTab]||'Dashboard'}</span>
            <span className={`badge${isAdmin?' badge-admin':' badge-appr'}`}>{isAdmin?'⚙ Admin':'🎓 Student'}</span>
            <div style={{display:'flex',gap:4,marginLeft:8}}>
              <button className="topbar-theme-toggle" onClick={()=>theme!=='light'&&toggleTheme()} style={theme==='light'?{borderColor:'var(--gold)',color:'var(--gold)',background:'var(--gold-bg)',fontWeight:600}:{}} aria-pressed={theme==='light'}>☀ Light</button>
              <button className="topbar-theme-toggle" onClick={()=>theme!=='dark'&&toggleTheme()} style={theme==='dark'?{borderColor:'var(--gold)',color:'var(--gold)',background:'var(--gold-bg)',fontWeight:600}:{}} aria-pressed={theme==='dark'}>☾ Dark</button>
            </div>
          </div>

          {/* Mobile header */}
          <div className="mob-header" role="banner">
            <button className="mob-menu-btn" onClick={()=>setSidebarOpen(o=>!o)} aria-label="Open menu" aria-expanded={sidebarOpen}>
              <Ico.menu/>
            </button>
            <span className="mob-header-title">SABNAHIS STE</span>
            <div style={{display:'flex',gap:4,alignItems:'center'}}>
              <button className="theme-toggle" onClick={()=>theme!=='light'&&toggleTheme()} style={theme==='light'?{background:'rgba(201,162,39,0.25)',color:'var(--gold-light)',border:'1px solid rgba(201,162,39,0.4)'}:{}} aria-pressed={theme==='light'}>☀</button>
              <button className="theme-toggle" onClick={()=>theme!=='dark'&&toggleTheme()} style={theme==='dark'?{background:'rgba(201,162,39,0.25)',color:'var(--gold-light)',border:'1px solid rgba(201,162,39,0.4)'}:{}} aria-pressed={theme==='dark'}>☾</button>
            </div>
          </div>

          <main className="page">{renderPage()}</main>
        </div>

        {/* Mobile bottom navigation */}
        <nav className="mob-nav" aria-label="Mobile navigation">
          <div className="mob-nav-inner">
            {mobNav.map(item=>(
              <button key={item.id}
                className={`mob-nav-btn${activeTab===item.id?' active':''}`}
                onClick={()=>setActiveTab(item.id)}
                aria-current={activeTab===item.id?'page':undefined}
                aria-label={item.label}>
                {item.icon}<span>{item.label}</span>
              </button>
            ))}
            {isAdmin&&(
              <button
                className={`mob-nav-btn${activeTab==='studies-admin'?' active':''}`}
                onClick={()=>setActiveTab('studies-admin')}
                aria-current={activeTab==='studies-admin'?'page':undefined}
                aria-label="Manage studies">
                <Ico.book/><span>Manage</span>
              </button>
            )}
            <button
              className="mob-nav-btn"
              onClick={()=>setSidebarOpen(o=>!o)}
              aria-label="More options"
              aria-expanded={sidebarOpen}>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" width="20" height="20"><circle cx="12" cy="5" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="19" r="1.5" fill="currentColor"/></svg>
              <span>More</span>
            </button>
          </div>
        </nav>
      </div>
    </ToastProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
