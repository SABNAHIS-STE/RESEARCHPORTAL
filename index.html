function StudyCard({ study, onOpen }) {
  const CLAMP_WORDS = 30;
  const words = (study.abstract||'').split(/\s+/).filter(Boolean);
  const isLong = words.length > CLAMP_WORDS;
  const [expanded, setExpanded] = useState(false);
  const preview = isLong ? words.slice(0, CLAMP_WORDS).join(' ') + '…' : study.abstract;

  return (
    <div className="sc"
      onClick={onOpen}
      role="article" tabIndex={0}
      onKeyDown={e=>e.key==='Enter'&&onOpen()}
      aria-label={`Study: ${study.title}`}>
      <div className="sc-cats">{(study.categories||[]).map(c=><span key={c} className="sc-cat">{c}</span>)}</div>
      <h3 className="sc-title" title={study.title}>{study.title}</h3>
      <p className="sc-authors">By: {(study.authors||[]).join(', ')}</p>
      <div>
        <p className={`sc-abs${expanded?' expanded':''}`} style={expanded?{display:'block'}:{}}>
          {expanded ? study.abstract : preview}
        </p>
        {isLong&&(
          <button className="sc-abs-toggle"
            onClick={e=>{e.stopPropagation();setExpanded(v=>!v);}}
            aria-expanded={expanded}>
            {expanded
              ? <><svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="18 15 12 9 6 15"/></svg> Show less</>
              : <><svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="6 9 12 15 18 9"/></svg> Read more</>
            }
          </button>
        )}
      </div>
      <div className="sc-meta">
        <span data-tip="Views"><Ico.eye/>{study.viewCount||0}</span>
        <span data-tip="Downloads"><Ico.dl/>{study.downloadCount||0}</span>
        <span data-tip={`${study.citationCount||0} citation${(study.citationCount||0)!==1?'s':''}`}>📋{study.citationCount||0}</span>
        <span data-tip="Publication year"><Ico.cal/>{study.year}</span>
        {(study.gdrive||study.file)&&<span data-tip="Google Drive file attached" style={{color:'var(--teal)'}}>🔗 Drive</span>}
        {(study.favoriteCount||0)>0&&<span data-tip="Bookmarked by students" style={{color:'var(--purple)'}}>📌{study.favoriteCount}</span>}
        {(study.avgRating||0)>0&&<span data-tip={`Avg rating: ${study.avgRating}`} style={{color:'#f59e0b'}}>★{study.avgRating}</span>}
        {study.teacherGrade&&<span style={{background:'var(--teal-light)',color:'var(--teal)',fontWeight:700,fontSize:'0.68rem',padding:'1px 7px',borderRadius:99,border:'1px solid var(--teal)'}} data-tip={`Teacher grade: ${study.teacherGrade}`}>✓ {study.teacherGrade}</span>}
        {study.revisionStatus==='revision_requested'&&<span style={{background:'var(--gold-bg)',color:'var(--gold)',fontWeight:700,fontSize:'0.68rem',padding:'1px 7px',borderRadius:99,border:'1px solid var(--gold)'}} data-tip="Teacher requested revision">✏️ Revision needed</span>}
        {study.revisionStatus==='resubmitted'&&<span style={{background:'var(--blue-light)',color:'var(--blue)',fontWeight:700,fontSize:'0.68rem',padding:'1px 7px',borderRadius:99,border:'1px solid var(--blue)'}} data-tip="Student submitted revision">🔄 Revised</span>}
        <span style={{marginLeft:'auto'}}>{fmtDate(study.createdAt)}</span>
      </div>
    </div>
  );
}

function StudiesPage({ currentUser }) {
  const [studies,setStudies]=useState([]);
  const [cats,setCats]=useState([]);
  const [availableYears,setAvailableYears]=useState([]);
  const [total,setTotal]=useState(0);
  const [totalPages,setTotalPages]=useState(1);
  const [search,setSearch]=useState('');
  const [searchInput,setSearchInput]=useState('');
  const [filterCat,setFilterCat]=useState('');
  const [sortBy,setSortBy]=useState('newest');
  const [filterYear,setFilterYear]=useState('');
  const [filterGrade,setFilterGrade]=useState('');
  const [filterSection,setFilterSection]=useState('');
  const [availableGrades,setAvailableGrades]=useState([]);
  const [availableSections,setAvailableSections]=useState([]);
  const [page,setPage]=useState(1);
  const [selected,setSelected]=useState(null);
  const [showUpload,setShowUpload]=useState(false);
  const [loading,setLoading]=useState(true);
  const searchTimeout = useRef(null);
  const [searchHistory,setSearchHistory]=useState(()=>{try{return JSON.parse(localStorage.getItem('sabnahis_search_history')||'[]');}catch{return [];}});
  const [showSearchHistory,setShowSearchHistory]=useState(false);
  const searchInputRef=useRef(null);

  // Load available years, grades, sections once on mount
  useEffect(()=>{
    API.getAllStudies().then(all=>{
      const yrs=[...new Set(all.map(s=>s.year).filter(Boolean))].sort((a,b)=>b-a);
      setAvailableYears(yrs);
      const grades=[...new Set(all.map(s=>s.uploaderGrade).filter(Boolean))].sort((a,b)=>Number(a)-Number(b));
      setAvailableGrades(grades);
      const secs=[...new Set(all.map(s=>(s.uploaderSection||'').trim()).filter(Boolean))].sort();
      setAvailableSections(secs);
    }).catch(()=>{});
  },[]);

  const load=useCallback(async()=>{
    setLoading(true);
    try{
      const [res,catsArr]=await Promise.all([API.getStudies({search,category:filterCat,year:filterYear,grade:filterGrade,section:filterSection,page,perPage:6,sortBy}),API.getCategories()]);
      setStudies(res.data);setTotal(res.total);setTotalPages(res.totalPages);setCats(catsArr);
    }catch(e){toast.err('Failed to load studies.');}
    setLoading(false);
  },[search,filterCat,filterYear,filterGrade,filterSection,page,sortBy]);

  useEffect(()=>{load();},[load]);

  // Keyboard shortcut: "/" focuses search (unless typing in a field), Esc clears it
  useEffect(()=>{
    const onKey = e => {
      const tag = document.activeElement?.tagName;
      const typing = tag==='INPUT' || tag==='TEXTAREA' || document.activeElement?.isContentEditable;
      if(e.key==='/' && !typing){
        e.preventDefault();
        searchInputRef.current?.focus();
      } else if(e.key==='Escape' && document.activeElement===searchInputRef.current && searchInput){
        setSearchInput('');
        setSearch('');
        setPage(1);
        searchInputRef.current?.blur();
      }
    };
    window.addEventListener('keydown',onKey);
    return ()=>window.removeEventListener('keydown',onKey);
  },[searchInput]);

  const saveSearchHistory = (val) => {
    if(!val.trim()) return;
    setSearchHistory(prev=>{
      const next=[val,...prev.filter(h=>h!==val)].slice(0,5);
      try{localStorage.setItem('sabnahis_search_history',JSON.stringify(next));}catch{}
      return next;
    });
  };

  const handleSearch = e => {
    const val = e.target.value;
    setSearchInput(val);
    clearTimeout(searchTimeout.current);
    searchTimeout.current = setTimeout(()=>{ setSearch(val); setPage(1); if(val.trim()) saveSearchHistory(val.trim()); }, 350);
  };

  const applyHistorySearch = (val) => {
    setSearchInput(val);
    setSearch(val);
    setPage(1);
    setShowSearchHistory(false);
  };

  const handleDelete = async id => {
    // Optimistic removal from grid
    const prev = studies;
    setStudies(s => s.filter(x => x.id !== id));
    setTotal(t => t - 1);
    try {
      await API.deleteStudy(id);
      toast.ok('Study deleted.');
    } catch(e) {
      setStudies(prev); setTotal(t => t + 1);
      toast.err('Failed to delete study.');
    }
  };

  const hasFilters = search || filterCat || filterYear || filterGrade || filterSection;
  const clearAllFilters = () => { setFilterCat('');setFilterYear('');setFilterGrade('');setFilterSection('');setSearchInput('');setSearch('');setPage(1); };

  const sortedStudies = studies; // sorting is handled in API.getStudies before pagination

  return (
    <div>
      <div className="page-hd">
        <div className="page-hd-left">
          <h2>Research Repository</h2>
          <p className="muted">{total} {total===1?'study':'studies'} found{filterYear?` · ${filterYear}`:''}{search&&<span style={{color:'var(--gold)',marginLeft:5}}>· "{search}"</span>}</p>
        </div>
        <button className="btn btn-gold" data-tip="Upload a new research study" onClick={()=>setShowUpload(true)}><Ico.up/> Upload Study</button>
      </div>
      <div className="mob-search-sticky">
        <div className="fb" style={{flexWrap:'wrap',gap:8}}>
          <div className="search-history-wrap">
            <div className="sb" style={{width:'100%'}}>
              <Ico.search/>
              <input ref={searchInputRef} placeholder="Search by title, author, or keyword…" value={searchInput} onChange={handleSearch}
                onFocus={()=>searchHistory.length>0&&setShowSearchHistory(true)}
                onBlur={()=>setTimeout(()=>setShowSearchHistory(false),180)}
                aria-label="Search studies"/>
              {searchInput&&<button onClick={()=>{setSearchInput('');setSearch('');setPage(1);setShowSearchHistory(false);}} style={{background:'none',border:'none',cursor:'pointer',color:'var(--muted)',padding:'0 2px',fontSize:'1rem',lineHeight:1}} data-tip="Clear search">✕</button>}
              {!searchInput&&<kbd className="search-kbd-hint" aria-hidden="true">/</kbd>}
            </div>
            {showSearchHistory&&!searchInput&&searchHistory.length>0&&(
              <div className="search-history-dropdown">
                <div className="search-history-header">
                  <span>Recent Searches</span>
                  <button className="search-history-clear" onClick={()=>{setSearchHistory([]);try{localStorage.removeItem('sabnahis_search_history');}catch{}setShowSearchHistory(false);}}>Clear all</button>
                </div>
                {searchHistory.map((h,i)=>(
                  <button key={i} className="search-history-item" onMouseDown={()=>applyHistorySearch(h)}>
                    <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.95"/></svg>
                    <span style={{flex:1,textAlign:'left'}}>{h}</span>
                    <button className="shi-del" onMouseDown={e=>{e.stopPropagation();setSearchHistory(prev=>{const next=prev.filter((_,j)=>j!==i);try{localStorage.setItem('sabnahis_search_history',JSON.stringify(next));}catch{}return next;});}}>✕</button>
                  </button>
                ))}
              </div>
            )}
          </div>
          <select value={filterCat} onChange={e=>{setFilterCat(e.target.value);setPage(1);}} style={{flex:1,minWidth:140,padding:'10px 13px'}} aria-label="Filter by category">
            <option value="">All Categories</option>
            {cats.map(c=><option key={c}>{c}</option>)}
          </select>
          <select value={filterGrade} onChange={e=>{setFilterGrade(e.target.value);setFilterSection('');setPage(1);}} style={{flex:1,minWidth:120,padding:'10px 13px'}} aria-label="Filter by grade">
            <option value="">All Grades</option>
            {availableGrades.map(g=><option key={g} value={g}>Grade {g}</option>)}
          </select>
          <select value={filterSection} onChange={e=>{setFilterSection(e.target.value);setPage(1);}} style={{flex:1,minWidth:120,padding:'10px 13px'}} aria-label="Filter by section">
            <option value="">All Sections</option>
            {availableSections.filter(s=>!filterGrade||true).map(s=><option key={s} value={s}>{s}</option>)}
          </select>
          <select value={filterYear} onChange={e=>{setFilterYear(e.target.value);setPage(1);}} style={{flex:1,minWidth:110,padding:'10px 13px'}} aria-label="Filter by year">
            <option value="">All Years</option>
            {availableYears.map(yr=><option key={yr} value={yr}>{yr}</option>)}
          </select>
          {hasFilters&&(
            <button className="btn btn-ol btn-sm" onClick={clearAllFilters} data-tip="Clear all filters" style={{whiteSpace:'nowrap'}}>✕ Clear</button>
          )}
        </div>
      </div>

      <div className="fb mob-search-hidden" style={{marginBottom:18}}>
        <div className="search-history-wrap">
          <div className="sb" style={{width:'100%'}}>
            <Ico.search/>
            <input placeholder="Search by title, author, or keyword…" value={searchInput} onChange={handleSearch}
              onFocus={()=>searchHistory.length>0&&setShowSearchHistory(true)}
              onBlur={()=>setTimeout(()=>setShowSearchHistory(false),180)}
              aria-label="Search studies"/>
            {searchInput&&<button onClick={()=>{setSearchInput('');setSearch('');setPage(1);setShowSearchHistory(false);}} style={{background:'none',border:'none',cursor:'pointer',color:'var(--muted)',padding:'0 2px',fontSize:'1rem',lineHeight:1}} data-tip="Clear search">✕</button>}
          </div>
          {showSearchHistory&&!searchInput&&searchHistory.length>0&&(
            <div className="search-history-dropdown">
              <div className="search-history-header">
                <span>Recent Searches</span>
                <button className="search-history-clear" onClick={()=>{setSearchHistory([]);try{localStorage.removeItem('sabnahis_search_history');}catch{}setShowSearchHistory(false);}}>Clear all</button>
              </div>
              {searchHistory.map((h,i)=>(
                <button key={i} className="search-history-item" onMouseDown={()=>applyHistorySearch(h)}>
                  <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.95"/></svg>
                  <span style={{flex:1,textAlign:'left'}}>{h}</span>
                  <button className="shi-del" onMouseDown={e=>{e.stopPropagation();setSearchHistory(prev=>{const next=prev.filter((_,j)=>j!==i);try{localStorage.setItem('sabnahis_search_history',JSON.stringify(next));}catch{}return next;});}}>✕</button>
                </button>
              ))}
            </div>
          )}
        </div>
        <select value={filterCat} onChange={e=>{setFilterCat(e.target.value);setPage(1);}} style={{width:'auto',padding:'10px 13px'}} aria-label="Filter by category">
          <option value="">All Categories</option>
          {cats.map(c=><option key={c}>{c}</option>)}
        </select>
        <select value={filterGrade} onChange={e=>{setFilterGrade(e.target.value);setFilterSection('');setPage(1);}} style={{width:'auto',padding:'10px 13px'}} aria-label="Filter by grade">
          <option value="">All Grades</option>
          {availableGrades.map(g=><option key={g} value={g}>Grade {g}</option>)}
        </select>
        <select value={filterSection} onChange={e=>{setFilterSection(e.target.value);setPage(1);}} style={{width:'auto',padding:'10px 13px'}} aria-label="Filter by section">
          <option value="">All Sections</option>
          {availableSections.map(s=><option key={s} value={s}>{s}</option>)}
        </select>
        <select value={sortBy} onChange={e=>{setSortBy(e.target.value);setPage(1);}} style={{width:'auto',padding:'10px 13px'}} aria-label="Sort studies">
          <option value="newest">Newest First</option>
          <option value="oldest">Oldest First</option>
          <option value="views">Most Viewed</option>
          <option value="downloads">Most Downloaded</option>
          <option value="az">A → Z</option>
        </select>
        <select value={filterYear} onChange={e=>{setFilterYear(e.target.value);setPage(1);}} style={{width:'auto',padding:'10px 13px'}} aria-label="Filter by year">
          <option value="">All Years</option>
          {availableYears.map(yr=><option key={yr} value={yr}>{yr}</option>)}
        </select>
        {hasFilters&&(
          <button className="btn btn-ol btn-sm" onClick={clearAllFilters} title="Clear all filters" style={{whiteSpace:'nowrap'}}>✕ Clear</button>
        )}
      </div>

      {/* Active filter pills */}
      {(filterCat||filterYear||filterGrade||filterSection)&&(
        <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:14}}>
          {filterCat&&<span style={{display:'flex',alignItems:'center',gap:5,background:'var(--gold-bg)',color:'var(--gold)',border:'1px solid var(--gold)',borderRadius:99,padding:'3px 10px',fontSize:'var(--text-xs)',fontWeight:600}}>🏷️ {filterCat}<button onClick={()=>{setFilterCat('');setPage(1);}} style={{background:'none',border:'none',cursor:'pointer',color:'var(--gold)',padding:'0 0 0 2px',lineHeight:1,fontSize:'0.8rem'}}>✕</button></span>}
          {filterGrade&&<span style={{display:'flex',alignItems:'center',gap:5,background:'var(--teal-light)',color:'var(--teal)',border:'1px solid var(--teal)',borderRadius:99,padding:'3px 10px',fontSize:'var(--text-xs)',fontWeight:600}}>🎓 Grade {filterGrade}<button onClick={()=>{setFilterGrade('');setFilterSection('');setPage(1);}} style={{background:'none',border:'none',cursor:'pointer',color:'var(--teal)',padding:'0 0 0 2px',lineHeight:1,fontSize:'0.8rem'}}>✕</button></span>}
          {filterSection&&<span style={{display:'flex',alignItems:'center',gap:5,background:'var(--teal-light)',color:'var(--teal)',border:'1px solid var(--teal)',borderRadius:99,padding:'3px 10px',fontSize:'var(--text-xs)',fontWeight:600}}>🏫 {filterSection}<button onClick={()=>{setFilterSection('');setPage(1);}} style={{background:'none',border:'none',cursor:'pointer',color:'var(--teal)',padding:'0 0 0 2px',lineHeight:1,fontSize:'0.8rem'}}>✕</button></span>}
          {filterYear&&<span style={{display:'flex',alignItems:'center',gap:5,background:'var(--purple-light)',color:'var(--purple)',border:'1px solid var(--purple)',borderRadius:99,padding:'3px 10px',fontSize:'var(--text-xs)',fontWeight:600}}>📅 {filterYear}<button onClick={()=>{setFilterYear('');setPage(1);}} style={{background:'none',border:'none',cursor:'pointer',color:'var(--purple)',padding:'0 0 0 2px',lineHeight:1,fontSize:'0.8rem'}}>✕</button></span>}
        </div>
      )}

      {loading?(
        <StudiesGridSkeleton count={6}/>
      ):sortedStudies.length===0?(
        <EmptyState
          icon="📚"
          title="No studies found"
          message={hasFilters?'Try adjusting your search or filters — there might be more studies waiting to be discovered.':'Be the first to upload a research study and kick off the repository!'}
        />
      ):(
        <div className="grid">
          {sortedStudies.map(study=>(
            <StudyCard key={study.id} study={study} currentUser={currentUser} onOpen={async()=>{await API.trackStudy(study.id,'viewCount',currentUser);API.setLastRead(currentUser.id,study).catch(()=>{});trackRecentlyViewed(study);setSelected({...study,viewCount:(study.viewCount||0)+1});}}/>
          ))}
        </div>
      )}

      {totalPages>1&&(
        <div className="pages" role="navigation" aria-label="Pagination">
          <button className="pg" disabled={page===1} onClick={()=>setPage(p=>p-1)} aria-label="Previous page">‹</button>
          {Array.from({length:totalPages},(_,i)=>i+1).filter(n=>Math.abs(n-page)<=2||n===1||n===totalPages).map((n,idx,arr)=>(
            <React.Fragment key={n}>
              {idx>0&&arr[idx-1]!==n-1&&<span style={{color:'var(--muted)',padding:'0 4px'}}>…</span>}
              <button className={`pg${page===n?' active':''}`} onClick={()=>setPage(n)} aria-current={page===n?'page':undefined}>{n}</button>
            </React.Fragment>
          ))}
          <button className="pg" disabled={page===totalPages} onClick={()=>setPage(p=>p+1)} aria-label="Next page">›</button>
        </div>
      )}

      {selected&&<StudyDetailModal study={selected} onClose={()=>setSelected(null)} currentUser={currentUser} onDelete={handleDelete} allStudies={studies} onOpenStudy={s=>{API.trackStudy(s.id,'viewCount',currentUser);API.setLastRead(currentUser.id,s).catch(()=>{});trackRecentlyViewed(s);setSelected({...s,viewCount:(s.viewCount||0)+1});}}/>}
      {showUpload&&<UploadModal onClose={()=>setShowUpload(false)} currentUser={currentUser} cats={cats} onUpload={()=>{load();setShowUpload(false);}}/>}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════
//  QUICK PROMPTS — context-aware
// ══════════════════════════════════════════════════════════════════
const QUICK_PROMPTS = {
  general:   ['What is the scientific method?','Define hypothesis vs theory','Show me all studies in the repository','What research gaps exist?'],
  find:      ['Find studies about robotics','Show all Environmental Science studies','Studies from the most recent year','Research about algorithms or AI'],
  cite:      ['APA citation for all studies','Cite the most recent study','Generate a full reference list','How do I cite a journal article in APA?'],
  define:    ['Define algorithm','What is natural selection?','Explain the water cycle','What is a control variable?'],
  compare:   ['Compare the two most recent studies','Difference between hypothesis and theory','Compare Biology and Chemistry studies'],
  summarize: ['Summarize all studies','Key findings from the repository','What are the main research themes?'],
  suggest:   ['What topics are missing from the repository?','Suggest interdisciplinary research ideas','Ideas for follow-up studies','Novel research directions'],
};

// ══════════════════════════════════════════════════════════════════
//  CHAT PAGE — Upgraded Research Copilot
// ══════════════════════════════════════════════════════════════════
function ChatPage({ currentUser }) {
  const isAdmin = currentUser.role === 'admin';
  const [groqKey, setGroqKey] = useState(()=>localStorage.getItem('sabnahis_groq_key')||'');
  const [keyInput, setKeyInput] = useState('');
  const [showKeySetup, setShowKeySetup] = useState(false);
  const saveKey = async () => {
    const k = keyInput.trim();
    if (!k) { toast.err('Please enter a valid API key.'); return; }
    try {
      await db.collection('config').doc('groq').set({ apiKey: k });
      _groqKeyCache = k;
      localStorage.setItem('sabnahis_groq_key', k);
      setGroqKey(k);
      setKeyInput('');
      setShowKeySetup(false);
      toast.ok('API key saved to Firestore!');
    } catch(e) {
      toast.err('Failed to save: ' + e.message);
    }
  };
  const removeKey = async () => {
    try {
      await db.collection('config').doc('groq').delete();
      _groqKeyCache = null;
      localStorage.removeItem('sabnahis_groq_key');
      setGroqKey('');
      toast.ok('API key removed.');
    } catch(e) {
      localStorage.removeItem('sabnahis_groq_key');
      setGroqKey('');
      toast.ok('API key removed locally.');
    }
  };
  const [studies,setStudies]=useState([]);
  const [msgs,setMsgs]=useState([]);
  const [input,setInput]=useState('');
  const [loading,setLoading]=useState(false);
  const [history,setHistory]=useState([]);
  const [mode,setMode]=useState('general');
  const [studiesLoaded,setStudiesLoaded]=useState(false);
  const [repoStats,setRepoStats]=useState(null);
  const [savedCites,setSavedCites]=useState([]);
  const [showSaved,setShowSaved]=useState(false);
  const bottomRef=useRef();
  const inputRef=useRef();
  const msgsRef=useRef();

  useEffect(()=>{
    loadGroqKeyFromFirestore().then(()=>{
      if(_groqKeyCache) setGroqKey(_groqKeyCache);
    });
    API.getAllStudies().then(s=>{
      setStudies(s);
      setStudiesLoaded(true);
      const byCat={};
      s.forEach(st=>(st.categories||['Uncategorized']).forEach(c=>{byCat[c]=(byCat[c]||0)+1;}));
      const gaps = detectResearchGaps(s);
      setRepoStats({
        total:s.length,
        categories:Object.entries(byCat).sort((a,b)=>b[1]-a[1]),
        views:s.reduce((a,x)=>a+(x.viewCount||0),0),
        recent:s[0]?.title||'—',
        gaps
      });
      const gapHint = gaps.length > 0 ? `\n\n🔭 *Quick insight: I've spotted **${gaps.length} research gap${gaps.length>1?'s':''}** in the repository — topics with no studies yet. Ask me "What research gaps exist?" to learn more.*` : '';
      setMsgs([{
        id:1,role:'bot',citations:[],time:now(),source:'local',
        text:`Hello! 👋 I'm your **SABNAHIS STE Research Assistant** — powered by Groq AI.

I function as a **smart research copilot**, not just a keyword search. I can:

**🔍 Repository Intelligence:**
• Find studies and explain *why* they're relevant
• Detect research gaps and unexplored topics
• Make connections between studies you might miss

**📚 Academic Knowledge:**
• Define any STEM concept with examples
• Generate APA 7th edition citations
• Compare, summarize, and analyze research

**💡 Research Guidance:**
• Suggest novel research directions
• Identify interdisciplinary opportunities
• Generate follow-up research questions

I have **${s.length}** ${s.length===1?'study':'studies'} loaded. Use the **mode buttons** to focus, or just ask me anything!${gapHint}`
      }]);
    });
  },[]);

  useEffect(()=>{ bottomRef.current?.scrollIntoView({behavior:'smooth'}); },[msgs]);

  // Auto-resize textarea
  useEffect(()=>{
    const ta = inputRef.current;
    if (!ta) return;
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 130)+'px';
  },[input]);

  const send=useCallback(async(text)=>{
    const q=(text||input).trim();
    if(!q||loading)return;
    setInput('');
    const userMsg={id:Date.now(),role:'user',text:q,citations:[],time:now()};
    setMsgs(m=>[...m,userMsg]);
    setLoading(true);
    try{
      const r=await callAI(q,history,studies,mode);
      setMsgs(m=>[...m,{id:Date.now()+1,role:'bot',text:r.text,citations:r.citations||[],source:r.source,time:now()}]);
      setHistory(h=>[...h,{role:'user',content:q},{role:'assistant',content:r.text}]);
    }catch{
      setMsgs(m=>[...m,{id:Date.now()+1,role:'bot',text:'Sorry, something went wrong. Please try again.',citations:[],time:now()}]);
    }
    setLoading(false);
    setTimeout(()=>inputRef.current?.focus(),80);
  },[input,loading,history,studies,mode]);

  const copyMsg=text=>navigator.clipboard?.writeText(text).then(()=>toast.ok('Copied to clipboard!'));

  const clearChat=()=>{
    setMsgs([{id:Date.now(),role:'bot',citations:[],time:now(),source:'local',text:`Chat cleared. **${studies.length}** studies loaded. Mode: **${AI_MODES[mode]?.label}**.\n\nWhat would you like to explore?`}]);
    setHistory([]);
  };

  const exportChat=()=>{
    const text=msgs.map(m=>`[${m.time}] ${m.role==='bot'?'AI':'You'}:\n${m.text}`).join('\n\n---\n\n');
    const blob=new Blob([text],{type:'text/plain'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`sabnahis-chat-${new Date().toISOString().split('T')[0]}.txt`;
    a.click();
    toast.ok('Chat exported!');
  };

  const saveCitation=study=>{
    const apa=generateAPA(study);
    if(savedCites.includes(apa)){toast.info('Already saved!');return;}
    setSavedCites(c=>[...c,apa]);
    toast.ok('Citation saved!');
  };

  const exportCitations=()=>{
    if(!savedCites.length){toast.err('No saved citations yet.');return;}
    const text='References\n\n'+savedCites.join('\n');
    const blob=new Blob([text],{type:'text/plain'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`references-${new Date().toISOString().split('T')[0]}.txt`;
    a.click();
    toast.ok('Citations exported!');
  };

  const handleKeyDown = e => {
    if (e.key==='Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  };

  return (
    <div>
      {/* Header */}
      <div className="page-hd">
        <div className="page-hd-left">
          <h2 style={{fontFamily:'var(--font-display)',fontSize:'var(--text-2xl)',fontWeight:600}}>AI Research Assistant</h2>
          <p className="muted" style={{fontSize:'var(--text-xs)'}}>Groq AI · {studies.length} studies loaded · APA citations</p>
        </div>
        <div style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap'}}>
          <span style={{background: groqKey ? 'var(--green-light)' : 'var(--red-light)', color: groqKey ? 'var(--green)' : 'var(--red)', fontSize:'0.7rem',fontWeight:500,padding:'4px 9px',borderRadius:99,display:'flex',alignItems:'center',gap:4}}>
            <span style={{width:6,height:6,borderRadius:'50%',background:'currentColor',flexShrink:0}}/>{groqKey ? 'Groq AI' : 'No API Key'}
          </span>
          {isAdmin && (
            <button className="btn btn-ol btn-sm" onClick={()=>setShowKeySetup(s=>!s)} data-tip={groqKey ? 'Change Groq API key' : 'Set up Groq API key for AI features'}>🔑 {groqKey ? 'Change Key' : 'Set API Key'}</button>
          )}
          {savedCites.length>0&&<button className="chat-export-btn" onClick={()=>setShowSaved(s=>!s)}>📝 {savedCites.length} saved</button>}
          <button className="chat-export-btn" onClick={exportChat}>⬇ Export</button>
          <button className="btn btn-ol btn-sm" onClick={clearChat}>Clear</button>
        </div>
      </div>

      {/* API Key setup — admin only */}
      {showKeySetup && isAdmin && (
        <div className="card" style={{marginBottom:14,borderLeft:'4px solid var(--gold)'}}>
          <div className="card-hd" style={{marginBottom:10}}>
            <span className="card-title" style={{fontSize:'0.875rem'}}>🔑 Groq API Key</span>
            <button className="btn btn-ol btn-sm" onClick={()=>setShowKeySetup(false)}>✕ Close</button>
          </div>
          <p style={{fontSize:'var(--text-xs)',color:'var(--muted)',marginBottom:10}}>
            Your key is saved to <strong>Firestore</strong> (admin-only) and loaded automatically for all users — it is never exposed in the source code. Get a free key at <strong>console.groq.com</strong>.
          </p>
          {groqKey && (
            <div style={{display:'flex',alignItems:'center',gap:9,padding:'8px 12px',background:'var(--green-light)',borderRadius:'var(--radius)',marginBottom:10,fontSize:'var(--text-xs)',color:'var(--green)'}}>
              ✓ Key saved: <code style={{fontFamily:'var(--font-mono)'}}>{groqKey.slice(0,12)}••••••••••••</code>
              <button className="btn btn-red btn-sm" style={{marginLeft:'auto'}} onClick={removeKey}>Remove</button>
            </div>
          )}
          <div style={{display:'flex',gap:9}}>
            <input placeholder="Paste your Groq API key here (gsk_...)" value={keyInput} onChange={e=>setKeyInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&saveKey()} style={{flex:1}} type="password"/>
            <button className="btn btn-gold" onClick={saveKey}>Save Key</button>
          </div>
        </div>
      )}

      {/* No key warning for non-admins */}
      {!groqKey && !isAdmin && (
        <div style={{display:'flex',alignItems:'center',gap:9,padding:'10px 14px',background:'var(--gold-bg)',border:'1.5px solid var(--gold)',borderRadius:'var(--radius)',marginBottom:14,fontSize:'var(--text-sm)',color:'var(--gold)'}}>
          ⚠️ AI is running in local mode. Ask your teacher to set up the Groq API key.
        </div>
      )}

      {/* Saved citations panel */}
      {showSaved&&savedCites.length>0&&(
        <div className="card" style={{marginBottom:14,borderLeft:'3px solid var(--gold)'}}>
          <div className="card-hd" style={{marginBottom:10}}>
            <span className="card-title" style={{fontSize:'0.875rem'}}>📝 Saved Citations ({savedCites.length})</span>
            <div style={{display:'flex',gap:6}}>
              <button className="btn btn-grn btn-sm" onClick={exportCitations}>⬇ Export .txt</button>
              <button className="btn btn-ol btn-sm" onClick={()=>{setSavedCites([]);setShowSaved(false);}}>Clear all</button>
            </div>
          </div>
          {savedCites.map((c,i)=>(
            <div key={i} style={{fontFamily:'var(--font-mono)',fontSize:'0.73rem',color:'var(--ink-3)',padding:'6px 10px',background:'var(--surface)',borderRadius:6,marginBottom:5,borderLeft:'2px solid var(--gold)',display:'flex',alignItems:'flex-start',gap:8}}>
              <span style={{flex:1,lineHeight:1.5}}>{c}</span>
              <button style={{background:'none',border:'none',cursor:'pointer',color:'var(--muted)',flexShrink:0,fontSize:'0.75rem',minWidth:36,minHeight:28,padding:'2px 6px'}} onClick={()=>{navigator.clipboard?.writeText(c);toast.ok('Copied!');}}>Copy</button>
            </div>
          ))}
        </div>
      )}

      {/* Research gap alert */}
      {repoStats?.gaps?.length>0&&msgs.length<=1&&(
        <div className="gap-alert" style={{marginBottom:14}}>
          <span style={{fontSize:'1rem',flexShrink:0}}>📌</span>
          <div>
            <strong>Research Gap Detected:</strong> No studies cover <strong>{repoStats.gaps[0]}</strong>{repoStats.gaps[1]?<> or <strong>{repoStats.gaps[1]}</strong></>:''} yet.
            <button style={{background:'none',border:'none',color:'var(--gold)',cursor:'pointer',fontSize:'0.73rem',fontWeight:600,marginLeft:6,textDecoration:'underline'}} onClick={()=>send('What research topics are missing from the repository?')}>Explore →</button>
          </div>
        </div>
      )}

      <div className="chat-layout">
        {/* Main chat column */}
        <div className="chat-main">
          {/* Mode pills */}
          <div className="mode-pills" role="tablist" aria-label="AI modes">
            {Object.entries(AI_MODES).map(([key,m])=>(
              <button key={key} role="tab" aria-selected={mode===key}
                className={`mode-pill${mode===key?' on':''}`}
                onClick={()=>setMode(key)}>
                {m.icon} {m.label}
              </button>
            ))}
          </div>

          {/* Messages */}
          <div className="chat-msgs" ref={msgsRef} role="log" aria-live="polite" aria-label="Chat messages">
            {!studiesLoaded?(
              <div style={{textAlign:'center',padding:'50px',color:'var(--muted)'}}>
                <span className="spin spin-gold" style={{width:28,height:28,border:'3px solid rgba(201,162,39,0.25)',borderTopColor:'var(--gold)',display:'inline-block',marginBottom:12}}/>
                <p>Loading AI assistant…</p>
              </div>
            ):msgs.map(msg=>(
              <div key={msg.id} className={`cm ${msg.role}`} role={msg.role==='bot'?'article':'none'}>
                <div className={`cm-av ${msg.role}`} aria-hidden="true">
                  {msg.role==='bot'?'🤖':initials(currentUser.name)}
                </div>
                <div className="cm-body">
                  <div className={`cm-bub ${msg.role}`}>
                    {msg.role==='bot'?<MD text={msg.text}/>:msg.text}
                    {msg.citations?.length>0&&(
                      <div className="chat-refs">
                        <div className="chat-ref-lbl">📚 Referenced Studies ({msg.citations.length})</div>
                        {msg.citations.map((s,i)=>(
                          <div key={i} className="chat-ref">
                            <span style={{flex:1,cursor:'pointer'}} title="Click to copy APA" onClick={()=>{navigator.clipboard?.writeText(generateAPA(s));toast.ok('APA citation copied!');}}>
                              [{i+1}] {generateAPA(s)}
                            </span>
                            <button style={{background:'none',border:'none',cursor:'pointer',color:'var(--teal)',fontSize:'0.65rem',fontWeight:600,flexShrink:0,whiteSpace:'nowrap',minWidth:36,minHeight:24,padding:'2px 4px'}} onClick={()=>saveCitation(s)}>Save</button>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                  <div className="cm-meta">
                    <span>{msg.time}</span>
                    {msg.source&&<span className={`cm-src ${msg.source}`}>{msg.source==='groq'?'⚡ Groq AI':'🔧 Local'}</span>}
                    {msg.role==='bot'&&(
                      <button style={{background:'none',border:'none',cursor:'pointer',color:'var(--muted)',padding:'0 4px',borderRadius:4,minWidth:28,minHeight:24,display:'flex',alignItems:'center'}} onClick={()=>copyMsg(msg.text)} data-tip="Copy response" aria-label="Copy response">
                        <Ico.copy/>
                      </button>
                    )}
                  </div>
                </div>
              </div>
            ))}
            {loading&&(
              <div className="cm bot" aria-label="AI is thinking">
                <div className="cm-av bot" aria-hidden="true">🤖</div>
                <div className="cm-body">
                  <div className="cm-bub bot"><div className="typing"><div className="dot"/><div className="dot"/><div className="dot"/></div></div>
                  <div className="cm-meta"><span>Thinking…</span></div>
                </div>
              </div>
            )}
            <div ref={bottomRef} style={{height:1}}/>
          </div>

          {/* Input area */}
          <div className="chat-input-area">
            <div className="chat-input-row">
              <textarea
                ref={inputRef}
                className="chat-in"
                placeholder={`${AI_MODES[mode]?.icon} ${AI_MODES[mode]?.desc}…`}
                value={input}
                onChange={e=>setInput(e.target.value)}
                onKeyDown={handleKeyDown}
                rows={1}
                maxLength={1200}
                aria-label="Type your message"
                aria-multiline="true"
              />
              <button
                className="chat-send-btn"
                onClick={()=>send()}
                disabled={loading||!input.trim()}
                aria-label="Send message">
                {loading?<span className="spin" style={{width:16,height:16}}/>:<Ico.send/>}
              </button>
            </div>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginTop:6,gap:8}}>
              <div className="chat-actions">
                {(QUICK_PROMPTS[mode]||[]).slice(0,3).map(q=>(
                  <button key={q} className="chat-action-btn" onClick={()=>send(q)}>
                    <Ico.spark/>{q}
                  </button>
                ))}
              </div>
              {input.length>0&&<span style={{fontSize:'0.65rem',color:'var(--muted)',flexShrink:0}}>{input.length}/1200</span>}
            </div>
          </div>
        </div>

        {/* Sidebar */}
        <div className="chat-sidebar">
          {/* Mode info */}
          <div className="chat-panel">
            <div className="chat-panel-hd">🎯 Mode</div>
            <div className="chat-panel-body" style={{padding:'12px 14px'}}>
              <div style={{fontSize:'1.2rem',marginBottom:4}}>{AI_MODES[mode]?.icon}</div>
              <div style={{fontWeight:600,fontSize:'0.875rem',marginBottom:4}}>{AI_MODES[mode]?.label}</div>
              <div style={{fontSize:'0.78rem',color:'var(--muted)'}}>{AI_MODES[mode]?.desc}</div>
            </div>
          </div>

          {/* Repository stats */}
          {repoStats&&(
            <div className="chat-panel">
              <div className="chat-panel-hd">📊 Repository</div>
              <div className="chat-panel-body">
                <div className="chat-stat-row"><span>Total Studies</span><span className="chat-stat-val">{repoStats.total}</span></div>
                <div className="chat-stat-row"><span>Total Views</span><span className="chat-stat-val">{repoStats.views}</span></div>
                <div className="chat-stat-row"><span>Categories</span><span className="chat-stat-val">{repoStats.categories.length}</span></div>
                {repoStats.categories.slice(0,5).map(([c,n])=>(
                  <div key={c} className="chat-stat-row" style={{fontSize:'0.72rem'}}>
                    <span style={{color:'var(--slate)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:'60%'}}>{c}</span>
                    <span style={{color:'var(--muted)',flexShrink:0}}>{n}</span>
                  </div>
                ))}
                {repoStats.gaps?.length>0&&(
                  <div style={{marginTop:8,padding:'6px 8px',background:'#fff8e6',borderRadius:6,fontSize:'0.7rem',color:'#8a6a00',borderLeft:'2px solid var(--gold)'}}>
                    📌 {repoStats.gaps.length} gap{repoStats.gaps.length>1?'s':''} detected
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Suggested questions */}
          <div className="chat-panel">
            <div className="chat-panel-hd"><Ico.bulb/> Suggested Questions</div>
            <div className="chat-panel-body" style={{padding:'8px'}}>
              {(QUICK_PROMPTS[mode]||[]).map(q=>(
                <button key={q} className="sugg-chip" onClick={()=>send(q)}>{q}</button>
              ))}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}


// ══════════════════════════════════════════════════════════════════
//  STUDY HISTORY MODAL — shows viewer/downloader/citer logs to uploader
// ══════════════════════════════════════════════════════════════════
function StudyHistoryModal({ study, onClose }) {
  const [logs, setLogs] = useState(null);
  const [tab, setTab] = useState('views');
  const [selectedYear, setSelectedYear] = useState('all');

  useEffect(() => {
    API.getStudyLogs(study.id).then(setLogs);
  }, [study.id]);

  const fmtTs = ts => {
    if (!ts) return '—';
    const d = new Date(ts);
    return d.toLocaleDateString('en-PH', { year:'numeric', month:'short', day:'numeric' })
      + ' · ' + d.toLocaleTimeString('en-PH', { hour:'2-digit', minute:'2-digit' });
  };

  const getYear = ts => ts ? new Date(ts).getFullYear() : null;

  // Get all unique years across views, downloads, and citations
  const allYears = useMemo(() => {
    if (!logs) return [];
    const yrs = new Set([
      ...logs.views.map(l => getYear(l.timestamp)),
      ...logs.downloads.map(l => getYear(l.timestamp)),
      ...logs.citations.map(l => getYear(l.timestamp))
    ].filter(Boolean));
    return [...yrs].sort((a,b) => b - a);
  }, [logs]);

  const currentList = useMemo(() => {
    if (!logs) return [];
    const list = logs[tab];
    if (selectedYear === 'all') return list;
    return list.filter(l => getYear(l.timestamp) === parseInt(selectedYear));
  }, [logs, tab, selectedYear]);

  // Group current list by year for display
  const groupedByYear = useMemo(() => {
    if (selectedYear !== 'all') return null;
    const groups = {};
    currentList.forEach(log => {
      const yr = getYear(log.timestamp) || 'Unknown';
      if (!groups[yr]) groups[yr] = [];
      groups[yr].push(log);
    });
    return Object.entries(groups).sort((a,b) => b[0] - a[0]);
  }, [currentList, selectedYear]);

  const uniqueStudents = logs
    ? [...new Set([
        ...logs.views.map(l=>l.userId),
        ...logs.downloads.map(l=>l.userId),
        ...logs.citations.map(l=>l.userId)
      ].filter(Boolean))].length
    : null;

  const TAB_BTN = (id, icon, label, count) => (
    <button
      style={{flex:1,padding:'8px',borderRadius:6,border:'none',cursor:'pointer',fontFamily:'var(--font-body)',fontSize:'var(--text-sm)',fontWeight:500,transition:'all var(--transition)',background:tab===id?'var(--white)':'transparent',color:tab===id?'var(--ink)':'var(--muted)',boxShadow:tab===id?'0 1px 4px rgba(0,0,0,0.08)':'none'}}
      onClick={()=>{setTab(id);setSelectedYear('all');}}>
      {icon} {label} {logs?`(${count})`:''}
    </button>
  );

  const LogRow = ({ log, i }) => (
    <tr key={i}>
      <td style={{color:'var(--muted)',fontSize:'var(--text-xs)'}}>{i+1}</td>
      <td>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <div className="avatar" style={{width:28,height:28,fontSize:'0.65rem',flexShrink:0}}>
            {(log.userName||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()}
          </div>
          <span style={{fontWeight:500}}>{log.userName||'Unknown'}</span>
        </div>
      </td>
      <td style={{fontSize:'var(--text-xs)',color:'var(--muted)'}}>{log.userEmail||'—'}</td>
      <td style={{fontSize:'var(--text-xs)'}}>
        {log.institution||'—'}
        {log.department?<span style={{color:'var(--muted)'}}> · {log.department}</span>:null}
      </td>
      <td style={{fontSize:'var(--text-xs)',color:'var(--muted)',whiteSpace:'nowrap'}}>{fmtTs(log.timestamp)}</td>
    </tr>
  );

  const TableHead = () => (
    <thead>
      <tr>
        <th>#</th>
        <th>Student Name</th>
        <th>Email</th>
        <th>School / Section</th>
        <th>Date & Time</th>
      </tr>
    </thead>
  );

  const emptyIcon = tab==='views'?'👁':tab==='downloads'?'⬇':'📋';
  const emptyLabel = tab==='views'?'views':tab==='downloads'?'downloads':'citations';

  return (
    <Modal title="Study Activity History" onClose={onClose} wide>
      {/* Study info */}
      <div style={{marginBottom:16}}>
        <div style={{fontFamily:'var(--font-display)',fontSize:'0.97rem',fontWeight:600,color:'var(--ink)',marginBottom:4}}>{study.title}</div>
        <div style={{fontSize:'var(--text-xs)',color:'var(--muted)'}}>By: {(study.authors||[]).join(', ')} · {study.year}</div>
      </div>

      {/* Summary stats */}
      <div style={{display:'flex',gap:10,marginBottom:18,flexWrap:'wrap'}}>
        <div style={{flex:1,minWidth:100,background:'var(--teal-light)',border:'1px solid var(--teal)',borderRadius:'var(--radius)',padding:'12px 16px',textAlign:'center'}}>
          <div style={{fontFamily:'var(--font-display)',fontSize:'1.5rem',fontWeight:700,color:'var(--teal)'}}>{study.viewCount||0}</div>
          <div style={{fontSize:'var(--text-xs)',color:'var(--teal)',fontWeight:500}}>Total Views</div>
        </div>
        <div style={{flex:1,minWidth:100,background:'var(--blue-light)',border:'1px solid var(--blue)',borderRadius:'var(--radius)',padding:'12px 16px',textAlign:'center'}}>
          <div style={{fontFamily:'var(--font-display)',fontSize:'1.5rem',fontWeight:700,color:'var(--blue)'}}>{study.downloadCount||0}</div>
          <div style={{fontSize:'var(--text-xs)',color:'var(--blue)',fontWeight:500}}>Total Downloads</div>
        </div>
        <div style={{flex:1,minWidth:100,background:'var(--purple-light)',border:'1px solid var(--purple)',borderRadius:'var(--radius)',padding:'12px 16px',textAlign:'center'}}>
          <div style={{fontFamily:'var(--font-display)',fontSize:'1.5rem',fontWeight:700,color:'var(--purple)'}}>{study.citationCount||0}</div>
          <div style={{fontSize:'var(--text-xs)',color:'var(--purple)',fontWeight:500}}>Total Citations</div>
        </div>
        <div style={{flex:1,minWidth:100,background:'var(--gold-bg)',border:'1px solid var(--gold)',borderRadius:'var(--radius)',padding:'12px 16px',textAlign:'center'}}>
          <div style={{fontFamily:'var(--font-display)',fontSize:'1.5rem',fontWeight:700,color:'var(--gold)'}}>{uniqueStudents ?? '—'}</div>
          <div style={{fontSize:'var(--text-xs)',color:'var(--gold)',fontWeight:500}}>Unique Students</div>
        </div>
      </div>

      {/* Controls row: tabs + year filter */}
      <div style={{display:'flex',gap:10,marginBottom:16,flexWrap:'wrap',alignItems:'center'}}>
        {/* Tab switcher */}
        <div style={{display:'flex',gap:4,background:'var(--surface)',borderRadius:8,padding:4,flex:1,minWidth:260}}>
          {TAB_BTN('views',   '👁',  'Viewers',    logs?.views.length    ?? 0)}
          {TAB_BTN('downloads','⬇', 'Downloaders', logs?.downloads.length ?? 0)}
          {TAB_BTN('citations','📋','Citers',      logs?.citations.length ?? 0)}
        </div>

        {/* Year filter */}
        <div style={{display:'flex',alignItems:'center',gap:7,flexShrink:0}}>
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2" style={{color:'var(--muted)',flexShrink:0}}><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <select
            value={selectedYear}
            onChange={e=>setSelectedYear(e.target.value)}
            style={{padding:'7px 10px',borderRadius:'var(--radius)',border:'1.5px solid var(--border)',background:'var(--white)',color:'var(--ink)',fontSize:'var(--text-xs)',fontFamily:'var(--font-body)',cursor:'pointer',minWidth:110}}>
            <option value="all">All Years</option>
            {allYears.map(yr=>(
              <option key={yr} value={yr}>{yr}</option>
            ))}
          </select>
        </div>
      </div>

      {/* Year summary pills (only when showing all) */}
      {logs && selectedYear === 'all' && allYears.length > 0 && (
        <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:14}}>
          {allYears.map(yr => {
            const vCount = logs.views.filter(l=>getYear(l.timestamp)===yr).length;
            const dCount = logs.downloads.filter(l=>getYear(l.timestamp)===yr).length;
            const cCount = logs.citations.filter(l=>getYear(l.timestamp)===yr).length;
            return (
              <button
                key={yr}
                onClick={()=>setSelectedYear(String(yr))}
                style={{display:'flex',alignItems:'center',gap:6,padding:'5px 10px',borderRadius:99,border:'1.5px solid var(--border)',background:'var(--surface)',cursor:'pointer',fontSize:'var(--text-xs)',fontFamily:'var(--font-body)',transition:'all var(--transition)',color:'var(--ink-3)'}}>
                <span style={{fontWeight:700,color:'var(--purple)'}}>{yr}</span>
                <span style={{color:'var(--teal)'}}>👁 {vCount}</span>
                <span style={{color:'var(--blue)'}}>⬇ {dCount}</span>
                <span style={{color:'var(--purple)'}}>📋 {cCount}</span>
              </button>
            );
          })}
        </div>
      )}

      {/* Active year badge */}
      {selectedYear !== 'all' && (
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12}}>
          <span style={{background:'var(--purple-light)',color:'var(--purple)',fontSize:'var(--text-xs)',fontWeight:600,padding:'3px 10px',borderRadius:99,border:'1px solid var(--purple)'}}>
            📅 {selectedYear}
          </span>
          <span style={{fontSize:'var(--text-xs)',color:'var(--muted)'}}>{currentList.length} record{currentList.length!==1?'s':''}</span>
          <button onClick={()=>setSelectedYear('all')} style={{background:'none',border:'none',color:'var(--muted)',cursor:'pointer',fontSize:'var(--text-xs)',textDecoration:'underline',padding:0}}>Clear filter</button>
        </div>
      )}

      {/* Log list */}
      {!logs ? (
        <div style={{textAlign:'center',padding:'30px',color:'var(--muted)'}}>
          <span className="spin spin-gold" style={{width:24,height:24,border:'2px solid rgba(201,162,39,0.25)',borderTopColor:'var(--gold)',display:'inline-block',marginBottom:10}}/>
          <p>Loading activity…</p>
        </div>
      ) : currentList.length === 0 ? (
        <EmptyState
          icon={emptyIcon}
          title={`No ${emptyLabel}${selectedYear!=='all'?` in ${selectedYear}`:''}`}
          message={selectedYear!=='all'?`Try selecting a different year or "All Years".`:`No one has ${tab==='views'?'viewed':tab==='downloads'?'downloaded':'cited'} this study yet.`}
          compact
        />
      ) : selectedYear !== 'all' ? (
        <div className="tw">
          <table>
            <TableHead/>
            <tbody>
              {currentList.map((log,i) => <LogRow key={i} log={log} i={i}/>)}
            </tbody>
          </table>
        </div>
      ) : (
        <div style={{display:'flex',flexDirection:'column',gap:18}}>
          {groupedByYear.map(([yr, entries]) => (
            <div key={yr}>
              <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:8}}>
                <div style={{background:'var(--purple)',color:'#fff',borderRadius:6,padding:'3px 12px',fontSize:'var(--text-xs)',fontWeight:700,flexShrink:0}}>
                  📅 {yr}
                </div>
                <div style={{height:1,flex:1,background:'var(--border)'}}/>
                <span style={{fontSize:'var(--text-xs)',color:'var(--muted)',flexShrink:0}}>{entries.length} record{entries.length!==1?'s':''}</span>
              </div>
              <div className="tw">
                <table>
                  <TableHead/>
                  <tbody>
                    {entries.map((log,i) => <LogRow key={i} log={log} i={i}/>)}
                  </tbody>
                </table>
              </div>
            </div>
          ))}
        </div>
      )}

      <div style={{marginTop:16,padding:'10px 14px',background:'var(--surface)',borderRadius:'var(--radius)',fontSize:'var(--text-xs)',color:'var(--muted)',display:'flex',alignItems:'center',gap:6}}>
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        Only activity recorded after this feature was enabled is shown. Earlier counts are totals only.
      </div>
    </Modal>
  );
}

function RecentlyViewedCard({ onOpenStudy }) {
  const [items,setItems]=useState([]);

  useEffect(()=>{ setItems(getRecentlyViewed()); },[]);

  if(items.length===0) return (
    <div className="card" style={{marginBottom:16}}>
      <div className="card-hd"><span className="card-title">🕘 Recently Viewed</span></div>
      <div style={{display:'flex',alignItems:'center',gap:12,padding:'6px 2px'}}>
        <div style={{fontSize:'1.8rem'}}>👀</div>
        <p className="muted" style={{fontSize:'0.8rem',margin:0}}>Studies you open will show up here so you can quickly jump back in.</p>
      </div>
    </div>
  );

  return (
    <div className="card" style={{marginBottom:16}}>
      <div className="card-hd"><span className="card-title">🕘 Recently Viewed</span></div>
      <div style={{display:'flex',gap:10,overflowX:'auto',paddingBottom:4}}>
        {items.map(it=>(
          <div key={it.id} className="lift-hover" style={{flex:'0 0 200px',minWidth:0,padding:'12px 14px',borderRadius:'var(--radius)',background:'var(--surface)',border:'1px solid var(--border)',cursor:'pointer'}}
            onClick={async()=>{
              const snap=await db.collection('studies').doc(it.id).get();
              if(snap.exists) onOpenStudy({id:snap.id,...snap.data()});
              else toast.err('Study no longer available.');
            }}>
            <div style={{fontWeight:600,fontSize:'0.82rem',marginBottom:3,display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical',overflow:'hidden',lineHeight:1.35,wordBreak:'break-word'}}>{it.title}</div>
            <div style={{fontSize:'0.7rem',color:'var(--muted)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{(it.authors||[]).join(', ')} · {it.year}</div>
          </div>
        ))}
      </div>
    </div>
  );
}


function WeeklyHighlightsCard({ onOpenStudy }) {
  const [data,setData]=useState(null);
  const [loading,setLoading]=useState(true);

  useEffect(()=>{
    let active=true;
    API.getWeeklyHighlights().then(d=>{ if(active){ setData(d); setLoading(false); } }).catch(()=>setLoading(false));
    return ()=>{active=false;};
  },[]);

  if(loading) return (
    <div className="card" style={{marginBottom:16}}>
      <div className="skel" style={{height:14,width:200,borderRadius:5,marginBottom:14}}/>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(240px,1fr))',gap:12}}>
        <div className="skel" style={{height:70,borderRadius:'var(--radius)'}}/>
        <div className="skel" style={{height:70,borderRadius:'var(--radius)'}}/>
      </div>
    </div>
  );

  if(!data || (!data.mostViewed && !data.mostDownloaded)) return null;

  const rangeLabel = data.range==='week' ? 'This Week' : 'All Time';

  const Tile = ({ icon, label, entry, accent }) => {
    if(!entry) return (
      <div style={{flex:'1 1 240px',minWidth:0,padding:'14px 16px',borderRadius:'var(--radius)',background:'var(--surface)',border:'1px solid var(--border)',textAlign:'center'}}>
        <div style={{fontSize:'0.72rem',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.5px',color:'var(--muted)',marginBottom:8}}>{icon} {label}</div>
        <div style={{fontSize:'1.6rem',marginBottom:4,opacity:0.5}}>🌱</div>
        <p className="muted" style={{fontSize:'0.78rem',margin:0}}>Nothing here yet — check back once studies start getting some attention!</p>
      </div>
    );
    const { study, count } = entry;
    return (
      <div
        className="lift-hover"
        style={{flex:'1 1 240px',minWidth:0,padding:'14px 16px',borderRadius:'var(--radius)',background:'var(--surface)',border:`1.5px solid ${accent}`,cursor:'pointer'}}
        onClick={()=>onOpenStudy(study)}>
        <div style={{fontSize:'0.72rem',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.5px',color:accent,marginBottom:6}}>{icon} {label}</div>
        <div style={{fontWeight:600,fontSize:'var(--text-sm)',marginBottom:3,display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical',overflow:'hidden',wordBreak:'break-word',lineHeight:1.35}}>{study.title}</div>
        <div style={{fontSize:'0.75rem',color:'var(--muted)',marginBottom:6,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{(study.authors||[]).join(', ')} · {study.year}</div>
        <div style={{display:'flex',alignItems:'center',gap:5,fontSize:'0.8rem',fontWeight:600,color:accent}}>
          {icon==='👁'?<Ico.eye/>:<Ico.dl/>} {count} {icon==='👁'?(count===1?'view':'views'):(count===1?'download':'downloads')}
        </div>
      </div>
    );
  };

  return (
    <div className="card" style={{marginBottom:16,maxWidth:'100%',overflow:'hidden'}}>
      <div className="card-hd"><span className="card-title">🔥 Study of the Week</span><span style={{fontSize:'0.72rem',color:'var(--muted)'}}>{rangeLabel}</span></div>
      <div style={{display:'flex',gap:12,flexWrap:'wrap',minWidth:0}}>
        <Tile icon="👁" label="Most Viewed" entry={data.mostViewed} accent="var(--blue)"/>
        <Tile icon="⬇" label="Most Downloaded" entry={data.mostDownloaded} accent="var(--purple)"/>
      </div>
    </div>
  );
}

function ReadingBadgeCard({ readCount }) {
  const [showAll,setShowAll]=useState(false);
  const { current, next } = getReadingBadge(readCount);
  const prevMin = current ? current.min : 0;
  const nextMin = next ? next.min : prevMin;
  const span = Math.max(1, nextMin - prevMin);
  const pct = next ? Math.min(100, Math.round(((readCount-prevMin)/span)*100)) : 100;

  return (
    <div className="card" style={{marginBottom:16}}>
      <div className="card-hd">
        <span className="card-title">🏅 Reading Badges</span>
        <span style={{fontSize:'0.72rem',color:'var(--muted)'}}>{readCount} studies read</span>
      </div>
      <div style={{display:'flex',alignItems:'center',gap:14,flexWrap:'wrap'}}>
        <div style={{
          width:54,height:54,borderRadius:'50%',flexShrink:0,
          display:'flex',alignItems:'center',justifyContent:'center',fontSize:'1.6rem',
          background:current?current.bg:'var(--surface)',
          border:`2px solid ${current?current.color:'var(--border)'}`
        }}>
          {current?current.icon:'🔒'}
        </div>
        <div style={{flex:1,minWidth:180}}>
          <div style={{fontWeight:600,fontSize:'var(--text-sm)',marginBottom:3}}>
            {current?current.label:'No badge yet'}
          </div>
          {next ? (
            <>
              <div style={{fontSize:'0.75rem',color:'var(--muted)',marginBottom:6}}>
                {next.min-readCount} more {next.min-readCount===1?'study':'studies'} read to unlock {next.icon} {next.label}
              </div>
              <div style={{height:6,borderRadius:99,background:'var(--surface)',border:'1px solid var(--border)',overflow:'hidden'}}>
                <div style={{height:'100%',width:`${pct}%`,background:next.color,borderRadius:99,transition:'width .3s'}}/>
              </div>
            </>
          ) : (
            <div style={{fontSize:'0.75rem',color:'var(--muted)'}}>You've earned every reading badge — incredible work! 🎉</div>
          )}
        </div>
        <button className="btn btn-ol btn-sm" style={{flexShrink:0}} onClick={()=>setShowAll(s=>!s)}>
          {showAll?'Hide':'View'} all badges
        </button>
      </div>
      {showAll&&(
        <div style={{display:'flex',gap:10,flexWrap:'wrap',marginTop:16,paddingTop:14,borderTop:'1px solid var(--border)'}}>
          {READING_BADGES.map(b=>{
            const earned = readCount>=b.min;
            return (
              <div key={b.id} style={{
                display:'flex',flexDirection:'column',alignItems:'center',gap:5,padding:'10px 12px',
                borderRadius:'var(--radius)',minWidth:90,textAlign:'center',
                background:earned?b.bg:'var(--surface)',
                border:`1px solid ${earned?b.color:'var(--border)'}`,
                opacity:earned?1:0.5
              }}>
                <div style={{fontSize:'1.4rem'}}>{earned?b.icon:'🔒'}</div>
                <div style={{fontWeight:600,fontSize:'0.7rem'}}>{b.label}</div>
                <div style={{fontSize:'0.65rem',color:'var(--muted)'}}>{b.desc}</div>
              </div>
            );
          })}
        </div>
      )}
      <p style={{fontSize:'0.7rem',color:'var(--muted)',marginTop:10,marginBottom:0}}>
        Badges are earned when you actually <em>read</em> a study (spend time with it), not just open it.
      </p>
    </div>
  );
}


function StreakCard({ streak, longestStreak }) {
  const tier = getStreakTier(streak);
  const nextTier = [...STREAK_TIERS].reverse().find(t=>t.min>streak);

  return (
    <div className="card" style={{marginBottom:16}}>
      <div className="card-hd">
        <span className="card-title">🔥 Daily Streak</span>
        {longestStreak>streak && <span style={{fontSize:'0.72rem',color:'var(--muted)'}}>Best: {longestStreak} day{longestStreak!==1?'s':''}</span>}
      </div>
      <div style={{display:'flex',alignItems:'center',gap:14,flexWrap:'wrap'}}>
        <div style={{
          width:54,height:54,borderRadius:'50%',flexShrink:0,
          display:'flex',alignItems:'center',justifyContent:'center',
          background:tier?`radial-gradient(circle, ${tier.glow}, transparent 70%)`:'var(--surface)',
          border:`2px solid ${tier?tier.color:'var(--border)'}`
        }}>
          <span className="streak-flame" style={{filter:tier?`drop-shadow(0 0 6px ${tier.glow})`:'none',opacity:tier?1:0.35}}>🔥</span>
        </div>
        <div style={{flex:1,minWidth:180}}>
          <div style={{fontWeight:600,fontSize:'var(--text-sm)',marginBottom:3}}>
            {streak>0
              ? <>{streak} day{streak!==1?'s':''} streak {tier&&<span style={{color:tier.color}}>· Keep going!</span>}</>
              : 'Start your streak today!'}
          </div>
          <div style={{fontSize:'0.75rem',color:'var(--muted)'}}>
            {streak===0
              ? 'Visit the portal every day to build a streak and light up your flame.'
              : nextTier
                ? `${nextTier.min-streak} more day${nextTier.min-streak!==1?'s':''} to reach the next level!`
                : "You've reached the highest flame tier — keep it going! 🌟"}
          </div>
        </div>
      </div>
      <div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:14,paddingTop:14,borderTop:'1px solid var(--border)'}}>
        {STREAK_TIERS.slice().reverse().map(t=>{
          const earned = streak>=t.min;
          return (
            <div key={t.id} style={{
              display:'flex',flexDirection:'column',alignItems:'center',gap:4,padding:'8px 10px',
              borderRadius:'var(--radius)',minWidth:78,textAlign:'center',
              background:earned?`${t.color}1a`:'var(--surface)',
              border:`1px solid ${earned?t.color:'var(--border)'}`,
              opacity:earned?1:0.5
            }}>
              <span style={{fontSize:'1.2rem',filter:earned?`drop-shadow(0 0 4px ${t.glow})`:'none'}}>🔥</span>
              <div style={{fontWeight:600,fontSize:'0.65rem',color:earned?t.color:'var(--muted)'}}>{t.label}</div>
              <div style={{fontSize:'0.62rem',color:'var(--muted)'}}>{t.min}+ {t.min===1?'day':'days'}</div>
            </div>
          );
        })}
      </div>
      <p style={{fontSize:'0.7rem',color:'var(--muted)',marginTop:10,marginBottom:0}}>
        Open the portal at least once each day to keep your flame burning. Miss a day and it resets.
      </p>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════
//  GRADE OVERVIEW PER SECTION  (admin)
// ══════════════════════════════════════════════════════════════════
function GradeOverviewPage({ currentUser }) {
  const [students, setStudents] = useState([]);
  const [studies,  setStudies]  = useState([]);
  const [loading,  setLoading]  = useState(true);
  const [gradeFilter,   setGradeFilter]   = useState('all');
  const [sectionFilter, setSectionFilter] = useState('all');

  useEffect(() => {
    Promise.all([
      API.getUsers({ role: 'student', status: 'approved' }),
      API.getAllStudies(),
    ]).then(([stus, studs]) => {
      setStudents(stus);
      setStudies(studs);
      setLoading(false);
    }).catch(() => setLoading(false));
  }, []);

  // Build per-student study map
  const studyMap = useMemo(() => {
    const m = {};
    studies.forEach(s => {
      if (!s.uploadedBy) return;
      if (!m[s.uploadedBy]) m[s.uploadedBy] = [];
      m[s.uploadedBy].push(s);
    });
    return m;
  }, [studies]);

  // All unique sections for the selected grade
  const sections = useMemo(() => {
    const s = new Set();
    students.forEach(u => {
      if (gradeFilter !== 'all' && u.gradeLevel !== gradeFilter) return;
      s.add(u.section?.trim() || 'No Section');
    });
    return ['all', ...Array.from(s).sort()];
  }, [students, gradeFilter]);

  // Filtered students
  const filtered = useMemo(() => {
    return students.filter(u => {
      if (gradeFilter !== 'all' && u.gradeLevel !== gradeFilter) return false;
      const sec = u.section?.trim() || 'No Section';
      if (sectionFilter !== 'all' && sec !== sectionFilter) return false;
      return true;
    });
  }, [students, gradeFilter, sectionFilter]);

  // Group by section
  const grouped = useMemo(() => {
    const m = {};
    filtered.forEach(u => {
      const sec = u.section?.trim() || 'No Section';
      if (!m[sec]) m[sec] = [];
      m[sec].push(u);
    });
    return Object.entries(m).sort(([a], [b]) => a.localeCompare(b));
  }, [filtered]);

  // Section summary stats
  const sectionStats = useMemo(() => {
    const out = {};
    grouped.forEach(([sec, list]) => {
      const studs = list.map(u => studyMap[u.id] || []).flat();
      const graded = studs.filter(s => s.teacherGrade);
      const gradeCounts = {};
      graded.forEach(s => { gradeCounts[s.teacherGrade] = (gradeCounts[s.teacherGrade] || 0) + 1; });
      const scores = graded.filter(s => s.teacherScore != null).map(s => s.teacherScore);
      const avgScore = scores.length ? Math.round(scores.reduce((a, b) => a + b, 0) / scores.length) : null;
      out[sec] = { total: list.length, uploads: studs.length, graded: graded.length, gradeCounts, avgScore };
    });
    return out;
  }, [grouped, studyMap]);

  const exportCSV = () => {
    const rows = [['Grade', 'Section', 'Student', 'Email', 'Uploads', 'Graded Studies', 'Avg Score', 'Grades']];
    grouped.forEach(([sec, list]) => {
      list.forEach(u => {
        const studs = studyMap[u.id] || [];
        const graded = studs.filter(s => s.teacherGrade);
        const scores = graded.filter(s => s.teacherScore != null).map(s => s.teacherScore);
        const avg = scores.length ? Math.round(scores.reduce((a, b) => a + b, 0) / scores.length) : '';
        const grades = graded.map(s => s.teacherGrade).join(', ');
        rows.push([u.gradeLevel ? `Grade ${u.gradeLevel}` : '', sec, u.name, u.email, studs.length, graded.length, avg, grades]);
      });
    });
    const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
    const a = document.createElement('a');
    a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
    a.download = 'grade-overview.csv';
    a.click();
    toast.ok('Exported!');
  };

  const GRADE_LETTERS = ['A+','A','A-','B+','B','B-','C+','C','C-','D','F'];
  const gradeColor = g => ({ 'A+':'var(--teal)','A':'var(--teal)','A-':'var(--teal)','B+':'var(--blue)','B':'var(--blue)','B-':'var(--blue)','C+':'var(--gold)','C':'var(--gold)','C-':'var(--gold)' }[g] || 'var(--red)');

  if (loading) return (
    <div>
      <div style={{ marginBottom: 22 }}>
        <div className="skel skel-page-title" style={{ marginBottom: 8 }} />
        <div className="skel" style={{ height: 13, width: 240, borderRadius: 5 }} />
      </div>
      <StatsSkeleton count={3} /><StudiesGridSkeleton count={2} />
    </div>
  );

  return (
    <div>
      {/* Header */}
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', flexWrap: 'wrap', gap: 10, marginBottom: 22 }}>
        <div>
          <h2 style={{ fontFamily: 'var(--font-display)', fontSize: 'var(--text-2xl)', marginBottom: 3 }}>📋 Grade Overview</h2>
          <p className="muted">Study grades grouped by section. {filtered.length} student{filtered.length !== 1 ? 's' : ''}.</p>
        </div>
        <button className="btn btn-ol btn-sm" onClick={exportCSV}>⬇ Export CSV</button>
      </div>

      {/* Filters */}
      <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginBottom: 16 }}>
        {/* Grade pills */}
        {['all', '8', '9', '10', '11', '12'].map(g => (
          <button key={g} onClick={() => { setGradeFilter(g); setSectionFilter('all'); }}
            style={{ padding: '5px 14px', borderRadius: 99, fontSize: '0.72rem', fontWeight: 600, cursor: 'pointer', transition: 'all .15s', border: `1.5px solid ${gradeFilter === g ? (GRADE_COLORS[g] || 'var(--ink)') : 'var(--border)'}`, background: gradeFilter === g ? (GRADE_COLORS[g] || 'var(--ink)') : 'var(--surface)', color: gradeFilter === g ? '#fff' : 'var(--muted)' }}>
            {g === 'all' ? 'All Grades' : `Grade ${g}`}
          </button>
        ))}
        {/* Section filter */}
        {sections.length > 2 && (
          <select value={sectionFilter} onChange={e => setSectionFilter(e.target.value)} style={{ padding: '5px 12px', borderRadius: 99, fontSize: '0.72rem', fontWeight: 600, border: '1.5px solid var(--border)', background: 'var(--surface)', color: 'var(--ink)', cursor: 'pointer' }}>
            {sections.map(s => <option key={s} value={s}>{s === 'all' ? 'All Sections' : s}</option>)}
          </select>
        )}
      </div>

      {/* Section cards */}
      {grouped.length === 0
        ? <EmptyState icon="📋" title="No students found" message="Try adjusting your grade or section filter." compact />
        : grouped.map(([sec, list]) => {
          const ss = sectionStats[sec] || {};
          return (
            <div key={sec} className="card" style={{ marginBottom: 16 }}>
              {/* Section header */}
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: 8, marginBottom: 14, paddingBottom: 12, borderBottom: '1px solid var(--border)' }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                  <div style={{ width: 4, height: 28, borderRadius: 2, background: GRADE_COLORS[list[0]?.gradeLevel] || 'var(--gold)', flexShrink: 0 }} />
                  <div>
                    <div style={{ fontFamily: 'var(--font-display)', fontSize: 'var(--text-lg)', fontWeight: 700 }}>{sec}</div>
                    <div style={{ fontSize: '0.72rem', color: 'var(--muted)' }}>
                      {list[0]?.gradeLevel ? `Grade ${list[0].gradeLevel} · ` : ''}{ss.total} student{ss.total !== 1 ? 's' : ''}
                    </div>
                  </div>
                </div>
                <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
                  <div style={{ textAlign: 'center', padding: '6px 12px', background: 'var(--surface)', borderRadius: 8, border: '1px solid var(--border)' }}>
                    <div style={{ fontSize: '1.1rem', fontWeight: 700, color: 'var(--gold)' }}>{ss.uploads || 0}</div>
                    <div style={{ fontSize: '0.62rem', color: 'var(--muted)' }}>uploads</div>
                  </div>
                  <div style={{ textAlign: 'center', padding: '6px 12px', background: 'var(--surface)', borderRadius: 8, border: '1px solid var(--border)' }}>
                    <div style={{ fontSize: '1.1rem', fontWeight: 700, color: 'var(--teal)' }}>{ss.graded || 0}</div>
                    <div style={{ fontSize: '0.62rem', color: 'var(--muted)' }}>graded</div>
                  </div>
                  {ss.avgScore != null && (
                    <div style={{ textAlign: 'center', padding: '6px 12px', background: 'var(--surface)', borderRadius: 8, border: '1px solid var(--border)' }}>
                      <div style={{ fontSize: '1.1rem', fontWeight: 700, color: 'var(--blue)' }}>{ss.avgScore}</div>
                      <div style={{ fontSize: '0.62rem', color: 'var(--muted)' }}>avg score</div>
                    </div>
                  )}
                  {/* Grade distribution pills */}
                  {Object.entries(ss.gradeCounts || {}).sort().map(([g, n]) => (
                    <span key={g} style={{ padding: '4px 10px', borderRadius: 99, fontSize: '0.72rem', fontWeight: 700, background: 'var(--surface)', color: gradeColor(g), border: `1.5px solid ${gradeColor(g)}` }}>{g}: {n}</span>
                  ))}
                </div>
              </div>

              {/* Student rows */}
              <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                {list.map(u => {
                  const uStudies = studyMap[u.id] || [];
                  const graded   = uStudies.filter(s => s.teacherGrade);
                  const scores   = graded.filter(s => s.teacherScore != null).map(s => s.teacherScore);
                  const avg      = scores.length ? Math.round(scores.reduce((a, b) => a + b, 0) / scores.length) : null;
                  return (
                    <div key={u.id} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '8px 10px', background: 'var(--surface)', borderRadius: 8 }}>
                      <div className="avatar" style={{ width: 30, height: 30, fontSize: '0.68rem', background: GRADE_COLORS[u.gradeLevel] || 'var(--ink-3)', flexShrink: 0 }}>{initials(u.name)}</div>
                      <div style={{ flex: 1, minWidth: 0 }}>
                        <div style={{ fontWeight: 500, fontSize: '0.85rem', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{u.name}</div>
                        <div style={{ fontSize: '0.65rem', color: 'var(--muted)' }}>{u.email}</div>
                      </div>
                      <div style={{ display: 'flex', gap: 8, flexShrink: 0, flexWrap: 'wrap', alignItems: 'center' }}>
                        <span style={{ fontSize: '0.72rem', color: 'var(--muted)' }}>{uStudies.length} upload{uStudies.length !== 1 ? 's' : ''}</span>
                        {graded.length > 0 && (
                          <div style={{ display: 'flex', gap: 4, flexWrap: 'wrap' }}>
                            {graded.map(s => (
                              <span key={s.id} style={{ fontSize: '0.65rem', fontWeight: 700, padding: '2px 8px', borderRadius: 99, background: 'var(--teal-light)', color: gradeColor(s.teacherGrade), border: `1px solid ${gradeColor(s.teacherGrade)}` }}>{s.teacherGrade}</span>
                            ))}
                          </div>
                        )}
                        {avg != null && <span style={{ fontSize: '0.72rem', fontWeight: 700, color: 'var(--blue)' }}>{avg}/100</span>}
                        {graded.length === 0 && uStudies.length > 0 && <span style={{ fontSize: '0.68rem', color: 'var(--muted)' }}>Not graded yet</span>}
                        {uStudies.length === 0 && <span style={{ fontSize: '0.68rem', color: 'var(--red)', fontWeight: 600 }}>No uploads</span>}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })}
    </div>
  );
}


function StudentDash({ currentUser }) {
  const [myStudies,setMyStudies]=useState([]);
  const [cats,setCats]=useState([]);

  const [loading,setLoading]=useState(true);

  const [historyStudy,setHistoryStudy]=useState(null);
  const [lastRead,setLastRead]=useState(null);

  const load=async()=>{
    setLoading(true);
    const [res,catsArr,allRes,lr,favs,readCnt,streak]=await Promise.all([

      API.getFavorites(currentUser.id),
      API.getReadCount(currentUser.id),
      API.getStreak(currentUser.id)

        <>
          <StatsSkeleton count={5}/>

              <div className="skel" style={{height:13,width:'80%',borderRadius:5}}/>
              <div className="skel" style={{height:13,width:'60%',borderRadius:5}}/>
            </div>
          </div>
          <StudiesGridSkeleton count={3}/>

      <>
      <div className="stats">

        <div className="stat teal"><div className="stat-icon"><Ico.eye/></div><div className="stat-body"><div className="stat-lbl">Total Views</div><div className="stat-val">{myStudies.reduce((a,s)=>a+(s.viewCount||0),0)}</div><div className="stat-sub">Across all my studies</div></div></div>
        <div className="stat blue"><div className="stat-icon"><Ico.dl/></div><div className="stat-body"><div className="stat-lbl">Downloads</div><div className="stat-val">{myStudies.reduce((a,s)=>a+(s.downloadCount||0),0)}</div><div className="stat-sub">Total</div></div></div>
        <div className="stat pur"><div className="stat-icon"><Ico.cite/></div><div className="stat-body"><div className="stat-lbl">Citations</div><div className="stat-val">{myStudies.reduce((a,s)=>a+(s.citationCount||0),0)}</div><div className="stat-sub">APA copies</div></div></div>
        <div className="stat slate"><div className="stat-icon"><Ico.bm/></div><div className="stat-body"><div className="stat-lbl">Bookmarks</div><div className="stat-val">{favorites.length}</div><div className="stat-sub">Saved studies</div></div></div>
      </div>

      


      <WeeklyHighlightsCard onOpenStudy={async s=>{
        const snap=await db.collection('studies').doc(s.id).get();
        if(snap.exists){const d={id:snap.id,...snap.data()};setSelectedStudy(d);trackRecentlyViewed(d);}
        else toast.err('Study no longer available.');
      }}/>
      <RecentlyViewedCard onOpenStudy={d=>setSelectedStudy(d)}/>

      {/* ── Continue Reading ── */}
      {lastRead&&(
        <div className="card card-clickable" style={{marginBottom:16,cursor:'pointer'}} onClick={async()=>{
          const snap=await db.collection('studies').doc(lastRead.studyId).get();
          if(snap.exists){const d={id:snap.id,...snap.data()};setSelectedStudy(d);trackRecentlyViewed(d);}
          else toast.err('Study no longer available.');
        }}>
